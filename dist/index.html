ós Schrems II"],"v":0},{"id":"gd2-10","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 30","t":[],"a":"excecao","d":3,"e":"O GDPR dispensa, em regra, organizações com menos de 250 trabalhadores do dever de manter registro das atividades de tratamento, salvo se o tratamento implicar risco, não for ocasional ou abranger categorias especiais de dados.","c":"Art. 30, n.º 5. Na prática, as exceções à dispensa são amplas. Compare com a flexibilização para agentes de pequeno porte no Brasil (Resolução CD/ANPD nº 2/2022).","ap":-1,"v":0},{"id":"gd2-11","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 4º","t":[],"a":"conceito","d":2,"e":"No GDPR, o responsável pelo tratamento corresponde ao controlador da LGPD, e o subcontratante corresponde ao operador.","c":"Terminologia da versão portuguesa do GDPR. Em inglês, controller e processor.","ap":-1,"v":0},{"id":"gd2-12","b":"gdpr","g":"E","l":"gdpr","art":null,"r":"GDPR, art. 37","t":[],"a":"comparacao","d":2,"e":"Assim como a LGPD, o GDPR exige que todo responsável pelo tratamento, sem exceção, designe encarregado da proteção de dados.","c":"O GDPR exige o encarregado em hipóteses específicas (autoridades públicas, monitorização sistemática em grande escala, categorias especiais em grande escala). A LGPD impõe o dever ao controlador em geral, admitindo dispensa por norma da ANPD (art. 41, § 3º).","ap":-1,"v":0},{"id":"gdpr-01","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 99","t":[],"a":"numero","d":1,"e":"O Regulamento Geral sobre a Proteção de Dados da União Europeia (GDPR), adotado em 2016, passou a ser aplicável em maio de 2018.","c":"O GDPR é o Regulamento (UE) 2016/679 e se aplica desde 25 de maio de 2018 (art. 99). Por ser regulamento, vale diretamente em todos os Estados-membros, sem lei nacional de transposição.","ap":-1,"v":0},{"id":"gdpr-02","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 6º","t":[],"a":"comparacao","d":2,"e":"O GDPR prevê seis bases legais para o tratamento de dados pessoais comuns, ao passo que a LGPD prevê dez.","c":"GDPR, art. 6º, 1: consentimento, contrato, obrigação legal, interesses vitais, interesse público ou exercício de autoridade pública e interesses legítimos. A LGPD tem dez incisos no art. 7º, inclusive proteção do crédito e tutela da saúde, que não existem como bases autônomas no GDPR.","ap":-1,"v":0},{"id":"gdpr-03","b":"gdpr","g":"E","l":"gdpr","art":null,"r":"GDPR, art. 6º","t":[],"a":"comparacao","d":2,"e":"Assim como a LGPD, o GDPR prevê a proteção do crédito como base legal autônoma para o tratamento de dados pessoais.","c":"A proteção do crédito (LGPD, art. 7º, X) é criação brasileira, sem correspondente direto no art. 6º do GDPR.","ap":-1,"v":0},{"id":"gdpr-04","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 33","t":[],"a":"numero","d":1,"e":"No GDPR, o controlador deve notificar a violação de dados pessoais à autoridade de controle sem demora injustificada e, sempre que possível, até 72 horas após ter tomado conhecimento dela, salvo se a violação não for suscetível de resultar em risco.","c":"Art. 33, 1, do GDPR. Na LGPD, o art. 48 fala em “prazo razoável, conforme definido pela autoridade nacional”, e a ANPD fixou o prazo em regulamento próprio.","ap":-1,"v":0},{"id":"gdpr-05","b":"gdpr","g":"E","l":"gdpr","art":null,"r":"GDPR, art. 34","t":[],"a":"comparacao","d":2,"e":"O GDPR fixa o mesmo prazo de 72 horas para a comunicação da violação de dados à autoridade de controle e aos titulares afetados.","c":"As 72 horas são para a autoridade (art. 33). A comunicação ao titular (art. 34) é exigida quando houver elevado risco e deve ser feita sem demora injustificada, sem prazo em horas.","ap":-1,"v":0},{"id":"gdpr-06","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 83","t":[],"a":"numero","d":2,"e":"No GDPR, as infrações mais graves podem ser punidas com multa de até 20 milhões de euros ou até 4% do volume de negócios anual a nível mundial do exercício anterior, consoante o montante mais elevado.","c":"Art. 83, 5. Compare com a LGPD: até 2% do faturamento no Brasil, limitado a R$ 50 milhões por infração (art. 52, II).","ap":-1,"v":0},{"id":"gdpr-07","b":"gdpr","g":"E","l":"gdpr","art":null,"r":"GDPR, art. 83","t":[],"a":"comparacao","d":2,"e":"Tal como na LGPD, as multas do GDPR têm como base o faturamento obtido no país em que ocorreu a infração, limitado a 2%.","c":"O GDPR usa o volume de negócios mundial (até 4% ou 2%, conforme a infração, ou valores fixos de 20 ou 10 milhões de euros). A base no país é traço da LGPD.","ap":-1,"v":0},{"id":"gdpr-08","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 37","t":[],"a":"comparacao","d":3,"e":"O GDPR exige a designação de encarregado da proteção de dados em hipóteses específicas, como tratamento por autoridade pública e monitoramento regular e sistemático de titulares em grande escala, enquanto a LGPD adota como regra a indicação de encarregado pelo controlador, admitidas dispensas pela autoridade nacional.","c":"GDPR, art. 37, 1; LGPD, art. 41, caput e § 3º. A lógica é inversa: no GDPR o DPO é exceção obrigatória; na LGPD, regra com possibilidade de dispensa.","ap":-1,"v":0},{"id":"gdpr-09","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 45","t":[],"a":"sujeito","d":2,"e":"No GDPR, as decisões de adequação que reconhecem o nível de proteção de país terceiro são adotadas pela Comissão Europeia.","c":"Art. 45 do GDPR. No Brasil, a avaliação é da ANPD (LGPD, art. 34); a Resolução CD/ANPD nº 32/2026 reconheceu a adequação da União Europeia.","ap":-1,"v":0},{"id":"gdpr-10","b":"gdpr","g":"E","l":"gdpr","art":null,"r":"GDPR, art. 45","t":[],"a":"sujeito","d":2,"e":"No GDPR, cada autoridade nacional de proteção de dados decide, isoladamente, sobre a adequação do nível de proteção de países terceiros.","c":"A decisão de adequação é da Comissão Europeia (art. 45). As autoridades nacionais e o Comitê Europeu emitem pareceres, mas não decidem.","ap":-1,"v":0},{"id":"gdpr-11","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 46","t":[],"a":"comparacao","d":2,"e":"Na ausência de decisão de adequação, o GDPR admite transferências internacionais com garantias adequadas, como cláusulas-padrão de proteção de dados e regras vinculativas aplicáveis às empresas, figuras equivalentes às cláusulas-padrão e às normas corporativas globais da LGPD.","c":"GDPR, arts. 46 e 47 (binding corporate rules). LGPD, art. 33, II, “b” e “c”.","ap":-1,"v":0},{"id":"gdpr-12","b":"gdpr","g":"E","l":"gdpr","art":null,"r":"GDPR, art. 17","t":[],"a":"extrapolacao","d":1,"e":"O GDPR não prevê expressamente direito do titular ao apagamento de seus dados, que decorre apenas da jurisprudência europeia.","c":"O art. 17 do GDPR prevê expressamente o direito ao apagamento, conhecido como direito a ser esquecido.","ap":-1,"v":0},{"id":"gdpr-13","b":"gdpr","g":"E","l":"gdpr","art":null,"r":"GDPR, art. 22","t":[],"a":"absoluto","d":3,"e":"O GDPR proíbe, sem exceções, que o titular seja submetido a decisão baseada exclusivamente em tratamento automatizado que produza efeitos jurídicos sobre ele.","c":"O art. 22, 2, admite exceções: necessidade para contrato, autorização por lei da União ou do Estado-membro e consentimento explícito. Na LGPD, o art. 20 garante a revisão, sem proibir a decisão automatizada.","ap":-1,"v":0},{"id":"gdpr-14","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 35","t":[],"a":"comparacao","d":2,"e":"O GDPR exige avaliação de impacto sobre a proteção de dados quando o tratamento for suscetível de implicar elevado risco para os direitos e liberdades das pessoas, figura próxima ao relatório de impacto da LGPD.","c":"GDPR, art. 35. Na LGPD, o relatório de impacto é exigível pela ANPD (arts. 10, § 3º, 32 e 38) e definido no art. 5º, XVII.","ap":-1,"v":0},{"id":"gdpr-15","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 8º","t":[],"a":"numero","d":3,"e":"No GDPR, o consentimento da criança para serviços da sociedade da informação é válido a partir dos 16 anos, podendo os Estados-membros fixar idade inferior, desde que não abaixo de 13 anos.","c":"Art. 8º, 1, do GDPR. A LGPD não fixa idade: exige consentimento de um dos pais para crianças (art. 14, § 1º), e o ECA considera criança quem tem até 12 anos incompletos.","ap":-1,"v":0},{"id":"gdpr-16","b":"gdpr","g":"E","l":"gdpr","art":null,"r":"GDPR, art. 8º","t":[],"a":"numero","d":2,"e":"O GDPR fixa em 13 anos, de modo uniforme para toda a União Europeia, a idade a partir da qual a criança pode consentir com serviços da sociedade da informação.","c":"A regra é 16 anos, com faculdade de cada Estado-membro reduzir até 13 (art. 8º, 1). Não há uniformidade.","ap":-1,"v":0},{"id":"gdpr-17","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 3º","t":[],"a":"comparacao","d":2,"e":"O GDPR aplica-se a controlador não estabelecido na União quando o tratamento estiver relacionado à oferta de bens ou serviços a titulares que se encontrem na União ou ao controle do seu comportamento, lógica semelhante à do art. 3º da LGPD.","c":"GDPR, art. 3º, 2. A LGPD também tem alcance extraterritorial (art. 3º, II).","ap":-1,"v":0},{"id":"gdpr-18","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 25","t":[],"a":"conceito","d":1,"e":"O GDPR consagra a proteção de dados desde a concepção e por padrão, exigindo medidas técnicas e organizativas adequadas tanto no momento de definir os meios de tratamento quanto no próprio tratamento.","c":"Art. 25 do GDPR. Na LGPD, o art. 46, § 2º, exige medidas desde a fase de concepção até a execução.","ap":-1,"v":0},{"id":"gdpr-19","b":"gdpr","g":"E","l":"gdpr","art":null,"r":"GDPR, art. 68","t":[],"a":"conceito","d":3,"e":"O Comitê Europeu para a Proteção de Dados é órgão consultivo do Parlamento Europeu, desprovido de personalidade jurídica.","c":"O art. 68, 1, cria o Comitê como organismo da União dotado de personalidade jurídica. Ele reúne as autoridades nacionais e a Autoridade Europeia para a Proteção de Dados.","ap":-1,"v":0},{"id":"gdpr-20","b":"gdpr","g":"E","l":"tjue","art":null,"r":"TJUE · C-311/18 (Schrems II)","t":[],"a":"caso","d":3,"e":"No caso Schrems II (2020), o Tribunal de Justiça da União Europeia invalidou as cláusulas contratuais-padrão como instrumento de transferência de dados para países terceiros.","c":"Schrems II invalidou o Privacy Shield (decisão de adequação dos EUA). As cláusulas-padrão continuaram válidas, mas o exportador passou a ter de avaliar, caso a caso, se o país de destino permite cumpri-las.","ap":-1,"v":0},{"id":"gdpr-21","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 56","t":[],"a":"conceito","d":3,"e":"Diferentemente do modelo brasileiro, de autoridade nacional única, o GDPR distribui a fiscalização entre autoridades de controle dos Estados-membros e prevê, para tratamentos transfronteiriços, a figura da autoridade de controle principal.","c":"GDPR, art. 56 (o mecanismo de balcão único, ou one-stop-shop). No Brasil, a ANPD é a autoridade central, com competência sancionatória exclusiva (LGPD, art. 55-K).","ap":-1,"v":0},{"id":"en2-01","b":"ingles","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":1,"e":"Segundo o texto, legisladores de vários países deixaram de aceitar a marcação de uma caixa por uma criança como consentimento significativo.","c":"“Lawmakers in several countries have now rejected that fiction”, referindo-se à prática descrita na frase anterior.","ap":0},{"id":"en2-02","b":"ingles","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"O texto afirma que as plataformas continuam autorizadas a confiar na idade declarada pelos próprios usuários.","c":"“Instead of asking users to declare their age, platforms are increasingly required to verify it.” A tendência é a verificação, não a autodeclaração, como no ECA Digital.","ap":0},{"id":"en2-03","b":"ingles","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"Infere-se do segundo parágrafo que a exigência de documento de identidade de todos os usuários pode gerar riscos à privacidade dos adultos.","c":"“may protect children while exposing adults to new risks of data breaches”.","ap":0},{"id":"en2-04","b":"ingles","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"De acordo com o texto, os reguladores preferem métodos que confirmem apenas a informação necessária, como o fato de o usuário ter mais de determinada idade, sem revelar sua identidade.","c":"Corresponde ao princípio da necessidade (minimização). Em inglês, “confirm only what is necessary”.","ap":0},{"id":"en2-05","b":"ingles","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"No texto, a palavra “however”, no início do segundo parágrafo, introduz ideia que confirma e amplia o que foi dito no parágrafo anterior.","c":"“However” é adversativo (no entanto): introduz uma ressalva, os riscos de privacidade da própria verificação etária.","ap":0},{"id":"en2-06","b":"ingles","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"A expressão “likely to be accessed by minors” poderia ser traduzida, sem prejuízo do sentido, por de acesso provável por menores.","c":"É exatamente o critério de “acesso provável” usado no ECA Digital e no Age Appropriate Design Code do Reino Unido.","ap":0},{"id":"en2-07","b":"ingles","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"O último parágrafo sustenta que o desenho de sistemas de verificação de idade é um desafio exclusivamente técnico.","c":"“is not merely a technical challenge”: envolve decidir quem arca com o custo, como corrigir erros e qual autoridade fiscaliza.","ap":0},{"id":"en2-08","b":"ingles","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":3,"e":"No trecho “their parents often do not either”, a expressão indica que os pais, assim como as crianças, frequentemente também não leem os termos aceitos.","c":"“not either” equivale a “também não”, retomando “rarely read the terms they accept”.","ap":0},{"id":"en-01","b":"ingles","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":1,"e":"Depreende-se do texto que as autoridades de proteção de dados enfrentam demandas crescentes com recursos limitados.","c":"É o sentido de “are being asked to do more with less”, no primeiro período.","ap":1},{"id":"en-02","b":"ingles","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"absoluto","d":1,"e":"Segundo o texto, as autoridades de proteção de dados passaram, de modo geral, a aplicar multas antes de publicar orientações.","c":"O texto diz que algumas autoridades (“Some authorities”) publicam orientações antes de multar. Não há generalização, e a ordem é a inversa.","ap":1},{"id":"en-03","b":"ingles","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"No texto, o adjetivo “toothless” é empregado no sentido de ineficaz, sem capacidade de se fazer cumprir.","c":"Literalmente “sem dentes”. O contexto (“unless it is backed by credible enforcement”) confirma o sentido de ineficaz.","ap":1},{"id":"en-04","b":"ingles","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":1,"e":"De acordo com o texto, a regulação responsiva começa pelo diálogo e só recorre a sanções quando a organização descumpre reiteradamente suas obrigações.","c":"“starts with dialogue and escalates to sanctions only when an organisation repeatedly ignores its obligations”.","ap":1},{"id":"en-05","b":"ingles","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":1,"e":"O texto afirma que a regulação responsiva favorece as pequenas empresas, que dispõem de menos recursos para litigar.","c":"Os críticos dizem o oposto: a abordagem pode favorecer as grandes empresas (“large companies”), que podem pagar advogados para negociar em cada etapa.","ap":1},{"id":"en-06","b":"ingles","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"A expressão “Whatever the strategy”, no último parágrafo, introduz ideia de causa.","c":"“Whatever the strategy” equivale a “qualquer que seja a estratégia”: ideia de concessão, não de causa.","ap":1},{"id":"en-07","b":"ingles","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"Infere-se do texto que a falta de transparência sobre as prioridades de uma autoridade pode levar à suspeita de que suas decisões são arbitrárias.","c":"“an authority that does not explain its priorities invites suspicion that its decisions are arbitrary”.","ap":1},{"id":"en-08","b":"ingles","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"Segundo o texto, além da licitude da coleta de dados, os reguladores devem avaliar se decisões automatizadas podem ser explicadas às pessoas por elas afetadas.","c":"É a estrutura “not only... but also” do primeiro parágrafo. O tema conversa com o art. 20 da LGPD.","ap":1},{"id":"ag-01","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 3º","t":[],"a":"conceito","d":1,"e":"Segundo a Lei nº 13.848/2019, a natureza especial conferida à agência reguladora é caracterizada pela ausência de tutela ou de subordinação hierárquica, pela autonomia funcional, decisória, administrativa e financeira e pela investidura a termo de seus dirigentes e estabilidade durante os mandatos.","c":"Art. 3º, caput, da Lei nº 13.848/2019. É o núcleo do regime de agência que a ANPD passou a ter.","ap":-1,"p":["Autonomia reforçada das agências reguladoras"],"v":0},{"id":"ag-02","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 3º","t":[],"a":"conceito","d":2,"e":"A natureza especial das agências reguladoras decorre de sua subordinação hierárquica direta ao ministério supervisor, que pode rever de ofício suas decisões técnicas.","c":"O art. 3º fala exatamente no oposto: ausência de tutela ou de subordinação hierárquica. A doutrina critica o recurso hierárquico impróprio ao ministério nas decisões finalísticas das agências.","ap":-1,"p":["Recurso hierárquico impróprio e agências reguladoras (Parecer AGU AC-051)"],"v":0},{"id":"ag-03","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 4º","t":[],"a":"literal","d":2,"e":"A agência reguladora deve observar, em suas atividades, a devida adequação entre meios e fins, vedada a imposição de obrigações, restrições e sanções em medida superior àquela necessária ao atendimento do interesse público.","c":"Art. 4º da Lei nº 13.848/2019. Repete a lógica do art. 2º, parágrafo único, VI, da Lei nº 9.784/1999 (proporcionalidade).","ap":-1,"v":0},{"id":"ag-04","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 5º","t":[],"a":"literal","d":2,"e":"A agência reguladora deverá indicar os pressupostos de fato e de direito que determinarem suas decisões, inclusive a respeito da edição ou não de atos normativos.","c":"Art. 5º. A motivação alcança inclusive a decisão de não regular.","ap":-1,"v":0},{"id":"ag-05","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 6º","t":[],"a":"conceito","d":2,"e":"A adoção e as propostas de alteração de atos normativos de interesse geral dos agentes econômicos, consumidores ou usuários dos serviços prestados serão, nos termos de regulamento, precedidas da realização de Análise de Impacto Regulatório.","c":"Art. 6º. A AIR contém informações e dados sobre os possíveis efeitos do ato normativo. O regulamento federal é o Decreto nº 10.411/2020.","ap":-1,"p":["Decreto 10.411/2020 (Análise de Impacto Regulatório)"],"v":0},{"id":"ag-06","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 6º","t":[],"a":"extrapolacao","d":3,"e":"Quando a Análise de Impacto Regulatório não for realizada, a agência fica dispensada de apresentar qualquer documento que fundamente a proposta de ato normativo.","c":"Sem AIR, deve ser disponibilizada nota técnica ou documento equivalente que fundamente a proposta de decisão.","ap":-1,"v":0},{"id":"ag-07","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 6º","t":[],"a":"literal","d":2,"e":"O conselho diretor ou a diretoria colegiada da agência reguladora manifestar-se-á, em relação ao relatório de Análise de Impacto Regulatório, sobre a adequação da proposta de ato normativo aos objetivos pretendidos.","c":"A decisão final é do colegiado, que deve se manifestar sobre o relatório de AIR; a AIR informa, mas não vincula.","ap":-1,"v":0},{"id":"ag-08","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 7º","t":[],"a":"literal","d":2,"e":"O processo de decisão da agência reguladora referente a regulação terá caráter colegiado, e o conselho diretor ou a diretoria colegiada deliberará por maioria absoluta dos votos de seus membros.","c":"Art. 7º. Maioria absoluta dos membros, não dos presentes.","ap":-1,"v":0},{"id":"ag-09","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 7º","t":[],"a":"numero","d":2,"e":"As deliberações do conselho diretor das agências reguladoras sobre regulação são tomadas por maioria simples dos membros presentes à reunião.","c":"A Lei nº 13.848/2019 exige maioria absoluta dos votos dos membros do colegiado.","ap":-1,"v":0},{"id":"ag-10","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 8º","t":[],"a":"literal","d":2,"e":"As reuniões deliberativas do conselho diretor ou da diretoria colegiada da agência reguladora serão públicas e gravadas em meio eletrônico, ressalvadas as hipóteses de sigilo previstas em lei.","c":"Art. 8º. A pauta deve ser divulgada previamente no sítio da agência; confira o prazo de antecedência no texto.","ap":-1,"v":0},{"id":"ag-11","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 9º","t":[],"a":"numero","d":1,"e":"A consulta pública sobre minutas e propostas de alteração de atos normativos de interesse geral terá duração mínima de 45 dias, ressalvado caso excepcional de urgência e relevância, devidamente motivado.","c":"Art. 9º, § 1º. Prazo muito cobrado. Compare com a Lei nº 9.784/1999, que não fixa prazo mínimo para consulta pública.","ap":-1,"p":["Consultas públicas da ANPD (plataforma Participa + Brasil)"],"v":0},{"id":"ag-12","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 9º","t":[],"a":"numero","d":1,"e":"O período de consulta pública nas agências reguladoras federais tem duração mínima de 30 dias, contados da publicação do aviso de abertura.","c":"O mínimo é de 45 dias, salvo urgência e relevância motivadas.","ap":-1,"v":0},{"id":"ag-13","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 9º","t":[],"a":"literal","d":2,"e":"Serão objeto de consulta pública, previamente à tomada de decisão pelo colegiado, as minutas e as propostas de alteração de atos normativos de interesse geral dos agentes econômicos, consumidores ou usuários dos serviços prestados.","c":"Art. 9º, caput. A agência também deve disponibilizar o relatório de AIR e publicar seu posicionamento sobre as contribuições recebidas.","ap":-1,"v":0},{"id":"ag-14","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 10","t":[],"a":"absoluto","d":2,"e":"A audiência pública é etapa obrigatória para a edição de qualquer ato normativo pelas agências reguladoras, sob pena de nulidade.","c":"A Lei nº 13.848/2019 diz que a agência “poderá” convocar audiência pública para formação de juízo e tomada de decisão sobre matéria relevante. Obrigatória é a consulta pública para atos de interesse geral. Não confunda com o art. 55-J, § 2º, da LGPD, que exige consulta e audiência públicas para os regulamentos da ANPD.","ap":-1,"v":0},{"id":"ag-15","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 14","t":[],"a":"sujeito","d":1,"e":"O controle externo das agências reguladoras será exercido pelo Congresso Nacional, com auxílio do Tribunal de Contas da União.","c":"Art. 14. Reproduz o modelo constitucional dos arts. 70 e 71 da CF.","ap":-1,"v":0},{"id":"ag-16","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 15","t":[],"a":"literal","d":2,"e":"A agência reguladora deverá elaborar relatório anual circunstanciado de suas atividades, no qual destacará o cumprimento da política do setor e dos seus planos estratégico e de gestão anual.","c":"Art. 15. O relatório é encaminhado ao ministro supervisor, ao Senado, à Câmara e ao TCU.","ap":-1,"v":0},{"id":"ag-17","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 17","t":[],"a":"numero","d":2,"e":"A agência reguladora deverá elaborar, para cada período quadrienal, plano estratégico que conterá os objetivos, as metas e os resultados estratégicos esperados de suas ações.","c":"Plano estratégico quadrienal (art. 17) e plano de gestão anual (art. 18), alinhado ao estratégico.","ap":-1,"v":0},{"id":"ag-18","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 21","t":[],"a":"conceito","d":1,"e":"A agenda regulatória é o instrumento de planejamento da atividade normativa que contém o conjunto dos temas prioritários a serem regulamentados pela agência durante sua vigência.","c":"Art. 21. A ANPD publica agenda regulatória bianual; confira a vigente.","ap":-1,"p":["Agenda regulatória da ANPD vigente"],"v":0},{"id":"ag-19","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 21","t":[],"a":"comparacao","d":2,"e":"A agenda regulatória substitui o plano de gestão anual e independe dos objetivos do plano estratégico da agência.","c":"A agenda regulatória deve estar alinhada aos objetivos do plano estratégico e integrar o plano de gestão anual.","ap":-1,"v":0},{"id":"ag-20","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 22","t":[],"a":"literal","d":2,"e":"Haverá, em cada agência reguladora, um ouvidor, que atuará sem subordinação hierárquica e exercerá suas atribuições sem acumulação com outras funções.","c":"Art. 22. A Ouvidoria também integra a ANPD pelo art. 55-C, IV, da LGPD.","ap":-1,"v":0},{"id":"ag-21","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 23","t":[],"a":"numero","d":2,"e":"O ouvidor da agência reguladora é escolhido pelo Presidente da República e por ele nomeado, após aprovação do Senado Federal, para mandato de três anos, vedada a recondução.","c":"Art. 23. Os diretores têm mandato de 5 anos (Lei nº 9.986/2000), mas a LGPD fixa 4 anos para o Conselho Diretor da ANPD (art. 55-D, § 3º).","ap":-1,"v":0},{"id":"ag-22","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 23","t":[],"a":"numero","d":2,"e":"O ouvidor das agências reguladoras tem mandato de quatro anos, permitida uma recondução.","c":"Três anos, vedada a recondução.","ap":-1,"v":0},{"id":"ag-23","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 26","t":[],"a":"literal","d":2,"e":"Quando a agência reguladora tomar conhecimento de fato que possa configurar infração à ordem econômica, deverá comunicá-lo imediatamente aos órgãos de defesa da concorrência para que adotem as providências cabíveis.","c":"Arts. 25 a 28 tratam da cooperação com o Cade. A agência não julga infração concorrencial.","ap":-1,"p":["Acordo de cooperação ANPD e Cade"],"v":0},{"id":"ag-24","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 26","t":[],"a":"sujeito","d":2,"e":"Constatada infração à ordem econômica em mercado regulado, compete à agência reguladora julgá-la e aplicar as sanções da Lei de Defesa da Concorrência.","c":"A competência é do Cade. A agência comunica o fato aos órgãos de defesa da concorrência.","ap":-1,"v":0},{"id":"ag-25","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 34","t":[],"a":"conceito","d":3,"e":"A Lei nº 13.848/2019 admite que as agências reguladoras federais descentralizem atividades fiscalizatórias, sancionatórias e arbitrais para agências reguladoras estaduais, distritais ou municipais, mediante acordo de cooperação.","c":"Articulação com agências estaduais (art. 34). Atividades normativas não entram nessa descentralização; confira os limites no texto.","ap":-1,"v":0},{"id":"ag-26","b":"lei-13848","g":"C","l":"lei9986","art":null,"r":"Lei 9.986/2000, art. 6º","t":[],"a":"numero","d":1,"e":"Após a Lei nº 13.848/2019, o mandato dos membros do conselho diretor ou da diretoria colegiada das agências reguladoras, regido pela Lei nº 9.986/2000, passou a ser de cinco anos, vedada a recondução.","c":"Art. 6º da Lei nº 9.986/2000, com redação da Lei nº 13.848/2019. Para a ANPD, o art. 55-D, § 3º, da LGPD ainda fala em 4 anos: atenção à regra especial.","ap":-1,"p":["Mandato dos diretores da ANPD: 4 anos (LGPD) × 5 anos (Lei 9.986)"],"v":0},{"id":"ag-27","b":"lei-13848","g":"C","l":"lei9986","art":null,"r":"Lei 9.986/2000, art. 5º","t":[],"a":"conceito","d":2,"e":"A escolha dos dirigentes das agências reguladoras pelo Presidente da República, a ser submetida à aprovação do Senado Federal, é precedida de processo público de pré-seleção, em que comissão de seleção forma lista tríplice.","c":"Inovação da Lei nº 13.848/2019 na Lei nº 9.986/2000. Também foram criados requisitos de experiência profissional e vedações de indicação.","ap":-1,"v":0},{"id":"ag-28","b":"lei-13848","g":"C","l":"lei9986","art":null,"r":"Lei 9.986/2000, art. 8º","t":[],"a":"numero","d":2,"e":"Os ex-dirigentes das agências reguladoras ficam impedidos, por período de seis meses após deixarem o cargo, de exercer atividade ou prestar serviço no setor regulado pela agência.","c":"A quarentena de seis meses é a mesma da Lei de Conflito de Interesses (Lei nº 12.813/2013), aplicada aos diretores da ANPD pelo art. 55-F da LGPD.","ap":-1,"v":0},{"id":"ag-29","b":"lei-13848","g":"E","l":"lei9986","art":null,"r":"Lei 9.986/2000, art. 8º","t":[],"a":"numero","d":2,"e":"A quarentena imposta aos ex-dirigentes das agências reguladoras é de dois anos, período em que recebem remuneração integral do cargo.","c":"O período é de seis meses. Durante a quarentena há remuneração compensatória, mas o prazo de dois anos está errado.","ap":-1,"v":0},{"id":"ag-30","b":"lei-13848","g":"C","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 29","t":[],"a":"conceito","d":3,"e":"As agências reguladoras podem editar atos normativos conjuntos sobre matéria cuja disciplina envolva agentes econômicos sujeitos a mais de uma regulação setorial.","c":"Atos normativos conjuntos entre agências (art. 29). Para a ANPD, combine com o art. 55-J, §§ 3º e 4º, da LGPD (coordenação e fórum permanente com reguladores setoriais).","ap":-1,"v":0},{"id":"pa-01","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 1º","t":[],"a":"conceito","d":1,"e":"Os preceitos da Lei nº 9.784/1999 também se aplicam aos órgãos dos Poderes Legislativo e Judiciário da União, quando no desempenho de função administrativa.","c":"Art. 1º, § 1º. A lei é federal: estados e municípios só a aplicam por lei própria ou, na falta dela, por analogia admitida pelo STJ.","ap":-1,"p":["Aplicação subsidiária da Lei 9.784/1999 a estados e municípios (Súmula 633 do STJ)"],"v":0},{"id":"pa-02","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 1º","t":[],"a":"conceito","d":2,"e":"Para a Lei nº 9.784/1999, entidade é a unidade de atuação integrante da estrutura da administração direta, desprovida de personalidade jurídica.","c":"Essa é a definição de órgão (art. 1º, § 2º, I). Entidade é a unidade de atuação dotada de personalidade jurídica (II); autoridade é o servidor ou agente público dotado de poder de decisão (III). A ANPD é entidade.","ap":-1,"v":0},{"id":"pa-03","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 2º","t":[],"a":"rol","d":1,"e":"A Administração Pública obedecerá, entre outros, aos princípios da legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência.","c":"Art. 2º, caput. Note que publicidade e impessoalidade não aparecem nominalmente no caput, embora estejam nos critérios do parágrafo único.","ap":-1,"v":0},{"id":"pa-04","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 2º","t":[],"a":"literal","d":2,"e":"Nos processos administrativos, deve ser observada a interpretação da norma administrativa da forma que melhor garanta o atendimento do fim público a que se dirige, vedada a aplicação retroativa de nova interpretação.","c":"Art. 2º, parágrafo único, XIII. Base da proteção da confiança contra mudanças de orientação.","ap":-1,"v":0},{"id":"pa-05","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 2º","t":[],"a":"extrapolacao","d":2,"e":"É permitida a cobrança de despesas processuais no processo administrativo federal sempre que a Administração entender necessária ao custeio da instrução.","c":"O critério do art. 2º, parágrafo único, XI, é a proibição de cobrança de despesas processuais, ressalvadas as previstas em lei.","ap":-1,"v":0},{"id":"pa-06","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 2º","t":[],"a":"literal","d":2,"e":"O processo administrativo será impulsionado de ofício, sem prejuízo da atuação dos interessados.","c":"Art. 2º, parágrafo único, XII (oficialidade).","ap":-1,"v":0},{"id":"pa-07","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 3º","t":[],"a":"literal","d":1,"e":"O administrado tem direito de fazer-se assistir, facultativamente, por advogado, salvo quando obrigatória a representação, por força de lei.","c":"Art. 3º, IV. Compare com a Súmula Vinculante 5: a falta de defesa técnica por advogado no processo administrativo disciplinar não ofende a Constituição.","ap":-1,"p":["Súmula Vinculante 5 do STF"],"v":0},{"id":"pa-08","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 4º","t":[],"a":"conceito","d":2,"e":"Por ser parte mais fraca na relação com o Estado, o administrado não tem deveres perante a Administração no processo administrativo, apenas direitos.","c":"O art. 4º lista deveres: expor os fatos conforme a verdade; proceder com lealdade, urbanidade e boa-fé; não agir de modo temerário; prestar informações e colaborar para o esclarecimento dos fatos.","ap":-1,"v":0},{"id":"pa-09","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 6º","t":[],"a":"literal","d":2,"e":"É vedada à Administração a recusa imotivada de recebimento de documentos, devendo o servidor orientar o interessado quanto ao suprimento de eventuais falhas.","c":"Art. 6º, parágrafo único. O requerimento inicial é escrito, salvo quando admitida solicitação oral (art. 6º, caput).","ap":-1,"v":0},{"id":"pa-10","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 9º","t":[],"a":"rol","d":2,"e":"São legitimadas como interessadas no processo administrativo as organizações e associações representativas, no tocante a direitos e interesses coletivos, e as pessoas ou associações legalmente constituídas, quanto a direitos ou interesses difusos.","c":"Art. 9º, III e IV. Também são interessados os que iniciam o processo e os que, sem tê-lo iniciado, podem ser afetados pela decisão.","ap":-1,"v":0},{"id":"pa-11","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 10","t":[],"a":"numero","d":1,"e":"São capazes, para fins de processo administrativo, os maiores de dezesseis anos, ressalvada previsão especial em ato normativo próprio.","c":"Art. 10: maiores de dezoito anos, ressalvada previsão especial.","ap":-1,"v":0},{"id":"pa-12","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 11","t":[],"a":"conceito","d":1,"e":"A competência é irrenunciável e se exerce pelos órgãos administrativos a que foi atribuída como própria, salvo os casos de delegação e avocação legalmente admitidos.","c":"Art. 11. Pilar do tema competência, muito cobrado junto com os arts. 12 a 15.","ap":-1,"v":0},{"id":"pa-13","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 12","t":[],"a":"conceito","d":2,"e":"Um órgão administrativo pode delegar parte de sua competência a outro órgão, ainda que este não lhe seja hierarquicamente subordinado, quando conveniente em razão de circunstâncias de índole técnica, social, econômica, jurídica ou territorial.","c":"Art. 12. A delegação é parcial e independe de hierarquia. A avocação (art. 15) é que pressupõe órgão hierarquicamente inferior.","ap":-1,"v":0},{"id":"pa-14","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 13","t":[],"a":"rol","d":1,"e":"Podem ser objeto de delegação a edição de atos de caráter normativo e a decisão de recursos administrativos, desde que o ato de delegação seja publicado no meio oficial.","c":"O art. 13 proíbe delegar: edição de atos de caráter normativo, decisão de recursos administrativos e matérias de competência exclusiva. Mnemônico: CE-NO-RE (competência exclusiva, normativos, recursos).","ap":-1,"p":["Delegação e avocação na Lei 9.784/1999"],"v":0},{"id":"pa-15","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 14","t":[],"a":"literal","d":2,"e":"As decisões adotadas por delegação devem mencionar explicitamente essa qualidade e considerar-se-ão editadas pelo delegado.","c":"Art. 14, § 3º. Por isso, em regra, mandado de segurança contra ato praticado por delegação é dirigido ao delegado (Súmula 510 do STF).","ap":-1,"v":0},{"id":"pa-16","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 14","t":[],"a":"absoluto","d":2,"e":"Uma vez publicado, o ato de delegação de competência é irrevogável durante o prazo nele fixado.","c":"O ato de delegação é revogável a qualquer tempo pela autoridade delegante (art. 14, § 2º).","ap":-1,"v":0},{"id":"pa-17","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 15","t":[],"a":"conceito","d":2,"e":"Será permitida, em caráter excepcional e por motivos relevantes devidamente justificados, a avocação temporária de competência atribuída a órgão hierarquicamente inferior.","c":"Art. 15. Avocação exige hierarquia, excepcionalidade, motivo relevante justificado e é temporária.","ap":-1,"v":0},{"id":"pa-18","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 17","t":[],"a":"literal","d":2,"e":"Inexistindo competência legal específica, o processo administrativo deverá ser iniciado perante a autoridade de menor grau hierárquico para decidir.","c":"Art. 17. Garante a possibilidade de recurso às instâncias superiores.","ap":-1,"v":0},{"id":"pa-19","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 18","t":[],"a":"comparacao","d":2,"e":"A amizade íntima ou a inimizade notória da autoridade com algum dos interessados configura impedimento, que gera presunção absoluta de parcialidade.","c":"Amizade íntima e inimizade notória são hipóteses de suspeição (art. 20). Impedimento (art. 18) é interesse direto ou indireto, atuação como perito, testemunha ou representante e litígio com o interessado.","ap":-1,"v":0},{"id":"pa-20","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 19","t":[],"a":"literal","d":2,"e":"A autoridade ou o servidor que incorrer em impedimento deve comunicar o fato à autoridade competente, abstendo-se de atuar, e a omissão do dever de comunicar constitui falta grave, para efeitos disciplinares.","c":"Art. 19 e parágrafo único. Impedimento é dever de abstenção; a suspeição (art. 20) pode ser arguida pelo interessado.","ap":-1,"v":0},{"id":"pa-21","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 21","t":[],"a":"literal","d":3,"e":"O indeferimento de alegação de suspeição poderá ser objeto de recurso, sem efeito suspensivo.","c":"Art. 21. Detalhe típico de item de lei seca.","ap":-1,"v":0},{"id":"pa-22","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 22","t":[],"a":"extrapolacao","d":2,"e":"No processo administrativo federal, é obrigatório o reconhecimento de firma em todos os documentos apresentados pelos interessados.","c":"O reconhecimento de firma somente será exigido quando houver dúvida de autenticidade (art. 22, § 2º). A Lei nº 13.726/2018 reforçou a desburocratização.","ap":-1,"v":0},{"id":"pa-23","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 24","t":[],"a":"numero","d":1,"e":"Inexistindo disposição específica, os atos do órgão ou da autoridade responsável pelo processo e dos administrados devem ser praticados no prazo de cinco dias, salvo motivo de força maior, podendo o prazo ser dilatado até o dobro, mediante comprovada justificação.","c":"Art. 24 e parágrafo único. Prazo residual de 5 dias, prorrogável até o dobro com justificativa comprovada.","ap":-1,"v":0},{"id":"pa-24","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 26","t":[],"a":"numero","d":2,"e":"A intimação para comparecimento deve observar a antecedência mínima de três dias úteis quanto à data de comparecimento.","c":"Art. 26, § 2º. A intimação pode ser feita por ciência no processo, via postal com aviso de recebimento, telegrama ou outro meio que assegure a certeza da ciência.","ap":-1,"v":0},{"id":"pa-25","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 27","t":[],"a":"extrapolacao","d":2,"e":"O desatendimento da intimação pelo administrado importa o reconhecimento da verdade dos fatos alegados pela Administração.","c":"Art. 27: o desatendimento não importa o reconhecimento da verdade dos fatos nem a renúncia a direito. Não há revelia com confissão ficta no processo administrativo federal.","ap":-1,"v":0},{"id":"pa-26","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 31","t":[],"a":"literal","d":2,"e":"O comparecimento à consulta pública não confere, por si, a condição de interessado do processo, mas confere o direito de obter da Administração resposta fundamentada, que poderá ser comum a todas as alegações substancialmente iguais.","c":"Art. 31, § 2º. Útil para entender as consultas públicas da ANPD.","ap":-1,"v":0},{"id":"pa-27","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 36","t":[],"a":"literal","d":2,"e":"Cabe ao interessado a prova dos fatos que tenha alegado, sem prejuízo do dever atribuído ao órgão competente para a instrução.","c":"Art. 36. A verdade material orienta o processo administrativo; a Administração também deve buscar provas.","ap":-1,"v":0},{"id":"pa-28","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 42","t":[],"a":"conceito","d":3,"e":"Se um parecer obrigatório e vinculante deixar de ser emitido no prazo fixado, o processo não terá seguimento até a respectiva apresentação, responsabilizando-se quem der causa ao atraso.","c":"Art. 42, § 1º. Se o parecer for obrigatório e não vinculante, o processo poderá prosseguir e ser decidido com sua dispensa (§ 2º). O prazo geral do parecer é de 15 dias.","ap":-1,"v":0},{"id":"pa-29","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 42","t":[],"a":"comparacao","d":3,"e":"Não emitido no prazo o parecer obrigatório e não vinculante, o processo fica paralisado até sua apresentação, sem possibilidade de decisão.","c":"Para parecer obrigatório e não vinculante, o processo pode prosseguir e ser decidido com sua dispensa (art. 42, § 2º). A paralisação vale para o parecer vinculante.","ap":-1,"v":0},{"id":"pa-30","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 45","t":[],"a":"literal","d":2,"e":"Em caso de risco iminente, a Administração Pública poderá motivadamente adotar providências acauteladoras sem a prévia manifestação do interessado.","c":"Art. 45. Base das medidas preventivas também no processo sancionador da ANPD.","ap":-1,"v":0},{"id":"pa-31","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 49","t":[],"a":"numero","d":1,"e":"Concluída a instrução de processo administrativo, a Administração tem o prazo de até 60 dias para decidir, prorrogável por igual período.","c":"Art. 49: até 30 dias, salvo prorrogação por igual período expressamente motivada.","ap":-1,"v":0},{"id":"pa-32","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 50","t":[],"a":"rol","d":2,"e":"Devem ser motivados, com indicação dos fatos e dos fundamentos jurídicos, os atos administrativos que importem anulação, revogação, suspensão ou convalidação de ato administrativo.","c":"Art. 50, VIII. Os oito incisos incluem também atos que neguem ou afetem direitos, imponham sanções, decidam recursos e dispensem licitação.","ap":-1,"v":0},{"id":"pa-33","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 50","t":[],"a":"conceito","d":2,"e":"A motivação deve ser explícita, clara e congruente, podendo consistir em declaração de concordância com fundamentos de anteriores pareceres, informações, decisões ou propostas, que, neste caso, serão parte integrante do ato.","c":"Art. 50, § 1º. É a chamada motivação aliunde ou per relationem.","ap":-1,"v":0},{"id":"pa-34","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 54","t":[],"a":"numero","d":1,"e":"O direito da Administração de anular os atos administrativos de que decorram efeitos favoráveis para os destinatários decai em cinco anos, contados da data em que foram praticados, salvo comprovada má-fé.","c":"Art. 54. No caso de efeitos patrimoniais contínuos, o prazo conta da percepção do primeiro pagamento (§ 1º).","ap":-1,"p":["Decadência administrativa e o art. 54 da Lei 9.784/1999"],"v":0},{"id":"pa-35","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 54","t":[],"a":"excecao","d":2,"e":"O prazo decadencial de cinco anos para a Administração anular atos favoráveis aos destinatários aplica-se inclusive quando comprovada a má-fé do beneficiário.","c":"A má-fé comprovada afasta o prazo decadencial do art. 54.","ap":-1,"v":0},{"id":"pa-36","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 55","t":[],"a":"conceito","d":2,"e":"Em decisão na qual se evidencie não acarretarem lesão ao interesse público nem prejuízo a terceiros, os atos que apresentarem defeitos sanáveis poderão ser convalidados pela própria Administração.","c":"Art. 55. Compare com a Súmula 473 do STF e com o art. 53 (anulação por ilegalidade, revogação por conveniência ou oportunidade).","ap":-1,"v":0},{"id":"pa-37","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 56","t":[],"a":"numero","d":2,"e":"O recurso administrativo será dirigido à autoridade que proferiu a decisão, a qual, se não a reconsiderar no prazo de cinco dias, o encaminhará à autoridade superior.","c":"Art. 56, § 1º. O recurso cabe por razões de legalidade e de mérito.","ap":-1,"v":0},{"id":"pa-38","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 56","t":[],"a":"extrapolacao","d":2,"e":"A interposição de recurso administrativo depende de caução, salvo quando o recorrente comprovar hipossuficiência econômica.","c":"Salvo exigência legal, a interposição de recurso independe de caução (art. 56, § 2º). A Súmula Vinculante 21 considera inconstitucional exigir depósito prévio para recorrer.","ap":-1,"p":["Súmula Vinculante 21 do STF"],"v":0},{"id":"pa-39","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 57","t":[],"a":"numero","d":1,"e":"O recurso administrativo tramitará no máximo por três instâncias administrativas, salvo disposição legal diversa.","c":"Art. 57. A contagem é de instâncias, não de recursos: o número máximo é três, salvo lei diversa.","ap":-1,"v":0},{"id":"pa-40","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 59","t":[],"a":"numero","d":1,"e":"Salvo disposição legal específica, é de quinze dias o prazo para interposição de recurso administrativo, contado a partir da ciência ou divulgação oficial da decisão recorrida.","c":"O prazo é de dez dias (art. 59). O recurso deve ser decidido em até 30 dias do recebimento dos autos, prorrogáveis por igual período com justificativa.","ap":-1,"v":0},{"id":"pa-41","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 61","t":[],"a":"excecao","d":2,"e":"Salvo disposição legal em contrário, o recurso administrativo não tem efeito suspensivo, mas a autoridade pode concedê-lo, de ofício ou a pedido, havendo justo receio de prejuízo de difícil ou incerta reparação.","c":"Art. 61 e parágrafo único. A regra é o efeito apenas devolutivo; o suspensivo depende de lei ou de decisão da autoridade.","ap":-1,"v":0},{"id":"pa-42","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 64","t":[],"a":"conceito","d":3,"e":"No julgamento de recurso administrativo, a decisão pode ser modificada em prejuízo do recorrente, desde que ele seja cientificado para formular suas alegações antes da decisão.","c":"Art. 64, parágrafo único. A reformatio in pejus é admitida no recurso, mas vedada na revisão (art. 65, parágrafo único).","ap":-1,"v":0},{"id":"pa-43","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 65","t":[],"a":"comparacao","d":3,"e":"Na revisão de processo administrativo de que resulte sanção, provocada pelo surgimento de fatos novos, a sanção pode ser agravada, desde que assegurado o contraditório.","c":"Da revisão não pode resultar agravamento da sanção (art. 65, parágrafo único). A revisão cabe a qualquer tempo, a pedido ou de ofício, diante de fatos novos ou circunstâncias relevantes.","ap":-1,"v":0},{"id":"pa-44","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 63","t":[],"a":"rol","d":2,"e":"O recurso não será conhecido quando interposto fora do prazo, perante órgão incompetente, por quem não seja legitimado ou após exaurida a esfera administrativa, o que não impede a Administração de rever de ofício o ato ilegal, desde que não ocorrida preclusão administrativa.","c":"Art. 63 e § 2º. Se o recurso for dirigido a órgão incompetente, será indicada a autoridade competente e devolvido o prazo (§ 1º).","ap":-1,"v":0},{"id":"pa-45","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 67","t":[],"a":"literal","d":2,"e":"Salvo motivo de força maior devidamente comprovado, os prazos processuais do processo administrativo federal não se suspendem.","c":"Art. 67. Os prazos em dias contam-se de modo contínuo (art. 66, § 2º), e não em dias úteis como no CPC.","ap":-1,"v":0},{"id":"pa-46","b":"lei-9784","g":"C","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 69","t":[],"a":"conceito","d":2,"e":"Os processos administrativos específicos continuarão a reger-se por lei própria, aplicando-se-lhes apenas subsidiariamente os preceitos da Lei nº 9.784/1999.","c":"Art. 69. É o caso do processo sancionador da ANPD, regido pela LGPD e por regulamento próprio, com a Lei nº 9.784/1999 como norma subsidiária.","ap":-1,"p":["Regulamento do processo de fiscalização e sancionador da ANPD (Resolução CD/ANPD 1/2021)"],"v":0},{"id":"pa-47","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 69-A","t":[],"a":"rol","d":2,"e":"A prioridade na tramitação de processos administrativos prevista na Lei nº 9.784/1999 alcança apenas as pessoas com idade igual ou superior a 65 anos.","c":"O art. 69-A garante prioridade a pessoas com 60 anos ou mais, pessoas com deficiência e pessoas com doenças graves listadas na lei.","ap":-1,"v":0},{"id":"lgpd2-2-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"2","r":"LGPD, art. 2º, III","t":["a liberdade de expressão, de informação, de comunicação e de opinião"],"a":"rol","d":1,"e":"A liberdade de expressão, de informação, de comunicação e de opinião é um dos fundamentos da disciplina da proteção de dados pessoais.","c":"Art. 2º, III. Os sete fundamentos: privacidade; autodeterminação informativa; liberdades de expressão e informação; intimidade, honra e imagem; desenvolvimento e inovação; livre iniciativa, concorrência e consumidor; direitos humanos, personalidade, dignidade e cidadania.","ap":-1},{"id":"lgpd2-2-02","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"2","r":"LGPD, art. 2º, VII","t":["os direitos humanos, o livre desenvolvimento da personalidade, a dignidade e o exercício da cidadania pelas pessoas naturais"],"a":"sujeito","d":2,"e":"O exercício da cidadania pelas pessoas naturais e jurídicas figura entre os fundamentos da disciplina da proteção de dados pessoais.","c":"O art. 2º, VII, fala em exercício da cidadania “pelas pessoas naturais”. A LGPD protege dados de pessoa natural; a inclusão de pessoas jurídicas torna o item errado.","ap":-1},{"id":"lgpd2-3-01","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"3","r":"LGPD, art. 3º","t":["independentemente do meio, do país de sua sede ou do país onde estejam localizados os dados"],"a":"extrapolacao","d":1,"e":"A LGPD aplica-se somente às operações de tratamento realizadas por pessoas com sede no Brasil e cujos dados estejam armazenados em território nacional.","c":"O art. 3º aplica a lei independentemente do meio, do país de sede do agente ou do país onde estejam os dados, desde que presente uma das três conexões com o território nacional.","ap":-1},{"id":"lgpd2-3-02","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"3","r":"LGPD, art. 3º, § 2º","t":["Excetua-se do disposto no inciso I deste artigo o tratamento de dados previsto no inciso IV do caput do art. 4º desta Lei."],"a":"excecao","d":3,"e":"O critério de aplicação da LGPD baseado na realização da operação de tratamento no território nacional não alcança os dados provenientes de fora do país que apenas transitem pelo Brasil, nas condições do inciso IV do art. 4º.","c":"Art. 3º, § 2º, combinado com o art. 4º, IV: dados vindos do exterior, sem comunicação ou compartilhamento com agentes brasileiros e sem transferência a terceiro país, e desde que o país de origem tenha proteção adequada.","ap":-1,"p":["Dados em trânsito e data centers no Brasil (art. 4º, IV, LGPD)"]},{"id":"lgpd2-4-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"4","r":"LGPD, art. 4º, II","t":["a) jornalístico e artísticos"],"a":"rol","d":1,"e":"A LGPD não se aplica ao tratamento de dados pessoais realizado para fins exclusivamente jornalísticos e artísticos.","c":"Art. 4º, II, a. Atenção ao “exclusivamente”: se houver também finalidade comercial, a exclusão deixa de valer.","ap":-1},{"id":"lgpd2-4-02","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"4","r":"LGPD, art. 4º, III","t":["d) atividades de investigação e repressão de infrações penais"],"a":"rol","d":1,"e":"Está fora do alcance da LGPD o tratamento de dados realizado para fins exclusivos de atividades de investigação e repressão de infrações penais, que deve ser regido por legislação específica.","c":"Art. 4º, III, d, e § 1º. Enquanto a legislação específica não vier (discute-se a chamada LGPD Penal), a lei já manda observar o devido processo, os princípios e os direitos do titular.","ap":-1,"p":["Anteprojeto de LGPD Penal"]},{"id":"lgpd2-4-03","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"4","r":"LGPD, art. 4º, § 3º","t":["A autoridade nacional emitirá opiniões técnicas ou recomendações referentes às exceções previstas no inciso III do caput deste artigo e deverá solicitar aos responsáveis relatórios de impacto à proteção de dados pessoais."],"a":"extrapolacao","d":2,"e":"Por estarem fora do âmbito da LGPD, os tratamentos para fins exclusivos de segurança pública e defesa nacional não sofrem nenhuma atuação da autoridade nacional.","c":"O § 3º do art. 4º manda a autoridade nacional emitir opiniões técnicas ou recomendações sobre essas exceções e solicitar relatórios de impacto aos responsáveis.","ap":-1},{"id":"lgpd2-6-01","b":"lgpd-5-11","g":"C","l":"lgpd","art":"6","r":"LGPD, art. 6º, VI","t":["transparência: garantia, aos titulares, de informações claras, precisas e facilmente acessíveis sobre a realização do tratamento e os respectivos agentes de tratamento, observados os segredos comercial e industrial"],"a":"conceito","d":1,"e":"O princípio da transparência garante aos titulares informações claras, precisas e facilmente acessíveis sobre a realização do tratamento e os respectivos agentes de tratamento, observados os segredos comercial e industrial.","c":"Art. 6º, VI. Não confunda com qualidade dos dados (V), que trata de exatidão, clareza, relevância e atualização dos próprios dados.","ap":-1},{"id":"lgpd2-6-02","b":"lgpd-5-11","g":"C","l":"lgpd","art":"6","r":"LGPD, art. 6º, VIII","t":["prevenção: adoção de medidas para prevenir a ocorrência de danos em virtude do tratamento de dados pessoais"],"a":"conceito","d":1,"e":"Pelo princípio da prevenção, devem ser adotadas medidas para prevenir a ocorrência de danos em virtude do tratamento de dados pessoais.","c":"Art. 6º, VIII. Segurança (VII) trata das medidas técnicas e administrativas contra acessos não autorizados e incidentes; prevenção é mais ampla, voltada a evitar danos.","ap":-1},{"id":"lgpd2-6-03","b":"lgpd-5-11","g":"C","l":"lgpd","art":"6","r":"LGPD, art. 6º, V","t":["qualidade dos dados: garantia, aos titulares, de exatidão, clareza, relevância e atualização dos dados"],"a":"conceito","d":1,"e":"O princípio da qualidade dos dados garante aos titulares exatidão, clareza, relevância e atualização dos dados, de acordo com a necessidade e para o cumprimento da finalidade do tratamento.","c":"Art. 6º, V. Bancas trocam esse conteúdo com transparência e livre acesso.","ap":-1},{"id":"lgpd2-6-04","b":"lgpd-5-11","g":"E","l":"lgpd","art":"6","r":"LGPD, art. 6º, I","t":["sem possibilidade de tratamento posterior de forma incompatível com essas finalidades"],"a":"absoluto","d":2,"e":"Pelo princípio da finalidade, é vedado qualquer tratamento posterior dos dados pessoais, ainda que compatível com as finalidades informadas ao titular.","c":"O princípio da finalidade veda o tratamento posterior “de forma incompatível” com as finalidades. Tratamento posterior compatível é admitido; veja também o art. 7º, § 7º.","ap":-1},{"id":"lgpd2-6-05","b":"lgpd-5-11","g":"C","l":"lgpd","art":"6","r":"LGPD, art. 6º, III","t":["limitação do tratamento ao mínimo necessário para a realização de suas finalidades, com abrangência dos dados pertinentes, proporcionais e não excessivos em relação às finalidades do tratamento de dados"],"a":"caso","d":2,"e":"Situação hipotética: para enviar boletim informativo gratuito por e-mail, um portal exige do usuário nome, e-mail, CPF, renda mensal e religião. Assertiva: a exigência de CPF, renda e religião afronta o princípio da necessidade.","c":"Necessidade (art. 6º, III): mínimo necessário, com dados pertinentes, proporcionais e não excessivos. Religião ainda é dado sensível (art. 5º, II).","ap":-1},{"id":"lgpd2-7-01","b":"lgpd-5-11","g":"E","l":"lgpd","art":"7","r":"LGPD, art. 7º, VI","t":["para o exercício regular de direitos em processo judicial, administrativo ou arbitral"],"a":"rol","d":2,"e":"O exercício regular de direitos autoriza o tratamento de dados pessoais apenas em processo judicial, excluídos os processos administrativos e arbitrais.","c":"Art. 7º, VI: processo judicial, administrativo ou arbitral, este nos termos da Lei de Arbitragem.","ap":-1},{"id":"lgpd2-7-02","b":"lgpd-5-11","g":"C","l":"lgpd","art":"7","r":"LGPD, art. 7º, IV","t":["para a realização de estudos por órgão de pesquisa, garantida, sempre que possível, a anonimização dos dados pessoais"],"a":"literal","d":1,"e":"O tratamento de dados pessoais pode ser realizado para estudos por órgão de pesquisa, garantida, sempre que possível, a anonimização dos dados pessoais.","c":"Art. 7º, IV. O “sempre que possível” impede itens que digam que a anonimização é sempre obrigatória. Órgão de pesquisa está definido no art. 5º, XVIII.","ap":-1},{"id":"lgpd2-7-03","b":"lgpd-5-11","g":"C","l":"lgpd","art":"7","r":"LGPD, art. 7º, § 3º","t":["O tratamento de dados pessoais cujo acesso é público deve considerar a finalidade, a boa-fé e o interesse público que justificaram sua disponibilização."],"a":"literal","d":2,"e":"O tratamento de dados pessoais cujo acesso é público deve considerar a finalidade, a boa-fé e o interesse público que justificaram sua disponibilização.","c":"Art. 7º, § 3º. Dado público não é dado livre: a finalidade original da disponibilização continua importando.","ap":-1,"p":["Raspagem de dados públicos (web scraping) e LGPD"]},{"id":"lgpd2-7-04","b":"lgpd-5-11","g":"E","l":"lgpd","art":"7","r":"LGPD, art. 7º, IX","t":["exceto no caso de prevalecerem direitos e liberdades fundamentais do titular que exijam a proteção dos dados pessoais"],"a":"excecao","d":2,"e":"Havendo interesse legítimo do controlador, o tratamento é autorizado ainda que prevaleçam direitos e liberdades fundamentais do titular que exijam a proteção dos dados.","c":"Art. 7º, IX: o legítimo interesse cede quando prevalecerem direitos e liberdades fundamentais do titular. Daí a necessidade do teste de balanceamento.","ap":-1,"p":["Teste de balanceamento do legítimo interesse (guia da ANPD)"]},{"id":"lgpd2-11-01","b":"lgpd-5-11","g":"C","l":"lgpd","art":"11","r":"LGPD, art. 11, II, d","t":["exercício regular de direitos, inclusive em contrato e em processo judicial, administrativo e arbitral"],"a":"comparacao","d":3,"e":"Embora a execução de contrato não figure entre as hipóteses de tratamento de dados sensíveis, o exercício regular de direitos, inclusive em contrato, autoriza esse tratamento sem consentimento quando indispensável.","c":"Art. 11, II, d. É a diferença clássica entre os arts. 7º e 11: o art. 11 não tem execução de contrato, legítimo interesse nem proteção do crédito, mas tem o exercício regular de direitos “inclusive em contrato” e a prevenção à fraude.","ap":-1},{"id":"lgpd2-11-02","b":"lgpd-5-11","g":"E","l":"lgpd","art":"11","r":"LGPD, art. 11, I","t":["quando o titular ou seu responsável legal consentir, de forma específica e destacada, para finalidades específicas"],"a":"comparacao","d":2,"e":"O consentimento para o tratamento de dados sensíveis segue a mesma forma do consentimento para dados comuns, bastando a manifestação livre, informada e inequívoca do titular.","c":"Para dados sensíveis, o art. 11, I, exige consentimento “de forma específica e destacada, para finalidades específicas”, requisito a mais em relação à definição geral do art. 5º, XII.","ap":-1},{"id":"lgpd2-11-03","b":"lgpd-5-11","g":"C","l":"lgpd","art":"11","r":"LGPD, art. 11, § 3º","t":["poderá ser objeto de vedação ou de regulamentação por parte da autoridade nacional, ouvidos os órgãos setoriais do Poder Público"],"a":"literal","d":3,"e":"A comunicação ou o uso compartilhado de dados pessoais sensíveis entre controladores com objetivo de obter vantagem econômica poderá ser vedado ou regulamentado pela autoridade nacional, ouvidos os órgãos setoriais do Poder Público.","c":"Art. 11, § 3º. Para dados de saúde, a própria lei já veda esse compartilhamento, com exceções (§ 4º).","ap":-1},{"id":"lgpd2-15-01","b":"lgpd-12-16","g":"C","l":"lgpd","art":"15","r":"LGPD, art. 15, I","t":["verificação de que a finalidade foi alcançada ou de que os dados deixaram de ser necessários ou pertinentes ao alcance da finalidade específica almejada"],"a":"rol","d":2,"e":"O término do tratamento ocorre quando se verifica que a finalidade foi alcançada ou que os dados deixaram de ser necessários ou pertinentes ao alcance da finalidade específica almejada.","c":"Art. 15, I. As quatro hipóteses de término: finalidade alcançada ou dados desnecessários; fim do período; comunicação do titular; determinação da autoridade por violação à lei.","ap":-1},{"id":"lgpd2-16-01","b":"lgpd-12-16","g":"C","l":"lgpd","art":"16","r":"LGPD, art. 16, IV","t":["uso exclusivo do controlador, vedado seu acesso por terceiro, e desde que anonimizados os dados"],"a":"excecao","d":2,"e":"Após o término do tratamento, o controlador pode conservar os dados para seu uso exclusivo, vedado o acesso por terceiro, desde que os dados estejam anonimizados.","c":"Art. 16, IV. Duas condições cumulativas: uso exclusivo do controlador e anonimização.","ap":-1},{"id":"lgpd2-16-02","b":"lgpd-12-16","g":"E","l":"lgpd","art":"16","r":"LGPD, art. 16, III","t":["transferência a terceiro, desde que respeitados os requisitos de tratamento de dados dispostos nesta Lei"],"a":"absoluto","d":2,"e":"Encerrado o tratamento, é vedada a conservação dos dados para transferência a terceiro em qualquer hipótese.","c":"O art. 16, III, autoriza a conservação para transferência a terceiro, desde que respeitados os requisitos de tratamento da LGPD.","ap":-1},{"id":"lgpd2-60-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"60","r":"LGPD, art. 60","t":["exclusão definitiva dos dados pessoais que tiver fornecido a determinada aplicação de internet, a seu requerimento, ao término da relação entre as partes, ressalvadas as hipóteses de guarda obrigatória de registros"],"a":"literal","d":3,"e":"A LGPD alterou o Marco Civil da Internet para assegurar ao usuário a exclusão definitiva, a seu requerimento e ao término da relação entre as partes, dos dados pessoais fornecidos a aplicação de internet, ressalvadas as hipóteses de guarda obrigatória de registros.","c":"Art. 60 da LGPD, que deu nova redação ao art. 7º, X, do Marco Civil (Lei nº 12.965/2014). A guarda obrigatória de registros está nos arts. 13 e 15 do Marco Civil.","ap":-1,"p":["Guarda de registros de conexão e de acesso no Marco Civil da Internet"]},{"id":"lgpd2-62-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"62","r":"LGPD, art. 62","t":["A autoridade nacional e o Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira (Inep), no âmbito de suas competências, editarão regulamentos específicos"],"a":"literal","d":3,"e":"A autoridade nacional e o Inep, no âmbito de suas competências, editarão regulamentos específicos para o acesso a dados tratados pela União relativos à avaliação da educação, incluídos os referentes ao Sinaes.","c":"Art. 62. Dispositivo pouco lido, que menciona a LDB e a Lei do Sinaes (Lei nº 10.861/2004).","ap":-1},{"id":"lgpd2-65-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"65","r":"LGPD, art. 65, I","t":["dia 28 de dezembro de 2018, quanto aos arts. 55-A, 55-B, 55-C, 55-D, 55-E, 55-F, 55-G, 55-H, 55-I, 55-J, 55-K, 55-L, 58-A e 58-B"],"a":"numero","d":2,"e":"Os dispositivos da LGPD que tratam da ANPD e do CNPD entraram em vigor em 28 de dezembro de 2018.","c":"Art. 65, I. As sanções (arts. 52 a 54) vigoram desde 1º de agosto de 2021 (I-A), e os demais artigos, 24 meses após a publicação (II).","ap":-1},{"id":"lgpd-1-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"1","r":"LGPD, art. 1º","t":["Esta Lei dispõe sobre o tratamento de dados pessoais, inclusive nos meios digitais, por pessoa natural ou por pessoa jurídica de direito público ou privado"],"a":"literal","d":1,"e":"A LGPD dispõe sobre o tratamento de dados pessoais, inclusive nos meios digitais, por pessoa natural ou por pessoa jurídica de direito público ou privado.","c":"Caput do art. 1º. O objetivo é proteger os direitos fundamentais de liberdade e de privacidade e o livre desenvolvimento da personalidade da pessoa natural.","ap":-1},{"id":"lgpd-1-02","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"1","r":"LGPD, art. 1º","t":["inclusive nos meios digitais"],"a":"extrapolacao","d":1,"e":"A LGPD aplica-se apenas ao tratamento de dados pessoais realizado em meios digitais, ficando os arquivos físicos sujeitos a legislação própria.","c":"“Inclusive nos meios digitais” significa que os meios físicos também estão abrangidos. O art. 5º, IV, define banco de dados em suporte eletrônico ou físico.","ap":-1},{"id":"lgpd-1-03","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"1","r":"LGPD, art. 1º, parágrafo único","t":["As normas gerais contidas nesta Lei são de interesse nacional e devem ser observadas pela União, Estados, Distrito Federal e Municípios"],"a":"literal","d":1,"e":"As normas gerais da LGPD são de interesse nacional e devem ser observadas pela União, pelos Estados, pelo Distrito Federal e pelos Municípios.","c":"Parágrafo único do art. 1º, incluído pela Lei nº 13.853/2019. Desde a EC nº 115/2022, legislar sobre proteção de dados é competência privativa da União (CF, art. 22, XXX).","ap":-1},{"id":"lgpd-2-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"2","r":"LGPD, art. 2º","t":["a autodeterminação informativa","a livre iniciativa, a livre concorrência e a defesa do consumidor"],"a":"rol","d":1,"e":"A autodeterminação informativa, a livre iniciativa, a livre concorrência e a defesa do consumidor estão entre os fundamentos da disciplina da proteção de dados pessoais.","c":"Incisos II e VI do art. 2º. Não confunda fundamentos (art. 2º) com princípios (art. 6º).","ap":-1},{"id":"lgpd-2-02","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"2","r":"LGPD, art. 2º","t":["A disciplina da proteção de dados pessoais tem como fundamentos"],"a":"rol","d":2,"e":"A soberania nacional e a segurança pública figuram entre os fundamentos da disciplina da proteção de dados pessoais previstos na LGPD.","c":"Os sete fundamentos do art. 2º são: privacidade; autodeterminação informativa; liberdades de expressão, informação, comunicação e opinião; inviolabilidade da intimidade, honra e imagem; desenvolvimento econômico e tecnológico e inovação; livre iniciativa, livre concorrência e defesa do consumidor; direitos humanos, personalidade, dignidade e cidadania.","ap":-1},{"id":"lgpd-2-03","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"2","r":"LGPD, art. 2º","t":["o desenvolvimento econômico e tecnológico e a inovação"],"a":"conceito","d":2,"e":"O desenvolvimento econômico e tecnológico e a inovação são princípios da LGPD, ao lado da finalidade e da necessidade.","c":"Desenvolvimento econômico e tecnológico e inovação são fundamentos (art. 2º, V), não princípios. Os princípios estão no art. 6º.","ap":-1},{"id":"lgpd-3-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"3","r":"LGPD, art. 3º","t":["independentemente do meio, do país de sua sede ou do país onde estejam localizados os dados","a atividade de tratamento tenha por objetivo a oferta ou o fornecimento de bens ou serviços ou o tratamento de dados de indivíduos localizados no território nacional"],"a":"caso","d":2,"e":"Situação hipotética: empresa sediada no exterior, com servidores fora do Brasil, oferece aplicativo de compras a consumidores localizados no Brasil. Assertiva: a LGPD aplica-se a esse tratamento.","c":"Art. 3º, II: a lei vale independentemente do país da sede e de onde estejam os dados, se o tratamento visa à oferta de bens ou serviços a indivíduos no território nacional.","ap":-1},{"id":"lgpd-3-02","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"3","r":"LGPD, art. 3º, § 1º","t":["Consideram-se coletados no território nacional os dados pessoais cujo titular nele se encontre no momento da coleta"],"a":"conceito","d":2,"e":"Consideram-se coletados no território nacional os dados pessoais de titular de nacionalidade brasileira, independentemente do local em que ele se encontre no momento da coleta.","c":"O § 1º do art. 3º usa critério de localização no momento da coleta, não de nacionalidade.","ap":-1},{"id":"lgpd-4-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"4","r":"LGPD, art. 4º, I","t":["realizado por pessoa natural para fins exclusivamente particulares e não econômicos"],"a":"excecao","d":1,"e":"A LGPD não se aplica ao tratamento de dados pessoais realizado por pessoa natural para fins exclusivamente particulares e não econômicos.","c":"Art. 4º, I. As duas condições são cumulativas: exclusivamente particulares e não econômicos.","ap":-1},{"id":"lgpd-4-02","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"4","r":"LGPD, art. 4º, II, b","t":["acadêmicos, aplicando-se a esta hipótese os arts. 7º e 11 desta Lei"],"a":"excecao","d":2,"e":"Ao tratamento de dados realizado para fins exclusivamente acadêmicos não se aplica nenhum dispositivo da LGPD.","c":"Para fins acadêmicos, a lei ressalva a aplicação dos arts. 7º e 11 (bases legais). Só a exceção jornalística e artística (alínea “a”) não tem essa ressalva.","ap":-1},{"id":"lgpd-4-03","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"4","r":"LGPD, art. 4º, § 1º","t":["O tratamento de dados pessoais previsto no inciso III será regido por legislação específica"],"a":"sujeito","d":2,"e":"O tratamento de dados para fins exclusivos de segurança pública é regido pela própria LGPD, com adaptações definidas pela ANPD.","c":"O § 1º do art. 4º remete esse tratamento a legislação específica, que deve prever medidas proporcionais e estritamente necessárias e observar os princípios e direitos da LGPD.","ap":-1},{"id":"lgpd-4-04","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"4","r":"LGPD, art. 4º, § 2º","t":["É vedado o tratamento dos dados a que se refere o inciso III do caput deste artigo por pessoa de direito privado, exceto em procedimentos sob tutela de pessoa jurídica de direito público"],"a":"excecao","d":3,"e":"É vedado a pessoa de direito privado tratar dados para fins exclusivos de segurança pública, exceto em procedimentos sob tutela de pessoa jurídica de direito público, que devem ser objeto de informe específico à autoridade nacional.","c":"Art. 4º, § 2º. Esses procedimentos ainda devem respeitar o limite do § 4º.","ap":-1},{"id":"lgpd-4-05","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"4","r":"LGPD, art. 4º, § 4º","t":["Em nenhum caso a totalidade dos dados pessoais de banco de dados de que trata o inciso III do caput deste artigo poderá ser tratada por pessoa de direito privado, salvo por aquela que possua capital integralmente constituído pelo poder público"],"a":"excecao","d":3,"e":"A totalidade dos dados de banco de dados de segurança pública pode ser tratada por empresa privada contratada, desde que sob supervisão de órgão público.","c":"O § 4º do art. 4º proíbe isso em qualquer caso, salvo pessoa de direito privado com capital integralmente público.","ap":-1},{"id":"lgpd-4-06","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"4","r":"LGPD, art. 4º, IV","t":["provenientes de fora do território nacional e que não sejam objeto de comunicação, uso compartilhado de dados com agentes de tratamento brasileiros ou objeto de transferência internacional de dados com outro país que não o de proveniência"],"a":"excecao","d":3,"e":"A LGPD não se aplica a dados provenientes de fora do território nacional que não sejam compartilhados com agentes de tratamento brasileiros nem transferidos a país diverso do de proveniência, desde que esse país proporcione grau de proteção adequado.","c":"Art. 4º, IV. É o caso do dado que apenas transita pelo Brasil, por exemplo em data center contratado por empresa estrangeira. O § 2º do art. 3º faz a ressalva correspondente.","ap":-1},{"id":"lgpd-14-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"14","r":"LGPD, art. 14","t":["O tratamento de dados pessoais de crianças e de adolescentes deverá ser realizado em seu melhor interesse"],"a":"literal","d":1,"e":"O tratamento de dados pessoais de crianças e de adolescentes deve ser realizado em seu melhor interesse.","c":"Caput do art. 14. O ECA Digital (Lei nº 15.211/2025) trouxe regras próprias para o ambiente digital; elas entram no banco quando você trouxer o texto.","ap":-1},{"id":"lgpd-14-02","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"14","r":"LGPD, art. 14, § 1º","t":["com o consentimento específico e em destaque dado por pelo menos um dos pais ou pelo responsável legal"],"a":"numero","d":1,"e":"O tratamento de dados pessoais de crianças exige o consentimento específico e em destaque de ambos os pais.","c":"O § 1º do art. 14 exige o consentimento de pelo menos um dos pais ou do responsável legal.","ap":-1},{"id":"lgpd-14-03","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"14","r":"LGPD, art. 14, § 1º","t":["O tratamento de dados pessoais de crianças deverá ser realizado com o consentimento específico e em destaque"],"a":"sujeito","d":2,"e":"Segundo o § 1º do art. 14 da LGPD, o consentimento específico e em destaque de um dos pais é exigido para o tratamento de dados pessoais de adolescentes.","c":"O § 1º do art. 14 fala só em crianças. Para adolescentes, vale o melhor interesse do caput e as demais bases legais. Confira depois se o ECA Digital mudou algo para o ambiente digital.","ap":-1},{"id":"lgpd-14-04","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"14","r":"LGPD, art. 14, § 3º","t":["quando a coleta for necessária para contatar os pais ou o responsável legal, utilizados uma única vez e sem armazenamento, ou para sua proteção"],"a":"excecao","d":2,"e":"Dados de crianças podem ser coletados sem consentimento dos pais quando necessários para contatá-los, usados uma única vez e sem armazenamento, ou para a proteção da criança.","c":"Art. 14, § 3º. Em nenhum caso esses dados podem ser repassados a terceiro sem o consentimento do § 1º.","ap":-1},{"id":"lgpd-14-05","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"14","r":"LGPD, art. 14, § 4º","t":["Os controladores não deverão condicionar a participação dos titulares de que trata o § 1º deste artigo em jogos, aplicações de internet ou outras atividades ao fornecimento de informações pessoais além das estritamente necessárias à atividade"],"a":"excecao","d":2,"e":"O controlador pode condicionar a participação de criança em jogo on-line ao fornecimento de informações pessoais além das estritamente necessárias, desde que haja consentimento de um dos pais.","c":"O § 4º do art. 14 proíbe esse condicionamento, sem exceção por consentimento.","ap":-1},{"id":"lgpd-14-06","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"14","r":"LGPD, art. 14, § 5º","t":["O controlador deve realizar todos os esforços razoáveis para verificar que o consentimento a que se refere o § 1º deste artigo foi dado pelo responsável pela criança, consideradas as tecnologias disponíveis"],"a":"literal","d":2,"e":"O controlador deve realizar todos os esforços razoáveis para verificar que o consentimento foi dado pelo responsável pela criança, consideradas as tecnologias disponíveis.","c":"Art. 14, § 5º. Base da verificação de idade e de responsável, tema central do ECA Digital.","ap":-1},{"id":"lgpd-14-07","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"14","r":"LGPD, art. 14, § 2º","t":["os controladores deverão manter pública a informação sobre os tipos de dados coletados, a forma de sua utilização e os procedimentos para o exercício dos direitos a que se refere o art. 18 desta Lei"],"a":"literal","d":2,"e":"No tratamento de dados de crianças, os controladores devem manter pública a informação sobre os tipos de dados coletados, a forma de sua utilização e os procedimentos para o exercício dos direitos do titular.","c":"Art. 14, § 2º. O § 6º completa: informação simples, clara e acessível, adequada ao entendimento da criança.","ap":-1},{"id":"lgpd-61-01","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"61","r":"LGPD, art. 61","t":["independentemente de procuração ou de disposição contratual ou estatutária"],"a":"extrapolacao","d":2,"e":"A empresa estrangeira só pode ser notificada e intimada dos atos processuais previstos na LGPD mediante procuração específica outorgada ao seu representante no Brasil.","c":"O art. 61 permite notificar e intimar a empresa estrangeira na pessoa do agente, representante ou responsável por filial, agência ou escritório no Brasil, independentemente de procuração.","ap":-1},{"id":"lgpd-64-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"64","r":"LGPD, art. 64","t":["Os direitos e princípios expressos nesta Lei não excluem outros previstos no ordenamento jurídico pátrio relacionados à matéria ou nos tratados internacionais em que a República Federativa do Brasil seja parte"],"a":"literal","d":1,"e":"Os direitos e princípios da LGPD não excluem outros previstos no ordenamento jurídico brasileiro ou em tratados internacionais de que o Brasil seja parte.","c":"Art. 64. É uma cláusula de abertura, parecida com o art. 5º, § 2º, da Constituição.
