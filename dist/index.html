literal","d":2,"e":"As sanções administrativas da LGPD não substituem a aplicação de sanções administrativas, civis ou penais previstas no Código de Defesa do Consumidor e em legislação específica.","c":"§ 2º do art. 52. Por isso um Procon pode aplicar sanção com base no CDC, embora as sanções da própria LGPD sejam exclusivas da ANPD (art. 55-K).","ap":-1},{"id":"lgpd-52-23","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 4º","t":["a autoridade nacional poderá considerar o faturamento total da empresa ou grupo de empresas, quando não dispuser do valor do faturamento no ramo de atividade empresarial em que ocorreu a infração"],"a":"excecao","d":3,"e":"No cálculo da multa simples, a autoridade nacional poderá considerar o faturamento total da empresa ou grupo de empresas quando não dispuser do valor do faturamento no ramo de atividade em que ocorreu a infração.","c":"§ 4º do art. 52. A regra é considerar o ramo da infração; o faturamento total entra quando esse valor falta, vem incompleto ou não é demonstrado de forma inequívoca e idônea.","ap":-1},{"id":"lgpd-52-24","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 6º, II","t":["em caso de controladores submetidos a outros órgãos e entidades com competências sancionatórias, ouvidos esses órgãos"],"a":"literal","d":3,"e":"Para aplicar as sanções de suspensão ou de proibição a controlador submetido a outros órgãos e entidades com competências sancionatórias, a ANPD deve ouvir esses órgãos.","c":"§ 6º, II, do art. 52. Exemplo: um banco, submetido ao Banco Central. A oitiva vale para as sanções dos incisos X, XI e XII.","ap":-1},{"id":"lgpd-53-01","b":"lgpd-52-54","g":"E","l":"lgpd","art":"53","r":"LGPD, art. 53","t":["que deverá ser objeto de consulta pública"],"a":"extrapolacao","d":2,"e":"O regulamento da ANPD que define as metodologias de cálculo do valor-base das multas dispensa consulta pública, por tratar de matéria de organização interna da agência.","c":"O caput do art. 53 exige que o regulamento de sanções seja “objeto de consulta pública”. Esse regulamento é a Resolução CD/ANPD nº 4/2023.","ap":-1},{"id":"lgpd-53-02","b":"lgpd-52-54","g":"C","l":"lgpd","art":"53","r":"LGPD, art. 53, § 1º","t":["devem ser previamente publicadas, para ciência dos agentes de tratamento"],"a":"literal","d":2,"e":"As metodologias de cálculo do valor-base das multas devem ser previamente publicadas, para ciência dos agentes de tratamento, com fundamentação detalhada de todos os seus elementos.","c":"§ 1º do art. 53. A publicação prévia dá previsibilidade ao regulado, uma ideia central na regulação.","ap":-1},{"id":"lgpd-53-03","b":"lgpd-52-54","g":"C","l":"lgpd","art":"53","r":"LGPD, art. 53, § 2º","t":["deve estabelecer as circunstâncias e as condições para a adoção de multa simples ou diária"],"a":"literal","d":2,"e":"Cabe ao regulamento de sanções e metodologias estabelecer as circunstâncias e as condições para a adoção de multa simples ou de multa diária.","c":"§ 2º do art. 53. A escolha entre multa simples e diária não fica livre: depende das condições fixadas no regulamento.","ap":-1},{"id":"lgpd-54-01","b":"lgpd-52-54","g":"E","l":"lgpd","art":"54","r":"LGPD, art. 54, parágrafo único","t":["a descrição da obrigação imposta, o prazo razoável e estipulado pelo órgão para o seu cumprimento e o valor da multa diária"],"a":"rol","d":2,"e":"A intimação da sanção de multa diária deve conter a descrição da obrigação imposta e o valor da multa, sendo dispensada a indicação de prazo para cumprimento, já que a multa incide a partir da intimação.","c":"O parágrafo único do art. 54 exige, no mínimo, três elementos: descrição da obrigação, prazo razoável para cumprimento e valor da multa diária.","ap":-1},{"id":"lgpd-54-02","b":"lgpd-52-54","g":"C","l":"lgpd","art":"54","r":"LGPD, art. 54","t":["deve observar a gravidade da falta e a extensão do dano ou prejuízo causado e ser fundamentado pela autoridade nacional"],"a":"literal","d":1,"e":"O valor da multa diária deve observar a gravidade da falta e a extensão do dano ou prejuízo causado, e deve ser fundamentado pela autoridade nacional.","c":"Caput do art. 54. Dois critérios específicos da multa diária (gravidade da falta e extensão do dano), mais o dever de fundamentação.","ap":-1},{"id":"lgpd-65-01","b":"lgpd-52-54","g":"E","l":"lgpd","art":"65","r":"LGPD, art. 65, I-A","t":["dia 1º de agosto de 2021, quanto aos arts. 52, 53 e 54"],"a":"numero","d":2,"e":"Os arts. 52 a 54 da LGPD, que tratam das sanções administrativas, entraram em vigor junto com a maior parte da lei, 24 meses após sua publicação.","c":"As sanções tiveram vigência própria: 1º de agosto de 2021 (art. 65, I-A, incluído pela Lei nº 14.010/2020). A maior parte da lei entrou em vigor 24 meses após a publicação (inciso II), e os dispositivos da ANPD em 28/12/2018 (inciso I).","ap":-1},{"id":"lgpd-55k-01","b":"lgpd-52-54","g":"C","l":"lgpd","art":"55-K","r":"LGPD, art. 55-K","t":["A aplicação das sanções previstas nesta Lei compete exclusivamente à ANPD"],"a":"literal","d":1,"e":"A aplicação das sanções previstas na LGPD compete exclusivamente à ANPD.","c":"Caput do art. 55-K. Exclusividade sobre as sanções da LGPD não impede outros órgãos de aplicar sanções de suas próprias leis (art. 52, § 2º).","ap":-1},{"id":"lgpd2-55c-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-C","r":"LGPD, art. 55-C","t":["III - Corregedoria","IV - Ouvidoria"],"a":"rol","d":1,"e":"A Corregedoria e a Ouvidoria integram a composição da ANPD prevista na LGPD.","c":"Art. 55-C, III e IV. A composição completa: Conselho Diretor, CNPD, Corregedoria, Ouvidoria, Procuradoria, Auditoria e unidades administrativas e especializadas.","ap":-1},{"id":"lgpd2-55c-02","b":"lgpd-55","g":"C","l":"lgpd","art":"55-C","r":"LGPD, art. 55-C, V-A","t":["V-A - Procuradoria; (Redação dada pela Lei nº 15.352, de 2026)"],"a":"literal","d":2,"e":"Na redação vigente do art. 55-C da LGPD, a Procuradoria integra a composição da ANPD.","c":"Inciso V-A, com redação dada pela Lei nº 15.352/2026. A mesma lei incluiu a Auditoria (V-B).","ap":-1,"p":["Procuradoria federal junto a agências reguladoras"]},{"id":"lgpd2-55d-01","b":"lgpd-55","g":"E","l":"lgpd","art":"55-D","r":"LGPD, art. 55-D, § 4º","t":["Os mandatos dos primeiros membros do Conselho Diretor nomeados serão de 2 (dois), de 3 (três), de 4 (quatro), de 5 (cinco) e de 6 (seis) anos"],"a":"numero","d":2,"e":"Os primeiros membros do Conselho Diretor da ANPD foram nomeados todos com mandato de quatro anos, para garantir a coincidência dos mandatos.","c":"O § 4º do art. 55-D escalonou os primeiros mandatos em 2, 3, 4, 5 e 6 anos, justamente para evitar a coincidência e garantir a renovação gradual do colegiado.","ap":-1,"p":["Mandatos escalonados e não coincidentes em agências reguladoras"]},{"id":"lgpd2-55e-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-E","r":"LGPD, art. 55-E, § 1º","t":["cabe ao Ministro de Estado Chefe da Casa Civil da Presidência da República instaurar o processo administrativo disciplinar, que será conduzido por comissão especial constituída por servidores públicos federais estáveis"],"a":"literal","d":3,"e":"Na literalidade do art. 55-E, § 1º, da LGPD, cabe ao Ministro de Estado Chefe da Casa Civil da Presidência da República instaurar o processo administrativo disciplinar contra membro do Conselho Diretor, conduzido por comissão especial de servidores públicos federais estáveis.","c":"O texto compilado mantém a Casa Civil nesse parágrafo, embora a ANPD hoje seja vinculada ao Ministério da Justiça e Segurança Pública. Em prova de lei seca, vale a literalidade; confira se regulamento ou lei posterior tratou do ponto.","ap":-1,"p":["Quem instaura PAD contra diretor da ANPD após a Lei 15.352/2026"]},{"id":"lgpd2-55f-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-F","r":"LGPD, art. 55-F, parágrafo único","t":["A infração ao disposto no caput deste artigo caracteriza ato de improbidade administrativa."],"a":"literal","d":2,"e":"A violação, por ex-membro do Conselho Diretor da ANPD, das restrições pós-exercício do cargo caracteriza ato de improbidade administrativa.","c":"Art. 55-F e parágrafo único: aplica-se o art. 6º da Lei nº 12.813/2013 (conflito de interesses), e a infração é ato de improbidade.","ap":-1,"p":["Quarentena da Lei 12.813/2013 (conflito de interesses)"]},{"id":"lgpd2-55h-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-H","r":"LGPD, art. 55-H","t":["Os cargos em comissão e as funções de confiança da ANPD serão remanejados de outros órgãos e entidades do Poder Executivo federal."],"a":"literal","d":2,"e":"Os cargos em comissão e as funções de confiança da ANPD serão remanejados de outros órgãos e entidades do Poder Executivo federal.","c":"Art. 55-H, literal. O art. 55-I completa: os ocupantes são indicados pelo Conselho Diretor e nomeados ou designados pelo Diretor-Presidente.","ap":-1},{"id":"lgpd2-55j-01","b":"lgpd-55","g":"E","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, XII","t":["elaborar relatórios de gestão anuais acerca de suas atividades"],"a":"comparacao","d":3,"e":"Compete à ANPD elaborar relatórios anuais de avaliação da execução das ações da Política Nacional de Proteção de Dados Pessoais e da Privacidade.","c":"Essa é competência do CNPD (art. 58-B, II). À ANPD cabe elaborar relatórios de gestão anuais acerca de suas atividades (art. 55-J, XII), com o detalhamento de receitas e despesas (XV).","ap":-1},{"id":"lgpd2-55j-02","b":"lgpd-55","g":"E","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, III","t":["elaborar diretrizes para a Política Nacional de Proteção de Dados Pessoais e da Privacidade"],"a":"comparacao","d":3,"e":"Cabe ao CNPD elaborar as diretrizes da Política Nacional de Proteção de Dados Pessoais e da Privacidade, limitando-se a ANPD a executá-las.","c":"A ANPD elabora diretrizes para a Política Nacional (art. 55-J, III). O CNPD propõe diretrizes estratégicas e fornece subsídios (art. 58-B, I). Elaborar × propor é a diferença cobrada.","ap":-1},{"id":"lgpd2-55j-03","b":"lgpd-55","g":"C","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, IX","t":["promover ações de cooperação com autoridades de proteção de dados pessoais de outros países, de natureza internacional ou transnacional"],"a":"literal","d":1,"e":"Compete à ANPD promover ações de cooperação com autoridades de proteção de dados pessoais de outros países, de natureza internacional ou transnacional.","c":"Art. 55-J, IX. Base para os acordos de cooperação com autoridades estrangeiras e para a atuação em redes internacionais.","ap":-1,"p":["Rede Ibero-Americana de Proteção de Dados (RIPD) e Global Privacy Assembly"]},{"id":"lgpd2-55j-04","b":"lgpd-55","g":"C","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, XIII","t":["relatórios de impacto à proteção de dados pessoais para os casos em que o tratamento representar alto risco à garantia dos princípios gerais de proteção de dados pessoais"],"a":"literal","d":2,"e":"Compete à ANPD editar regulamentos e procedimentos sobre relatórios de impacto à proteção de dados pessoais para os casos em que o tratamento representar alto risco à garantia dos princípios gerais de proteção de dados.","c":"Art. 55-J, XIII. O conceito de alto risco foi detalhado no regulamento de agentes de pequeno porte (Resolução CD/ANPD nº 2/2022).","ap":-1,"p":["Tratamento de alto risco na Resolução CD/ANPD 2/2022"]},{"id":"lgpd2-55j-05","b":"lgpd-55","g":"E","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, XXI","t":["comunicar às autoridades competentes as infrações penais das quais tiver conhecimento"],"a":"sujeito","d":1,"e":"Compete à ANPD processar e julgar, na esfera administrativa, as infrações penais relacionadas ao tratamento de dados pessoais de que tiver conhecimento.","c":"Infração penal não é julgada na via administrativa. O art. 55-J, XXI, manda a ANPD comunicar às autoridades competentes as infrações penais de que tiver conhecimento.","ap":-1},{"id":"lgpd2-55j-06","b":"lgpd-55","g":"C","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, XXIV","t":["implementar mecanismos simplificados, inclusive por meio eletrônico, para o registro de reclamações sobre o tratamento de dados pessoais em desconformidade com esta Lei"],"a":"literal","d":1,"e":"Compete à ANPD implementar mecanismos simplificados, inclusive por meio eletrônico, para o registro de reclamações sobre tratamento de dados pessoais em desconformidade com a LGPD.","c":"Art. 55-J, XXIV, último inciso do rol de competências.","ap":-1},{"id":"lgpd2-55j-07","b":"lgpd-55","g":"C","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, § 4º","t":["A ANPD manterá fórum permanente de comunicação, inclusive por meio de cooperação técnica, com órgãos e entidades da administração pública responsáveis pela regulação de setores específicos da atividade econômica e governamental"],"a":"literal","d":2,"e":"A ANPD manterá fórum permanente de comunicação, inclusive por meio de cooperação técnica, com os órgãos e entidades responsáveis pela regulação de setores específicos da atividade econômica e governamental.","c":"Art. 55-J, § 4º. O § 3º manda coordenar atividades com os reguladores setoriais; o art. 55-K, parágrafo único, fala em articulação.","ap":-1,"p":["Acordos de cooperação técnica da ANPD com reguladores (Senacon, Cade e outros)"]},{"id":"lgpd2-55j-08","b":"lgpd-55","g":"E","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, II","t":["zelar pela observância dos segredos comercial e industrial, observada a proteção de dados pessoais e do sigilo das informações quando protegido por lei"],"a":"sujeito","d":2,"e":"A proteção dos segredos comercial e industrial é matéria estranha às competências da ANPD, cabendo exclusivamente ao Instituto Nacional da Propriedade Industrial.","c":"Zelar pela observância dos segredos comercial e industrial é competência expressa da ANPD (art. 55-J, II), observada a proteção de dados e o sigilo legal.","ap":-1},{"id":"lgpd2-55k-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-K","r":"LGPD, art. 55-K","t":["suas competências prevalecerão, no que se refere à proteção de dados pessoais, sobre as competências correlatas de outras entidades ou órgãos da administração pública"],"a":"literal","d":2,"e":"No que se refere à proteção de dados pessoais, as competências da ANPD prevalecem sobre as competências correlatas de outras entidades ou órgãos da administração pública.","c":"Art. 55-K, caput. A aplicação das sanções da LGPD é exclusiva da ANPD; os demais órgãos atuam em articulação (parágrafo único).","ap":-1},{"id":"lgpd2-55l-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-L","r":"LGPD, art. 55-L, VII","t":["o produto da venda de publicações, material técnico, dados e informações, inclusive para fins de licitação pública"],"a":"rol","d":2,"e":"Constitui receita da ANPD o produto da venda de publicações, material técnico, dados e informações, inclusive para fins de licitação pública.","c":"Art. 55-L, VII. Lembre que o inciso V foi vetado: as multas não são receita da ANPD; vão para o Fundo de Defesa de Direitos Difusos (art. 52, § 5º).","ap":-1},{"id":"lgpd2-58a-01","b":"lgpd-55","g":"E","l":"lgpd","art":"58-A","r":"LGPD, art. 58-A, XI","t":["XI - 2 (dois) de entidades representativas do setor laboral"],"a":"numero","d":2,"e":"O setor laboral tem três representantes no CNPD, mesmo número das entidades representativas do setor empresarial relacionado à área de tratamento de dados.","c":"Setor empresarial relacionado a dados (X) e setor laboral (XI) têm 2 representantes cada. Os trios são sociedade civil (VII), ciência e tecnologia (VIII) e confederações sindicais do setor produtivo (IX).","ap":-1},{"id":"lgpd2-58a-02","b":"lgpd-55","g":"C","l":"lgpd","art":"58-A","r":"LGPD, art. 58-A, § 1º","t":["Os representantes serão designados por ato do Presidente da República, permitida a delegação."],"a":"literal","d":2,"e":"Os representantes do CNPD serão designados por ato do Presidente da República, permitida a delegação.","c":"Art. 58-A, § 1º. A indicação dos representantes do poder público (incisos I a VI) cabe aos titulares dos órgãos (§ 2º); a dos demais segue regulamento (§ 3º, I).","ap":-1},{"id":"lgpd2-58b-01","b":"lgpd-55","g":"C","l":"lgpd","art":"58-B","r":"LGPD, art. 58-B, IV","t":["elaborar estudos e realizar debates e audiências públicas sobre a proteção de dados pessoais e da privacidade"],"a":"rol","d":2,"e":"Compete ao CNPD elaborar estudos e realizar debates e audiências públicas sobre a proteção de dados pessoais e da privacidade, além de sugerir ações a serem realizadas pela ANPD.","c":"Art. 58-B, III e IV. O CNPD é consultivo: propõe, sugere, estuda, avalia e dissemina. Não julga nem sanciona.","ap":-1},{"id":"lgpd-55a-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-A","r":"LGPD, art. 55-A","t":["autarquia de natureza especial vinculada ao Ministério da Justiça e Segurança Pública, dotada de autonomia funcional, técnica, decisória, administrativa e financeira, com patrimônio próprio e com sede e foro no Distrito Federal"],"a":"literal","d":1,"e":"A ANPD é autarquia de natureza especial vinculada ao Ministério da Justiça e Segurança Pública, dotada de autonomia funcional, técnica, decisória, administrativa e financeira, com patrimônio próprio e com sede e foro no Distrito Federal.","c":"Art. 55-A com a redação da Lei nº 15.352/2026. Decore as cinco autonomias: funcional, técnica, decisória, administrativa e financeira.","ap":-1},{"id":"lgpd-55a-02","b":"lgpd-55","g":"E","l":"lgpd","art":"55-A","r":"LGPD, art. 55-A","t":["vinculada ao Ministério da Justiça e Segurança Pública"],"a":"sujeito","d":1,"e":"A ANPD é autarquia de natureza especial vinculada à Presidência da República, com sede e foro no Distrito Federal.","c":"A vinculação é ao Ministério da Justiça e Segurança Pública. A ANPD nasceu como órgão da Presidência da República (redação original de 2019), e essa memória antiga é a pegadinha.","ap":-1},{"id":"lgpd-55a-03","b":"lgpd-55","g":"E","l":"lgpd","art":"55-A","r":"LGPD, art. 55-A","t":["dotada de autonomia funcional, técnica, decisória, administrativa e financeira"],"a":"rol","d":2,"e":"A ANPD possui autonomia funcional, técnica e decisória, mas, por ser vinculada a ministério, não dispõe de autonomia financeira nem de patrimônio próprio.","c":"O art. 55-A garante autonomia financeira e patrimônio próprio. Vinculação ministerial não é subordinação hierárquica.","ap":-1},{"id":"lgpd-55a-04","b":"lgpd-55","g":"C","l":"lgpd","art":"55-A","r":"LGPD, art. 55-A","t":["nos termos da Lei nº 13.848, de 25 de junho de 2019"],"a":"literal","d":2,"e":"Com a Lei nº 15.352/2026, a ANPD passou a ser regida, nos termos do art. 55-A da LGPD, pela Lei nº 13.848/2019, que dispõe sobre a gestão, a organização e o processo decisório das agências reguladoras.","c":"O art. 55-A remete expressamente à Lei nº 13.848/2019, o que leva para a ANPD as regras de agências reguladoras (análise de impacto regulatório, agenda regulatória, ouvidoria, prestação de contas). Por isso essa lei é tronco fixo do seu estudo.","ap":-1},{"id":"lgpd-5-viii-01","b":"lgpd-55","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, VIII","t":["atuar como canal de comunicação entre o controlador, os titulares dos dados e a Agência Nacional de Proteção de Dados (ANPD); (Redação dada pela Lei nº 15.352, de 2026)"],"a":"literal","d":2,"e":"Na redação dada pela Lei nº 15.352/2026, a definição legal de encarregado refere-se expressamente à Agência Nacional de Proteção de Dados como um dos polos do canal de comunicação.","c":"Art. 5º, VIII. A Lei nº 15.352/2026 trocou a referência à antiga Autoridade Nacional pela Agência Nacional de Proteção de Dados.","ap":-1},{"id":"lgpd-5-xix-01","b":"lgpd-55","g":"E","l":"lgpd","art":"5","r":"LGPD, art. 5º, XIX","t":["autoridade nacional: entidade da administração pública responsável por zelar, implementar e fiscalizar o cumprimento desta Lei em todo o território nacional"],"a":"conceito","d":3,"e":"Na redação vigente da LGPD, autoridade nacional é definida como órgão da administração pública direta responsável por zelar, implementar e fiscalizar o cumprimento da lei.","c":"A redação dada pela Lei nº 15.352/2026 ao art. 5º, XIX, usa “entidade da administração pública”. Órgão não tem personalidade jurídica; autarquia é entidade da administração indireta. A troca de uma palavra decide o item.","ap":-1},{"id":"lgpd-55c-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-C","r":"LGPD, art. 55-C","t":["I - Conselho Diretor, órgão máximo de direção","II - Conselho Nacional de Proteção de Dados Pessoais e da Privacidade","V-B - Auditoria"],"a":"rol","d":2,"e":"Integram a ANPD, entre outras unidades, o Conselho Diretor, órgão máximo de direção, o Conselho Nacional de Proteção de Dados Pessoais e da Privacidade e a Auditoria.","c":"Art. 55-C. A composição atual: Conselho Diretor, CNPD, Corregedoria, Ouvidoria, Procuradoria (V-A), Auditoria (V-B) e unidades administrativas e especializadas. Procuradoria e Auditoria vieram com a Lei nº 15.352/2026.","ap":-1},{"id":"lgpd-55c-02","b":"lgpd-55","g":"E","l":"lgpd","art":"55-C","r":"LGPD, art. 55-C, V-B","t":["V-B - Auditoria; e (Incluído pela Lei nº 15.352, de 2026)"],"a":"rol","d":2,"e":"A Auditoria não integra a estrutura da ANPD definida na LGPD, cabendo a função de auditoria interna exclusivamente à Controladoria-Geral da União.","c":"A Lei nº 15.352/2026 incluiu a Auditoria (inciso V-B) na composição da ANPD. Detalhe que interessa a quem estuda para o cargo.","ap":-1},{"id":"lgpd-55c-03","b":"lgpd-55","g":"E","l":"lgpd","art":"55-C","r":"LGPD, art. 55-C, II","t":["A ANPD é composta de","II - Conselho Nacional de Proteção de Dados Pessoais e da Privacidade"],"a":"conceito","d":2,"e":"O Conselho Nacional de Proteção de Dados Pessoais e da Privacidade é órgão externo à ANPD, vinculado diretamente ao Ministério da Justiça e Segurança Pública.","c":"O art. 55-C, II, lista o CNPD entre os órgãos que compõem a ANPD.","ap":-1},{"id":"lgpd-55d-01","b":"lgpd-55","g":"E","l":"lgpd","art":"55-D","r":"LGPD, art. 55-D","t":["O Conselho Diretor da ANPD será composto de 5 (cinco) diretores, incluído o Diretor-Presidente"],"a":"numero","d":1,"e":"O Conselho Diretor da ANPD é composto de sete diretores, incluído o Diretor-Presidente.","c":"São 5 diretores, incluído o Diretor-Presidente (art. 55-D).","ap":-1},{"id":"lgpd-55d-02","b":"lgpd-55","g":"C","l":"lgpd","art":"55-D","r":"LGPD, art. 55-D, § 1º","t":["serão escolhidos pelo Presidente da República e por ele nomeados, após aprovação pelo Senado Federal"],"a":"sujeito","d":1,"e":"Os membros do Conselho Diretor da ANPD são escolhidos e nomeados pelo Presidente da República, após aprovação pelo Senado Federal.","c":"§ 1º do art. 55-D, com base no art. 52, III, “f”, da Constituição (sabatina pelo Senado).","ap":-1},{"id":"lgpd-55d-03","b":"lgpd-55","g":"E","l":"lgpd","art":"55-D","r":"LGPD, art. 55-D, § 1º","t":["escolhidos pelo Presidente da República e por ele nomeados, após aprovação pelo Senado Federal"],"a":"sujeito","d":1,"e":"Os diretores da ANPD são nomeados pelo Ministro da Justiça e Segurança Pública, após aprovação pela Câmara dos Deputados.","c":"Quem escolhe e nomeia é o Presidente da República; quem aprova é o Senado Federal.","ap":-1},{"id":"lgpd-55d-04","b":"lgpd-55","g":"E","l":"lgpd","art":"55-D","r":"LGPD, art. 55-D, § 5º","t":["Na hipótese de vacância do cargo no curso do mandato de membro do Conselho Diretor, o prazo remanescente será completado pelo sucessor"],"a":"extrapolacao","d":2,"e":"Em caso de vacância no curso do mandato de membro do Conselho Diretor da ANPD, o sucessor é nomeado para cumprir mandato integral, contado da posse.","c":"O § 5º do art. 55-D manda o sucessor completar o prazo remanescente do mandato, sem iniciar novo mandato.","ap":-1},{"id":"lgpd-55d-05","b":"lgpd-55","g":"C","l":"lgpd","art":"55-D","r":"LGPD, art. 55-D, § 2º","t":["escolhidos dentre brasileiros que tenham reputação ilibada, nível superior de educação e elevado conceito no campo de especialidade dos cargos"],"a":"literal","d":2,"e":"Os membros do Conselho Diretor da ANPD devem ser brasileiros de reputação ilibada, com nível superior de educação e elevado conceito no campo de especialidade dos cargos para os quais são nomeados.","c":"§ 2º do art. 55-D. A lei não exige brasileiro nato.","ap":-1},{"id":"lgpd-55e-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-E","r":"LGPD, art. 55-E","t":["somente perderão seus cargos em virtude de renúncia, condenação judicial transitada em julgado ou pena de demissão decorrente de processo administrativo disciplinar"],"a":"rol","d":1,"e":"Os membros do Conselho Diretor da ANPD somente perdem seus cargos em virtude de renúncia, condenação judicial transitada em julgado ou pena de demissão decorrente de processo administrativo disciplinar.","c":"Art. 55-E. É a estabilidade no mandato que caracteriza a autonomia decisória das agências.","ap":-1},{"id":"lgpd-55e-02","b":"lgpd-55","g":"E","l":"lgpd","art":"55-E","r":"LGPD, art. 55-E","t":["somente perderão seus cargos em virtude de renúncia, condenação judicial transitada em julgado ou pena de demissão"],"a":"extrapolacao","d":1,"e":"Por ocuparem cargos de confiança, os diretores da ANPD podem ser exonerados a qualquer tempo pelo Presidente da República, independentemente de motivação.","c":"A exoneração livre (ad nutum) é incompatível com o art. 55-E, que lista de forma fechada as hipóteses de perda do cargo.","ap":-1},{"id":"lgpd-55e-03","b":"lgpd-55","g":"E","l":"lgpd","art":"55-E","r":"LGPD, art. 55-E, § 2º","t":["Compete ao Presidente da República determinar o afastamento preventivo, somente quando assim recomendado pela comissão especial"],"a":"excecao","d":3,"e":"O Presidente da República pode determinar o afastamento preventivo de diretor da ANPD a qualquer tempo, independentemente de recomendação da comissão especial que conduz o processo disciplinar.","c":"O § 2º do art. 55-E só admite o afastamento preventivo “quando assim recomendado pela comissão especial”.","ap":-1},{"id":"lgpd-55f-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-F","r":"LGPD, art. 55-F","t":["Aplica-se aos membros do Conselho Diretor, após o exercício do cargo, o disposto no art. 6º da Lei nº 12.813, de 16 de maio de 2013","A infração ao disposto no caput deste artigo caracteriza ato de improbidade administrativa"],"a":"literal","d":2,"e":"Aplicam-se aos ex-membros do Conselho Diretor da ANPD as restrições pós-exercício da Lei de Conflito de Interesses, e sua violação caracteriza ato de improbidade administrativa.","c":"Art. 55-F, que remete ao art. 6º da Lei nº 12.813/2013 (a chamada quarentena). É a ferramenta contra a porta giratória, risco clássico de captura regulatória.","ap":-1},{"id":"lgpd-55g-01","b":"lgpd-55","g":"E","l":"lgpd","art":"55-G","r":"LGPD, art. 55-G","t":["Ato do Presidente da República disporá sobre a estrutura regimental da ANPD","O Conselho Diretor disporá sobre o regimento interno da ANPD"],"a":"sujeito","d":2,"e":"A estrutura regimental da ANPD é aprovada por resolução do Conselho Diretor, ao passo que o regimento interno é aprovado por decreto do Presidente da República.","c":"É o contrário: estrutura regimental por ato do Presidente da República (art. 55-G, caput); regimento interno pelo Conselho Diretor (§ 2º).","ap":-1},{"id":"lgpd-55i-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-I","r":"LGPD, art. 55-I","t":["serão indicados pelo Conselho Diretor e nomeados ou designados pelo Diretor-Presidente"],"a":"sujeito","d":2,"e":"Os ocupantes dos cargos em comissão e das funções de confiança da ANPD são indicados pelo Conselho Diretor e nomeados ou designados pelo Diretor-Presidente.","c":"Art. 55-I. Duas autoridades diferentes: o colegiado indica, o Diretor-Presidente nomeia.","ap":-1},{"id":"lgpd-55j-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, IV","t":["fiscalizar e aplicar sanções em caso de tratamento de dados realizado em descumprimento à legislação, mediante processo administrativo que assegure o contraditório, a ampla defesa e o direito de recurso"],"a":"literal","d":1,"e":"Compete à ANPD fiscalizar e aplicar sanções em caso de tratamento de dados realizado em descumprimento à legislação, mediante processo administrativo que assegure o contraditório, a ampla defesa e o direito de recurso.","c":"Art. 55-J, IV. O rito desse processo está na Resolução CD/ANPD nº 1/2021.","ap":-1},{"id":"lgpd-55j-02","b":"lgpd-55","g":"E","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, XX","t":["deliberar, na esfera administrativa, em caráter terminativo, sobre a interpretação desta Lei, as suas competências e os casos omissos"],"a":"conceito","d":2,"e":"Compete à ANPD deliberar, na esfera administrativa, em caráter consultivo e sujeito a revisão ministerial, sobre a interpretação da LGPD e os casos omissos.","c":"O art. 55-J, XX, fala em caráter terminativo. Não há recurso hierárquico impróprio ao ministério contra a interpretação da ANPD na esfera administrativa.","ap":-1},{"id":"lgpd-55j-03","b":"lgpd-55","g":"C","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, XVII","t":["celebrar, a qualquer momento, compromisso com agentes de tratamento para eliminar irregularidade, incerteza jurídica ou situação contenciosa no âmbito de processos administrativos"],"a":"literal","d":2,"e":"A ANPD pode celebrar, a qualquer momento, compromisso com agentes de tratamento para eliminar irregularidade, incerteza jurídica ou situação contenciosa no âmbito de processos administrativos, conforme a Lei de Introdução às Normas do Direito Brasileiro.","c":"Art. 55-J, XVII, que remete ao Decreto-Lei nº 4.657/1942 (LINDB, art. 26). É a base do compromisso de ajustamento no processo da ANPD.","ap":-1},{"id":"lgpd-55j-04","b":"lgpd-55","g":"E","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, XVIII","t":["editar normas, orientações e procedimentos simplificados e diferenciados, inclusive quanto aos prazos"],"a":"extrapolacao","d":2,"e":"As normas simplificadas e diferenciadas que a ANPD pode editar para microempresas, empresas de pequeno porte e startups não podem tratar de prazos, sob pena de violação da isonomia.","c":"O art. 55-J, XVIII, autoriza tratamento diferenciado “inclusive quanto aos prazos”. A Resolução CD/ANPD nº 2/2022 usa essa base, por exemplo dobrando prazos.","ap":-1},{"id":"lgpd-55j-05","b":"lgpd-55","g":"C","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, XIX","t":["garantir que o tratamento de dados de idosos seja efetuado de maneira simples, clara, acessível e adequada ao seu entendimento"],"a":"literal","d":2,"e":"Compete à ANPD garantir que o tratamento de dados de idosos seja efetuado de maneira simples, clara, acessível e adequada ao seu entendimento.","c":"Art. 55-J, XIX, que remete ao Estatuto da Pessoa Idosa (Lei nº 10.741/2003). Dados de crianças e adolescentes estão no art. 14 e, agora, no ECA Digital.","ap":-1},{"id":"lgpd-55j-06","b":"lgpd-55","g":"E","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, § 1º","t":["a ANPD deve observar a exigência de mínima intervenção"],"a":"conceito","d":2,"e":"Ao impor condicionantes administrativas ao tratamento de dados por agente privado, a ANPD deve observar a exigência de máxima efetividade, podendo restringir a livre iniciativa sempre que isso aumentar a proteção dos titulares.","c":"O § 1º do art. 55-J impõe a exigência de mínima intervenção, com referência ao art. 170 da Constituição (ordem econômica).","ap":-1},{"id":"lgpd-55j-07","b":"lgpd-55","g":"C","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, § 2º","t":["Os regulamentos e as normas editados pela ANPD devem ser precedidos de consulta e audiência públicas, bem como de análises de impacto regulatório"],"a":"literal","d":1,"e":"Os regulamentos e as normas editados pela ANPD devem ser precedidos de consulta e audiência públicas e de análises de impacto regulatório.","c":"§ 2º do art. 55-J. A exigência conversa com a Lei nº 13.848/2019 (arts. 6º e 9º) e com o Decreto nº 10.411/2020.","ap":-1},{"id":"lgpd-55j-08","b":"lgpd-55","g":"E","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, § 2º","t":["devem ser precedidos de consulta e audiência públicas, bem como de análises de impacto regulatório"],"a":"extrapolacao","d":2,"e":"Por gozar de autonomia técnica, a ANPD pode editar regulamentos sem consulta pública nem análise de impacto regulatório, desde que justifique a urgência.","c":"O § 2º do art. 55-J não traz exceção de urgência. A autonomia técnica não afasta o dever de consulta e de AIR.","ap":-1},{"id":"lgpd-55j-09","b":"lgpd-55","g":"C","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, § 6º","t":["poderão ser analisadas de forma agregada, e as eventuais providências delas decorrentes poderão ser adotadas de forma padronizada"],"a":"literal","d":2,"e":"As reclamações de titulares recebidas pela ANPD podem ser analisadas de forma agregada, e as providências delas decorrentes podem ser adotadas de forma padronizada.","c":"§ 6º do art. 55-J. Permite à ANPD tratar reclamações em lote, por tema ou por agente, em vez de caso a caso.","ap":-1},{"id":"lgpd-55j-10","b":"lgpd-55","g":"C","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, XVI","t":["realizar auditorias, ou determinar sua realização, no âmbito da atividade de fiscalização de que trata o inciso IV","incluído o poder público"],"a":"literal","d":2,"e":"No âmbito da fiscalização, compete à ANPD realizar auditorias, ou determinar sua realização, sobre o tratamento de dados pessoais efetuado pelos agentes de tratamento, incluído o poder público.","c":"Art. 55-J, XVI. Junto com o art. 20, § 2º, é a base legal da atividade de auditoria da agência.","ap":-1},{"id":"lgpd-55j-11","b":"lgpd-55","g":"E","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, XXII","t":["comunicar aos órgãos de controle interno o descumprimento do disposto nesta Lei por órgãos e entidades da administração pública federal"],"a":"sujeito","d":3,"e":"Constatado descumprimento da LGPD por órgão da administração pública federal, compete à ANPD comunicar o fato ao Tribunal de Contas da União, órgão de controle interno do Poder Executivo.","c":"O art. 55-J, XXII, manda comunicar aos órgãos de controle interno. O TCU é órgão de controle externo, auxiliar do Congresso Nacional. Infrações penais vão às autoridades competentes (inciso XXI).","ap":-1},{"id":"lgpd-55k-02","b":"lgpd-55","g":"E","l":"lgpd","art":"55-K","r":"LGPD, art. 55-K","t":["A aplicação das sanções previstas nesta Lei compete exclusivamente à ANPD"],"a":"sujeito","d":2,"e":"A aplicação das sanções previstas na LGPD é compartilhada entre a ANPD e os órgãos de defesa do consumidor, prevalecendo a competência do órgão que primeiro instaurar o processo.","c":"As sanções da LGPD são exclusivas da ANPD (art. 55-K). O Procon pode sancionar com base no CDC (art. 52, § 2º), mas não aplica as sanções do art. 52.","ap":-1},{"id":"lgpd-55k-03","b":"lgpd-55","g":"C","l":"lgpd","art":"55-K","r":"LGPD, art. 55-K, parágrafo único","t":["será o órgão central de interpretação desta Lei e do estabelecimento de normas e diretrizes para a sua implementação"],"a":"literal","d":1,"e":"A ANPD é o órgão central de interpretação da LGPD e do estabelecimento de normas e diretrizes para a sua implementação.","c":"Parágrafo único do art. 55-K. A lei ainda usa a palavra “órgão” aqui, embora a ANPD seja autarquia. Em prova, a expressão “órgão central de interpretação” é a literal.","ap":-1},{"id":"lgpd-55l-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-L","r":"LGPD, art. 55-L","t":["os valores apurados em aplicações no mercado financeiro das receitas previstas neste artigo","o produto da venda de publicações, material técnico, dados e informações, inclusive para fins de licitação pública"],"a":"rol","d":2,"e":"Constituem receitas da ANPD, entre outras, os valores apurados em aplicações no mercado financeiro de suas receitas e o produto da venda de publicações, material técnico, dados e informações.","c":"Incisos IV e VII do art. 55-L. O inciso V foi vetado, e multas não são receita da agência (vão para o Fundo de Defesa de Direitos Difusos).","ap":-1},{"id":"lgpd-55m-01","b":"lgpd-55","g":"C","l":"lgpd","art":"55-M","r":"LGPD, art. 55-M","t":["que lhe forem transferidos pelos órgãos da Presidência da República","que venha a adquirir ou a incorporar"],"a":"literal","d":2,"e":"Constituem o patrimônio da ANPD os bens e direitos que lhe forem transferidos pelos órgãos da Presidência da República e os que venha a adquirir ou a incorporar.","c":"Art. 55-M, incluído pela Lei nº 14.460/2022, quando a ANPD deixou a Presidência e virou autarquia.","ap":-1},{"id":"lgpd-58a-01","b":"lgpd-55","g":"C","l":"lgpd","art":"58-A","r":"LGPD, art. 58-A","t":["será composto de 23 (vinte e três) representantes, titulares e suplentes"],"a":"numero","d":1,"e":"O Conselho Nacional de Proteção de Dados Pessoais e da Privacidade é composto de 23 representantes, titulares e suplentes.","c":"Art. 58-A. Distribuição: 5 do Executivo federal; 1 do Senado; 1 da Câmara; 1 do CNJ; 1 do CNMP; 1 do CGI.br; 3 da sociedade civil; 3 de ICTs; 3 de confederações sindicais do setor produtivo; 2 do setor empresarial; 2 do setor laboral.","ap":-1},{"id":"lgpd-58a-02","b":"lgpd-55","g":"E","l":"lgpd","art":"58-A","r":"LGPD, art. 58-A, I","t":["I - 5 (cinco) do Poder Executivo federal"],"a":"numero","d":2,"e":"Dos 23 representantes do CNPD, três são indicados pelo Poder Executivo federal, mesmo número reservado à sociedade civil com atuação em proteção de dados.","c":"O Poder Executivo federal tem 5 representantes (art. 58-A, I). A sociedade civil tem 3 (inciso VII).","ap":-1},{"id":"lgpd-58a-03","b":"lgpd-55","g":"C","l":"lgpd","art":"58-A","r":"LGPD, art. 58-A, § 3º, III","t":["terão mandato de 2 (dois) anos, permitida 1 (uma) recondução"],"a":"numero","d":2,"e":"Os representantes da sociedade civil, das instituições científicas, das confederações sindicais e dos setores empresarial e laboral no CNPD têm mandato de dois anos, permitida uma recondução.","c":"§ 3º, III, do art. 58-A, que alcança os representantes dos incisos VII a XI.","ap":-1},{"id":"lgpd-58a-04","b":"lgpd-55","g":"E","l":"lgpd","art":"58-A","r":"LGPD, art. 58-A, § 3º","t":["Os representantes de que tratam os incisos VII, VIII, IX, X e XI do caput deste artigo e seus suplentes"],"a":"extrapolacao","d":3,"e":"Conforme a LGPD, os representantes do Senado Federal e da Câmara dos Deputados no CNPD têm mandato de dois anos, permitida uma recondução.","c":"A regra do mandato de dois anos (§ 3º, III) vale só para os representantes dos incisos VII a XI. Os representantes do Senado e da Câmara (incisos II e III) são indicados pelos titulares dos órgãos (§ 2º), sem mandato fixado na lei.","ap":-1},{"id":"lgpd-58a-05","b":"lgpd-55","g":"E","l":"lgpd","art":"58-A","r":"LGPD, art. 58-A, § 3º, II","t":["não poderão ser membros do Comitê Gestor da Internet no Brasil"],"a":"excecao","d":3,"e":"Os representantes da sociedade civil no CNPD podem acumular a condição de membro do Comitê Gestor da Internet no Brasil, desde que não sejam remunerados.","c":"O § 3º, II, do art. 58-A proíbe que os representantes dos incisos VII a XI sejam membros do CGI.br. O CGI.br já tem seu próprio representante (inciso VI).","ap":-1},{"id":"lgpd-58a-06","b":"lgpd-55","g":"C","l":"lgpd","art":"58-A","r":"LGPD, art. 58-A, § 4º","t":["será considerada prestação de serviço público relevante, não remunerada"],"a":"literal","d":1,"e":"A participação no CNPD é considerada prestação de serviço público relevante, não remunerada.","c":"§ 4º do art. 58-A. Não remunerada e serviço público relevante: os dois atributos aparecem juntos e costumam ser trocados (por exemplo, “mediante jeton”).","ap":-1},{"id":"lgpd-58b-01","b":"lgpd-55","g":"C","l":"lgpd","art":"58-B","r":"LGPD, art. 58-B","t":["propor diretrizes estratégicas e fornecer subsídios para a elaboração da Política Nacional de Proteção de Dados Pessoais e da Privacidade e para a atuação da ANPD","sugerir ações a serem realizadas pela ANPD"],"a":"rol","d":2,"e":"Compete ao CNPD propor diretrizes estratégicas para a Política Nacional de Proteção de Dados Pessoais e da Privacidade e sugerir ações a serem realizadas pela ANPD.","c":"Incisos I e III do art. 58-B. As competências do CNPD são de proposição, avaliação, estudo e disseminação. Fiscalizar e sancionar ficam com o Conselho Diretor e as unidades da ANPD.","ap":-1},{"id":"lgpd-58b-02","b":"lgpd-55","g":"E","l":"lgpd","art":"58-B","r":"LGPD, art. 58-B","t":["elaborar relatórios anuais de avaliação da execução das ações da Política Nacional de Proteção de Dados Pessoais e da Privacidade"],"a":"sujeito","d":2,"e":"Compete ao CNPD julgar, em grau de recurso, os processos administrativos sancionadores instaurados pela ANPD.","c":"Nenhum inciso do art. 58-B dá ao CNPD função judicante. Suas competências são propor diretrizes, elaborar relatórios anuais de avaliação, sugerir ações, elaborar estudos e realizar audiências, e disseminar conhecimento.","ap":-1},{"id":"lgpd-65-02","b":"lgpd-55","g":"E","l":"lgpd","art":"65","r":"LGPD, art. 65, I","t":["dia 28 de dezembro de 2018, quanto aos arts. 55-A, 55-B, 55-C, 55-D, 55-E, 55-F, 55-G, 55-H, 55-I, 55-J, 55-K, 55-L, 58-A e 58-B"],"a":"numero","d":2,"e":"Os dispositivos que estruturam a ANPD e o CNPD entraram em vigor 24 meses após a publicação da LGPD, junto com os demais artigos.","c":"Os arts. 55-A a 55-L, 58-A e 58-B entraram em vigor em 28 de dezembro de 2018 (art. 65, I), antes do restante da lei. A estrutura da autoridade precisava existir antes das obrigações.","ap":-1},{"id":"lgpd3-5-01","b":"lgpd-5-11","g":"E","l":"lgpd","art":"5","r":"LGPD, art. 5º, X","t":["tratamento: toda operação realizada com dados pessoais, como as que se referem a coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação"],"a":"conceito","d":1,"e":"O mero armazenamento ou arquivamento de dados pessoais, sem nenhum uso ativo, não configura tratamento para os fins da LGPD.","c":"Arquivamento e armazenamento estão expressamente no conceito de tratamento (art. 5º, X), que abrange “toda operação realizada com dados pessoais”. Até a eliminação é tratamento.","ap":-1},{"id":"lgpd3-5-02","b":"lgpd-5-11","g":"E","l":"lgpd","art":"5","r":"LGPD, art. 5º, IV","t":["banco de dados: conjunto estruturado de dados pessoais, estabelecido em um ou em vários locais, em suporte eletrônico ou físico"],"a":"conceito","d":1,"e":"Para a LGPD, banco de dados é o conjunto estruturado de dados pessoais mantido em suporte eletrônico, não abrangendo arquivos físicos em papel.","c":"O art. 5º, IV, inclui suporte eletrônico ou físico, em um ou em vários locais. Fichários em papel também são banco de dados.","ap":-1},{"id":"lgpd3-5-03","b":"lgpd-5-11","g":"E","l":"lgpd","art":"5","r":"LGPD, art. 5º, IX","t":["agentes de tratamento: o controlador e o operador"],"a":"conceito","d":1,"e":"São agentes de tratamento, na definição da LGPD, o controlador, o operador e o encarregado.","c":"Agentes de tratamento são só o controlador e o operador (art. 5º, IX). O encarregado é canal de comunicação (VIII), não agente.","ap":-1},{"id":"lgpd3-5-04","b":"lgpd-5-11","g":"E","l":"lgpd","art":"5","r":"LGPD, art. 5º, VII","t":["operador: pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do controlador"],"a":"conceito","d":2,"e":"O operador é a pessoa natural ou jurídica que realiza o tratamento de dados pessoais em nome próprio, segundo seus próprios interesses e finalidades.","c":"O operador trata dados “em nome do controlador” (art. 5º, VII). Quem trata para finalidades próprias decide sobre o tratamento e, por isso, é controlador.","ap":-1},{"id":"lgpd3-1-01","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"1","r":"LGPD, art. 1º","t":["por pessoa natural ou por pessoa jurídica de direito público ou privado"],"a":"sujeito","d":1,"e":"A LGPD dispõe sobre o tratamento de dados pessoais realizado por pessoas naturais e por pessoas jurídicas de direito privado, não alcançando as pessoas jurídicas de direito público, regidas pela Lei de Acesso à Informação.","c":"O art. 1º inclui pessoas jurídicas de direito público, que têm até capítulo próprio na LGPD (arts. 23 a 32).","ap":-1},{"id":"lgpd3-1-02","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"1","r":"LGPD, art. 1º, parágrafo único","t":["As normas gerais contidas nesta Lei são de interesse nacional e devem ser observadas pela União, Estados, Distrito Federal e Municípios."],"a":"sujeito","d":1,"e":"As normas gerais da LGPD são de interesse federal e vinculam apenas a União e suas entidades, cabendo a cada ente federativo editar sua própria lei geral de proteção de dados.","c":"As normas gerais são de interesse nacional e devem ser observadas por União, Estados, DF e Municípios (art. 1º, parágrafo único). Além disso, legislar sobre o tema é privativo da União (CF, art. 22, XXX).","ap":-1},{"id":"lgpd3-14-01","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"14","r":"LGPD, art. 14, § 3º","t":["quando a coleta for necessária para contatar os pais ou o responsável legal, utilizados uma única vez e sem armazenamento"],"a":"excecao","d":2,"e":"Os dados de criança coletados sem consentimento parental para contatar os pais podem ser armazenados pelo controlador para contatos futuros, desde que não sejam repassados a terceiros.","c":"O § 3º do art. 14 exige uso uma única vez e sem armazenamento. A outra exceção é a coleta para a proteção da criança.","ap":-1},{"id":"lgpd3-14-02","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"14","r":"LGPD, art. 14, § 5º","t":["O controlador deve realizar todos os esforços razoáveis para verificar que o consentimento a que se refere o § 1º deste artigo foi dado pelo responsável pela criança, consideradas as tecnologias disponíveis."],"a":"absoluto","d":2,"e":"O controlador responde objetivamente se não garantir, de forma absoluta e infalível, que o consentimento para tratamento de dados de criança foi dado pelo responsável legal.","c":"A LGPD exige “todos os esforços razoáveis”, consideradas as tecnologias disponíveis (art. 14, § 5º): dever de meio, não garantia absoluta. Para serviços digitais, veja também o ECA Digital.","ap":-1},{"id":"lgpd3-14-03","b":"lgpd-1-4-14","g":"E","l":"lgpd","art":"14","r":"LGPD, art. 14, § 6º","t":["de forma a proporcionar a informação necessária aos pais ou ao responsável legal e adequada ao entendimento da criança"],"a":"extrapolacao","d":2,"e":"As informações sobre o tratamento de dados de crianças devem ser dirigidas exclusivamente aos pais, dispensada sua adaptação ao entendimento da criança.","c":"O § 6º manda informar os pais e, também, de forma adequada ao entendimento da criança, com recursos audiovisuais quando adequado.","ap":-1},{"id":"lgpd3-55m-01","b":"lgpd-55","g":"E","l":"lgpd","art":"55-M","r":"LGPD, art. 55-M, I","t":["que lhe forem transferidos pelos órgãos da Presidência da República"],"a":"sujeito","d":3,"e":"Na literalidade da LGPD, constituem o patrimônio da ANPD os bens e os direitos que lhe forem transferidos pelo Ministério da Justiça e Segurança Pública e os que venha a adquirir ou a incorporar.","c":"O art. 55-M, I, fala em bens transferidos “pelos órgãos da Presidência da República”, memória da época em que a ANPD integrava a Presidência. A vinculação atual ao MJSP (art. 55-A) não mudou esse inciso.","ap":-1},{"id":"lgpd3-58a-01","b":"lgpd-55","g":"E","l":"lgpd","art":"58-A","r":"LGPD, art. 58-A","t":["VII - 3 (três) de entidades da sociedade civil com atuação relacionada a proteção de dados pessoais"],"a":"rol","d":1,"e":"O CNPD é composto exclusivamente de representantes do poder público, indicados pelos titulares dos respectivos órgãos.","c":"Dos 23 membros, 13 vêm de fora do poder público: sociedade civil (3), instituições científicas (3), confederações sindicais (3), setor empresarial (2) e setor laboral (2).","ap":-1},{"id":"painel-01","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 3º","t":["O disposto nos incisos I, IV, V, VI, X, XI e XII do caput deste artigo poderá ser aplicado às entidades e aos órgãos públicos"],"a":"rol","d":2,"e":"A LGPD veda a aplicação de multa simples ou diária, no âmbito do processo administrativo sancionador conduzido pela ANPD, a órgãos e entidades públicas.","c":"Atenção ao mecanismo: o art. 52, § 3º, não usa a palavra “veda”. Ele lista os incisos aplicáveis a entidades e órgãos públicos (I, IV, V, VI, X, XI e XII), e a multa simples e a multa diária (incisos II e III) ficam fora da lista. É essa omissão num rol taxativo que impede a multa contra ente público, e é esse tipo de troca (“a lei proíbe” por “a lei lista o permitido, e X não está na lista”) que o Cebraspe usa para decidir um item.","ap":-1},{"id":"painel-02","b":"lgpd-55","g":"C","l":"lgpd","art":"55-C","r":"LGPD, art. 55-C","t":["I - Conselho Diretor, órgão máximo de direção","II - Conselho Nacional de Proteção de Dados Pessoais e da Privacidade"],"a":"rol","d":2,"e":"A LGPD inclui na composição da ANPD, ao lado do Conselho Diretor, seu órgão máximo de direção, o Conselho Nacional de Proteção de Dados Pessoais e da Privacidade, integrado por representantes do poder público e da sociedade civil.","c":"Art. 55-C, I e II, e art. 58-A (23 representantes, do Executivo, do Legislativo, do CNJ, do CNMP, do CGI.br, da sociedade civil, da academia, do setor produtivo e do setor laboral). Esta questão substitui a versão antiga do painel, que chamava o Conselho Diretor de “diretoria executiva” e atribuía ao CNPD “caráter consultivo”, termos que não estão na lei e poderiam tornar o item errado.","ap":-1},{"id":"painel-03","b":"lgpd-17-22","g":"C","l":"lgpd","art":"18","r":"LGPD, art. 18","t":["confirmação da existência de tratamento","correção de dados incompletos, inexatos ou desatualizados","portabilidade dos dados a outro fornecedor de serviço ou produto"],"a":"rol","d":1,"e":"Entre os direitos do titular previstos na LGPD estão a confirmação da existência de tratamento, o acesso aos dados, a correção de dados incompletos ou desatualizados e a portabilidade dos dados a outro fornecedor de serviço.","c":"Rol do art. 18. O Cebraspe costuma testar se algum direito parecido, mas não previsto no rol, foi incluído de propósito no item. Vale decorar os nove incisos.","ap":-1},{"id":"painel-04","b":"lgpd-33-36","g":"C","l":"lgpd","art":"33","r":"LGPD, art. 33","t":["A transferência internacional de dados pessoais somente é permitida nos seguintes casos"],"a":"rol","d":1,"e":"Como regra geral, a transferência internacional de dados pessoais pela LGPD depende de uma das hipóteses legais específicas (como adequação do país de destino, cláusulas-padrão contratuais ou consentimento específico do titular), não bastando o mero acordo entre o controlador brasileiro e o destinatário estrangeiro.","c":"Espírito do art. 33: a transferência é exceção regrada, não livre pactuação. O consentimento do inciso VIII, aliás, precisa ser específico e em destaque, com informação prévia sobre o caráter internacional.","ap":-1},{"id":"painel-05","b":"lgpd-17-22","g":"C","l":"lgpd","art":"20","r":"LGPD, art. 20","t":["O titular dos dados tem direito a solicitar a revisão de decisões tomadas unicamente com base em tratamento automatizado de dados pessoais que afetem seus interesses","§ 3º (VETADO)"],"a":"vetado","d":1,"e":"O titular de dados pessoais tem direito a solicitar a revisão de decisões tomadas unicamente com base em tratamento automatizado que afetem seus interesses, incluídas as que definem perfil pessoal, profissional, de consumo ou de crédito.","c":"Caput do art. 20. O § 3º, que trataria da revisão por pessoa natural, foi incluído pela Lei nº 13.853/2019 e vetado: hoje o art. 20 tem só caput, § 1º e § 2º em vigor. Um item que afirme que “a lei exige revisão por pessoa natural” estaria errado.","ap":-1},{"id":"painel-06","b":"res-19-2024","g":"E","l":"res19","art":null,"r":"Res. CD/ANPD 19/2024, art. 6º","t":[],"a":"conceito","d":2,"e":"Nos termos do Regulamento de Transferência Internacional de Dados (Resolução CD/ANPD nº 19/2024), a coleta de dados pessoais realizada diretamente no exterior por agente de tratamento estrangeiro, sem qualquer intermediação de agente de tratamento situado no território nacional, configura transferência internacional de dados para todos os efeitos.","c":"O art. 6º do Regulamento é expresso: “a coleta internacional de dados não caracteriza transferência internacional de dados”. São duas figuras distintas: a coleta internacional segue as hipóteses do art. 3º da LGPD, não o regime do art. 33. Separar coleta de transferência é a pegadinha central deste artigo.","ap":-1,"v":0},{"id":"painel-07","b":"res-19-2024","g":"E","l":"res19","art":null,"r":"Res. CD/ANPD 19/2024, art. 16","t":[],"a":"extrapolacao","d":2,"e":"O agente de tratamento que fundamentar uma transferência internacional de dados nas cláusulas-padrão contratuais aprovadas pela ANPD pode adaptar o texto das cláusulas mandatórias (Seção II do Anexo II), desde que preserve nível de proteção equivalente ao exigido pela LGPD.","c":"O art. 16 é categórico: a validade pressupõe “a adoção integral e sem alteração do texto” das cláusulas do Anexo II. A Seção II se chama “Cláusulas Mandatórias”; só a Seção I (campos de identificação) e a Seção IV (cláusulas adicionais, que não podem contrariar as Seções I a III) admitem preenchimento pelas partes.","ap":-1,"v":0},{"id":"painel-08","b":"res-19-2024","g":"E","l":"res19","art":null,"r":"Res. CD/ANPD 19/2024, Anexo II, cláusula 16.1","t":[],"a":"numero","d":2,"e":"Segundo as cláusulas-padrão contratuais aprovadas pela ANPD, a comunicação à ANPD e aos titulares sobre incidente de segurança que possa acarretar risco ou dano relevante deve ocorrer no prazo de 2 (dois) dias úteis, contado da identificação do incidente.","c":"O prazo correto é de 3 (três) dias úteis, não 2 (Cláusula 16.1 do Anexo II). Prazo exato é o tipo de detalhe que o Cebraspe testa trocando o número. Não confunda com o prazo de 15 dias para responder ao titular sobre a íntegra das cláusulas (art. 17, § 1º, e Cláusula 15.3).","ap":-1,"v":0},{"id":"painel-09","b":"res-19-2024","g":"E","l":"res19","art":null,"r":"Res. CD/ANPD 19/2024, art. 13","t":[],"a":"comparacao","d":3,"e":"Qualquer pessoa jurídica de direito privado interessada pode requerer diretamente à ANPD a instauração de procedimento de decisão de adequação do nível de proteção de dados de país estrangeiro, da mesma forma como pode fazê-lo em relação ao reconhecimento de equivalência de cláusulas-padrão contratuais estrangeiras.","c":"São regimes diferentes. A decisão de adequação (art. 13, I) só pode ser instaurada de ofício pelo Conselho Diretor ou por solicitação das pessoas jurídicas de direito público referidas na Lei de Acesso à Informação. Já o reconhecimento de equivalência de cláusulas-padrão (art. 18, § 1º, I) admite “requerimento dos interessados”, inclusive privados.","ap":-1,"v":0},{"id":"painel-10","b":"res-19-2024","g":"C","l":"res19","art":null,"r":"Res. CD/ANPD 19/2024, art. 34","t":[],"a":"literal","d":2,"e":"Das decisões do Conselho Diretor da ANPD nos procedimentos de decisão de adequação, de equivalência de cláusulas-padrão ou de aprovação de cláusulas específicas e normas corporativas globais, cabe pedido de reconsideração fundamentado, no prazo de 10 dias úteis contados da ciência oficial pelo interessado, nos termos do Anexo da Resolução CD/ANPD nº 1/2021.","c":"É o art. 34 do Regulamento, e mostra como as resoluções se encaixam: o prazo e o rito remetem ao art. 12 do Anexo da Resolução CD/ANPD nº 1/2021, a mesma resolução do processo de fiscalização e sancionador.","ap":-1,"v":0},{"id":"pt2-01","b":"portugues","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":1,"e":"Depreende-se do texto que a responsabilidade das organizações passou a abranger também a prevenção, e não apenas a reação aos incidentes.","c":"O primeiro parágrafo diz que se exige demonstrar medidas adotadas “antes dele”, além da reação. Ideia ligada ao princípio da prevenção da LGPD.","ap":2},{"id":"pt2-02","b":"portugues","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"Segundo o texto, a pequena loja virtual está dispensada de conhecer os dados que coleta, por não dispor de departamento de segurança.","c":"O texto diz o oposto: a loja não precisa de um departamento inteiro, “mas deve conhecer os dados que coleta e por que os coleta”.","ap":2},{"id":"pt2-03","b":"portugues","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"No primeiro parágrafo, a comparação dos vazamentos com tempestades reforça a ideia, criticada pelo autor, de que esses eventos seriam imprevisíveis e alheios à vontade humana.","c":"A comparação, introduzida por “quase como”, retrata a visão antiga, que o texto declara superada (“Essa visão mudou”).","ap":2},{"id":"pt2-04","b":"portugues","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"No trecho “uma pequena loja virtual, por sua vez, não precisa”, a expressão “por sua vez” poderia ser suprimida sem prejuízo da correção, mas a vírgula depois de “virtual” teria de ser mantida.","c":"Suprimida a expressão intercalada, as duas vírgulas que a isolam devem sair juntas; manter a vírgula depois de “virtual” separaria indevidamente o sujeito do verbo.","ap":2},{"id":"pt2-05","b":"portugues","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"O vocábulo “portanto”, no segundo parágrafo, introduz conclusão extraída dos exemplos apresentados e poderia ser substituído por por conseguinte, sem alteração de sentido.","c":"Ambas são conjunções ou locuções conclusivas.","ap":2},{"id":"pt2-06","b":"portugues","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"Em “Resta saber se as autoridades conseguirão fiscalizar”, o vocábulo “se” é pronome apassivador.","c":"É conjunção integrante, que introduz oração subordinada substantiva (o que resta saber). Teste: substituindo por “isso”, a frase continua com sentido (resta saber isso).","ap":2},{"id":"pt2-07","b":"portugues","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":3,"e":"A forma verbal “haviam adotado” indica ação anterior a outro fato passado mencionado no período, no caso, o incidente.","c":"Pretérito mais-que-perfeito composto: a adoção das medidas é anterior ao incidente.","ap":2},{"id":"pt2-08","b":"portugues","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"O autor defende, no último parágrafo, que o aumento progressivo do valor das multas é a resposta mais provável para a limitação de pessoal das autoridades.","c":"O texto afirma que a resposta “não está em multas cada vez maiores”, mas em orientações, prioridades públicas e sanções exemplares a reincidentes.","ap":2},{"id":"pt-01","b":"portugues","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":1,"e":"O vocábulo “Contudo”, que inicia o segundo parágrafo, poderia ser substituído por Entretanto, sem prejuízo da correção gramatical e do sentido do texto.","c":"As duas conjunções são adversativas e equivalentes nesse contexto.","ap":3},{"id":"pt-02","b":"portugues","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"No trecho “cabe ao Estado assegurar que o consentimento seja livre e informado”, o sujeito da forma verbal “cabe” é “ao Estado”.","c":"“Ao Estado” é complemento (objeto indireto). O sujeito é a oração “assegurar que o consentimento seja livre e informado” (oração subordinada substantiva subjetiva): o que cabe ao Estado é assegurar.","ap":3},{"id":"pt-03","b":"portugues","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"Em “o usuário raramente se pergunta”, a próclise é justificada pela presença do advérbio, que atrai o pronome para antes do verbo.","c":"Advérbios sem pausa (raramente, não, nunca, já) são palavras atrativas pela norma-padrão.","ap":3},{"id":"pt-04","b":"portugues","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"No trecho “aquelas que dialogam com o setor regulado, publicam suas prioridades e aplicam sanções”, as formas verbais estão no plural para concordar com “interesses”.","c":"Os verbos concordam com o pronome relativo “que”, cujo antecedente é “aquelas” (as agências). “Interesses” está em outra oração.","ap":3},{"id":"pt-05","b":"portugues","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":1,"e":"O texto defende que a regulação da proteção de dados deve conciliar a proteção dos titulares e a inovação.","c":"“regular não significa impedir a inovação” e “equilibrar esses interesses” sustentam a leitura.","ap":3},{"id":"pt-06","b":"portugues","g":"E","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"absoluto","d":1,"e":"Segundo o texto, a confiança dos cidadãos depende exclusivamente da firmeza das sanções aplicadas pelo Estado.","c":"O texto diz “tanto da firmeza quanto da previsibilidade”. O “exclusivamente” contradiz a correlação aditiva.","ap":3},{"id":"pt-07","b":"portugues","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":2,"e":"Em “É justamente nesse ponto que a regulação se mostra necessária”, a expressão “É... que” tem valor de realce e poderia ser suprimida, sem prejuízo da correção gramatical, reescrevendo-se o trecho como Justamente nesse ponto a regulação se mostra necessária.","c":"“É... que” é expressão expletiva (de realce). Retirá-la mantém a correção e o sentido básico, só reduz a ênfase.","ap":3},{"id":"pt-08","b":"portugues","g":"C","l":"texto","art":null,"r":"Texto de apoio","t":[],"a":"interpretacao","d":1,"e":"O emprego do sinal indicativo de crase em “acesso à agenda” é obrigatório.","c":"O nome “acesso” rege a preposição “a”, e “agenda” é palavra feminina que admite artigo: a + a = à.","ap":3},{"id":"rg2-01","b":"regulacao-teoria","g":"C","l":"doutrina","art":null,"r":"Doutrina · regulação por incentivos","t":[],"a":"conceito","d":2,"e":"Na regulação por preço-teto, a firma regulada se apropria, por certo período, dos ganhos de eficiência obtidos, o que cria incentivo à redução de custos, ao contrário da regulação pela taxa de retorno.","c":"Price cap (RPI − X) × rate of return. Na taxa de retorno, a firma tende a inflar a base de capital (efeito Averch-Johnson).","ap":-1},{"id":"rg2-02","b":"regulacao-teoria","g":"E","l":"doutrina","art":null,"r":"Doutrina · autorregulação","t":[],"a":"conceito","d":2,"e":"A autorregulação regulada caracteriza-se pela completa ausência de participação estatal, cabendo apenas ao setor privado criar e fiscalizar as regras.","c":"Na autorregulação regulada (corregulação), o Estado define parâmetros, reconhece e supervisiona os instrumentos privados. A LGPD faz isso com boas práticas (art. 50, § 3º) e selos e certificados (art. 35).","ap":-1},{"id":"rg2-03","b":"regulacao-teoria","g":"C","l":"decreto","art":null,"r":"Decreto nº 10.411/2020","t":[],"a":"conceito","d":2,"e":"O Decreto nº 10.411/2020 prevê, além da análise de impacto regulatório prévia, a avaliação de resultado regulatório, destinada a verificar os efeitos de atos normativos já em vigor.","c":"AIR (ex ante) e ARR (ex post) formam o ciclo regulatório. A ANPD está sujeita a ambas como agência.","ap":-1,"p":["Avaliação de resultado regulatório (ARR)"],"v":0},{"id":"rg2-04","b":"regulacao-teoria","g":"E","l":"lc","art":null,"r":"Lei Complementar nº 182/2021","t":[],"a":"conceito","d":2,"e":"O participante de ambiente regulatório experimental fica dispensado, de forma permanente, das normas do regulador afastadas durante o teste.","c":"O sandbox é temporário, com condições e limites definidos pelo regulador. Encerrado o período, valem as regras gerais ou as novas regras editadas a partir do aprendizado.","ap":-1,"v":0},{"id":"rg2-05","b":"regulacao-teoria","g":"C","l":"doutrina","art":null,"r":"Doutrina · falhas de governo","t":[],"a":"conceito","d":2,"e":"Além das falhas de mercado, a teoria da regulação reconhece falhas de governo, como captura, assimetria de informação do regulador e custos regulatórios excessivos.","c":"Justifica instrumentos como AIR, consulta pública, agenda regulatória e transparência decisória (Lei nº 13.848/2019).","ap":-1},{"id":"rg2-06","b":"regulacao-teoria","g":"C","l":"doutrina","art":null,"r":"Doutrina · regulação baseada em risco","t":[],"a":"conceito","d":2,"e":"Na regulação baseada em risco, o regulador concentra recursos de fiscalização nos agentes e nas atividades que apresentam maior probabilidade e maior impacto de dano.","c":"A LGPD adota essa lógica em vários pontos: incidentes que possam acarretar risco ou dano relevante (art. 48), RIPD para alto risco (art. 55-J, XIII) e dosimetria (art. 52, § 1º).","ap":-1},{"id":"rg2-07","b":"regulacao-teoria","g":"E","l":"doutrina","art":null,"r":"Doutrina · regulação responsiva","t":[],"a":"conceito","d":2,"e":"A regulação responsiva recomenda que o regulador inicie sempre pela sanção mais severa, para gerar efeito dissuasório máximo.","c":"A pirâmide começa pela persuasão e pelo diálogo na base, escalando para sanções mais severas apenas diante da resistência do regulado (Ayres e Braithwaite).","ap":-1},{"id":"rg2-08","b":"regulacao-teoria","g":"C","l":"doutrina","art":null,"r":"Doutrina · agências reguladoras","t":[],"a":"conceito","d":2,"e":"A autonomia das agências reguladoras busca reduzir a interferência político-eleitoral de curto prazo nas decisões técnicas e dar previsibilidade aos regulados.","c":"Instrumentos: mandatos fixos e não coincidentes, estabilidade dos dirigentes, decisão colegiada e autonomia financeira (Lei nº 13.848/2019).","ap":-1},{"id":"reg-01","b":"regulacao-teoria","g":"C","l":"doutrina","art":null,"r":"Doutrina · captura","t":[],"a":"conceito","d":1,"e":"A teoria da captura sustenta que agências reguladoras podem passar a atuar em favor dos interesses dos regulados, em detrimento do interesse público que justificou sua criação.","c":"Formulação associada a George Stigler (1971). Mandatos fixos, quarentena e decisões colegiadas fundamentadas são as defesas institucionais clássicas.","ap":-1},{"id":"reg-02","b":"regulacao-teoria","g":"E","l":"doutrina","art":null,"r":"Doutrina · captura","t":[],"a":"absoluto","d":2,"e":"A captura regulatória pressupõe, necessariamente, a corrupção ativa de dirigentes da agência por agentes regulados.","c":"A captura pode ocorrer sem ilícito: dependência de informações fornecidas pelo setor (captura informacional), afinidade de visão de mundo (captura cognitiva) e porta giratória entre agência e mercado.","ap":-1},{"id":"reg-03","b":"regulacao-teoria","g":"C","l":"doutrina","art":null,"r":"Doutrina · falhas de mercado","t":[],"a":"conceito","d":1,"e":"Externalidades, bens públicos, poder de mercado e assimetria de informação são falhas de mercado tradicionalmente invocadas para justificar a regulação estatal.","c":"Em proteção de dados, a assimetria de informação é a falha central: o titular não sabe o que é feito com seus dados nem consegue avaliar o risco.","ap":-1},{"id":"reg-04","b":"regulacao-teoria","g":"C","l":"decreto","art":null,"r":"Decreto nº 10.411/2020","t":[],"a":"conceito","d":2,"e":"A análise de impacto regulatório (AIR) é procedimento realizado antes da edição do ato normativo, com o objetivo de avaliar os possíveis efeitos das alternativas regulatórias e subsidiar a tomada de decisão.","c":"A AIR é ex ante. Foi regulamentada pelo Decreto nº 10.411/2020, que trata do art. 5º da Lei nº 13.874/2019 e do art. 6º da Lei nº 13.848/2019. Na LGPD, é exigida pelo art. 55-J, § 2º.","ap":-1,"v":0},{"id":"reg-05","b":"regulacao-teoria","g":"E","l":"decreto","art":null,"r":"Decreto nº 10.411/2020","t":[],"a":"conceito","d":2,"e":"A análise de impacto regulatório é realizada após a entrada em vigor do ato normativo, para verificar se seus objetivos foram alcançados.","c":"A verificação posterior é a avaliação de resultado regulatório (ARR), ex post. A AIR vem antes da decisão.","ap":-1,"v":0},{"id":"reg-06","b":"regulacao-teoria","g":"C","l":"doutrina","art":null,"r":"Doutrina · regulação responsiva","t":[],"a":"conceito","d":2,"e":"Na regulação responsiva, a atuação do regulador é organizada em pirâmide: na base, medidas de persuasão e orientação; no topo, as sanções mais severas, aplicadas quando o regulado persiste no descumprimento.","c":"Modelo de Ian Ayres e John Braithwaite (1992). O regulamento de fiscalização da ANPD (Resolução CD/ANPD nº 1/2021) costuma ser descrito como responsivo; confira quando o texto entrar no banco.","ap":-1},{"id":"reg-07","b":"regulacao-teoria","g":"E","l":"doutrina","art":null,"r":"Doutrina · regulação responsiva","t":[],"a":"conceito","d":2,"e":"Na pirâmide da regulação responsiva, a base é ocupada pelas sanções mais severas, aplicadas desde logo para gerar efeito dissuasório.","c":"É o contrário: a base tem as medidas mais brandas e mais usadas; a severidade cresce em direção ao topo. A LGPD reflete a ideia ao exigir sanção anterior antes da suspensão ou proibição (art. 52, § 6º).","ap":-1},{"id":"reg-08","b":"regulacao-teoria","g":"C","l":"lc","art":null,"r":"Lei Complementar nº 182/2021","t":[],"a":"conceito","d":2,"e":"O ambiente regulatório experimental, ou sandbox regulatório, permite que empresas testem produtos ou serviços inovadores sob condições regulatórias flexibilizadas, por tempo limitado e com supervisão do regulador.","c":"A figura está definida no Marco Legal das Startups (Lei Complementar nº 182/2021). A ANPD abriu discussão pública sobre um sandbox de inteligência artificial e proteção de dados.","ap":-1,"v":0},{"id":"reg-09","b":"regulacao-teoria","g":"E","l":"lgpd","art":"55-F","r":"LGPD, art. 55-F","t":["Aplica-se aos membros do Conselho Diretor, após o exercício do cargo, o disposto no art. 6º da Lei nº 12.813, de 16 de maio de 2013"],"a":"sujeito","d":2,"e":"A restrição à atuação de ex-diretores da ANPD no setor regulado, conhecida como quarentena, está prevista exclusivamente no regimento interno da agência.","c":"A quarentena dos ex-membros do Conselho Diretor está na própria LGPD (art. 55-F), que remete à Lei de Conflito de Interesses (Lei nº 12.813/2013). A violação é improbidade administrativa.","ap":-1},{"id":"reg-10","b":"regulacao-teoria","g":"C","l":"lgpd","art":"55-E","r":"LGPD, art. 55-E","t":["somente perderão seus cargos em virtude de renúncia, condenação judicial transitada em julgado ou pena de demissão decorrente de processo administrativo disciplinar"],"a":"conceito","d":2,"e":"A estabilidade dos dirigentes durante o mandato, que só podem perder o cargo nas hipóteses previstas em lei, é instrumento de autonomia das agências reguladoras frente a pressões políticas.","c":"Na ANPD, o art. 55-E da LGPD limita a perda do cargo a renúncia, condenação judicial transitada em julgado e demissão em processo disciplinar.","ap":-1},{"id":"reg-11","b":"regulacao-teoria","g":"C","l":"lgpd","art":"50","r":"LGPD, art. 50, § 3º","t":["poderão ser reconhecidas e divulgadas pela autoridade nacional"],"a":"conceito","d":2,"e":"A possibilidade de a autoridade nacional reconhecer e divulgar regras de boas práticas e de governança formuladas pelos próprios agentes de tratamento é exemplo de corregulação na LGPD.","c":"Art. 50, § 3º. Na corregulação, o setor elabora as regras e o Estado as reconhece e supervisiona, diferente da autorregulação pura e da regulação estatal direta.","ap":-1},{"id":"reg-12","b":"regulacao-teoria","g":"E","l":"doutrina","art":null,"r":"Doutrina · regulação baseada em risco","t":[],"a":"conceito","d":2,"e":"A regulação baseada em risco distribui os recursos de fiscalização de forma igual entre todos os regulados, independentemente do potencial de dano de suas atividades.","c":"A regulação baseada em risco concentra a fiscalização onde a probabilidade e a gravidade do dano são maiores. É a lógica do Mapa de Temas Prioritários da ANPD.","ap":-1},{"id":"reg-13","b":"regulacao-teoria","g":"C","l":"res31","art":null,"r":"Res. CD/ANPD 31/2025","t":[],"a":"numero","d":3,"e":"A Agenda Regulatória 2025-2026 da ANPD, atualizada pela Resolução CD/ANPD nº 31/2025, organiza seus itens em quatro fases e inclui temas como direitos dos titulares e compartilhamento de dados pelo Poder Público.","c":"Segundo o seu Plano de Estudos: 19 itens em 4 fases, com os arts. 9º, 18 a 20, 26, 27, 30, 46 e 12, § 3º, da LGPD. Agenda regulatória é instrumento de planejamento previsto na Lei nº 13.848/2019.","ap":-1,"v":0},{"id":"reg-14","b":"regulacao-teoria","g":"E","l":"res30","art":null,"r":"Res. CD/ANPD 30/2025","t":[],"a":"conceito","d":2,"e":"O Mapa de Temas Prioritários 2026-2027 da ANPD (Resolução CD/ANPD nº 30/2025) é norma de efeito externo que cria novas obrigações para os agentes de tratamento.","c":"O Mapa é planejamento da fiscalização, sem criar obrigações novas. Seus quatro temas (titulares, crianças e ECA Digital, Poder Público e IA) indicam onde a ANPD vai concentrar esforços.","ap":-1,"v":0},{"id":"reg-15","b":"regulacao-teoria","g":"C","l":"res30","art":null,"r":"Res. CD/ANPD 30/2025","t":[],"a":"rol","d":2,"e":"O Mapa de Temas Prioritários 2026-2027 da ANPD inclui, entre seus temas, a proteção de crianças e adolescentes no ambiente digital e a inteligência artificial.","c":"Segundo o seu Plano de Estudos, os quatro temas são direitos dos titulares, crianças e adolescentes (ECA Digital), Poder Público e inteligência artificial, com metas numéricas.","ap":-1,"v":0},{"id":"r15-01","b":"res-15-2024","g":"C","l":"res15","art":null,"r":"Res. CD/ANPD 15/2024","t":[],"a":"numero","d":1,"e":"Segundo o regulamento de comunicação de incidentes da ANPD, a comunicação à autoridade deve ser feita pelo controlador em três dias úteis, contados do conhecimento de que o incidente afetou dados pessoais.","c":"A Resolução CD/ANPD nº 15/2024 deu concretude ao “prazo razoável” do art. 48, § 1º, da LGPD.","ap":-1,"p":["Formulário de comunicação de incidente de segurança (CIS) da ANPD"],"v":0},{"id":"r15-02","b":"res-15-2024","g":"E","l":"res15","art":null,"r":"Res. CD/ANPD 15/2024","t":[],"a":"comparacao","d":1,"e":"Assim como no GDPR, o regulamento da ANPD fixa o prazo de 72 horas, contado da ocorrência do incidente, para a comunicação à autoridade.","c":"São três dias úteis, contados do conhecimento pelo controlador de que o incidente afetou dados pessoais. As 72 horas são do GDPR (art. 33).","ap":-1,"v":0},{"id":"r15-03","b":"res-15-2024","g":"C","l":"res15","art":null,"r":"Res. CD/ANPD 15/2024","t":[],"a":"numero","d":2,"e":"O controlador deve manter registro dos incidentes de segurança, inclusive dos que não foram comunicados à ANPD e aos titulares, pelo prazo mínimo de cinco anos.","c":"O registro permite demonstrar a avaliação feita e conversa com o princípio da responsabilização e prestação de contas (art. 6º, X, da LGPD).","ap":-1,"v":0},{"id":"r15-04","b":"res-15-2024","g":"E","l":"res15","art":null,"r":"Res. CD/ANPD 15/2024","t":[],"a":"extrapolacao","d":2,"e":"Segundo a Resolução CD/ANPD nº 15/2024, o dever de registro alcança apenas os incidentes que foram comunicados à ANPD, por presumirem risco relevante.","c":"O registro abrange também os incidentes não comunicados.","ap":-1,"v":0},{"id":"r15-05","b":"res-15-2024","g":"C","l":"res15","art":null,"r":"Res. CD/ANPD 15/2024","t":[],"a":"conceito","d":2,"e":"Na avaliação de se o incidente pode acarretar risco ou dano relevante, consideram-se fatores como a natureza e a sensibilidade dos dados, o número de titulares afetados e o perfil desses titulares.","c":"Confira no texto a lista completa, que inclui dados sensíveis, dados de crianças, adolescentes e idosos, dados financeiros e tratamento em larga escala.","ap":-1,"v":0},{"id":"r2-01","b":"res-2-2022","g":"C","l":"res2","art":null,"r":"Res. CD/ANPD 2/2022","t":[],"a":"conceito","d":1,"e":"Para o regulamento da ANPD, podem ser agentes de tratamento de pequeno porte, entre outros, microempresas, empresas de pequeno porte, startups, pessoas jurídicas de direito privado sem fins lucrativos, pessoas naturais e entes privados despersonalizados.","c":"Resolução CD/ANPD nº 2/2022, editada com base no art. 55-J, XVIII, da LGPD.","ap":-1,"v":0},{"id":"r2-02","b":"res-2-2022","g":"C","l":"res2","art":null,"r":"Res. CD/ANPD 2/2022","t":[],"a":"conceito","d":2,"e":"Considera-se de alto risco o tratamento que atender, cumulativamente, a pelo menos um critério geral e a pelo menos um critério específico previstos no regulamento de agentes de pequeno porte.","c":"Critérios gerais: larga escala ou afetação significativa de direitos. Específicos: tecnologias emergentes, vigilância de zonas públicas, decisões automatizadas, dados sensíveis ou de crianças, adolescentes e idosos. Confira a redação exata.","ap":-1,"p":["Critérios gerais e específicos de alto risco (Resolução CD/ANPD 2/2022)"],"v":0},{"id":"r2-03","b":"res-2-2022","g":"E","l":"res2","art":null,"r":"Res. CD/ANPD 2/2022","t":[],"a":"excecao","d":2,"e":"O agente de tratamento de pequeno porte que realiza tratamento de alto risco mantém todos os benefícios do regime diferenciado, por força de seu porte econômico.","c":"Quem realiza tratamento de alto risco não pode se beneficiar do tratamento jurídico diferenciado do regulamento, qualquer que seja o porte.","ap":-1,"v":0},{"id":"r2-04","b":"res-2-2022","g":"C","l":"res2","art":null,"r":"Res. CD/ANPD 2/2022","t":[],"a":"excecao","d":1,"e":"Os agentes de tratamento de pequeno porte não são obrigados a indicar o encarregado exigido pelo art. 41 da LGPD.","c":"A dispensa vem com o dever de manter canal de comunicação com o titular. A base legal é o art. 41, § 3º, da LGPD.","ap":-1,"v":0},{"id":"r2-05","b":"res-2-2022","g":"E","l":"res2","art":null,"r":"Res. CD/ANPD 2/2022","t":[],"a":"absoluto","d":1,"e":"A microempresa que trata dados pessoais sem alto risco deve indicar encarregado, sob pena de multa, pois a LGPD não admite exceção a esse dever.","c":"O art. 41, § 3º, da LGPD permite dispensa por norma da ANPD, e a Resolução CD/ANPD nº 2/2022 dispensou os agentes de pequeno porte.","ap":-1,"v":0},{"id":"r2-06","b":"res-2-2022","g":"C","l":"res2","art":null,"r":"Res. CD/ANPD 2/2022","t":[],"a":"numero","d":3,"e":"Quando solicitado pela ANPD, o agente de tratamento de pequeno porte deve comprovar, em até quinze dias, que se enquadra no regime diferenciado.","c":"Prazo citado nos resumos do regulamento; confira no texto.","ap":-1,"v":0},{"id":"r18-01","b":"res-18-2024","g":"C","l":"res18","art":null,"r":"Res. CD/ANPD 18/2024","t":[],"a":"conceito","d":2,"e":"A indicação do encarregado deve ser feita por ato formal do agente de tratamento, documento escrito, datado e assinado, do qual constem as formas de atuação e as atividades a desempenhar.","c":"Resolução CD/ANPD nº 18/2024. O documento deve ser apresentado à ANPD quando solicitado.","ap":-1,"p":["Resolução CD/ANPD 18/2024: deveres do agente em relação ao encarregado"],"v":0},{"id":"r18-02","b":"res-18-2024","g":"E","l":"res18","art":null,"r":"Res. CD/ANPD 18/2024","t":[],"a":"conceito","d":2,"e":"O encarregado deve ser obrigatoriamente pessoa natural com vínculo empregatício com o controlador.","c":"O regulamento admite pessoa natural ou jurídica, integrante do quadro ou externa (encarregado como serviço).","ap":-1,"v":0},{"id":"r18-03","b":"res-18-2024","g":"C","l":"res18","art":null,"r":"Res. CD/ANPD 18/2024","t":[],"a":"conceito","d":2,"e":"O encarregado pode acumular outras funções na organização, desde que não haja conflito de interesse.","c":"O conflito de interesse é o limite. Exemplo típico de risco: acumular com cargos que decidem sobre o próprio tratamento de dados.","ap":-1,"v":0},{"id":"r18-04","b":"res-18-2024","g":"E","l":"res18","art":null,"r":"Res. CD/ANPD 18/2024","t":[],"a":"extrapolacao","d":2,"e":"O ato formal de designação do encarregado só produz efeitos após registro e homologação pela ANPD.","c":"Não há registro ou homologação prévia: o ato formal é apresentado à ANPD quando solicitado. A identidade e o contato do
