não tiver seguido as instruções lícitas do controlador, hipótese em que o operador equipara-se ao controlador"],"a":"caso","d":2,"e":"Situação hipotética: empresa contratada para processar a folha de pagamento de um hospital usou os dados dos empregados para oferecer empréstimos próprios, contrariando as instruções do contratante. Assertiva: nessa situação, a contratada equipara-se ao controlador e responde solidariamente pelos danos causados.","c":"Art. 42, § 1º, I: o operador que não segue as instruções lícitas do controlador equipara-se a ele e responde solidariamente, salvo as excludentes do art. 43.","ap":-1},{"id":"lgpd2-43-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"43","r":"LGPD, art. 43, II","t":["que, embora tenham realizado o tratamento de dados pessoais que lhes é atribuído, não houve violação à legislação de proteção de dados"],"a":"rol","d":2,"e":"O agente de tratamento não será responsabilizado se provar que, embora tenha realizado o tratamento de dados que lhe é atribuído, não houve violação à legislação de proteção de dados.","c":"Art. 43, II. As três excludentes: não realizou o tratamento; realizou sem violar a lei; culpa exclusiva do titular ou de terceiro. O “só não serão” indica rol fechado.","ap":-1},{"id":"lgpd2-44-01","b":"lgpd-37-45","g":"E","l":"lgpd","art":"44","r":"LGPD, art. 44, III","t":["as técnicas de tratamento de dados pessoais disponíveis à época em que foi realizado"],"a":"numero","d":3,"e":"Para aferir se o tratamento forneceu a segurança que o titular podia esperar, consideram-se as técnicas de tratamento de dados disponíveis na data do julgamento da ação de reparação.","c":"Art. 44, III: as técnicas disponíveis “à época em que foi realizado” o tratamento. A troca do marco temporal decide o item.","ap":-1},{"id":"lgpd2-45-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"45","r":"LGPD, art. 45","t":["As hipóteses de violação do direito do titular no âmbito das relações de consumo permanecem sujeitas às regras de responsabilidade previstas na legislação pertinente."],"a":"literal","d":1,"e":"As hipóteses de violação do direito do titular no âmbito das relações de consumo permanecem sujeitas às regras de responsabilidade previstas na legislação pertinente.","c":"Art. 45. Na prática, remete ao Código de Defesa do Consumidor, com responsabilidade objetiva do fornecedor.","ap":-1,"p":["Responsabilidade civil na LGPD: subjetiva ou objetiva?"]},{"id":"lgpd-37-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"37","r":"LGPD, art. 37","t":["O controlador e o operador devem manter registro das operações de tratamento de dados pessoais que realizarem, especialmente quando baseado no legítimo interesse"],"a":"literal","d":1,"e":"O controlador e o operador devem manter registro das operações de tratamento de dados pessoais que realizarem, especialmente quando baseado no legítimo interesse.","c":"Art. 37. O registro das operações (inventário de dados) é a primeira coisa que uma auditoria pede.","ap":-1},{"id":"lgpd-37-02","b":"lgpd-37-45","g":"E","l":"lgpd","art":"37","r":"LGPD, art. 37","t":["O controlador e o operador devem manter registro das operações"],"a":"sujeito","d":1,"e":"O dever de manter registro das operações de tratamento de dados pessoais é exclusivo do controlador, cabendo ao operador apenas seguir suas instruções.","c":"O art. 37 impõe o registro ao controlador e ao operador.","ap":-1},{"id":"lgpd-38-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"38","r":"LGPD, art. 38","t":["A autoridade nacional poderá determinar ao controlador que elabore relatório de impacto à proteção de dados pessoais, inclusive de dados sensíveis"],"a":"literal","d":1,"e":"A autoridade nacional pode determinar ao controlador que elabore relatório de impacto à proteção de dados pessoais, inclusive de dados sensíveis, referente a suas operações de tratamento.","c":"Caput do art. 38. Observados os segredos comercial e industrial e nos termos de regulamento.","ap":-1},{"id":"lgpd-38-02","b":"lgpd-37-45","g":"E","l":"lgpd","art":"38","r":"LGPD, art. 38, parágrafo único","t":["o relatório deverá conter, no mínimo, a descrição dos tipos de dados coletados, a metodologia utilizada para a coleta e para a garantia da segurança das informações e a análise do controlador com relação a medidas, salvaguardas e mecanismos de mitigação de risco adotados"],"a":"extrapolacao","d":2,"e":"O relatório de impacto à proteção de dados pessoais deve conter, no mínimo, a identificação nominal de todos os titulares cujos dados são tratados.","c":"O conteúdo mínimo do parágrafo único do art. 38 é: tipos de dados coletados, metodologia de coleta e de segurança, e análise do controlador sobre medidas, salvaguardas e mitigação de risco. Lista nominal de titulares não entra.","ap":-1},{"id":"lgpd-39-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"39","r":"LGPD, art. 39","t":["O operador deverá realizar o tratamento segundo as instruções fornecidas pelo controlador, que verificará a observância das próprias instruções e das normas sobre a matéria"],"a":"literal","d":1,"e":"O operador deve realizar o tratamento segundo as instruções fornecidas pelo controlador, que verificará a observância das próprias instruções e das normas sobre a matéria.","c":"Art. 39. Se o operador descumpre instruções lícitas, passa a responder solidariamente como se fosse controlador (art. 42, § 1º, I).","ap":-1},{"id":"lgpd-40-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"40","r":"LGPD, art. 40","t":["A autoridade nacional poderá dispor sobre padrões de interoperabilidade para fins de portabilidade, livre acesso aos dados e segurança, assim como sobre o tempo de guarda dos registros"],"a":"literal","d":2,"e":"A autoridade nacional pode dispor sobre padrões de interoperabilidade para fins de portabilidade, livre acesso aos dados e segurança, bem como sobre o tempo de guarda dos registros.","c":"Art. 40, tendo em vista especialmente a necessidade e a transparência.","ap":-1},{"id":"lgpd-41-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"41","r":"LGPD, art. 41, § 1º","t":["A identidade e as informações de contato do encarregado deverão ser divulgadas publicamente, de forma clara e objetiva, preferencialmente no sítio eletrônico do controlador"],"a":"literal","d":1,"e":"A identidade e as informações de contato do encarregado devem ser divulgadas publicamente, de forma clara e objetiva, preferencialmente no sítio eletrônico do controlador.","c":"Art. 41, § 1º. A Resolução CD/ANPD nº 18/2024 detalha a atuação do encarregado.","ap":-1},{"id":"lgpd-41-02","b":"lgpd-37-45","g":"E","l":"lgpd","art":"41","r":"LGPD, art. 41, § 1º","t":["deverão ser divulgadas publicamente"],"a":"extrapolacao","d":1,"e":"A identidade do encarregado deve ser informada exclusivamente à autoridade nacional, preservando-se o sigilo perante os titulares.","c":"O § 1º do art. 41 manda divulgar publicamente a identidade e o contato do encarregado. Ele é o canal de comunicação com os titulares.","ap":-1},{"id":"lgpd-41-03","b":"lgpd-37-45","g":"C","l":"lgpd","art":"41","r":"LGPD, art. 41, § 2º","t":["aceitar reclamações e comunicações dos titulares, prestar esclarecimentos e adotar providências","orientar os funcionários e os contratados da entidade a respeito das práticas a serem tomadas em relação à proteção de dados pessoais"],"a":"rol","d":2,"e":"Entre as atividades do encarregado estão aceitar reclamações e comunicações dos titulares, prestar esclarecimentos e adotar providências, e orientar os funcionários e os contratados da entidade sobre as práticas de proteção de dados.","c":"Incisos I e III do art. 41, § 2º. Os outros dois: receber comunicações da ANPD e adotar providências; e executar demais atribuições do controlador ou de normas complementares.","ap":-1},{"id":"lgpd-41-04","b":"lgpd-37-45","g":"E","l":"lgpd","art":"41","r":"LGPD, art. 41, § 3º","t":["inclusive hipóteses de dispensa da necessidade de sua indicação, conforme a natureza e o porte da entidade ou o volume de operações de tratamento de dados"],"a":"extrapolacao","d":2,"e":"A LGPD veda que a autoridade nacional dispense qualquer controlador da indicação de encarregado.","c":"O § 3º do art. 41 autoriza a ANPD a prever hipóteses de dispensa, conforme natureza e porte da entidade ou volume de operações. A Resolução CD/ANPD nº 2/2022 usa essa autorização para agentes de pequeno porte.","ap":-1},{"id":"lgpd-41-05","b":"lgpd-37-45","g":"E","l":"lgpd","art":"41","r":"LGPD, art. 41, § 2º, II","t":["receber comunicações da autoridade nacional e adotar providências"],"a":"sujeito","d":2,"e":"Compete ao encarregado aplicar sanções disciplinares aos empregados do controlador que violarem a política de privacidade.","c":"As atividades do encarregado (art. 41, § 2º) são de comunicação, orientação e providências. Poder disciplinar é do empregador, não está na lista.","ap":-1},{"id":"lgpd-42-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"42","r":"LGPD, art. 42","t":["causar a outrem dano patrimonial, moral, individual ou coletivo, em violação à legislação de proteção de dados pessoais, é obrigado a repará-lo"],"a":"literal","d":1,"e":"O controlador ou o operador que, em razão do exercício de atividade de tratamento de dados pessoais, causar a outrem dano patrimonial, moral, individual ou coletivo, em violação à legislação de proteção de dados, é obrigado a repará-lo.","c":"Caput do art. 42. Alcança dano patrimonial e moral, individual e coletivo.","ap":-1},{"id":"lgpd-42-02","b":"lgpd-37-45","g":"C","l":"lgpd","art":"42","r":"LGPD, art. 42, § 1º, I","t":["o operador responde solidariamente pelos danos causados pelo tratamento quando descumprir as obrigações da legislação de proteção de dados ou quando não tiver seguido as instruções lícitas do controlador, hipótese em que o operador equipara-se ao controlador"],"a":"excecao","d":2,"e":"O operador responde solidariamente pelos danos causados pelo tratamento quando descumprir as obrigações da legislação de proteção de dados ou não seguir as instruções lícitas do controlador, hipótese em que se equipara ao controlador.","c":"Art. 42, § 1º, I. Ressalvadas as excludentes do art. 43.","ap":-1},{"id":"lgpd-42-03","b":"lgpd-37-45","g":"E","l":"lgpd","art":"42","r":"LGPD, art. 42, § 1º, I","t":["quando descumprir as obrigações da legislação de proteção de dados ou quando não tiver seguido as instruções lícitas do controlador"],"a":"absoluto","d":2,"e":"O operador responde solidariamente com o controlador por qualquer dano causado pelo tratamento, ainda que tenha cumprido a legislação e seguido as instruções lícitas recebidas.","c":"A solidariedade do operador depende de descumprimento da lei ou das instruções lícitas do controlador (art. 42, § 1º, I).","ap":-1},{"id":"lgpd-42-04","b":"lgpd-37-45","g":"C","l":"lgpd","art":"42","r":"LGPD, art. 42, § 1º, II","t":["os controladores que estiverem diretamente envolvidos no tratamento do qual decorreram danos ao titular dos dados respondem solidariamente"],"a":"literal","d":2,"e":"Os controladores diretamente envolvidos no tratamento do qual decorreram danos ao titular respondem solidariamente, salvo as excludentes previstas na LGPD.","c":"Art. 42, § 1º, II. Caso típico: controladoria conjunta.","ap":-1},{"id":"lgpd-42-05","b":"lgpd-37-45","g":"E","l":"lgpd","art":"42","r":"LGPD, art. 42, § 2º","t":["O juiz, no processo civil, poderá inverter o ônus da prova a favor do titular dos dados quando, a seu juízo, for verossímil a alegação, houver hipossuficiência para fins de produção de prova ou quando a produção de prova pelo titular resultar-lhe excessivamente onerosa"],"a":"absoluto","d":2,"e":"Nas ações de reparação de danos fundadas na LGPD, a inversão do ônus da prova em favor do titular é automática e obrigatória.","c":"O § 2º do art. 42 diz que o juiz “poderá” inverter, a seu juízo, quando houver verossimilhança, hipossuficiência ou prova excessivamente onerosa. É faculdade judicial, não regra automática.","ap":-1},{"id":"lgpd-42-06","b":"lgpd-37-45","g":"C","l":"lgpd","art":"42","r":"LGPD, art. 42, § 4º","t":["Aquele que reparar o dano ao titular tem direito de regresso contra os demais responsáveis, na medida de sua participação no evento danoso"],"a":"literal","d":2,"e":"Aquele que reparar o dano ao titular tem direito de regresso contra os demais responsáveis, na medida de sua participação no evento danoso.","c":"Art. 42, § 4º. A solidariedade protege o titular; entre os responsáveis, o prejuízo se divide pela participação de cada um.","ap":-1},{"id":"lgpd-43-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"43","r":"LGPD, art. 43","t":["que não realizaram o tratamento de dados pessoais que lhes é atribuído","que o dano é decorrente de culpa exclusiva do titular dos dados ou de terceiro"],"a":"rol","d":2,"e":"Os agentes de tratamento não são responsabilizados quando provarem que não realizaram o tratamento que lhes é atribuído ou que o dano decorre de culpa exclusiva do titular ou de terceiro.","c":"Incisos I e III do art. 43. O inciso II: realizaram o tratamento, mas não houve violação à legislação. O ônus da prova é do agente (“quando provarem”).","ap":-1},{"id":"lgpd-43-02","b":"lgpd-37-45","g":"E","l":"lgpd","art":"43","r":"LGPD, art. 43","t":["Os agentes de tratamento só não serão responsabilizados quando provarem"],"a":"rol","d":3,"e":"O caso fortuito e a força maior estão expressamente previstos no art. 43 da LGPD como excludentes de responsabilidade dos agentes de tratamento.","c":"O art. 43 traz três excludentes, e caso fortuito ou força maior não estão entre elas. O “só” do caput reforça que a lista é fechada.","ap":-1},{"id":"lgpd-43-03","b":"lgpd-37-45","g":"E","l":"lgpd","art":"43","r":"LGPD, art. 43, III","t":["que o dano é decorrente de culpa exclusiva do titular dos dados ou de terceiro"],"a":"conceito","d":2,"e":"A culpa concorrente do titular dos dados exclui a responsabilidade do agente de tratamento pelo dano.","c":"O inciso III do art. 43 exige culpa exclusiva do titular ou de terceiro. Culpa concorrente pode, no máximo, reduzir a indenização pelas regras gerais, mas não exclui a responsabilidade.","ap":-1},{"id":"lgpd-44-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"44","r":"LGPD, art. 44","t":["quando não fornecer a segurança que o titular dele pode esperar, consideradas as circunstâncias relevantes","as técnicas de tratamento de dados pessoais disponíveis à época em que foi realizado"],"a":"literal","d":2,"e":"O tratamento de dados pessoais é irregular quando não fornece a segurança que o titular dele pode esperar, consideradas circunstâncias como o modo de realização, os riscos razoavelmente esperados e as técnicas disponíveis à época.","c":"Art. 44. O critério das técnicas disponíveis à época evita que se julgue um tratamento antigo com a tecnologia de hoje.","ap":-1},{"id":"lgpd-44-02","b":"lgpd-37-45","g":"E","l":"lgpd","art":"44","r":"LGPD, art. 44, parágrafo único","t":["Responde pelos danos decorrentes da violação da segurança dos dados o controlador ou o operador que, ao deixar de adotar as medidas de segurança previstas no art. 46 desta Lei, der causa ao dano"],"a":"sujeito","d":2,"e":"Responde pelos danos decorrentes da violação da segurança dos dados apenas o controlador, ainda que tenha sido o operador quem deixou de adotar as medidas de segurança do art. 46 e deu causa ao dano.","c":"O parágrafo único do art. 44 responsabiliza o controlador ou o operador que, ao deixar de adotar as medidas do art. 46, der causa ao dano.","ap":-1},{"id":"lgpd-45-01","b":"lgpd-37-45","g":"E","l":"lgpd","art":"45","r":"LGPD, art. 45","t":["As hipóteses de violação do direito do titular no âmbito das relações de consumo permanecem sujeitas às regras de responsabilidade previstas na legislação pertinente"],"a":"comparacao","d":2,"e":"Nas relações de consumo, as violações de direitos do titular de dados submetem-se exclusivamente às regras de responsabilidade da LGPD, afastado o Código de Defesa do Consumidor.","c":"O art. 45 mantém as regras de responsabilidade da legislação pertinente nas relações de consumo, isto é, o CDC continua aplicável.","ap":-1},{"id":"lgpd2-46-01","b":"lgpd-46-51","g":"E","l":"lgpd","art":"46","r":"LGPD, art. 46","t":["aptas a proteger os dados pessoais de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração, comunicação ou qualquer forma de tratamento inadequado ou ilícito"],"a":"extrapolacao","d":2,"e":"As medidas de segurança exigidas dos agentes de tratamento destinam-se a proteger os dados pessoais apenas contra condutas ilícitas de terceiros, não alcançando situações acidentais de perda ou destruição.","c":"O art. 46 alcança expressamente “situações acidentais ou ilícitas” de destruição, perda, alteração e comunicação, além de acessos não autorizados.","ap":-1},{"id":"lgpd2-46-02","b":"lgpd-46-51","g":"C","l":"lgpd","art":"46","r":"LGPD, art. 46, § 1º","t":["considerados a natureza das informações tratadas, as características específicas do tratamento e o estado atual da tecnologia, especialmente no caso de dados pessoais sensíveis"],"a":"literal","d":2,"e":"Ao dispor sobre padrões técnicos mínimos de segurança, a autoridade nacional considerará a natureza das informações tratadas, as características específicas do tratamento e o estado atual da tecnologia, especialmente no caso de dados pessoais sensíveis.","c":"Art. 46, § 1º, que também manda observar os princípios do art. 6º. Note o verbo “poderá dispor”: é faculdade da autoridade.","ap":-1,"p":["Guia orientativo de segurança da informação para agentes de pequeno porte (ANPD)"]},{"id":"lgpd2-48-01","b":"lgpd-46-51","g":"C","l":"lgpd","art":"48","r":"LGPD, art. 48, § 1º","t":["A comunicação será feita em prazo razoável, conforme definido pela autoridade nacional"],"a":"numero","d":2,"e":"A LGPD não fixa em horas ou dias o prazo para a comunicação de incidente de segurança, determinando que ela seja feita em prazo razoável, conforme definido pela autoridade nacional.","c":"Art. 48, § 1º. O prazo em dias foi fixado em regulamento da ANPD sobre comunicação de incidentes (Resolução CD/ANPD nº 15/2024), não na lei. As 72 horas são do GDPR (art. 33).","ap":-1,"p":["Prazo de comunicação de incidente na Resolução CD/ANPD 15/2024"]},{"id":"lgpd2-48-02","b":"lgpd-46-51","g":"C","l":"lgpd","art":"48","r":"LGPD, art. 48, § 1º, V","t":["os motivos da demora, no caso de a comunicação não ter sido imediata"],"a":"rol","d":2,"e":"Se a comunicação do incidente de segurança não tiver sido imediata, ela deverá mencionar os motivos da demora.","c":"Art. 48, § 1º, V. O conteúdo mínimo tem seis itens: dados afetados, titulares envolvidos, medidas de proteção, riscos, motivos da demora e medidas de reversão ou mitigação.","ap":-1},{"id":"lgpd2-48-03","b":"lgpd-46-51","g":"C","l":"lgpd","art":"48","r":"LGPD, art. 48, § 3º","t":["será avaliada eventual comprovação de que foram adotadas medidas técnicas adequadas que tornem os dados pessoais afetados ininteligíveis"],"a":"caso","d":3,"e":"Situação hipotética: houve furto de notebook com banco de dados de clientes, mas o disco estava integralmente criptografado com chave guardada em outro local. Assertiva: a comprovação dessa medida técnica será considerada pela autoridade nacional no juízo de gravidade do incidente.","c":"Art. 48, § 3º: medidas que tornem os dados ininteligíveis para terceiros não autorizados entram no juízo de gravidade. A lei não diz que a criptografia dispensa automaticamente a comunicação.","ap":-1,"p":["Criptografia e incidentes de segurança"]},{"id":"lgpd2-50-01","b":"lgpd-46-51","g":"C","l":"lgpd","art":"50","r":"LGPD, art. 50, § 1º","t":["a natureza, o escopo, a finalidade e a probabilidade e a gravidade dos riscos e dos benefícios decorrentes de tratamento de dados do titular"],"a":"literal","d":2,"e":"Ao estabelecer regras de boas práticas, o controlador e o operador levarão em consideração, em relação ao tratamento e aos dados, a natureza, o escopo, a finalidade e a probabilidade e a gravidade dos riscos e dos benefícios decorrentes do tratamento.","c":"Art. 50, § 1º. A abordagem baseada em risco aparece aqui, no art. 44 e no art. 52, § 1º.","ap":-1},{"id":"lgpd2-50-02","b":"lgpd-46-51","g":"E","l":"lgpd","art":"50","r":"LGPD, art. 50, § 2º","t":["Na aplicação dos princípios indicados nos incisos VII e VIII do caput do art. 6º desta Lei, o controlador, observados a estrutura, a escala e o volume de suas operações, bem como a sensibilidade dos dados tratados e a probabilidade e a gravidade dos danos para os titulares dos dados, poderá:"],"a":"absoluto","d":3,"e":"Na aplicação dos princípios da segurança e da prevenção, todo controlador, qualquer que seja seu porte, deverá implementar programa de governança em privacidade com os requisitos mínimos previstos na LGPD.","c":"O § 2º diz que o controlador “poderá” implementar o programa, observados estrutura, escala, volume e sensibilidade dos dados. Os incisos VII e VIII do art. 6º são, de fato, segurança e prevenção.","ap":-1},{"id":"lgpd2-50-03","b":"lgpd-46-51","g":"E","l":"lgpd","art":"50","r":"LGPD, art. 50, § 2º, I, h","t":["seja atualizado constantemente com base em informações obtidas a partir de monitoramento contínuo e avaliações periódicas"],"a":"numero","d":2,"e":"O programa de governança em privacidade deve, no mínimo, ser atualizado a cada dois anos, com base em auditoria externa independente.","c":"A alínea h fala em atualização constante, com base em monitoramento contínuo e avaliações periódicas. Não há prazo bienal nem exigência de auditoria externa.","ap":-1},{"id":"lgpd2-50-04","b":"lgpd-46-51","g":"C","l":"lgpd","art":"50","r":"LGPD, art. 50, § 2º, I, e","t":["tenha o objetivo de estabelecer relação de confiança com o titular, por meio de atuação transparente e que assegure mecanismos de participação do titular"],"a":"rol","d":2,"e":"O programa de governança em privacidade deve ter o objetivo de estabelecer relação de confiança com o titular, por meio de atuação transparente e que assegure mecanismos de participação do titular.","c":"Art. 50, § 2º, I, e. São oito alíneas (a a h); vale lembrar das palavras-chave de cada uma.","ap":-1},{"id":"lgpd2-51-01","b":"lgpd-46-51","g":"C","l":"lgpd","art":"51","r":"LGPD, art. 51","t":["A autoridade nacional estimulará a adoção de padrões técnicos que facilitem o controle pelos titulares dos seus dados pessoais."],"a":"literal","d":1,"e":"A autoridade nacional estimulará a adoção de padrões técnicos que facilitem o controle pelos titulares dos seus dados pessoais.","c":"Art. 51, literal. O verbo é “estimulará”: itens que trocam por “imporá” ou “exigirá” ficam errados.","ap":-1},{"id":"lgpd-46-01","b":"lgpd-46-51","g":"C","l":"lgpd","art":"46","r":"LGPD, art. 46","t":["Os agentes de tratamento devem adotar medidas de segurança, técnicas e administrativas aptas a proteger os dados pessoais de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração, comunicação ou qualquer forma de tratamento inadequado ou ilícito"],"a":"literal","d":1,"e":"Os agentes de tratamento devem adotar medidas de segurança, técnicas e administrativas, aptas a proteger os dados pessoais de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração ou comunicação.","c":"Caput do art. 46. O dever é dos agentes de tratamento, ou seja, controlador e operador.","ap":-1},{"id":"lgpd-46-02","b":"lgpd-46-51","g":"C","l":"lgpd","art":"46","r":"LGPD, art. 46, § 2º","t":["deverão ser observadas desde a fase de concepção do produto ou do serviço até a sua execução"],"a":"literal","d":1,"e":"As medidas de segurança devem ser observadas desde a fase de concepção do produto ou do serviço até a sua execução.","c":"Art. 46, § 2º: é a privacidade e segurança desde a concepção (privacy by design).","ap":-1},{"id":"lgpd-46-03","b":"lgpd-46-51","g":"E","l":"lgpd","art":"46","r":"LGPD, art. 46, § 2º","t":["desde a fase de concepção do produto ou do serviço até a sua execução"],"a":"extrapolacao","d":1,"e":"As medidas de segurança exigidas pela LGPD devem ser adotadas a partir do início da execução do serviço, quando os dados pessoais começam a ser efetivamente tratados.","c":"O § 2º do art. 46 antecipa o dever para a fase de concepção.","ap":-1},{"id":"lgpd-46-04","b":"lgpd-46-51","g":"E","l":"lgpd","art":"46","r":"LGPD, art. 46, § 1º","t":["A autoridade nacional poderá dispor sobre padrões técnicos mínimos"],"a":"conceito","d":2,"e":"A LGPD obriga a autoridade nacional a editar padrões técnicos mínimos de segurança antes que os agentes de tratamento possam ser responsabilizados por falhas de segurança.","c":"O § 1º do art. 46 diz que a ANPD “poderá” dispor sobre padrões técnicos mínimos. O dever de segurança do caput existe independentemente desse regulamento.","ap":-1},{"id":"lgpd-47-01","b":"lgpd-46-51","g":"E","l":"lgpd","art":"47","r":"LGPD, art. 47","t":["obriga-se a garantir a segurança da informação prevista nesta Lei em relação aos dados pessoais, mesmo após o seu término"],"a":"extrapolacao","d":1,"e":"O dever de garantir a segurança da informação em relação aos dados pessoais cessa com o término do tratamento.","c":"O art. 47 estende o dever “mesmo após o seu término” e alcança qualquer pessoa que intervenha em uma das fases do tratamento.","ap":-1},{"id":"lgpd-47-02","b":"lgpd-46-51","g":"C","l":"lgpd","art":"47","r":"LGPD, art. 47","t":["Os agentes de tratamento ou qualquer outra pessoa que intervenha em uma das fases do tratamento obriga-se a garantir a segurança da informação"],"a":"sujeito","d":2,"e":"Qualquer pessoa que intervenha em uma das fases do tratamento, ainda que não seja controlador nem operador, obriga-se a garantir a segurança da informação em relação aos dados pessoais.","c":"Art. 47. Alcança, por exemplo, um técnico terceirizado que faz manutenção em servidor com dados pessoais.","ap":-1},{"id":"lgpd-48-01","b":"lgpd-46-51","g":"C","l":"lgpd","art":"48","r":"LGPD, art. 48","t":["O controlador deverá comunicar à autoridade nacional e ao titular a ocorrência de incidente de segurança que possa acarretar risco ou dano relevante aos titulares"],"a":"literal","d":1,"e":"O controlador deve comunicar à autoridade nacional e ao titular a ocorrência de incidente de segurança que possa acarretar risco ou dano relevante aos titulares.","c":"Caput do art. 48. O dever é do controlador e a comunicação vai para dois destinatários: a ANPD e o titular.","ap":-1},{"id":"lgpd-48-02","b":"lgpd-46-51","g":"E","l":"lgpd","art":"48","r":"LGPD, art. 48","t":["incidente de segurança que possa acarretar risco ou dano relevante aos titulares"],"a":"absoluto","d":2,"e":"O controlador deve comunicar à autoridade nacional todo e qualquer incidente de segurança, independentemente do risco que ele represente aos titulares.","c":"A LGPD exige a comunicação do incidente que possa acarretar risco ou dano relevante. O que fazer com os incidentes sem esse potencial (registro interno, por exemplo) é matéria da Resolução CD/ANPD nº 15/2024, que entra no banco quando você trouxer o texto.","ap":-1},{"id":"lgpd-48-03","b":"lgpd-46-51","g":"E","l":"lgpd","art":"48","r":"LGPD, art. 48","t":["deverá comunicar à autoridade nacional e ao titular"],"a":"sujeito","d":2,"e":"Ocorrido incidente de segurança relevante, o controlador comunica o fato apenas à ANPD, que decide se os titulares devem ou não ser informados.","c":"O caput do art. 48 manda o controlador comunicar à ANPD e ao titular. A ANPD pode ainda determinar ampla divulgação (§ 2º, I).","ap":-1},{"id":"lgpd-48-04","b":"lgpd-46-51","g":"E","l":"lgpd","art":"48","r":"LGPD, art. 48, § 1º","t":["A comunicação será feita em prazo razoável, conforme definido pela autoridade nacional"],"a":"numero","d":2,"e":"A LGPD fixa o prazo de 72 horas para a comunicação de incidente de segurança à autoridade nacional, contado da ciência do fato.","c":"A lei fala em “prazo razoável, conforme definido pela autoridade nacional”. O prazo de 72 horas é do GDPR (art. 33). Na ANPD, o prazo foi fixado na Resolução CD/ANPD nº 15/2024 (três dias úteis, a conferir quando você trouxer o texto).","ap":-1},{"id":"lgpd-48-05","b":"lgpd-46-51","g":"C","l":"lgpd","art":"48","r":"LGPD, art. 48, § 1º","t":["os motivos da demora, no caso de a comunicação não ter sido imediata","os riscos relacionados ao incidente"],"a":"rol","d":2,"e":"A comunicação de incidente de segurança deve mencionar, no mínimo, entre outros elementos, os riscos relacionados ao incidente e os motivos da demora, no caso de a comunicação não ter sido imediata.","c":"Incisos IV e V do § 1º do art. 48. O rol mínimo tem seis itens: natureza dos dados, titulares envolvidos, medidas de segurança, riscos, motivos da demora e medidas adotadas.","ap":-1},{"id":"lgpd-48-06","b":"lgpd-46-51","g":"C","l":"lgpd","art":"48","r":"LGPD, art. 48, § 2º","t":["ampla divulgação do fato em meios de comunicação","medidas para reverter ou mitigar os efeitos do incidente"],"a":"literal","d":2,"e":"A autoridade nacional pode determinar ao controlador, se necessário para salvaguardar os direitos dos titulares, a ampla divulgação do incidente em meios de comunicação e medidas para reverter ou mitigar seus efeitos.","c":"Art. 48, § 2º. A lista é exemplificativa (“tais como”).","ap":-1},{"id":"lgpd-48-07","b":"lgpd-46-51","g":"E","l":"lgpd","art":"48","r":"LGPD, art. 48, § 3º","t":["No juízo de gravidade do incidente, será avaliada eventual comprovação de que foram adotadas medidas técnicas adequadas que tornem os dados pessoais afetados ininteligíveis"],"a":"extrapolacao","d":3,"e":"Se os dados afetados por um incidente estavam criptografados, o controlador fica legalmente dispensado de comunicá-lo, pois a LGPD exclui tais casos do dever de comunicação.","c":"A criptografia entra no juízo de gravidade (art. 48, § 3º) e pode levar à conclusão de que não há risco relevante, mas a lei não cria dispensa automática.","ap":-1},{"id":"lgpd-49-01","b":"lgpd-46-51","g":"C","l":"lgpd","art":"49","r":"LGPD, art. 49","t":["Os sistemas utilizados para o tratamento de dados pessoais devem ser estruturados de forma a atender aos requisitos de segurança, aos padrões de boas práticas e de governança e aos princípios gerais previstos nesta Lei"],"a":"literal","d":1,"e":"Os sistemas utilizados para o tratamento de dados pessoais devem ser estruturados de forma a atender aos requisitos de segurança, aos padrões de boas práticas e de governança e aos princípios gerais da LGPD.","c":"Art. 49. É o fecho da seção de segurança: o próprio sistema tem de ser desenhado para cumprir a lei.","ap":-1},{"id":"lgpd-50-01","b":"lgpd-46-51","g":"C","l":"lgpd","art":"50","r":"LGPD, art. 50","t":["individualmente ou por meio de associações, poderão formular regras de boas práticas e de governança"],"a":"literal","d":1,"e":"Controladores e operadores podem formular regras de boas práticas e de governança individualmente ou por meio de associações.","c":"Caput do art. 50. É a base da corregulação: o setor cria regras e a ANPD pode reconhecê-las (§ 3º).","ap":-1},{"id":"lgpd-50-02","b":"lgpd-46-51","g":"E","l":"lgpd","art":"50","r":"LGPD, art. 50","t":["poderão formular regras de boas práticas e de governança"],"a":"conceito","d":2,"e":"A formulação de regras de boas práticas e de governança é obrigatória para todos os controladores, sob pena de multa.","c":"O art. 50 usa “poderão”. Adotar política de boas práticas conta a favor na dosimetria (art. 52, § 1º, IX), mas não é obrigação.","ap":-1},{"id":"lgpd-50-03","b":"lgpd-46-51","g":"C","l":"lgpd","art":"50","r":"LGPD, art. 50, § 2º, I","t":["conte com planos de resposta a incidentes e remediação","seja atualizado constantemente com base em informações obtidas a partir de monitoramento contínuo e avaliações periódicas"],"a":"rol","d":2,"e":"O programa de governança em privacidade deve, no mínimo, contar com planos de resposta a incidentes e remediação e ser atualizado constantemente com base em monitoramento contínuo e avaliações periódicas.","c":"Alíneas “g” e “h” do art. 50, § 2º, I. Tema típico de auditoria: você verifica se o programa existe e se funciona.","ap":-1},{"id":"lgpd-50-04","b":"lgpd-46-51","g":"E","l":"lgpd","art":"50","r":"LGPD, art. 50, § 2º, I, b","t":["seja aplicável a todo o conjunto de dados pessoais que estejam sob seu controle, independentemente do modo como se realizou sua coleta"],"a":"extrapolacao","d":2,"e":"O programa de governança em privacidade pode limitar-se aos dados coletados após sua implantação, preservando-se as bases de dados antigas.","c":"A alínea “b” exige que o programa alcance todo o conjunto de dados sob controle do controlador, independentemente de como foram coletados.","ap":-1},{"id":"lgpd-50-05","b":"lgpd-46-51","g":"E","l":"lgpd","art":"50","r":"LGPD, art. 50, § 2º, II","t":["a pedido da autoridade nacional ou de outra entidade responsável por promover o cumprimento de boas práticas ou códigos de conduta"],"a":"sujeito","d":3,"e":"O controlador só pode ser instado a demonstrar a efetividade de seu programa de governança em privacidade mediante decisão judicial.","c":"O inciso II do § 2º do art. 50 prevê a demonstração quando apropriado e, em especial, a pedido da ANPD ou de entidade que promova boas práticas ou códigos de conduta.","ap":-1},{"id":"lgpd-50-06","b":"lgpd-46-51","g":"C","l":"lgpd","art":"50","r":"LGPD, art. 50, § 3º","t":["deverão ser publicadas e atualizadas periodicamente e poderão ser reconhecidas e divulgadas pela autoridade nacional"],"a":"literal","d":2,"e":"As regras de boas práticas e de governança devem ser publicadas e atualizadas periodicamente e podem ser reconhecidas e divulgadas pela autoridade nacional.","c":"Art. 50, § 3º. Repare: publicar é dever (“deverão”); o reconhecimento pela ANPD é possibilidade (“poderão”).","ap":-1},{"id":"lgpd-51-01","b":"lgpd-46-51","g":"E","l":"lgpd","art":"51","r":"LGPD, art. 51","t":["A autoridade nacional estimulará a adoção de padrões técnicos que facilitem o controle pelos titulares dos seus dados pessoais"],"a":"conceito","d":2,"e":"A autoridade nacional imporá aos controladores a adoção obrigatória de padrões técnicos que facilitem o controle pelos titulares dos seus dados pessoais.","c":"O art. 51 usa o verbo “estimulará”. Estimular não é impor; a troca do verbo decide o item.","ap":-1},{"id":"lgpd-5-01","b":"lgpd-5-11","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, I","t":["dado pessoal: informação relacionada a pessoa natural identificada ou identificável"],"a":"conceito","d":1,"e":"Para a LGPD, dado pessoal é a informação relacionada a pessoa natural identificada ou identificável.","c":"Art. 5º, I. O “identificável” amplia muito o conceito: basta que a pessoa possa ser identificada com meios razoáveis, mesmo sem nome no registro.","ap":-1},{"id":"lgpd-5-02","b":"lgpd-5-11","g":"E","l":"lgpd","art":"5","r":"LGPD, art. 5º, II","t":["dado pessoal sensível: dado pessoal sobre origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou a organização de caráter religioso, filosófico ou político, dado referente à saúde ou à vida sexual, dado genético ou biométrico, quando vinculado a uma pessoa natural"],"a":"rol","d":1,"e":"Dados bancários e financeiros, por seu potencial lesivo, são classificados pela LGPD como dados pessoais sensíveis.","c":"O rol do art. 5º, II, não inclui dados financeiros. Eles são dados pessoais comuns, ainda que mereçam cuidado (sigilo bancário, proteção do crédito).","ap":-1},{"id":"lgpd-5-03","b":"lgpd-5-11","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, II","t":["dado genético ou biométrico, quando vinculado a uma pessoa natural"],"a":"rol","d":1,"e":"O dado biométrico é considerado dado pessoal sensível quando vinculado a uma pessoa natural.","c":"Art. 5º, II. A ressalva “quando vinculado a uma pessoa natural” vale para o dado genético e para o biométrico. Biometria abre o Mapa de Temas Prioritários 2026-2027 da ANPD.","ap":-1},{"id":"lgpd-5-04","b":"lgpd-5-11","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, II","t":["filiação a sindicato ou a organização de caráter religioso, filosófico ou político"],"a":"rol","d":2,"e":"A filiação a organização de caráter filosófico constitui dado pessoal sensível.","c":"Art. 5º, II: filiação a sindicato ou a organização de caráter religioso, filosófico ou político.","ap":-1},{"id":"lgpd-5-05","b":"lgpd-5-11","g":"E","l":"lgpd","art":"5","r":"LGPD, art. 5º, VI","t":["controlador: pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento de dados pessoais","operador: pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do controlador"],"a":"conceito","d":1,"e":"Operador é a pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento de dados pessoais.","c":"Essa é a definição de controlador (art. 5º, VI). O operador realiza o tratamento em nome do controlador (inciso VII).","ap":-1},{"id":"lgpd-5-06","b":"lgpd-5-11","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, VI","t":["controlador: pessoa natural ou jurídica, de direito público ou privado"],"a":"conceito","d":2,"e":"Uma pessoa natural pode figurar como controladora de dados pessoais, nos termos da LGPD.","c":"O art. 5º, VI, admite pessoa natural ou jurídica como controlador. O que a lei exclui (art. 4º, I) é o tratamento por pessoa natural para fins exclusivamente particulares e não econômicos.","ap":-1},{"id":"lgpd-5-07","b":"lgpd-5-11","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, VIII","t":["encarregado: pessoa indicada pelo controlador e operador para atuar como canal de comunicação"],"a":"conceito","d":2,"e":"Segundo a definição legal, o encarregado é pessoa indicada pelo controlador e operador para atuar como canal de comunicação entre o controlador, os titulares dos dados e a ANPD.","c":"Art. 5º, VIII, com a redação da Lei nº 15.352/2026. Atenção: o art. 41 fala só em dever do controlador de indicar encarregado. A definição do art. 5º menciona controlador e operador.","ap":-1},{"id":"lgpd-5-08","b":"lgpd-5-11","g":"E","l":"lgpd","art":"5","r":"LGPD, art. 5º, III","t":["dado anonimizado: dado relativo a titular que não possa ser identificado, considerando a utilização de meios técnicos razoáveis e disponíveis na ocasião de seu tratamento"],"a":"absoluto","d":2,"e":"Dado anonimizado é aquele cujo titular não possa ser identificado por nenhum meio técnico existente, ainda que de custo desproporcional.","c":"O art. 5º, III, adota padrão de razoabilidade: meios técnicos razoáveis e disponíveis na ocasião do tratamento. Não se exige anonimização impossível de reverter por qualquer meio.","ap":-1},{"id":"lgpd-5-09","b":"lgpd-5-11","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, XIII","t":["bloqueio: suspensão temporária de qualquer operação de tratamento, mediante guarda do dado pessoal ou do banco de dados"],"a":"conceito","d":1,"e":"Bloqueio é a suspensão temporária de qualquer operação de tratamento, mediante guarda do dado pessoal ou do banco de dados.","c":"Art. 5º, XIII. O bloqueio é temporário e mantém o dado guardado; a eliminação (inciso XIV) exclui o dado.","ap":-1},{"id":"lgpd-5-10","b":"lgpd-5-11","g":"E","l":"lgpd","art":"5","r":"LGPD, art. 5º, XIV","t":["eliminação: exclusão de dado ou de conjunto de dados armazenados em banco de dados, independentemente do procedimento empregado","bloqueio: suspensão temporária de qualquer operação de tratamento"],"a":"conceito","d":1,"e":"Na LGPD, bloqueio é a exclusão definitiva de dado ou de conjunto de dados armazenados em banco de dados, independentemente do procedimento empregado.","c":"Essa é a definição de eliminação (art. 5º, XIV). Bloqueio é suspensão temporária (inciso XIII).","ap":-1},{"id":"lgpd-5-11","b":"lgpd-5-11","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, XII","t":["consentimento: manifestação livre, informada e inequívoca pela qual o titular concorda com o tratamento de seus dados pessoais para uma finalidade determinada"],"a":"conceito","d":1,"e":"Consentimento é a manifestação livre, informada e inequívoca pela qual o titular concorda com o tratamento de seus dados pessoais para uma finalidade determinada.","c":"Art. 5º, XII. Os três adjetivos (livre, informada, inequívoca) e a finalidade determinada são os pontos de troca.","ap":-1},{"id":"lgpd-5-12","b":"lgpd-5-11","g":"E","l":"lgpd","art":"8","r":"LGPD, art. 8º","t":["deverá ser fornecido por escrito ou por outro meio que demonstre a manifestação de vontade do titular"],"a":"extrapolacao","d":1,"e":"O consentimento para tratamento de dados pessoais deve ser fornecido obrigatoriamente por escrito, sob pena de nulidade.","c":"O art. 8º admite consentimento por escrito “ou por outro meio que demonstre a manifestação de vontade do titular”, como um clique em caixa de seleção não pré-marcada.","ap":-1},{"id":"lgpd-5-13","b":"lgpd-5-11","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, XVIII","t":["pessoa jurídica de direito privado sem fins lucrativos legalmente constituída sob as leis brasileiras, com sede e foro no País"],"a":"conceito","d":2,"e":"Pessoa jurídica de direito privado sem fins lucrativos, constituída sob as leis brasileiras e com sede e foro no País, pode ser considerada órgão de pesquisa, desde que inclua a pesquisa em sua missão institucional ou objetivo social.","c":"Art. 5º, XVIII, com a redação da Lei nº 13.853/2019.","ap":-1},{"id":"lgpd-5-14","b":"lgpd-5-11","g":"E","l":"lgpd","art":"5","r":"LGPD, art. 5º, XVIII","t":["órgão de pesquisa: órgão ou entidade da administração pública direta ou indireta ou pessoa jurídica de direito privado sem fins lucrativos"],"a":"conceito","d":2,"e":"Para a LGPD, somente órgãos e entidades da administração pública podem ser considerados órgãos de pesquisa.","c":"O art. 5º, XVIII, também admite pessoa jurídica de direito privado sem fins lucrativos. Empresa com fins lucrativos é que não entra.","ap":-1},{"id":"lgpd-5-15","b":"lgpd-5-11","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, XVI","t":["uso compartilhado de dados: comunicação, difusão, transferência internacional, interconexão de dados pessoais ou tratamento compartilhado de bancos de dados pessoais"],"a":"conceito","d":3,"e":"O conceito legal de uso compartilhado de dados abrange a comunicação, a difusão, a transferência internacional e a interconexão de dados pessoais, entre outras operações.","c":"Art. 5º, XVI. O conceito alcança relações entre órgãos públicos, entre estes e entes privados e também entre entes privados.","ap":-1},{"id":"lgpd-5-16","b":"lgpd-5-11","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, XVII","t":["documentação do controlador que contém a descrição dos processos de tratamento de dados pessoais que podem gerar riscos às liberdades civis e aos direitos fundamentais"],"a":"conceito","d":2,"e":"O relatório de impacto à proteção de dados pessoais é documentação do controlador que descreve os processos de tratamento que podem gerar riscos às liberdades civis e aos direitos fundamentais, bem como as medidas e salvaguardas de mitigação de risco.","c":"Art. 5º, XVII. O relatório é do controlador; a ANPD pode exigi-lo (arts. 10, § 3º, e 38).","ap":-1},{"id":"lgpd-6-01","b":"lgpd-5-11","g":"C","l":"lgpd","art":"6","r":"LGPD, art. 6º, III","t":["necessidade: limitação do tratamento ao mínimo necessário para a realização de suas finalidades"],"a":"conceito","d":1,"e":"Pelo princípio da necessidade, o tratamento deve limitar-se ao mínimo necessário para a realização de suas finalidades, com abrangência dos dados pertinentes, proporcionais e não excessivos.","c":"Art. 6º, III. É a minimização de dados do GDPR.","ap":-1},{"id":"lgpd-6-02","b":"lgpd-5-11","g":"E","l":"lgpd","art":"6","r":"LGPD, art. 6º, II","t":["adequação: compatibilidade do tratamento com as finalidades informadas ao titular, de acordo com o contexto do tratamento"],"a":"conceito","d":2,"e":"O princípio da adequação consiste na limitação do tratamento ao mínimo necessário para a realização de suas finalidades.","c":"Essa é a necessidade (inciso III). Adequação é a compatibilidade do tratamento com as finalidades informadas, de acordo com o contexto (inciso II).","ap":-1},{"id":"lgpd-6-03","b":"lgpd-5-11","g":"C","l":"lgpd","art":"6","r":"LGPD, art. 6º, IV","t":["livre acesso: garantia, aos titulares, de consulta facilitada e gratuita sobre a forma e a duração do tratamento, bem como sobre a integralidade de seus dados pessoais"],"a":"conceito","d":1,"e":"O princípio do livre acesso garante aos titulares consulta facilitada e gratuita sobre a forma e a duração do tratamento e sobre a integralidade de seus dados pessoais.","c":"Art. 6º, IV. O art. 9º detalha as informações que concretizam esse princípio.","ap":-1},{"id":"lgpd-6-04","b":"lgpd-5-11","g":"E","l":"lgpd","art":"6","r":"LGPD, art. 6º, V","t":["qualidade dos dados: garantia, aos titulares, de exatidão, clareza, relevância e atualização dos dados"],"a":"conceito","d":2,"e":"O princípio da transparência garante aos titulares a exatidão, a clareza, a relevância e a atualização dos dados, de acordo com a necessidade.","c":"Exatidão, clareza, relevância e atualização são da qualidade dos dados (inciso V). Transparência (inciso VI) trata de informações claras, precisas e acessíveis sobre o tratamento e os agentes.","ap":-1},{"id":"lgpd-6-05","b":"lgpd-5-11","g":"C","l":"lgpd","art":"6","r":"LGPD, art. 6º, X","t":["responsabilização e prestação de contas: demonstração, pelo agente, da adoção de medidas eficazes e capazes de comprovar a observância e o cumprimento das normas de proteção de dados pessoais e, inclusive, da eficácia dessas medidas"],"a":"conceito","d":2,"e":"O princípio da responsabilização e prestação de contas exige que o agente demonstre a adoção de medidas eficazes e capazes de comprovar o cumprimento das normas de proteção de dados, inclusive a eficácia dessas medidas.","c":"Art. 6º, X. É o accountability: não basta cumprir, é preciso conseguir demonstrar o cumprimento.","ap":-1},{"id":"lgpd-6-06","b":"lgpd-5-11","g":"E","l":"lgpd","art":"6","r":"LGPD, art. 6º, VII","t":["segurança: utilização de medidas técnicas e administrativas aptas a proteger os dados pessoais de acessos não autorizados","prevenção: adoção de medidas para prevenir a ocorrência de danos em virtude do tratamento de dados pessoais"],"a":"conceito","d":2,"e":"O princípio da prevenção consiste na utilização de medidas técnicas e administrativas aptas a proteger os dados pessoais de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda ou alteração.","c":"Essa é a definição de segurança (inciso VII). Prevenção (inciso VIII) é a adoção de medidas para prevenir danos em virtude do tratamento.","ap":-1},{"id":"lgpd-6-07","b":"lgpd-5-11","g":"C","l":"lgpd","art":"6","r":"LGPD, art. 6º","t":["As atividades de tratamento de dados pessoais deverão observar a boa-fé e os seguintes princípios"],"a":"literal","d":1,"e":"As atividades de tratamento de dados pessoais devem observar a boa-fé e os princípios elencados no art. 6º da LGPD.","c":"Caput do art. 6º. A boa-fé aparece no caput, fora da lista numerada de dez princípios.","ap":-1},{"id":"lgpd-6-08","b":"lgpd-5-11","g":"E","l":"lgpd","art":"6","r":"LGPD, art. 6º, IX","t":["não discriminação: impossibilidade de realização do tratamento para fins discriminatórios ilícitos ou abusivos"],"a":"absoluto","d":2,"e":"O princípio da não discriminação veda qualquer tratamento de dados que diferencie titulares entre si.","c":"O inciso IX do art. 6º veda fins discriminatórios ilícitos ou abusivos. Diferenciações lícitas (por exemplo, preço de seguro conforme idade, quando permitido) não são alcançadas.","ap":-1},{"id":"lgpd-6-09","b":"lgpd-5-11","g":"C","l":"lgpd","art":"6","r":"LGPD, art. 6º, I","t":["finalidade: realização do tratamento para propósitos legítimos, específicos, explícitos e informados ao titular, sem possibilidade de tratamento posterior de forma incompatível com essas finalidades"],"a":"conceito","d":1,"e":"Pelo princípio da finalidade, o tratamento deve ser realizado para propósitos legítimos, específicos, explícitos e informados ao titular, sem possibilidade de tratamento posterior incompatível com essas finalidades.","c":"Art. 6º, I. Repare que a lei não proíbe o tratamento posterior; proíbe o tratamento posterior incompatível.","ap":-1},{"id":"lgpd-7-01","b":"lgpd-5-11","g":"C","l":"lgpd","art":"7","r":"LGPD, art. 7º, X","t":["para a proteção do crédito, inclusive quanto ao disposto na legislação pertinente"],"a":"rol","d":1,"e":"A proteção do crédito é uma das hipóteses legais que autorizam o tratamento de dados pessoais.","c":"Art. 7º, X. É uma base legal brasileira que não existe no GDPR. Para dados sensíveis, ela não aparece no art. 11.","ap":-1},{"id":"lgpd-7-02","b":"lgpd-5-11","g":"E","l":"lgpd","art":"7","r":"LGPD, art. 7º, VIII","t":["para a tutela da saúde, exclusivamente, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária"],"a":"sujeito","d":2,"e":"A tutela da saúde autoriza o tratamento de dados pessoais por qualquer pessoa que preste auxílio ao titular, ainda que não seja profissional de saúde.","c":"O art. 7º, VIII, restringe a tutela da saúde a procedimento realizado “exclusivamente” por profissionais de saúde, serviços de saúde ou autoridade sanitária.","ap":-1},{"id":"lgpd-7-03","b":"lgpd-5-11","g":"C","l":"lgpd","art":"7","r":"LGPD, art. 7º, § 4º","t":["É dispensada a exigência do consentimento previsto no caput deste artigo para os dados tornados manifestamente públicos pelo titular, resguardados os direitos do titular e os princípios previstos nesta Lei"],"a":"excecao","d":2,"e":"É dispensado o consentimento para o tratamento de dados tornados manifestamente públicos pelo titular, resguardados os direitos do titular e os princípios previstos na LGPD.","c":"Art. 7º, § 4º. A dispensa do consentimento não libera o tratamento de todo o resto da lei (§ 6º).","ap":-1},{"id":"lgpd-7-04","b":"lgpd-5-11","g":"E","l":"lgpd","art":"7","r":"LGPD, art. 7º, § 5º","t":["deverá obter consentimento específico do titular para esse fim, ressalvadas as hipóteses de dispensa do consentimento previstas nesta Lei"],"a":"excecao","d":2,"e":"O controlador que obteve o consentimento do titular pode compartilhar os dados com outros controladores sem novo consentimento, desde que mantida a mesma finalidade.","c":"O § 5º do art. 7º exige consentimento específico para comunicar ou compartilhar com outros controladores, ressalvadas as hipóteses de dispensa.","ap":-1},{"id":"lgpd-7-05","b":"lgpd-5-11","g":"C","l":"lgpd","art":"7","r":"LGPD, art. 7º, § 6º","t":["A eventual dispensa da exigência do consentimento não desobriga os agentes de tratamento das demais obrigações previstas nesta Lei"],"a":"literal","d":1,"e":"A dispensa do consentimento não desobriga os agentes de tratamento das demais obrigações da LGPD, especialmente da observância dos princípios e da garantia dos direitos do titular.","c":"Art. 7º, § 6º. Sem consentimento, continuam valendo os princípios do art. 6º e os direitos do art. 18, inclusive o de oposição em caso de descumprimento (art. 18, § 2º).","ap":-1},{"id":"lgpd-7-06","b":"lgpd-5-11","g":"E","l":"lgpd","art":"7","r":"LGPD, art. 7º, V","t":["quando necessário para a execução de contrato ou de procedimentos preliminares relacionados a contrato do qual seja parte o titular, a pedido do titular dos dados"],"a":"sujeito","d":2,"e":"O tratamento é autorizado quando necessário para procedimentos preliminares relacionados a contrato do qual seja parte o titular, a pedido do controlador.","c":"O art. 7º, V, exige que os procedimentos preliminares sejam a pedido do titular.","ap":-1},{"id":"lgpd-7-07","b":"lgpd-5-11","g":"C","l":"lgpd","art":"7","r":"LGPD, art. 7º, § 7º","t":["poderá ser realizado para novas finalidades, desde que observados os propósitos legítimos e específicos para o novo tratamento e a preservação dos direitos do titular"],"a":"literal","d":3,"e":"Dados de acesso público ou tornados manifestamente públicos pelo titular podem ser tratados posteriormente para novas finalidades, desde que observados propósitos legítimos e específicos e preservados os direitos do titular.","c":"Art. 7º, § 7º, incluído pela Lei nº 13.853/2019, que remete aos §§ 3º e 4º.","ap":-1},{"id":"lgpd-7-08","b":"lgpd-5-11","g":"E","l":"lgpd","art":"7","r":"LGPD, art. 7º, III","t":["pela administração pública, para o tratamento e uso compartilhado de dados necessários à execução de políticas públicas previstas em leis e regulamentos ou respaldadas em contratos, convênios ou instrumentos congêneres"],"a":"excecao","d":2,"e":"O tratamento de dados pela administração pública para a execução de políticas públicas previstas em lei depende de consentimento do titular.","c":"Execução de políticas públicas é base legal própria (art. 7º, III), independente de consentimento.","ap":-1},{"id":"lgpd-8-01","b":"lgpd-5-11","g":"C","l":"lgpd","art":"8","r":"LGPD, art. 8º, § 2º","t":["Cabe ao controlador o ônus da prova de que o consentimento foi obtido em conformidade com o disposto nesta Lei"],"a":"sujeito","d":1,"e":"Cabe ao controlador o ônus da prova de que o consentimento foi obtido em conformidade com a LGPD.","c":"Art. 8º, § 2º. Na dúvida sobre se houve consentimento válido, quem perde é o controlador, que precisa guardar prova de como e quando o obteve.","ap":-1},{"id":"lgpd-8-02","b":"lgpd-5-11","g":"E","l":"lgpd","art":"8","r":"LGPD, art. 8º, § 4º","t":["as autorizações genéricas para o tratamento de dados pessoais serão nulas"],"a":"conceito","d":3,"e":"Segundo a LGPD, as autorizações genéricas para o tratamento de dados pessoais são anuláveis, podendo ser convalidadas por manifestação posterior do titular.","c":"O § 4º do art. 8º diz que as autorizações genéricas “serão nulas”. Nulidade e anulabilidade são regimes distintos; a palavra decide o item.","ap":-1},{"id":"lgpd-8-03","b":"lgpd-5-11","g":"C","l":"lgpd","art":"8","r":"LGPD, art. 8º, § 5º","t":["O consentimento pode ser revogado a qualquer momento mediante manifestação expressa do titular, por procedimento gratuito e facilitado, ratificados os tratamentos realizados sob amparo do consentimento anteriormente manifestado"],"a":"literal","d":2,"e":"O consentimento pode ser revogado a qualquer momento, por manifestação expressa do titular, em procedimento gratuito e facilitado, ficando ratificados os tratamentos realizados sob o consentimento anterior enquanto não houver requerimento de eliminação.","c":"Art. 8º, § 5º. A revogação produz efeitos para frente.","ap":-1},{"id":"lgpd-8-04","b":"lgpd-5-11","g":"E","l":"lgpd","art":"8","r":"LGPD, art. 8º, § 5º","t":["ratificados os tratamentos realizados sob amparo do consentimento anteriormente manifestado"],"a":"conceito","d":2,"e":"A revogação do consentimento torna ilícitos, retroativamente, os tratamentos realizados com base nele.","c":"O § 5º do art. 8º ratifica os tratamentos anteriores. A revogação não retroage.","ap":-1},{"id":"lgpd-8-05","b":"lgpd-5-11","g":"C","l":"lgpd","art":"8","r":"LGPD, art. 8º, § 1º","t":["Caso o consentimento seja fornecido por escrito, esse deverá constar de cláusula destacada das demais cláusulas contratuais"],"a":"literal","d":1,"e":"Quando fornecido por escrito, o consentimento deve constar de cláusula destacada das demais cláusulas contratuais.","c":"Art. 8º, § 1º. O destaque serve para o titular perceber que está consentindo; cláusula escondida no meio do contrato não vale.","ap":-1},{"id":"lgpd-9-01","b":"lgpd-5-11","g":"C","l":"lgpd","art":"9","r":"LGPD, art. 9º, § 1º","t":["esse será considerado nulo caso as informações fornecidas ao titular tenham conteúdo enganoso ou abusivo ou não tenham sido apresentadas previamente com transparência, de forma clara e inequívoca"],"a":"literal","d":2,"e":"Quando o consentimento é requerido, ele é considerado nulo se as informações fornecidas ao titular tiverem conteúdo enganoso ou abusivo ou não tiverem sido apresentadas previamente com transparência.","c":"Art. 9º, § 1º. A nulidade decorre de informação enganosa, abusiva ou não apresentada previamente; o § 2º trata da mudança de finalidade incompatível.","ap":-1},{"id":"lgpd-9-02","b":"lgpd-5-11","g":"E","l":"lgpd","art":"9","r":"LGPD, art. 9º, § 3º","t":["Quando o tratamento de dados pessoais for condição para o fornecimento de produto ou de serviço ou para o exercício de direito, o titular será informado com destaque sobre esse fato"],"a":"extrapolacao","d":2,"e":"É vedado condicionar o fornecimento de produto ou de serviço ao tratamento de dados pessoais do titular.","c":"O § 3º do art. 9º admite que o tratamento seja condição para o fornecimento, desde que o titular seja informado com destaque sobre isso e sobre como exercer seus direitos.","ap":-1},{"id":"lgpd-9-03","b":"lgpd-5-11","g":"C","l":"lgpd","art":"9","r":"LGPD, art. 9º","t":["identificação do controlador","direitos do titular, com menção explícita aos direitos contidos no art. 18 desta Lei"],"a":"rol","d":2,"e":"Entre as informações que devem ser disponibilizadas ao titular de forma clara, adequada e ostensiva estão a identificação do controlador e os direitos do titular, com menção explícita aos direitos do art. 18.","c":"Incisos III e VII do art. 9º. A lista é exemplificativa (“entre outras características previstas em regulamentação”).","ap":-1},{"id":"lgpd-10-01","b":"lgpd-5-11","g":"C","l":"lgpd","art":"10","r":"LGPD, art. 10, § 1º","t":["somente os dados pessoais estritamente necessários para a finalidade pretendida poderão ser tratados"],"a":"literal","d":1,"e":"Quando o tratamento for baseado no legítimo interesse do controlador, somente os dados pessoais estritamente necessários para a finalidade pretendida poderão ser tratados.","c":"Art. 10, § 1º. É o princípio da necessidade aplicado com mais rigor ao legítimo interesse: “estritamente necessários”.","ap":-1},{"id":"lgpd-10-02","b":"lgpd-5-11","g":"E","l":"lgpd","art":"10","r":"LGPD, art. 10, § 2º","t":["O controlador deverá adotar medidas para garantir a transparência do tratamento de dados baseado em seu legítimo interesse"],"a":"extrapolacao","d":2,"e":"O tratamento fundado no legítimo interesse do controlador dispensa medidas específicas de transparência, por não depender da vontade do titular.","c":"O § 2º do art. 10 exige medidas de transparência no tratamento baseado em legítimo interesse.","ap":-1},{"id":"lgpd-10-03","b":"lgpd-5-11","g":"C","l":"lgpd","art":"10","r":"LGPD, art. 10, § 3º","t":["A autoridade nacional poderá solicitar ao controlador relatório de impacto à proteção de dados pessoais, quando o tratamento tiver como fundamento seu interesse legítimo"],"a":"literal","d":2,"e":"A autoridade nacional pode solicitar ao controlador relatório de impacto à proteção de dados pessoais quando o tratamento tiver como fundamento o seu interesse legítimo.","c":"Art. 10, § 3º. O legítimo interesse também é a base citada no art. 37 para o registro das operações.","ap":-1},{"id":"lgpd-10-04","b":"lgpd-5-11","g":"E","l":"lgpd","art":"10","r":"LGPD, art. 10","t":["para finalidades legítimas, consideradas a partir de situações concretas, que incluem, mas não se limitam a"],"a":"rol","d":3,"e":"O apoio e a promoção de atividades do controlador e a proteção do exercício regular de direitos do titular são as únicas finalidades que podem fundamentar o legítimo interesse.","c":"O caput do art. 10 diz que as finalidades legítimas “incluem, mas não se limitam a” esses dois exemplos. O rol é exemplificativo.","ap":-1},{"id":"lgpd-11-01","b":"lgpd-5-11","g":"E","l":"lgpd","art":"11","r":"LGPD, art. 11","t":["O tratamento de dados pessoais sensíveis somente poderá ocorrer nas seguintes hipóteses"],"a":"rol","d":2,"e":"O legítimo interesse do controlador autoriza o tratamento de dados pessoais sensíveis sem consentimento, desde que não prevaleçam direitos fundamentais do titular.","c":"O legítimo interesse não está entre as hipóteses do art. 11 para dados sensíveis.","ap":-1},{"id":"lgpd-11-02","b":"lgpd-5-11","g":"E","l":"lgpd","art":"11","r":"LGPD, art. 11, II","t":["sem fornecimento de consentimento do titular, nas hipóteses em que for indispensável para"],"a":"rol","d":2,"e":"A proteção do crédito autoriza o tratamento de dados pessoais sensíveis sem consentimento do titular.","c":"A proteção do crédito é base do art. 7º, X, para dados comuns, mas não está nas alíneas do art. 11, II.","ap":-1},{"id":"lgpd-11-03","b":"lgpd-5-11","g":"C","l":"lgpd","art":"11","r":"LGPD, art. 11, I","t":["quando o titular ou seu responsável legal consentir, de forma específica e destacada, para finalidades específicas"],"a":"literal","d":1,"e":"Dados pessoais sensíveis podem ser tratados quando o titular ou seu responsável legal consentir, de forma específica e destacada, para finalidades específicas.","c":"Art. 11, I. Repare que o consentimento para dado sensível precisa ser específico e destacado, além dos atributos gerais do art. 5º, XII.","ap":-1},{"id":"lgpd-11-04","b":"lgpd-5-11","g":"C","l":"lgpd","art":"11","r":"LGPD, art. 11, II, g","t":["garantia da prevenção à fraude e à segurança do titular, nos processos de identificação e autenticação de cadastro em sistemas eletrônicos"],"a":"rol","d":2,"e":"Dados sensíveis podem ser tratados sem consentimento quando indispensáveis à garantia da prevenção à fraude e à segurança do titular nos processos de identificação e autenticação de cadastro em sistemas eletrônicos.","c":"Art. 11, II, “g”. É a base usada, por exemplo, para biometria facial em login de aplicativo bancário, resguardados os direitos do art. 9º.","ap":-1},{"id":"lgpd-11-05","b":"lgpd-5-11","g":"E","l":"lgpd","art":"11","r":"LGPD, art. 11, § 5º","t":["É vedado às operadoras de planos privados de assistência à saúde o tratamento de dados de saúde para a prática de seleção de riscos na contratação de qualquer modalidade"],"a":"extrapolacao","d":2,"e":"As operadoras de planos privados de assistência à saúde podem tratar dados de saúde para seleção de riscos na contratação, desde que obtenham consentimento específico e destacado do titular.","c":"O § 5º do art. 11 veda a seleção de riscos por operadoras, sem exceção por consentimento.","ap":-1},{"id":"lgpd-11-06","b":"lgpd-5-11","g":"E","l":"lgpd","art":"11","r":"LGPD, art. 11, § 4º","t":["exceto nas hipóteses relativas a prestação de serviços de saúde, de assistência farmacêutica e de assistência à saúde"],"a":"absoluto","d":3,"e":"A LGPD veda, sem exceção, a comunicação ou o uso compartilhado entre controladores de dados de saúde com o objetivo de obter vantagem econômica.","c":"O § 4º do art. 11 traz exceções: prestação de serviços de saúde, assistência farmacêutica e assistência à saúde, em benefício dos titulares, para permitir a portabilidade solicitada pelo titular ou as transações financeiras e administrativas decorrentes.","ap":-1},{"id":"lgpd-11-07","b":"lgpd-5-11","g":"C","l":"lgpd","art":"11","r":"LGPD, art. 11, § 2º","t":["será dada publicidade à referida dispensa de consentimento, nos termos do inciso I do caput do art. 23 desta Lei"],"a":"literal","d":3,"e":"Quando órgãos e entidades públicos tratam dados sensíveis sem consentimento para cumprir obrigação legal ou executar políticas públicas, deve ser dada publicidade a essa dispensa de consentimento.","c":"Art. 11, § 2º, que remete às alíneas “a” e “b” do inciso II e ao art. 23, I.","ap":-1},{"id":"lgpd-11-08","b":"lgpd-5-11","g":"C","l":"lgpd","art":"11","r":"LGPD, art. 11, § 1º","t":["Aplica-se o disposto neste artigo a qualquer tratamento de dados pessoais que revele dados pessoais sensíveis e que possa causar dano ao titular"],"a":"conceito","d":3,"e":"As regras de tratamento de dados sensíveis aplicam-se também a tratamento de dados pessoais comuns que revele dados sensíveis e que possa causar dano ao titular.","c":"Art. 11, § 1º. Exemplo: histórico de compras em farmácia que permite inferir uma doença.","ap":-1},{"id":"lgpd2-52-01","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, V","t":["bloqueio dos dados pessoais a que se refere a infração até a sua regularização"],"a":"literal","d":1,"e":"Entre as sanções administrativas previstas na LGPD está o bloqueio dos dados pessoais a que se refere a infração até a sua regularização.","c":"Art. 52, V. O bloqueio é temporário (até a regularização); a eliminação (VI) é definitiva.","ap":-1},{"id":"lgpd2-52-02","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, VI","t":["eliminação dos dados pessoais a que se refere a infração"],"a":"extrapolacao","d":2,"e":"A sanção de eliminação prevista na LGPD alcança todos os dados pessoais tratados pelo infrator, ainda que não relacionados à infração apurada.","c":"O inciso VI limita a eliminação aos dados pessoais “a que se refere a infração”. A mesma delimitação aparece no bloqueio (V) e nas suspensões (X e XI).","ap":-1},{"id":"lgpd2-52-03","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, VIII","t":["VIII - (VETADO);"],"a":"vetado","d":3,"e":"Os incisos VII a IX do art. 52 da LGPD preveem, respectivamente, a suspensão do banco de dados, a suspensão da atividade de tratamento e a proibição do exercício de atividades de tratamento.","c":"Os incisos VII, VIII e IX foram vetados. As suspensões e a proibição vieram depois, pela Lei nº 13.853/2019, como incisos X, XI e XII.","ap":-1,"p":["Como os incisos X a XII entraram no art. 52 (Lei 13.853/2019)"]},{"id":"lgpd2-52-04","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 1º, VIII","t":["a adoção reiterada e demonstrada de mecanismos e procedimentos internos capazes de minimizar o dano"],"a":"rol","d":2,"e":"Na aplicação das sanções, a autoridade nacional considera a adoção reiterada e demonstrada de mecanismos e procedimentos internos capazes de minimizar o dano, voltados ao tratamento seguro e adequado de dados.","c":"Art. 52, § 1º, VIII. Ao lado dele: política de boas práticas e governança (IX) e pronta adoção de medidas corretivas (X).","ap":-1},{"id":"lgpd2-52-05","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, § 1º","t":["considerados os seguintes parâmetros e critérios"],"a":"rol","d":2,"e":"Entre os parâmetros e critérios de aplicação das sanções previstos na LGPD estão a condição econômica do infrator e a repercussão da infração nos meios de comunicação.","c":"A condição econômica está no inciso IV, mas a repercussão midiática não consta dos onze incisos do § 1º. Item que mistura um critério real com um inventado é errado.","ap":-1},{"id":"lgpd2-52-06","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 1º, III","t":["a vantagem auferida ou pretendida pelo infrator"],"a":"caso","d":2,"e":"Situação hipotética: em processo sancionador, ficou comprovado que a empresa vendeu bases de clientes a terceiros sem base legal, mas a operação não chegou a gerar receita. Assertiva: ainda assim, a vantagem pretendida pela empresa pode ser considerada na dosimetria da sanção.","c":"Art. 52, § 1º, III: “a vantagem auferida ou pretendida pelo infrator”. Basta a vantagem pretendida.","ap":-1},{"id":"lgpd2-52-07","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, X","t":["até a regularização da atividade de tratamento pelo controlador"],"a":"literal","d":3,"e":"A suspensão parcial do funcionamento do banco de dados a que se refere a infração dura até a regularização da atividade de tratamento pelo controlador, observado o período máximo legal, prorrogável por igual período.","c":"Art. 52, X: período máximo de 6 meses, prorrogável por igual período, até a regularização. A suspensão da atividade de tratamento (XI) não traz essa referência à regularização.","ap":-1},{"id":"lgpd2-53-01","b":"lgpd-52-54","g":"C","l":"lgpd","art":"53","r":"LGPD, art. 53, § 1º","t":["devem apresentar objetivamente as formas e dosimetrias para o cálculo do valor-base das sanções de multa, que deverão conter fundamentação detalhada de todos os seus elementos"],"a":"literal","d":2,"e":"As metodologias de cálculo do valor-base das multas devem apresentar objetivamente as formas e dosimetrias desse cálculo, com fundamentação detalhada de todos os seus elementos.","c":"Art. 53, § 1º. O regulamento de dosimetria da ANPD é a Resolução CD/ANPD nº 4/2023.","ap":-1,"p":["Resolução CD/ANPD 4/2023 (dosimetria das sanções)"]},{"id":"lgpd-52-01","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, II","t":["multa simples, de até 2% (dois por cento) do faturamento da pessoa jurídica de direito privado, grupo ou conglomerado no Brasil no seu último exercício, excluídos os tributos, limitada, no total, a R$ 50.000.000,00 (cinquenta milhões de reais) por infração"],"a":"numero","d":1,"e":"A multa simples prevista na LGPD é de até 2% do faturamento da pessoa jurídica de direito privado, grupo ou conglomerado no Brasil no seu último exercício, excluídos os tributos, limitada, no total, a R$ 50 milhões por infração.","c":"Inciso II do art. 52, literal. Guarde os quatro detalhes que o Cebraspe troca: 2%; faturamento no Brasil; excluídos os tributos; teto de R$ 50 milhões por infração.","ap":-1},{"id":"lgpd-52-02","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, II","t":["limitada, no total, a R$ 50.000.000,00 (cinquenta milhões de reais) por infração"],"a":"numero","d":1,"e":"A multa simples aplicada pela ANPD é limitada a R$ 50 milhões por ano-calendário, somadas todas as infrações cometidas pelo mesmo agente.","c":"O teto de R$ 50 milhões é por infração, não por ano nem por agente. Vários processos podem gerar várias multas, cada uma com seu teto.","ap":-1},{"id":"lgpd-52-03","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, II","t":["do faturamento da pessoa jurídica de direito privado, grupo ou conglomerado no Brasil no seu último exercício, excluídos os tributos"],"a":"comparacao","d":2,"e":"A multa simples da LGPD pode alcançar até 2% do faturamento mundial do grupo econômico no último exercício, incluídos os tributos.","c":"Dois erros: a base é o faturamento no Brasil (não o mundial) e os tributos são excluídos. Faturamento mundial é a base do GDPR europeu (até 4%), uma comparação que costuma aparecer em prova.","ap":-1},{"id":"lgpd-52-04","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, III","t":["multa diária, observado o limite total a que se refere o inciso II"],"a":"literal","d":1,"e":"A multa diária prevista na LGPD está sujeita ao mesmo limite total estabelecido para a multa simples.","c":"Inciso III do art. 52: multa diária, “observado o limite total a que se refere o inciso II”, ou seja, R$ 50 milhões por infração.","ap":-1},{"id":"lgpd-52-05","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, I","t":["advertência, com indicação de prazo para adoção de medidas corretivas"],"a":"extrapolacao","d":1,"e":"A advertência é a sanção mais branda prevista na LGPD e, justamente por isso, dispensa a indicação de prazo para adoção de medidas corretivas.","c":"O inciso I do art. 52 define a advertência “com indicação de prazo para adoção de medidas corretivas”. O prazo é parte da própria sanção.","ap":-1},{"id":"lgpd-52-06","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, IV","t":["publicização da infração após devidamente apurada e confirmada a sua ocorrência"],"a":"excecao","d":2,"e":"A publicização da infração pode ser determinada pela ANPD de forma cautelar, antes da confirmação de sua ocorrência, para proteger os titulares.","c":"O inciso IV do art. 52 só admite a publicização “após devidamente apurada e confirmada a sua ocorrência”.","ap":-1},{"id":"lgpd-52-07","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 3º","t":["O disposto nos incisos I, IV, V, VI, X, XI e XII do caput deste artigo poderá ser aplicado às entidades e aos órgãos públicos"],"a":"rol","d":2,"e":"Órgãos e entidades públicos sujeitam-se, entre outras, às sanções de publicização da infração e de bloqueio dos dados pessoais a que se refere a infração.","c":"O § 3º do art. 52 lista os incisos aplicáveis ao Poder Público: I (advertência), IV (publicização), V (bloqueio), VI (eliminação), X e XI (suspensões) e XII (proibição). Ficam fora as multas (II e III).","ap":-1},{"id":"lgpd-52-08","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, § 3º","t":["O disposto nos incisos I, IV, V, VI, X, XI e XII do caput deste artigo poderá ser aplicado às entidades e aos órgãos públicos"],"a":"rol","d":2,"e":"Às entidades e aos órgãos públicos aplicam-se todas as sanções do art. 52 da LGPD, inclusive a multa diária, desde que a infração seja grave.","c":"A multa simples (II) e a multa diária (III) não estão no rol do § 3º. Guarde o rol na ordem: I, IV, V, VI, X, XI e XII.","ap":-1},{"id":"lgpd-52-09","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 6º, I","t":["somente após já ter sido imposta ao menos 1 (uma) das sanções de que tratam os incisos II, III, IV, V e VI do caput deste artigo para o mesmo caso concreto"],"a":"excecao","d":2,"e":"A suspensão do exercício da atividade de tratamento dos dados pessoais somente pode ser aplicada depois de imposta ao menos uma das sanções de multa simples, multa diária, publicização, bloqueio ou eliminação, para o mesmo caso concreto.","c":"O § 6º do art. 52 trata as sanções mais severas (X, XI e XII) como degrau final: exigem sanção anterior dos incisos II a VI no mesmo caso.","ap":-1},{"id":"lgpd-52-10","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, § 6º, I","t":["somente após já ter sido imposta ao menos 1 (uma) das sanções de que tratam os incisos II, III, IV, V e VI do caput deste artigo para o mesmo caso concreto"],"a":"rol","d":3,"e":"Para que a ANPD aplique a suspensão parcial do funcionamento do banco de dados, basta que, no mesmo caso concreto, já tenha sido imposta ao agente a sanção de advertência.","c":"A advertência é o inciso I e não está entre os incisos II a VI exigidos pelo § 6º, I, do art. 52. Precisa ter havido multa, publicização, bloqueio ou eliminação antes.","ap":-1},{"id":"lgpd-52-11","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, § 6º, I","t":["somente após já ter sido imposta ao menos 1 (uma) das sanções"],"a":"absoluto","d":2,"e":"A proibição total do exercício de atividades relacionadas a tratamento de dados pode ser aplicada como primeira e única sanção, desde que a infração seja considerada gravíssima.","c":"A proibição (inciso XII) segue a regra do § 6º do art. 52: só depois de imposta ao menos uma sanção dos incisos II a VI no mesmo caso. A gravidade não dispensa essa ordem.","ap":-1},{"id":"lgpd-52-12","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, X","t":["pelo período máximo de 6 (seis) meses, prorrogável por igual período"],"a":"numero","d":1,"e":"A suspensão parcial do funcionamento do banco de dados a que se refere a infração pode durar até seis meses, prorrogável por igual período, até a regularização da atividade de tratamento.","c":"Inciso X do art. 52. O inciso XI (suspensão do exercício da atividade) tem o mesmo prazo: até 6 meses, prorrogável por igual período.","ap":-1},{"id":"lgpd-52-13","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, XI","t":["suspensão do exercício da atividade de tratamento dos dados pessoais a que se refere a infração pelo período máximo de 6 (seis) meses, prorrogável por igual período"],"a":"numero","d":2,"e":"A suspensão do exercício da atividade de tratamento dos dados pessoais a que se refere a infração pode durar até seis meses, vedada a prorrogação.","c":"O inciso XI admite prorrogação por igual período, o que leva o máximo a 12 meses.","ap":-1},{"id":"lgpd-52-14","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 1º","t":["As sanções serão aplicadas após procedimento administrativo que possibilite a oportunidade da ampla defesa, de forma gradativa, isolada ou cumulativa"],"a":"literal","d":1,"e":"As sanções da LGPD são aplicadas após procedimento administrativo que possibilite a ampla defesa, de forma gradativa, isolada ou cumulativa, conforme as peculiaridades do caso concreto.","c":"§ 1º do art. 52. A expressão “gradativa, isolada ou cumulativa” costuma ser mutilada no item errado (por exemplo, “vedada a cumulação”).","ap":-1},{"id":"lgpd-52-15","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, § 1º","t":["de forma gradativa, isolada ou cumulativa"],"a":"extrapolacao","d":1,"e":"Em respeito à proporcionalidade, as sanções da LGPD devem ser aplicadas de forma isolada, vedada sua cumulação no mesmo processo.","c":"O § 1º do art. 52 admite expressamente a aplicação cumulativa das sanções.","ap":-1},{"id":"lgpd-52-16","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 1º","t":["a cooperação do infrator","a pronta adoção de medidas corretivas"],"a":"rol","d":2,"e":"A cooperação do infrator e a pronta adoção de medidas corretivas figuram entre os parâmetros e critérios considerados na aplicação das sanções administrativas da LGPD.","c":"São os incisos VII e X do § 1º do art. 52. A lista tem 11 critérios, entre eles boa-fé, vantagem auferida, condição econômica, reincidência, grau do dano e proporcionalidade.","ap":-1},{"id":"lgpd-52-17","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, § 1º, V","t":["a reincidência"],"a":"rol","d":2,"e":"A reincidência não figura entre os parâmetros de aplicação de sanções previstos na própria LGPD, sendo considerada apenas no regulamento de dosimetria editado pela ANPD.","c":"A reincidência está no inciso V do § 1º do art. 52. O regulamento de dosimetria (Resolução CD/ANPD nº 4/2023) detalha seu efeito, mas a previsão é da lei.","ap":-1},{"id":"lgpd-52-18","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 5º","t":["será destinado ao Fundo de Defesa de Direitos Difusos"],"a":"literal","d":2,"e":"O produto da arrecadação das multas aplicadas pela ANPD, inscritas ou não em dívida ativa, é destinado ao Fundo de Defesa de Direitos Difusos.","c":"§ 5º do art. 52, incluído pela Lei nº 13.853/2019. O fundo é o da Lei da Ação Civil Pública (Lei nº 7.347/1985, art. 13).","ap":-1},{"id":"lgpd-52-19","b":"lgpd-52-54","g":"E","l":"lgpd","art":"55-L","r":"LGPD, art. 55-L, V","t":["V - (VETADO)"],"a":"vetado","d":3,"e":"O produto das multas aplicadas pela ANPD constitui receita própria da agência, ao lado das dotações orçamentárias e das doações que lhe forem destinadas.","c":"As multas vão para o Fundo de Defesa de Direitos Difusos (art. 52, § 5º). O inciso V do art. 55-L, que cuidaria de receitas desse tipo, foi vetado. A lista de receitas não inclui multas.","ap":-1},{"id":"lgpd-52-20","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 7º","t":["Os vazamentos individuais ou os acessos não autorizados de que trata o caput do art. 46 desta Lei poderão ser objeto de conciliação direta entre controlador e titular"],"a":"literal","d":2,"e":"Vazamentos individuais ou acessos não autorizados podem ser objeto de conciliação direta entre controlador e titular; não havendo acordo, o controlador fica sujeito às penalidades do art. 52 da LGPD.","c":"§ 7º do art. 52. A conciliação direta é uma faculdade e não afasta a sanção se não houver acordo.","ap":-1},{"id":"lgpd-52-21","b":"lgpd-52-54","g":"E","l":"lgpd","art":"52","r":"LGPD, art. 52, § 7º","t":["poderão ser objeto de conciliação direta entre controlador e titular e, caso não haja acordo, o controlador estará sujeito à aplicação das penalidades"],"a":"extrapolacao","d":2,"e":"Vazamentos individuais de dados devem ser obrigatoriamente submetidos à ANPD, vedada a conciliação direta entre controlador e titular.","c":"O § 7º do art. 52 admite justamente a conciliação direta entre controlador e titular nesses casos.","ap":-1},{"id":"lgpd-52-22","b":"lgpd-52-54","g":"C","l":"lgpd","art":"52","r":"LGPD, art. 52, § 2º","t":["O disposto neste artigo não substitui a aplicação de sanções administrativas, civis ou penais definidas na Lei nº 8.078, de 11 de setembro de 1990, e em legislação específica"],"a":"
