<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Painel ANPD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única de leitura (máx. 760px) com cabeçalho fixo no topo e barra de abas no rodapé,
   como um app de celular; sessões de questões abrem por cima, em tela cheia, no formato de folha de respostas. */
:root{
  --bg:#edf1ee;
  --surface:#ffffff;
  --surface-2:#e1e8e4;
  --ink:#13211d;
  --ink-2:#4b5f57;
  --ink-3:#6f8179;
  --line:#c6d1cb;
  --accent:#0c6b66;
  --accent-2:#d6ebe7;
  --accent-ink:#ffffff;
  --gold:#94600a;
  --gold-bg:#f4e6c7;
  --certo:#1f7445;
  --certo-bg:#dcefe3;
  --errado:#ad3726;
  --errado-bg:#f7dfda;
  --mark:#fbe3a6;
  --calor-0:#dfe7e3;
  --calor-1:#a9d6cd;
  --calor-2:#5fb3a6;
  --calor-3:#1f8a80;
  --calor-4:#0b5a55;
  --sombra:0 1px 2px rgba(19,33,29,.06),0 6px 20px rgba(19,33,29,.06);
  --f-titulo:'Newsreader',Georgia,'Times New Roman',serif;
  --f-corpo:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:12px;
  --abas-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1513; --surface:#151f1c; --surface-2:#1c2925; --ink:#e3ebe7; --ink-2:#a2b5ad; --ink-3:#7f938b;
    --line:#2a3a35; --accent:#52cfbe; --accent-2:#163a35; --accent-ink:#04201c; --gold:#e6b04b; --gold-bg:#3a2c10;
    --certo:#72cf98; --certo-bg:#14321f; --errado:#f08a77; --errado-bg:#3d1d17; --mark:#5a4512;
    --calor-0:#1c2925; --calor-1:#1d4a43; --calor-2:#22766b; --calor-3:#3aa597; --calor-4:#7fe0d1;
    --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#151f1c; --surface-2:#1c2925; --ink:#e3ebe7; --ink-2:#a2b5ad; --ink-3:#7f938b;
  --line:#2a3a35; --accent:#52cfbe; --accent-2:#163a35; --accent-ink:#04201c; --gold:#e6b04b; --gold-bg:#3a2c10;
  --certo:#72cf98; --certo-bg:#14321f; --errado:#f08a77; --errado-bg:#3d1d17; --mark:#5a4512;
  --calor-0:#1c2925; --calor-1:#1d4a43; --calor-2:#22766b; --calor-3:#3aa597; --calor-4:#7fe0d1;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-corpo);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-titulo);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mudo{color:var(--ink-2)}
.pequeno{font-size:.86rem}
.rotulo{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-bottom:calc(var(--abas-h) + 28px + env(safe-area-inset-bottom,0px))}

/* Cabeçalho */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.marca{display:flex;flex-direction:column;min-width:0;flex:1}
.marca b{font-family:var(--f-titulo);font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.marca span{font-size:.78rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pilula{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-size:.8rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.pilula svg{width:15px;height:15px}
.pilula.fogo{color:var(--gold)}
.pilula.fogo.apagado{color:var(--ink-3)}
.pilula.xp{color:var(--accent)}
.icone-btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.icone-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}

/* Abas */
.abas{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.abas>.aba{flex:1;max-width:150px;appearance:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;cursor:pointer;color:var(--ink-3);font-size:.74rem;font-weight:700}
.aba svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.aba[aria-current="page"]{color:var(--accent)}
.aba[aria-current="page"] svg{stroke-width:2.2}
.aba:focus-visible,.btn:focus-visible,.chip:focus-visible,.bolha:focus-visible,.icone-btn:focus-visible,.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.conteudo{padding-top:18px;outline:none}
.vista{display:flex;flex-direction:column;gap:18px}
.secao{display:flex;flex-direction:column;gap:10px}
.secao-cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.secao-cab h2{font-size:1.2rem}

.cartao{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cartao.destaque{border-color:var(--accent);box-shadow:var(--sombra)}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primario{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primario:hover{filter:brightness(1.06)}
.btn.fantasma{background:transparent}
.btn.pequeno{min-height:34px;padding:6px 12px;font-size:.84rem}
.btn.largo{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.linha-btns{display:flex;gap:10px;flex-wrap:wrap}
.linkish{appearance:none;border:0;background:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:700;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{font-family:var(--f-mono);font-size:.74rem;opacity:.8}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.selo{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.selo.p1{background:var(--errado-bg);color:var(--errado)}
.selo.p2{background:var(--gold-bg);color:var(--gold)}
.selo.ok{background:var(--certo-bg);color:var(--certo)}
.selo.mono{font-family:var(--f-mono);font-weight:500}

/* Hoje */
.heroi{display:grid;grid-template-columns:1fr auto;gap:14px 18px;align-items:start}
.heroi .dia{font-family:var(--f-titulo);font-size:1.5rem;font-weight:600}
.heroi .data{font-family:var(--f-mono);color:var(--ink-2);font-size:.85rem}
.heroi .atividade{grid-column:1 / -1;font-size:1.02rem;line-height:1.5}
.heroi .acoes{grid-column:1 / -1}
.anel{width:86px;height:86px;position:relative;flex-shrink:0}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel circle{fill:none;stroke-width:8}
.anel .trilho{stroke:var(--surface-2)}
.anel .valor{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.anel .valor.cheio{stroke:var(--gold)}
.anel .meio{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.anel .meio b{font-family:var(--f-mono);font-size:1.15rem}
.anel .meio span{font-size:.66rem;color:var(--ink-2)}
.nota-aguardando{font-size:.86rem;color:var(--gold);background:var(--gold-bg);padding:8px 10px;border-radius:8px}

.nivel{display:flex;align-items:center;gap:14px}
.nivel .insignia{width:52px;height:52px;flex-shrink:0;border-radius:14px;background:var(--accent-2);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:1.2rem}
.nivel .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.nivel .titulo{font-family:var(--f-titulo);font-size:1.12rem;font-weight:600}
.barra{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.barra>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}
.barra.ouro>i{background:var(--gold)}

.grade-modos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modo{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;color:var(--ink)}
.modo:hover{border-color:var(--accent)}
.modo b{font-family:var(--f-titulo);font-size:1.08rem;font-weight:600}
.modo span{font-size:.84rem;color:var(--ink-2);line-height:1.4}
.modo .num{margin-top:auto;font-family:var(--f-mono);font-size:.78rem;color:var(--accent);font-weight:600}
.contagem{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.contagem .grande{font-family:var(--f-mono);font-size:2rem;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}

/* Treinar */
.grupo-blocos{display:flex;flex-direction:column;gap:8px}
.bloco-op{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.bloco-op input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}
.bloco-op .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bloco-op .txt b{font-size:.92rem}
.bloco-op .txt small{color:var(--ink-2);font-size:.78rem}
.bloco-op .dom{width:64px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.bloco-op .dom span{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2)}
.bloco-op.vazio{opacity:.6;cursor:default}
.campo{display:flex;flex-direction:column;gap:6px}
.campo>label,.campo>.rot{font-weight:700;font-size:.9rem}

/* Sessão (tela cheia) */
.sessao{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sessao-corpo{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 32px);display:flex;flex-direction:column;gap:14px}
.sessao-topo{display:flex;align-items:center;gap:10px}
.sessao-topo .tit{flex:1;min-width:0;display:flex;flex-direction:column}
.sessao-topo .tit b{font-family:var(--f-titulo);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sessao-topo .tit span{font-size:.78rem;color:var(--ink-2)}
.relogio{font-family:var(--f-mono);font-weight:600;font-size:1rem;padding:4px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.relogio.urgente{color:var(--errado);border-color:var(--errado)}
.combo{font-family:var(--f-mono);font-weight:600;font-size:.82rem;color:var(--gold);background:var(--gold-bg);padding:3px 9px;border-radius:999px}
.combo.pulso{animation:pulso .35s ease}
@keyframes pulso{50%{transform:scale(1.15)}}

/* Folha de respostas: tira de bolhas */
.tira{display:flex;flex-wrap:wrap;gap:4px}
.tira i{width:14px;height:10px;border-radius:50%;border:1.5px solid var(--line);display:block}
.tira i.atual{border-color:var(--accent);border-width:2px}
.tira i.C{background:var(--certo);border-color:var(--certo)}
.tira i.E{background:var(--errado);border-color:var(--errado)}
.tira i.B{background:var(--ink-3);border-color:var(--ink-3)}
.tira i.R{background:var(--accent);border-color:var(--accent)}
.tira button{appearance:none;border:0;padding:0;background:none;cursor:pointer}

.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.item-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.item-num{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2)}
.enunciado{font-family:var(--f-titulo);font-size:1.16rem;line-height:1.55;font-weight:400}
.apoio{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-family:var(--f-titulo);font-size:1rem;line-height:1.6;color:var(--ink);display:flex;flex-direction:column;gap:8px}
details.apoio-det summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:.88rem}
details.apoio-det[open] summary{margin-bottom:8px}

.respostas{display:flex;gap:12px}
.bolha{flex:1;appearance:none;border:2px solid var(--ink-2);background:var(--surface);border-radius:999px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-weight:700;font-size:.98rem;letter-spacing:.03em;color:var(--ink);transition:background .15s,border-color .15s,transform .1s}
.bolha .oval{width:26px;height:18px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem}
.bolha:hover{transform:translateY(-1px)}
.bolha.c:hover,.bolha.c.marcada{border-color:var(--certo);color:var(--certo)}
.bolha.e:hover,.bolha.e.marcada{border-color:var(--errado);color:var(--errado)}
.bolha.b{flex:0 0 auto;padding-inline:16px;border-style:dashed;color:var(--ink-2);border-color:var(--ink-3)}
.bolha.marcada .oval{background:currentColor}
.bolha.marcada .oval span{color:var(--surface)}
.duvida{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink-2);cursor:pointer;user-select:none}
.duvida input{width:18px;height:18px;accent-color:var(--gold)}
.atalhos{font-size:.76rem;color:var(--ink-3)}
@media (hover:none){.atalhos{display:none}}

.veredito{border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700}
.veredito.ok{background:var(--certo-bg);color:var(--certo)}
.veredito.no{background:var(--errado-bg);color:var(--errado)}
.veredito .ganho{font-family:var(--f-mono);font-size:.9rem;color:var(--gold)}
.ganho-voa{animation:voa .9s ease forwards}
@keyframes voa{0%{opacity:0;transform:translateY(6px)}30%{opacity:1;transform:translateY(0)}100%{opacity:1}}
.explica{display:flex;flex-direction:column;gap:10px;font-size:.96rem;line-height:1.6}
.explica .gab{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.citacao{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.citacao q{font-family:var(--f-titulo);font-size:1rem;line-height:1.55;quotes:"“" "”"}
.citacao q+q{border-top:1px dashed var(--line);padding-top:8px}
.citacao .fonte{font-family:var(--f-mono);font-size:.76rem;color:var(--ink-2)}

.placar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.placar>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.placar b{display:block;font-family:var(--f-mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.placar span{font-size:.72rem;color:var(--ink-2)}
.placar .C b{color:var(--certo)}
.placar .E b{color:var(--errado)}
.placar .L b{color:var(--accent)}
.nota-final{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nota-final .grande{font-family:var(--f-mono);font-size:2.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.lista-rev{display:flex;flex-direction:column;gap:8px}
.lista-rev button{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.lista-rev button .marca-res{flex-shrink:0;font-family:var(--f-mono);font-weight:600;width:22px}
.lista-rev .marca-res.C{color:var(--certo)}
.lista-rev .marca-res.E{color:var(--errado)}
.lista-rev .marca-res.B{color:var(--ink-3)}
.lista-rev .txt{font-size:.88rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Lei seca */
.busca{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-size:1rem}
.busca:focus{outline:2px solid var(--accent);outline-offset:1px}
.capitulo{display:flex;flex-direction:column;gap:6px}
.capitulo h3{font-size:.95rem;font-family:var(--f-corpo);font-weight:700;color:var(--ink-2);padding-top:6px}
.artigos{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.art-btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.82rem;font-weight:600;color:var(--ink)}
.art-btn:hover{border-color:var(--accent)}
.art-btn .pontos{display:flex;gap:2px;height:6px}
.art-btn .pontos i{width:6px;height:6px;border-radius:50%;background:var(--surface-2)}
.art-btn .pontos i.ok{background:var(--certo)}
.art-btn .pontos i.no{background:var(--errado)}
.art-btn .pontos i.nv{background:var(--line)}
.art-btn.lido{background:var(--accent-2)}
.texto-lei{font-family:var(--f-titulo);font-size:1.04rem;line-height:1.65;display:flex;flex-direction:column;gap:6px}
.texto-lei p.caput{font-weight:500}
.texto-lei p.inc{padding-left:18px}
.texto-lei p.ali{padding-left:36px}
.texto-lei p.par{padding-left:0}
.texto-lei .nota{font-family:var(--f-corpo);font-size:.74rem;color:var(--ink-3)}
.texto-lei mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.texto-lei mark.erro{background:var(--errado-bg);box-shadow:inset 0 -2px 0 var(--errado)}
.resultado-busca{display:flex;flex-direction:column;gap:8px}
.resultado-busca button{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.resultado-busca b{font-family:var(--f-mono);font-size:.82rem}
.resultado-busca span{font-size:.88rem;color:var(--ink-2)}

/* Folha lateral / inferior */

.dom-linha .barra{height:10px;border-radius:4px}

.calor-env{overflow-x:auto}
.calor{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;width:max-content;position:relative}
.calor i{width:14px;height:14px;border-radius:3px;background:var(--calor-0)}
.calor i[data-n="1"]{background:var(--calor-1)}
.calor i[data-n="2"]{background:var(--calor-2)}
.calor i[data-n="3"]{background:var(--calor-3)}
.calor i[data-n="4"]{background:var(--calor-4)}
.calor i.hoje{outline:2px solid var(--accent);outline-offset:1px}
.calor-leg{display:flex;align-items:center;gap:4px;font-size:.74rem;color:var(--ink-2)}
.calor-leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dica{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:5px 8px;border-radius:6px;white-space:nowrap;font-family:var(--f-mono)}
.conquistas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.conquista{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-height:96px}

.tabela{width:100%;border-collapse:collapse;font-size:.88rem}
.tabela th,.tabela td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tabela th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.tabela td.num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

/* Plano */
.fase{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.fase-cab{appearance:none;border:0;background:transparent;width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:14px 16px;cursor:pointer;color:var(--ink)}
.fase-cab .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.fase-cab .t b{font-family:var(--f-titulo);font-size:1.05rem;font-weight:600}
.fase-cab .t span{font-size:.8rem;color:var(--ink-2)}
.fase-cab .seta{transition:transform .15s;color:var(--ink-3);font-family:var(--f-mono)}
.fase-cab[aria-expanded="true"] .seta{transform:rotate(90deg)}
.fase-corpo{border-top:1px solid var(--line);padding:6px 16px 14px;display:flex;flex-direction:column;gap:6px}

.dia-linha{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.dia-linha:last-child{border-bottom:0}

.dia-linha.passado{opacity:.62}
.data-sel{flex:0 0 46px;text-align:center;font-family:var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:5px 2px;background:var(--surface-2)}
.data-sel b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.data-sel span{display:block;font-size:.62rem;color:var(--ink-2);text-transform:uppercase}
.dia-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:.9rem;line-height:1.45}
.dia-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dia-check{padding-top:2px}
.dia-check input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.status-btn{appearance:none;border:0;cursor:pointer}

/* Avisos (toasts) */
.avisos{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--abas-h) + 20px);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.aviso{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;box-shadow:var(--sombra);display:flex;gap:10px;align-items:center;animation:entra .3s ease;pointer-events:auto}

.vazio-msg{color:var(--ink-2);font-size:.92rem;text-align:center;padding:12px}
.sync{font-size:.74rem;color:var(--ink-3);text-align:center}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}

.notas-card .n2{border-color:var(--gold);color:var(--gold)}
.notas-card .n3{border-color:var(--certo);color:var(--certo)}

e proibidos","Funções do pronome relativo “que”"]}],"armadilhas":{"literal":"Texto literal","rol":"Rol taxativo ou exemplificativo","numero":"Número, prazo ou quórum trocado","sujeito":"Sujeito ou competência trocada","absoluto":"Palavra absoluta (sempre, nunca, somente)","extrapolacao":"Acrescenta o que a lei não diz","excecao":"Exceção esquecida ou invertida","conceito":"Conceito ou definição","vetado":"Dispositivo vetado ou revogado","caso":"Caso concreto","comparacao":"Comparação entre regimes","interpretacao":"Interpretação de texto"},"questoes":[{"id":"adm-01","b":"administrativo","g":"C","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 20","t":[],"a":"literal","d":1,"e":"Nas esferas administrativa, controladora e judicial, não se decidirá com base em valores jurídicos abstratos sem que sejam consideradas as consequências práticas da decisão.","c":"Art. 20 da LINDB, incluído pela Lei nº 13.655/2018. É o chamado consequencialismo jurídico.","ap":-1,"p":["Lei 13.655/2018 e o consequencialismo na LINDB"],"v":0},{"id":"adm-02","b":"administrativo","g":"C","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 21","t":[],"a":"literal","d":2,"e":"A decisão que, nas esferas administrativa, controladora ou judicial, decretar a invalidação de ato, contrato, ajuste, processo ou norma administrativa deverá indicar de modo expresso suas consequências jurídicas e administrativas.","c":"Art. 21 da LINDB. O parágrafo único manda indicar as condições para a regularização de modo proporcional e equânime.","ap":-1,"v":0},{"id":"adm-03","b":"administrativo","g":"C","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 22","t":[],"a":"conceito","d":2,"e":"Na interpretação de normas sobre gestão pública, serão considerados os obstáculos e as dificuldades reais do gestor e as exigências das políticas públicas a seu cargo, sem prejuízo dos direitos dos administrados.","c":"Art. 22 da LINDB (primazia da realidade).","ap":-1,"v":0},{"id":"adm-04","b":"administrativo","g":"E","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 22","t":[],"a":"rol","d":2,"e":"Segundo a LINDB, na aplicação de sanções, não podem ser considerados os antecedentes do agente, sob pena de bis in idem.","c":"O art. 22, § 2º, manda considerar a natureza e a gravidade da infração, os danos, as agravantes ou atenuantes e os antecedentes do agente. Compare com a reincidência do art. 52, § 1º, V, da LGPD.","ap":-1,"v":0},{"id":"adm-05","b":"administrativo","g":"C","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 23","t":[],"a":"conceito","d":2,"e":"A decisão administrativa que estabelecer interpretação ou orientação nova sobre norma de conteúdo indeterminado, impondo novo dever ou novo condicionamento de direito, deverá prever regime de transição quando indispensável para que o novo dever seja cumprido de modo proporcional, equânime e eficiente.","c":"Art. 23 da LINDB. Relevante para guias e orientações da ANPD que mudem entendimento.","ap":-1,"v":0},{"id":"adm-06","b":"administrativo","g":"E","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 24","t":[],"a":"conceito","d":3,"e":"Com base em mudança posterior de orientação geral, a Administração pode declarar inválidas situações plenamente constituídas sob a orientação anterior.","c":"O art. 24 da LINDB veda exatamente isso: a revisão de ato já completado leva em conta as orientações gerais da época.","ap":-1,"v":0},{"id":"adm-07","b":"administrativo","g":"C","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 26","t":[],"a":"conceito","d":2,"e":"Para eliminar irregularidade, incerteza jurídica ou situação contenciosa na aplicação do direito público, a autoridade administrativa poderá celebrar compromisso com os interessados, após oitiva do órgão jurídico e, quando for o caso, após consulta pública, presentes razões de relevante interesse geral.","c":"Art. 26 da LINDB. A LGPD remete a ele no art. 55-J, XVII (compromisso da ANPD com agentes de tratamento). O compromisso só produz efeitos após publicação oficial.","ap":-1,"p":["Compromisso e termo de ajustamento de conduta na ANPD"],"v":0},{"id":"adm-08","b":"administrativo","g":"E","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 26","t":[],"a":"extrapolacao","d":3,"e":"O compromisso celebrado com base no art. 26 da LINDB pode conferir ao interessado desoneração permanente de dever reconhecido por orientação geral, desde que haja vantagem para o erário.","c":"O § 1º do art. 26 proíbe conferir desoneração permanente de dever ou condicionamento de direito reconhecidos por orientação geral.","ap":-1,"v":0},{"id":"adm-09","b":"administrativo","g":"C","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 28","t":[],"a":"literal","d":1,"e":"O agente público responderá pessoalmente por suas decisões ou opiniões técnicas em caso de dolo ou erro grosseiro.","c":"Art. 28 da LINDB. Culpa leve não basta.","ap":-1,"v":0},{"id":"adm-10","b":"administrativo","g":"E","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 28","t":[],"a":"extrapolacao","d":2,"e":"Segundo a LINDB, o agente público responde pessoalmente por suas opiniões técnicas sempre que houver culpa, ainda que leve.","c":"A responsabilização pessoal exige dolo ou erro grosseiro (art. 28).","ap":-1,"v":0},{"id":"adm-11","b":"administrativo","g":"C","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 29","t":[],"a":"literal","d":2,"e":"Em qualquer órgão ou Poder, a edição de atos normativos por autoridade administrativa, salvo os de mera organização interna, poderá ser precedida de consulta pública para manifestação de interessados, preferencialmente por meio eletrônico.","c":"Art. 29 da LINDB. Para a ANPD, a consulta pública é obrigatória por norma especial (art. 55-J, § 2º, da LGPD e Lei nº 13.848/2019).","ap":-1,"v":0},{"id":"adm-12","b":"administrativo","g":"C","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 30","t":[],"a":"conceito","d":2,"e":"As autoridades públicas devem atuar para aumentar a segurança jurídica na aplicação das normas, inclusive por meio de regulamentos, súmulas administrativas e respostas a consultas, instrumentos que terão caráter vinculante em relação ao órgão ou entidade a que se destinam.","c":"Art. 30 da LINDB e parágrafo único.","ap":-1,"v":0},{"id":"adm-13","b":"administrativo","g":"C","l":"cf","art":null,"r":"CF/88, art. 37, XIX","t":[],"a":"literal","d":1,"e":"Somente por lei específica poderá ser criada autarquia e autorizada a instituição de empresa pública, de sociedade de economia mista e de fundação.","c":"Art. 37, XIX, da CF. Autarquia é criada pela própria lei; as demais têm a criação autorizada por lei.","ap":-1,"v":0},{"id":"adm-14","b":"administrativo","g":"E","l":"cf","art":null,"r":"CF/88, art. 37, XIX","t":[],"a":"conceito","d":2,"e":"A transformação da ANPD em autarquia de natureza especial poderia ter sido feita por decreto do Presidente da República, por se tratar de matéria de organização administrativa.","c":"Criação de autarquia exige lei específica (art. 37, XIX, da CF). Decreto autônomo (art. 84, VI, a) não pode criar nem extinguir órgãos ou entidades. A transformação veio por lei (Leis nº 14.460/2022 e nº 15.352/2026).","ap":-1,"v":0},{"id":"adm-15","b":"administrativo","g":"C","l":"doutrina","art":null,"r":"Doutrina · autarquia","t":[],"a":"conceito","d":1,"e":"Autarquia é pessoa jurídica de direito público da administração indireta, criada por lei, com patrimônio e receita próprios, para executar atividades típicas da administração pública.","c":"Definição do art. 5º, I, do Decreto-Lei nº 200/1967, atualizada pela doutrina para pessoa jurídica de direito público.","ap":-1},{"id":"adm-16","b":"administrativo","g":"E","l":"doutrina","art":null,"r":"Doutrina · autarquia","t":[],"a":"conceito","d":2,"e":"A vinculação da ANPD ao Ministério da Justiça e Segurança Pública caracteriza subordinação hierárquica, permitindo ao ministro rever de ofício qualquer decisão da agência.","c":"Entre a administração direta e a autarquia há vinculação e supervisão ministerial (tutela ou controle finalístico), não hierarquia. A Lei nº 13.848/2019 afasta expressamente tutela e subordinação para as agências.","ap":-1},{"id":"adm-17","b":"administrativo","g":"C","l":"doutrina","art":null,"r":"Doutrina · poder de polícia","t":[],"a":"conceito","d":2,"e":"Considera-se poder de polícia a atividade da administração pública que, limitando ou disciplinando direito, interesse ou liberdade, regula a prática de ato ou abstenção de fato, em razão de interesse público.","c":"Definição do art. 78 do Código Tributário Nacional. A fiscalização e a sanção pela ANPD são manifestações do poder de polícia.","ap":-1,"p":["Ciclo de polícia: ordem, consentimento, fiscalização e sanção"]},{"id":"adm-18","b":"administrativo","g":"C","l":"doutrina","art":null,"r":"Doutrina · ato administrativo","t":[],"a":"conceito","d":2,"e":"Pela teoria dos motivos determinantes, a validade do ato administrativo vincula-se aos motivos indicados como seu fundamento, de modo que motivo falso ou inexistente invalida o ato, ainda que a motivação não fosse obrigatória.","c":"Teoria muito cobrada pelo Cebraspe, aplicada inclusive à exoneração ad nutum motivada.","ap":-1},{"id":"adm-19","b":"administrativo","g":"E","l":"doutrina","art":null,"r":"Doutrina · ato administrativo","t":[],"a":"conceito","d":2,"e":"A autoexecutoriedade é atributo presente em todos os atos administrativos, inclusive na cobrança de multas, que pode ser feita diretamente sobre o patrimônio do infrator, sem processo judicial.","c":"Nem todo ato é autoexecutório. A multa administrativa não paga é inscrita em dívida ativa e cobrada por execução fiscal. As multas da ANPD vão para o Fundo de Defesa de Direitos Difusos (art. 52, § 5º, da LGPD).","ap":-1},{"id":"adm-20","b":"administrativo","g":"C","l":"doutrina","art":null,"r":"Doutrina · ato administrativo","t":[],"a":"conceito","d":2,"e":"A Administração pode anular seus próprios atos, quando eivados de vícios que os tornem ilegais, ou revogá-los, por motivo de conveniência ou oportunidade, respeitados os direitos adquiridos.","c":"Súmula 473 do STF, reproduzida no art. 53 da Lei nº 9.784/1999. Anulação: ilegalidade, efeitos retroativos. Revogação: mérito, efeitos prospectivos.","ap":-1},{"id":"adm-21","b":"administrativo","g":"E","l":"doutrina","art":null,"r":"Doutrina · ato administrativo","t":[],"a":"conceito","d":2,"e":"O Poder Judiciário pode revogar ato administrativo discricionário de outro Poder quando entender que existe solução mais conveniente ao interesse público.","c":"O Judiciário controla legalidade (inclusive razoabilidade e proporcionalidade), mas não revoga atos de outro Poder por conveniência e oportunidade.","ap":-1},{"id":"adm-22","b":"administrativo","g":"C","l":"doutrina","art":null,"r":"Doutrina · improbidade","t":[],"a":"conceito","d":2,"e":"Após a Lei nº 14.230/2021, somente condutas dolosas configuram ato de improbidade administrativa.","c":"A reforma eliminou a modalidade culposa. O art. 55-F da LGPD qualifica como improbidade a violação da quarentena por ex-diretor da ANPD.","ap":-1,"p":["Tema 1199 do STF (retroatividade da Lei 14.230/2021)"]},{"id":"adm-23","b":"administrativo","g":"C","l":"doutrina","art":null,"r":"Doutrina · agências reguladoras","t":[],"a":"conceito","d":2,"e":"O poder normativo das agências reguladoras é de natureza técnica e deve ser exercido nos limites da lei, não podendo inovar de forma originária na ordem jurídica contra ou além do que a lei autoriza.","c":"Tema clássico (deslegalização e poder normativo técnico). O STF reconheceu a validade do poder normativo das agências nos limites legais, por exemplo na ADI 4874 (Anvisa).","ap":-1,"p":["ADI 4874 e o poder normativo das agências reguladoras"]},{"id":"adm-24","b":"administrativo","g":"C","l":"cf","art":null,"r":"CF/88, art. 37, § 6º","t":[],"a":"conceito","d":2,"e":"As pessoas jurídicas de direito público responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa.","c":"Art. 37, § 6º, da CF: responsabilidade objetiva do Estado e subjetiva do agente na ação de regresso. O STF fixou que a vítima deve acionar o Estado, não o agente diretamente (Tema 940).","ap":-1,"p":["Tema 940 do STF (dupla garantia)"],"v":0},{"id":"cf2-01","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 5º, XXXIII","t":[],"a":"literal","d":1,"e":"Todos têm direito a receber dos órgãos públicos informações de seu interesse particular, ou de interesse coletivo ou geral, ressalvadas aquelas cujo sigilo seja imprescindível à segurança da sociedade e do Estado.","c":"Art. 5º, XXXIII, da CF, regulamentado pela Lei de Acesso à Informação. A LGPD convive com a LAI (art. 23, § 2º, da LGPD).","ap":-1,"p":["Conflito aparente entre LAI e LGPD"],"v":0},{"id":"cf2-02","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 5º, XII","t":[],"a":"conceito","d":2,"e":"A interceptação de comunicações telefônicas exige ordem judicial, nas hipóteses e na forma que a lei estabelecer, para fins de investigação criminal ou instrução processual penal.","c":"Art. 5º, XII, da CF, regulamentado pela Lei nº 9.296/1996.","ap":-1,"v":0},{"id":"cf2-03","b":"constitucional","g":"E","l":"cf","art":null,"r":"CF/88, art. 5º, XII","t":[],"a":"sujeito","d":3,"e":"As comissões parlamentares de inquérito podem determinar a interceptação de comunicações telefônicas dos investigados, por terem poderes de investigação próprios das autoridades judiciais.","c":"A interceptação está sob reserva de jurisdição. Segundo o STF, a CPI pode quebrar sigilo bancário, fiscal e de dados telefônicos (registros), mas não determinar interceptação.","ap":-1,"v":0},{"id":"cf2-04","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 5º, LXXVII","t":[],"a":"literal","d":1,"e":"São gratuitas as ações de habeas corpus e habeas data.","c":"Art. 5º, LXXVII, da CF. A gratuidade alcança também os atos necessários ao exercício da cidadania, na forma da lei.","ap":-1,"v":0},{"id":"cf2-05","b":"constitucional","g":"E","l":"cf","art":null,"r":"CF/88, art. 5º, LXXII","t":[],"a":"excecao","d":2,"e":"O habeas data pode ser impetrado independentemente de prévio pedido administrativo, pois o acesso ao Judiciário é incondicionado.","c":"Segundo a Súmula 2 do STJ e a Lei nº 9.507/1997, não cabe habeas data sem recusa de informações pela autoridade administrativa. A LGPD remete à Lei do Habeas Data no art. 23, § 3º.","ap":-1,"v":0},{"id":"cf2-06","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 84, VI, a","t":[],"a":"literal","d":2,"e":"Compete privativamente ao Presidente da República dispor, mediante decreto, sobre organização e funcionamento da administração federal, quando não implicar aumento de despesa nem criação ou extinção de órgãos públicos.","c":"Art. 84, VI, a (decreto autônomo). Por isso a estrutura regimental da ANPD é aprovada por ato do Presidente (art. 55-G da LGPD), mas a criação da entidade exigiu lei.","ap":-1,"v":0},{"id":"cf2-07","b":"constitucional","g":"C","l":"stf","art":null,"r":"STF · ADI 6649","t":[],"a":"conceito","d":3,"e":"Ao julgar a ADI 6649 e a ADPF 695, o STF conferiu interpretação conforme ao decreto federal sobre compartilhamento de dados na administração pública, exigindo, entre outros pontos, finalidade legítima, específica e explícita e observância da LGPD.","c":"Julgamento de 2022 sobre o Decreto nº 10.046/2019 (Cadastro Base do Cidadão). Reforça que compartilhamento entre órgãos públicos não é livre.","ap":-1,"p":["ADI 6649 e ADPF 695: compartilhamento de dados no governo"],"v":0},{"id":"cf2-08","b":"constitucional","g":"E","l":"cf","art":null,"r":"CF/88, art. 22, XXX","t":[],"a":"comparacao","d":2,"e":"Por força da competência legislativa sobre proteção de dados, os Estados podem editar leis próprias de proteção de dados aplicáveis às empresas privadas sediadas em seu território, com regras diferentes das da LGPD.","c":"Desde a EC nº 115/2022, legislar sobre proteção e tratamento de dados pessoais é competência privativa da União (art. 22, XXX). Estados disciplinam o tratamento em sua própria administração, observada a LGPD.","ap":-1,"v":0},{"id":"cf2-09","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 5º, LXXIX","t":[],"a":"conceito","d":2,"e":"O direito fundamental à proteção dos dados pessoais, inclusive nos meios digitais, é assegurado nos termos da lei, sendo a LGPD a principal lei que o concretiza.","c":"Art. 5º, LXXIX, da CF, incluído pela EC nº 115/2022, depois do reconhecimento do direito autônomo pelo STF em 2020 (ADI 6387).","ap":-1,"v":0},{"id":"cf2-10","b":"constitucional","g":"E","l":"cf","art":null,"r":"CF/88, art. 37","t":[],"a":"rol","d":1,"e":"Os princípios expressos da administração pública no caput do art. 37 da CF são legalidade, impessoalidade, moralidade, publicidade, eficiência e razoabilidade.","c":"O caput traz cinco princípios (LIMPE). Razoabilidade e proporcionalidade são implícitos na CF e expressos na Lei nº 9.784/1999.","ap":-1,"v":0},{"id":"cf-01","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 5º, LXXIX","t":[],"a":"literal","d":1,"e":"A Emenda Constitucional nº 115/2022 incluiu entre os direitos e garantias fundamentais o direito à proteção dos dados pessoais, inclusive nos meios digitais, nos termos da lei.","c":"Art. 5º, LXXIX, da Constituição, incluído pela EC nº 115/2022. Antes disso, o STF já havia reconhecido a proteção de dados como direito fundamental autônomo (ADI 6.387, 2020).","ap":-1,"v":0},{"id":"cf-02","b":"constitucional","g":"E","l":"cf","art":null,"r":"CF/88, art. 5º, LXXIX","t":[],"a":"conceito","d":2,"e":"A proteção de dados pessoais foi incluída na Constituição como princípio geral da atividade econômica, no art. 170, e não como direito fundamental.","c":"A EC nº 115/2022 inseriu a proteção de dados no art. 5º (inciso LXXIX), entre os direitos e garantias fundamentais. O art. 170 aparece na LGPD por outro motivo: o dever de mínima intervenção da ANPD (art. 55-J, § 1º).","ap":-1,"v":0},{"id":"cf-03","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 22, XXX","t":[],"a":"sujeito","d":1,"e":"Compete privativamente à União legislar sobre proteção e tratamento de dados pessoais.","c":"Art. 22, XXX, incluído pela EC nº 115/2022. Por isso leis estaduais ou municipais não podem criar regras gerais de proteção de dados; o parágrafo único do art. 1º da LGPD já dizia que suas normas gerais são de interesse nacional.","ap":-1,"v":0},{"id":"cf-04","b":"constitucional","g":"E","l":"cf","art":null,"r":"CF/88, art. 22, XXX","t":[],"a":"sujeito","d":2,"e":"A competência para legislar sobre proteção e tratamento de dados pessoais é concorrente entre a União, os Estados e o Distrito Federal, cabendo à União estabelecer normas gerais.","c":"É competência privativa da União (art. 22, XXX), não concorrente (art. 24).","ap":-1,"v":0},{"id":"cf-05","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 21, XXVI","t":[],"a":"sujeito","d":2,"e":"Compete à União organizar e fiscalizar a proteção e o tratamento de dados pessoais, nos termos da lei.","c":"Art. 21, XXVI, incluído pela EC nº 115/2022. É a competência material que a ANPD exerce em nome da União.","ap":-1,"v":0},{"id":"cf-06","b":"constitucional","g":"E","l":"cf","art":null,"r":"CF/88, art. 21, XXVI","t":[],"a":"sujeito","d":2,"e":"Compete aos Municípios organizar e fiscalizar a proteção e o tratamento de dados pessoais em seu território, nos termos da lei.","c":"A competência para organizar e fiscalizar é da União (art. 21, XXVI).","ap":-1,"v":0},{"id":"cf-07","b":"constitucional","g":"C","l":"stf","art":null,"r":"STF · ADI 6387","t":[],"a":"caso","d":2,"e":"Em 2020, o Supremo Tribunal Federal suspendeu a eficácia de medida provisória que obrigava empresas de telefonia a compartilhar dados de usuários com o IBGE, reconhecendo a proteção de dados pessoais como direito fundamental autônomo.","c":"ADI 6.387 e ações conexas, relatora Ministra Rosa Weber, sobre a MP nº 954/2020. O julgamento é marco do reconhecimento do direito antes da EC nº 115/2022.","ap":-1,"v":0},{"id":"cf-08","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 5º, LXXII","t":[],"a":"conceito","d":1,"e":"Concede-se habeas data para assegurar o conhecimento de informações relativas à pessoa do impetrante, constantes de registros ou bancos de dados de entidades governamentais ou de caráter público, e para a retificação de dados.","c":"Art. 5º, LXXII, alíneas “a” e “b”. A LGPD (art. 23, § 3º) remete à Lei do Habeas Data (Lei nº 9.507/1997) os prazos e procedimentos perante o Poder Público.","ap":-1,"v":0},{"id":"cf-09","b":"constitucional","g":"E","l":"cf","art":null,"r":"CF/88, art. 5º, LXXII","t":[],"a":"sujeito","d":2,"e":"O habeas data é a ação adequada para obter informações pessoais de terceiros constantes de bancos de dados públicos.","c":"O habeas data protege informações relativas à pessoa do impetrante. Para informações de terceiros, o caminho é outro (por exemplo, a Lei de Acesso à Informação, com as restrições de dados pessoais).","ap":-1,"v":0},{"id":"cf-10","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 5º, XII","t":[],"a":"excecao","d":2,"e":"A Constituição declara inviolável o sigilo da correspondência e das comunicações telegráficas, de dados e das comunicações telefônicas, admitindo, no último caso, a quebra por ordem judicial, nas hipóteses e na forma que a lei estabelecer, para fins de investigação criminal ou instrução processual penal.","c":"Art. 5º, XII. A ressalva expressa (ordem judicial) refere-se às comunicações telefônicas.","ap":-1,"v":0},{"id":"cf-11","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 52, III, f","t":[],"a":"sujeito","d":2,"e":"A aprovação prévia, pelo Senado Federal, dos membros do Conselho Diretor da ANPD tem fundamento na competência privativa do Senado para aprovar a escolha de titulares de outros cargos que a lei determinar.","c":"Art. 52, III, “f”, da Constituição, citado expressamente no art. 55-D, § 1º, da LGPD.","ap":-1,"v":0},{"id":"cf-12","b":"constitucional","g":"E","l":"cf","art":null,"r":"CF/88, art. 5º, X","t":[],"a":"extrapolacao","d":1,"e":"A Constituição declara invioláveis a intimidade, a vida privada, a honra e a imagem das pessoas, mas não assegura indenização por dano moral decorrente de sua violação.","c":"O art. 5º, X, assegura o direito a indenização pelo dano material ou moral decorrente da violação.","ap":-1,"v":0},{"id":"cf-13","b":"constitucional","g":"C","l":"cf","art":null,"r":"CF/88, art. 60, § 4º, IV","t":[],"a":"conceito","d":2,"e":"Por integrar o rol dos direitos e garantias individuais, o direito à proteção de dados pessoais não pode ser objeto de proposta de emenda constitucional tendente a aboli-lo.","c":"Art. 60, § 4º, IV: não será objeto de deliberação a proposta de emenda tendente a abolir os direitos e garantias individuais. O inciso LXXIX está no art. 5º.","ap":-1,"v":0},{"id":"eca-01","b":"eca-digital","g":"C","l":"lei15211","art":null,"r":"ECA Digital (Lei 15.211/2025)","t":[],"a":"literal","d":1,"e":"O ECA Digital exige que os fornecedores de produtos e serviços digitais direcionados a crianças e adolescentes, ou de acesso provável por eles, adotem mecanismos confiáveis de verificação de idade, vedada a autodeclaração.","c":"A vedação da autodeclaração é o ponto mais citado da lei. As fontes citam meios como documento oficial, cartão de pagamento e reconhecimento facial.","ap":-1,"p":["Mecanismos de verificação etária aceitos no ECA Digital"],"v":0},{"id":"eca-02","b":"eca-digital","g":"E","l":"lei15211","art":null,"r":"ECA Digital (Lei 15.211/2025)","t":[],"a":"extrapolacao","d":1,"e":"Para o ECA Digital, a autodeclaração de idade pelo usuário é meio suficiente de verificação etária, desde que acompanhada de termo de responsabilidade aceito pelo usuário.","c":"A lei veda a autodeclaração como mecanismo de verificação de idade, com ou sem termo de responsabilidade.","ap":-1,"v":0},{"id":"eca-03","b":"eca-digital","g":"C","l":"lei15211","art":null,"r":"ECA Digital (Lei 15.211/2025)","t":[],"a":"conceito","d":2,"e":"O ECA Digital alcança não apenas serviços direcionados a crianças e adolescentes, mas também aqueles de acesso provável por esse público.","c":"O critério de acesso provável amplia o alcance da lei para além dos produtos feitos para o público infantil, como redes sociais e jogos de uso geral.","ap":-1,"p":["Conceito de acesso provável no ECA Digital"],"v":0},{"id":"eca-04","b":"eca-digital","g":"C","l":"lei15211","art":null,"r":"ECA Digital (Lei 15.211/2025)","t":[],"a":"literal","d":2,"e":"Segundo o ECA Digital, contas de crianças e de adolescentes de até 16 anos de idade devem estar vinculadas à conta de um de seus responsáveis legais.","c":"A vinculação a responsável até os 16 anos é uma das regras centrais de supervisão parental. Confira no texto o alcance exato (tipos de provedor abrangidos).","ap":-1,"v":0},{"id":"eca-05","b":"eca-digital","g":"E","l":"lei15211","art":null,"r":"ECA Digital (Lei 15.211/2025)","t":[],"a":"numero","d":2,"e":"A vinculação obrigatória da conta do usuário à conta de responsável legal, prevista no ECA Digital, limita-se às crianças de até 12 anos de idade.","c":"O marco etário da vinculação é de até 16 anos, alcançando também parte dos adolescentes. Doze anos é o limite entre criança e adolescente no ECA (Lei nº 8.069/1990).","ap":-1,"v":0},{"id":"eca-06","b":"eca-digital","g":"C","l":"lei15211","art":null,"r":"ECA Digital (Lei 15.211/2025)","t":[],"a":"literal","d":1,"e":"O ECA Digital proíbe as caixas de recompensa, conhecidas como loot boxes, em jogos eletrônicos direcionados a crianças e adolescentes ou de acesso provável por eles.","c":"A vedação das loot boxes foi uma das mudanças de maior impacto para o mercado de jogos.","ap":-1,"v":0},{"id":"eca-07","b":"eca-digital","g":"E","l":"lei15211","art":null,"r":"ECA Digital (Lei 15.211/2025)","t":[],"a":"extrapolacao","d":2,"e":"As caixas de recompensa em jogos eletrônicos de acesso provável por crianças são permitidas pelo ECA Digital, desde que haja consentimento específico de um dos pais ou responsável.","c":"O ECA Digital proíbe as loot boxes nesses jogos. O consentimento parental não afasta a vedação.","ap":-1,"v":0},{"id":"eca-08","b":"eca-digital","g":"C","l":"lei15211","art":null,"r":"ECA Digital (Lei 15.211/2025)","t":[],"a":"literal","d":2,"e":"O ECA Digital veda o uso de técnicas de perfilamento para o direcionamento de publicidade comercial a crianças e adolescentes.","c":"A vedação alcança o perfilamento e o uso de tecnologias como análise emocional e realidade aumentada ou virtual para esse fim.","ap":-1,"p":["Publicidade infantil: Resolução Conanda 163/2014 e ECA Digital"],"v":0},{"id":"eca-09","b":"eca-digital","g":"C","l":"lei15211","art":null,"r":"ECA Digital (Lei 15.211/2025)","t":[],"a":"comparacao","d":2,"e":"A multa simples prevista no ECA Digital pode chegar a 10% do faturamento do grupo econômico no Brasil, percentual superior ao teto de 2% previsto para a multa simples da LGPD.","c":"As fontes indicam multa de até 10% do faturamento no Brasil, com limite de R$ 50 milhões por infração, além de advertência, suspensão temporária e proibição de atividades.","ap":-1,"p":["Sanções do ECA Digital × sanções da LGPD"],"v":0},{"id":"eca-10","b":"eca-digital","g":"C","l":"lei15211","art":null,"r":"ECA Digital (Lei 15.211/2025)","t":[],"a":"numero","d":2,"e":"Provedores com mais de um milhão de usuários crianças e adolescentes no Brasil devem publicar relatórios semestrais de transparência, em língua portuguesa.","c":"Os relatórios tratam de canais de denúncia, moderação de conteúdo e de contas, denúncias recebidas e medidas de proteção. O primeiro cobriu o primeiro semestre de 2026.","ap":-1,"v":0},{"id":"eca-11","b":"eca-digital","g":"E","l":"lei15211","art":null,"r":"ECA Digital (Lei 15.211/2025)","t":[],"a":"numero","d":2,"e":"Pelo ECA Digital, apenas provedores com mais de dez milhões de usuários menores de idade estão obrigados a publicar relatórios de transparência, com periodicidade anual.","c":"O corte é de um milhão de usuários crianças e adolescentes, e a periodicidade é semestral.","ap":-1,"v":0},{"id":"eca-12","b":"eca-digital","g":"C","l":"dec12622","art":null,"r":"Decreto 12.622/2025","t":[],"a":"sujeito","d":1,"e":"O Decreto nº 12.622/2025 designou a ANPD como autoridade administrativa autônoma de proteção dos direitos de crianças e adolescentes no ambiente digital, para os fins do ECA Digital.","c":"O decreto regulamentou o § 6º do art. 35 da Lei nº 15.211/2025. Depois, a Lei nº 15.352/2026 transformou a ANPD em agência reguladora e consolidou essas atribuições.","ap":-1,"v":0},{"id":"eca-13","b":"eca-digital","g":"E","l":"dec12622","art":null,"r":"Decreto 12.622/2025","t":[],"a":"sujeito","d":1,"e":"A fiscalização administrativa do ECA Digital foi atribuída ao Conselho Nacional dos Direitos da Criança e do Adolescente (Conanda), cabendo à ANPD apenas a proteção de dados pessoais de crianças.","c":"A autoridade administrativa autônoma do ECA Digital é a ANPD (Decreto nº 12.622/2025). O Conanda segue com suas atribuições próprias de política pública.","ap":-1,"v":0},{"id":"eca-14","b":"eca-digital","g":"C","l":"dec12622","art":null,"r":"Decreto 12.622/2025","t":[],"a":"literal","d":3,"e":"Segundo o Decreto nº 12.622/2025, as sanções de suspensão temporária e de proibição de atividades previstas no ECA Digital, quando não cumpridas diretamente pelo infrator, serão efetivadas por meio de ordens de bloqueio.","c":"O decreto também definiu competências para o recebimento das ordens judiciais de bloqueio.","ap":-1,"v":0},{"id":"eca-15","b":"eca-digital","g":"C","l":"lei15352","art":null,"r":"Lei 15.352/2026","t":[],"a":"literal","d":2,"e":"O ECA Digital entrou em vigor em 17 de março de 2026.","c":"A vigência foi fixada pela Lei nº 15.352/2026, a mesma que transformou a ANPD em Agência Nacional de Proteção de Dados.","ap":-1,"p":["Histórico da vigência do ECA Digital (MP e Lei 15.352/2026)"],"v":0},{"id":"ec2-01","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · falhas de mercado","t":[],"a":"conceito","d":2,"e":"No mercado de “limões” descrito por Akerlof, a assimetria de informação sobre a qualidade dos bens pode levar à seleção adversa e à retirada dos bens de boa qualidade do mercado.","c":"Exemplo clássico com carros usados. Selos, certificados e garantias são respostas de mercado; a regulação de transparência é resposta estatal.","ap":-1},{"id":"ec2-02","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · falhas de mercado","t":[],"a":"conceito","d":2,"e":"O monopólio natural caracteriza-se por custos médios crescentes, que tornam mais eficiente a divisão do mercado entre muitas firmas.","c":"No monopólio natural, uma única firma atende a demanda a custo menor que várias (subaditividade de custos), em geral por economias de escala, como em redes de distribuição.","ap":-1},{"id":"ec2-03","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · teoria da agência","t":[],"a":"conceito","d":2,"e":"O problema principal-agente surge quando o agente, que age em nome do principal, tem interesses próprios e informações que o principal não observa plenamente.","c":"Aplica-se à relação entre regulador e regulado, entre sociedade e regulador e entre controlador e operador de dados.","ap":-1},{"id":"ec2-04","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · captura","t":[],"a":"conceito","d":2,"e":"Na teoria econômica da regulação associada a George Stigler, a regulação tende a ser demandada pela indústria e desenhada principalmente em seu benefício.","c":"Artigo de 1971 (The Theory of Economic Regulation), base da teoria da captura.","ap":-1},{"id":"ec2-05","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · elasticidade","t":[],"a":"conceito","d":1,"e":"A demanda é inelástica ao preço quando a variação percentual da quantidade demandada é maior que a variação percentual do preço.","c":"Isso é demanda elástica (elasticidade, em módulo, maior que 1). Na inelástica, a quantidade reage menos que proporcionalmente ao preço.","ap":-1},{"id":"ec2-06","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · mercados digitais","t":[],"a":"conceito","d":2,"e":"Em plataformas de múltiplos lados, é comum que um dos lados receba o serviço a preço zero, financiado pelo outro lado, como ocorre quando usuários usam redes sociais gratuitas e anunciantes pagam pela atenção e pelos dados.","c":"Base do debate sobre dados como contraprestação e sobre poder de mercado de plataformas.","ap":-1,"p":["Mercados de dois lados e preço zero"]},{"id":"ec2-07","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · estatística","t":[],"a":"conceito","d":3,"e":"Um intervalo de confiança de 95% significa que há 95% de probabilidade de o parâmetro populacional estar dentro do intervalo específico calculado com a amostra observada.","c":"Na interpretação frequentista, 95% dos intervalos construídos pelo mesmo método, em amostras repetidas, conteriam o parâmetro. Para um intervalo já calculado, o parâmetro está ou não está nele.","ap":-1},{"id":"ec2-08","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · estatística","t":[],"a":"conceito","d":2,"e":"Na amostragem estratificada, a população é dividida em estratos internamente homogêneos e sorteiam-se elementos de cada estrato.","c":"Reduz a variância das estimativas quando os estratos são bem definidos. Não confunda com amostragem por conglomerados, em que se sorteiam grupos inteiros.","ap":-1},{"id":"ec2-09","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · estatística","t":[],"a":"conceito","d":2,"e":"Em distribuição com assimetria positiva, isto é, com cauda longa à direita, a média tende a ser maior que a mediana.","c":"Valores extremos altos puxam a média. Exemplo típico: distribuição de renda.","ap":-1},{"id":"ec2-10","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · estatística","t":[],"a":"conceito","d":2,"e":"O erro do tipo II consiste em rejeitar a hipótese nula quando ela é verdadeira.","c":"Isso é o erro do tipo I (probabilidade alfa). O tipo II é não rejeitar a hipótese nula falsa (probabilidade beta); o poder do teste é 1 − beta.","ap":-1},{"id":"ec2-11","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · estatística","t":[],"a":"conceito","d":1,"e":"O coeficiente de correlação de Pearson varia entre −1 e 1 e mede o grau de associação linear entre duas variáveis.","c":"Correlação zero não significa ausência de relação: pode haver relação não linear.","ap":-1},{"id":"ec2-12","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · análise de impacto","t":[],"a":"conceito","d":2,"e":"Na análise de impacto regulatório, a comparação entre alternativas inclui a opção de não agir, que serve de linha de base para avaliar custos e benefícios das demais.","c":"O Decreto nº 10.411/2020 exige que a AIR considere alternativas, inclusive a de não ação, quando for o caso.","ap":-1},{"id":"eco-01","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · externalidades","t":[],"a":"conceito","d":1,"e":"Externalidade negativa ocorre quando a atividade de um agente impõe custos a terceiros que não são refletidos no preço de mercado.","c":"Um vazamento de dados é exemplo: o custo recai sobre os titulares, não sobre quem deixou de investir em segurança. Multas e responsabilidade civil buscam internalizar esse custo.","ap":-1},{"id":"eco-02","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · bens públicos","t":[],"a":"conceito","d":1,"e":"Bens públicos puros caracterizam-se pela não rivalidade no consumo e pela não exclusividade.","c":"Não rival: o uso de um não reduz o do outro. Não excludente: não dá para impedir quem não paga. Exemplo: defesa nacional.","ap":-1},{"id":"eco-03","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · bens públicos","t":[],"a":"conceito","d":1,"e":"Bens públicos puros são rivais no consumo e excludentes, razão pela qual o mercado tende a ofertá-los em quantidade ótima.","c":"É o contrário: bens públicos são não rivais e não excludentes, e por isso o mercado tende a ofertá-los abaixo do ótimo (problema do carona).","ap":-1},{"id":"eco-04","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · assimetria de informação","t":[],"a":"conceito","d":2,"e":"A seleção adversa decorre de informação oculta antes da celebração do contrato, ao passo que o risco moral decorre de ação oculta após a celebração do contrato.","c":"Seleção adversa é ex ante; risco moral é ex post. Ambos são consequências da assimetria de informação.","ap":-1},{"id":"eco-05","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · assimetria de informação","t":[],"a":"conceito","d":2,"e":"A seleção adversa ocorre após a celebração do contrato, quando uma das partes muda seu comportamento por estar protegida contra riscos.","c":"Mudança de comportamento depois do contrato é risco moral. Seleção adversa acontece antes.","ap":-1},{"id":"eco-06","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · estatística descritiva","t":[],"a":"conceito","d":1,"e":"A mediana é medida de tendência central menos sensível a valores extremos do que a média aritmética.","c":"Por isso a mediana é preferida para variáveis assimétricas, como renda ou valor de multas aplicadas.","ap":-1},{"id":"eco-07","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · testes de hipótese","t":[],"a":"conceito","d":2,"e":"O erro do tipo I consiste em não rejeitar a hipótese nula quando ela é falsa.","c":"Isso é o erro do tipo II. O erro do tipo I é rejeitar a hipótese nula verdadeira, e sua probabilidade máxima é o nível de significância.","ap":-1},{"id":"eco-08","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · testes de hipótese","t":[],"a":"conceito","d":2,"e":"O valor-p é a probabilidade de se obter resultado tão ou mais extremo que o observado, supondo verdadeira a hipótese nula.","c":"Valor-p pequeno indica que o resultado seria improvável se a hipótese nula fosse verdadeira. Ele não é a probabilidade de a hipótese nula ser verdadeira.","ap":-1},{"id":"eco-09","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · correlação","t":[],"a":"conceito","d":1,"e":"A existência de forte correlação entre duas variáveis demonstra que uma é causa da outra.","c":"Correlação não implica causalidade: pode haver variável omitida, causalidade reversa ou coincidência.","ap":-1},{"id":"eco-10","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · estatística descritiva","t":[],"a":"conceito","d":2,"e":"O desvio padrão é a média dos quadrados dos desvios em relação à média.","c":"Essa é a variância (populacional). O desvio padrão é a raiz quadrada da variância e tem a mesma unidade dos dados.","ap":-1},{"id":"eco-11","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · análise custo-benefício","t":[],"a":"conceito","d":2,"e":"Em análise custo-benefício, valor presente líquido positivo indica que os benefícios descontados superam os custos descontados.","c":"É um dos métodos previstos para comparar alternativas na análise de impacto regulatório (Decreto nº 10.411/2020).","ap":-1},{"id":"eco-12","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · mercados digitais","t":[],"a":"conceito","d":2,"e":"Efeitos de rede e economias de escala tendem a favorecer a concentração em mercados digitais, e a portabilidade de dados pode reduzir os custos de troca do consumidor.","c":"A portabilidade da LGPD (art. 18, V) tem também função concorrencial: dificulta o aprisionamento (lock-in) do usuário.","ap":-1},{"id":"eco-13","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · avaliação de impacto","t":[],"a":"conceito","d":3,"e":"O método de diferenças em diferenças estima o efeito de uma intervenção comparando a variação no tempo do grupo tratado com a variação do grupo de controle, sob a hipótese de tendências paralelas.","c":"Sem a hipótese de tendências paralelas, a diferença observada pode refletir trajetórias que já eram diferentes antes da intervenção.","ap":-1},{"id":"eco-14","b":"economia","g":"C","l":"doutrina","art":null,"r":"Doutrina · avaliação de impacto","t":[],"a":"conceito","d":2,"e":"Em experimentos aleatorizados, a atribuição aleatória ao grupo de tratamento tende a eliminar o viés de seleção, tornando os grupos comparáveis em média.","c":"É por isso que o experimento aleatorizado é considerado o padrão-ouro em avaliação de impacto.","ap":-1},{"id":"pa2-01","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 1º","t":[],"a":"sujeito","d":2,"e":"Por ser lei nacional, a Lei nº 9.784/1999 aplica-se diretamente aos processos administrativos de Estados e Municípios, independentemente da existência de lei local.","c":"A Lei nº 9.784/1999 regula o processo administrativo no âmbito da administração pública federal. A aplicação a estados e municípios é subsidiária, na falta de norma local (Súmula 633 do STJ).","ap":-1,"v":0},{"id":"pa2-02","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 11","t":[],"a":"conceito","d":1,"e":"A competência administrativa pode ser renunciada pelo órgão a que foi atribuída quando houver conveniência administrativa devidamente motivada.","c":"A competência é irrenunciável (art. 11). O que a lei admite é a delegação e a avocação, nos casos legais.","ap":-1,"v":0},{"id":"pa2-03","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 15","t":[],"a":"conceito","d":2,"e":"A avocação de competência pode ser feita em caráter permanente e independe de relação hierárquica entre os órgãos envolvidos.","c":"A avocação é temporária, excepcional, motivada e recai sobre competência de órgão hierarquicamente inferior (art. 15). A delegação é que independe de hierarquia.","ap":-1,"v":0},{"id":"pa2-04","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 5º","t":[],"a":"conceito","d":1,"e":"O processo administrativo federal somente pode iniciar-se a pedido do interessado, em respeito ao princípio da inércia.","c":"O processo pode iniciar-se de ofício ou a pedido de interessado (art. 5º). Inércia é princípio da jurisdição; no processo administrativo vale a oficialidade.","ap":-1,"v":0},{"id":"pa2-05","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 31","t":[],"a":"conceito","d":2,"e":"Quem comparece à consulta pública adquire, por esse simples fato, a condição de interessado no processo administrativo, com direito de recorrer da decisão final.","c":"O comparecimento não confere, por si, a condição de interessado, mas dá direito a resposta fundamentada, que pode ser comum a alegações iguais (art. 31, § 2º).","ap":-1,"v":0},{"id":"pa2-06","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 62","t":[],"a":"numero","d":3,"e":"Interposto o recurso administrativo, o órgão competente intimará os demais interessados para que, no prazo de dez dias úteis, apresentem alegações.","c":"O prazo do art. 62 é de cinco dias úteis. Dez dias é o prazo para interpor o recurso (art. 59).","ap":-1,"v":0},{"id":"pa2-07","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 51","t":[],"a":"excecao","d":2,"e":"A desistência do interessado extingue necessariamente o processo administrativo, ainda que a Administração considere que o interesse público exige seu prosseguimento.","c":"A desistência ou renúncia não prejudica o prosseguimento do processo se a Administração considerar que o interesse público assim o exige (art. 51, § 2º).","ap":-1,"v":0},{"id":"pa2-08","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 66","t":[],"a":"numero","d":2,"e":"Na Lei nº 9.784/1999, os prazos expressos em dias são contados apenas em dias úteis, por aplicação subsidiária do Código de Processo Civil.","c":"Os prazos em dias contam-se de modo contínuo (art. 66, § 2º). A regra dos dias úteis do CPC não se aplica, havendo norma própria.","ap":-1,"v":0},{"id":"pa2-09","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 55","t":[],"a":"excecao","d":2,"e":"Atos com defeitos sanáveis podem ser convalidados pela Administração ainda que a convalidação cause prejuízo a terceiros, desde que preservado o interesse público.","c":"A convalidação exige que não haja lesão ao interesse público nem prejuízo a terceiros (art. 55). As duas condições são cumulativas.","ap":-1,"v":0},{"id":"pa2-10","b":"lei-9784","g":"E","l":"lei9784","art":null,"r":"Lei 9.784/1999, art. 42","t":[],"a":"numero","d":2,"e":"Salvo norma especial, o parecer obrigatório deve ser emitido no prazo máximo de trinta dias.","c":"O prazo do art. 42 é de quinze dias, salvo norma especial ou comprovada necessidade de maior prazo.","ap":-1,"v":0},{"id":"ag2-01","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 6º","t":[],"a":"conceito","d":2,"e":"O relatório de Análise de Impacto Regulatório vincula o colegiado da agência, que deve adotar obrigatoriamente a alternativa nele recomendada.","c":"A AIR subsidia a decisão. O colegiado se manifesta sobre a adequação da proposta aos objetivos pretendidos, mas não está vinculado à recomendação.","ap":-1,"v":0},{"id":"ag2-02","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 8º","t":[],"a":"conceito","d":1,"e":"As reuniões deliberativas do colegiado das agências reguladoras são, em regra, reservadas, admitindo-se a presença do público apenas por convite.","c":"A regra é a publicidade: reuniões públicas e gravadas em meio eletrônico (art. 8º), com exceções legais.","ap":-1,"v":0},{"id":"ag2-03","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 14","t":[],"a":"sujeito","d":2,"e":"O controle externo das agências reguladoras é exercido pelo ministério supervisor, com auxílio da Controladoria-Geral da União.","c":"O controle externo é do Congresso Nacional, com auxílio do TCU (art. 14). O ministério exerce supervisão; a CGU, controle interno.","ap":-1,"v":0},{"id":"ag2-04","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 17","t":[],"a":"numero","d":2,"e":"O plano estratégico das agências reguladoras é elaborado anualmente e substitui o plano de gestão.","c":"O plano estratégico é quadrienal (art. 17); o plano de gestão é anual (art. 18) e alinhado ao estratégico.","ap":-1,"v":0},{"id":"ag2-05","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 21","t":[],"a":"conceito","d":2,"e":"A agenda regulatória é o instrumento de planejamento da atividade fiscalizatória da agência, com a lista dos agentes que serão inspecionados no período.","c":"A agenda regulatória planeja a atividade normativa (temas a regulamentar). A ANPD planeja a fiscalização em outro instrumento, o mapa de temas prioritários.","ap":-1,"v":0},{"id":"ag2-06","b":"lei-13848","g":"E","l":"lei13848","art":null,"r":"Lei 13.848/2019, art. 22","t":[],"a":"conceito","d":1,"e":"O ouvidor da agência reguladora é subordinado ao diretor-presidente, a quem deve submeter previamente seus relatórios.","c":"O ouvidor atua sem subordinação hierárquica e sem acumulação com outras funções (art. 22).","ap":-1,"v":0},{"id":"ag2-07","b":"lei-13848","g":"E","l":"lei9986","art":null,"r":"Lei 9.986/2000, art. 6º","t":[],"a":"numero","d":1,"e":"Na Lei nº 9.986/2000, com a redação vigente, o mandato dos dirigentes das agências reguladoras é de quatro anos, permitida uma recondução.","c":"É de cinco anos, vedada a recondução. Para a ANPD, a LGPD mantém regra própria de quatro anos (art. 55-D, § 3º).","ap":-1,"v":0},{"id":"adm2-01","b":"administrativo","g":"E","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 26","t":[],"a":"literal","d":2,"e":"O compromisso celebrado com base no art. 26 da LINDB produz efeitos a partir de sua assinatura, independentemente de publicação oficial.","c":"O compromisso só produz efeitos a partir de sua publicação oficial (art. 26 da LINDB).","ap":-1,"v":0},{"id":"adm2-02","b":"administrativo","g":"E","l":"doutrina","art":null,"r":"Doutrina · autarquia","t":[],"a":"conceito","d":1,"e":"Por ter autonomia financeira, a ANPD é pessoa jurídica de direito privado integrante da administração indireta.","c":"Autarquia, inclusive de regime especial, é pessoa jurídica de direito público. Autonomia financeira não muda a natureza jurídica.","ap":-1},{"id":"adm2-03","b":"administrativo","g":"E","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 29","t":[],"a":"absoluto","d":2,"e":"A LINDB torna obrigatória a consulta pública prévia para todos os atos normativos de qualquer órgão, inclusive os de mera organização interna.","c":"O art. 29 diz que a edição de atos normativos “poderá” ser precedida de consulta pública e exclui os de mera organização interna. Para a ANPD, a obrigatoriedade vem de norma especial.","ap":-1,"v":0},{"id":"adm2-04","b":"administrativo","g":"E","l":"doutrina","art":null,"r":"Doutrina · ato administrativo","t":[],"a":"conceito","d":2,"e":"A teoria dos motivos determinantes aplica-se apenas aos atos vinculados, pois nos atos discricionários a Administração não fica presa aos motivos que declarou.","c":"A teoria se aplica a atos vinculados e discricionários: declarado o motivo, o ato fica vinculado a ele, ainda que a motivação fosse dispensável.","ap":-1},{"id":"adm2-05","b":"administrativo","g":"E","l":"lindb","art":null,"r":"LINDB (Decreto-Lei 4.657/1942), art. 22","t":[],"a":"conceito","d":2,"e":"Na interpretação de normas sobre gestão pública, a LINDB determina que sejam desconsideradas as dificuldades reais enfrentadas pelo gestor, para assegurar a aplicação uniforme da lei.","c":"O art. 22 manda considerar os obstáculos e as dificuldades reais do gestor e as exigências das políticas públicas a seu cargo.","ap":-1,"v":0},{"id":"ec3-01","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · falhas de mercado","t":[],"a":"conceito","d":1,"e":"Bem público, na teoria econômica, é aquele produzido ou fornecido pelo Estado.","c":"Bem público é definido pelas características de não rivalidade e não exclusão, não por quem o produz. O Estado fornece bens privados, e o mercado pode fornecer bens públicos.","ap":-1},{"id":"ec3-02","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · falhas de mercado","t":[],"a":"conceito","d":2,"e":"Na presença de externalidade positiva, o mercado tende a produzir quantidade acima da socialmente ótima.","c":"Com externalidade positiva, o benefício social excede o privado e o mercado produz abaixo do ótimo. Superprodução ocorre com externalidade negativa.","ap":-1},{"id":"ec3-03","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · estatística","t":[],"a":"conceito","d":2,"e":"Se o coeficiente de correlação de Pearson entre duas variáveis é igual a zero, as variáveis são necessariamente independentes.","c":"Correlação zero indica ausência de relação linear. Pode haver forte relação não linear, como uma relação quadrática.","ap":-1},{"id":"ec3-04","b":"economia","g":"E","l":"doutrina","art":null,"r":"Doutrina · análise de impacto","t":[],"a":"conceito","d":2,"e":"Na decisão sobre continuar ou não um projeto, os custos afundados devem ser somados aos custos futuros, pois representam recursos já comprometidos.","c":"Custos afundados são irrecuperáveis e não devem influenciar decisões futuras; considerá-los é a falácia do custo afundado.","ap":-1},{"id":"gd2-01","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 5º","t":[],"a":"rol","d":2,"e":"Entre os princípios do art. 5º do GDPR estão a minimização dos dados, a limitação da conservação e a responsabilidade, pela qual o responsável pelo tratamento deve ser capaz de comprovar o cumprimento dos demais princípios.","c":"Art. 5º do GDPR: licitude, lealdade e transparência; limitação das finalidades; minimização; exatidão; limitação da conservação; integridade e confidencialidade; responsabilidade (accountability).","ap":-1,"v":0},{"id":"gd2-02","b":"gdpr","g":"E","l":"gdpr","art":null,"r":"GDPR, art. 5º","t":[],"a":"comparacao","d":3,"e":"A limitação da conservação, princípio expresso do GDPR, também figura nominalmente no rol de princípios do art. 6º da LGPD.","c":"O art. 6º da LGPD não nomeia esse princípio. A lógica aparece nas regras de término e eliminação (arts. 15 e 16) e no princípio da necessidade.","ap":-1,"v":0},{"id":"gd2-03","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 20","t":[],"a":"conceito","d":2,"e":"No GDPR, o direito à portabilidade aplica-se quando o tratamento se basear no consentimento ou em contrato e for realizado por meios automatizados.","c":"Art. 20 do GDPR. Compare com a cópia eletrônica integral da LGPD (art. 19, § 3º), também ligada a consentimento ou contrato.","ap":-1,"v":0},{"id":"gd2-04","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 9º","t":[],"a":"conceito","d":2,"e":"O GDPR proíbe, como regra, o tratamento de categorias especiais de dados, como os relativos à saúde e à origem racial ou étnica, mas admite exceções expressas, como o consentimento explícito do titular.","c":"Art. 9º do GDPR. A LGPD adota estrutura parecida no art. 11, com rol de hipóteses.","ap":-1,"v":0},{"id":"gd2-05","b":"gdpr","g":"E","l":"gdpr","art":null,"r":"GDPR, art. 56","t":[],"a":"conceito","d":3,"e":"No mecanismo de balcão único do GDPR, cada autoridade nacional decide isoladamente os casos transfronteiriços que lhe são apresentados, sem cooperação com as demais.","c":"No balcão único, a autoridade do estabelecimento principal atua como autoridade de controlo principal, em cooperação com as autoridades interessadas (arts. 56 e 60) e sob o mecanismo de coerência (art. 63).","ap":-1,"p":["One-stop-shop do GDPR e autoridade de controlo principal"],"v":0},{"id":"gd2-06","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 27","t":[],"a":"conceito","d":3,"e":"O responsável pelo tratamento não estabelecido na União, mas sujeito ao GDPR por oferecer bens ou serviços a pessoas na União, deve, em regra, designar por escrito um representante na União.","c":"Art. 27 do GDPR, com exceções para tratamento ocasional e de baixo risco e para autoridades públicas.","ap":-1,"v":0},{"id":"gd2-07","b":"gdpr","g":"C","l":"gdpr","art":null,"r":"GDPR, art. 83","t":[],"a":"numero","d":2,"e":"No GDPR, determinadas infrações estão sujeitas a coimas de até 10 milhões de euros ou, no caso de empresa, até 2% do volume de negócios anual a nível mundial do exercício anterior, consoante o montante mais elevado.","c":"Art. 83, n.º 4. As infrações mais graves chegam a 20 milhões de euros ou 4% (n.º 5). Na LGPD, 2% do faturamento no Brasil, limitado a R$ 50 milhões por infração.","ap":-1,"v":0},{"id":"gd2-08","b":"gdpr","g":"C","l":"tjue","art":null,"r":"TJUE · C-362/14 (Schrems I)","t":[],"a":"conceito","d":2,"e":"O Tribunal de Justiça da União Europeia invalidou o Safe Harbor em 2015, no caso Schrems I, e o Privacy Shield em 2020, no caso Schrems II.","c":"Depois de Schrems II, a Comissão Europeia adotou, em julho de 2023, decisão de adequação para o EU-US Data Privacy Framework.","ap":-1,"p":["EU-US Data Privacy Framework (2023)"],"v":0},{"id":"gd2-09","b":"gdpr","g":"E","l":"tjue","art":null,"r":"TJUE · C-311/18 (Schrems II)","t":[],"a":"conceito","d":3,"e":"Após o caso Schrems II, as cláusulas contratuais-padrão passaram a dispensar qualquer avaliação do exportador sobre a legislação do país de destino.","c":"Ao contrário: o TJUE manteve as cláusulas-padrão, mas exigiu verificar, caso a caso, se o país de destino assegura proteção essencialmente equivalente, com medidas suplementares quando preciso.","ap":-1,"p":["Avaliação de impacto da transferência (TIA) ap
