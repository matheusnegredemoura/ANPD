","ap":-1},{"id":"lgpd-65-03","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"65","r":"LGPD, art. 65, II","t":["24 (vinte e quatro) meses após a data de sua publicação, quanto aos demais artigos"],"a":"numero","d":2,"e":"Excetuados os dispositivos sobre a ANPD, o CNPD e as sanções, os demais artigos da LGPD entraram em vigor 24 meses após a data de sua publicação.","c":"Art. 65, II. Resumo das três vigências: ANPD e CNPD em 28/12/2018; sanções em 1º/8/2021; o restante 24 meses após a publicação.","ap":-1},{"id":"lgpd-63-01","b":"lgpd-1-4-14","g":"C","l":"lgpd","art":"63","r":"LGPD, art. 63","t":["A autoridade nacional estabelecerá normas sobre a adequação progressiva de bancos de dados constituídos até a data de entrada em vigor desta Lei"],"a":"literal","d":2,"e":"A autoridade nacional estabelecerá normas sobre a adequação progressiva dos bancos de dados constituídos até a entrada em vigor da LGPD, consideradas a complexidade das operações e a natureza dos dados.","c":"Art. 63. Regra de transição para os bancos de dados que já existiam antes da lei.","ap":-1},{"id":"lgpd-12-01","b":"lgpd-12-16","g":"C","l":"lgpd","art":"12","r":"LGPD, art. 12","t":["Os dados anonimizados não serão considerados dados pessoais para os fins desta Lei, salvo quando o processo de anonimização ao qual foram submetidos for revertido, utilizando exclusivamente meios próprios, ou quando, com esforços razoáveis, puder ser revertido"],"a":"excecao","d":2,"e":"Dados anonimizados não são considerados dados pessoais para os fins da LGPD, salvo quando o processo de anonimização for revertido com meios próprios ou puder ser revertido com esforços razoáveis.","c":"Caput do art. 12. A regra tem duas exceções; a segunda (reversível com esforços razoáveis) é a que pega a maior parte dos casos práticos de anonimização mal feita.","ap":-1},{"id":"lgpd-12-02","b":"lgpd-12-16","g":"E","l":"lgpd","art":"12","r":"LGPD, art. 12","t":["salvo quando o processo de anonimização ao qual foram submetidos for revertido"],"a":"absoluto","d":1,"e":"Uma vez anonimizados, os dados nunca mais são considerados dados pessoais para os fins da LGPD.","c":"O art. 12 ressalva a reversão efetiva e a reversibilidade com esforços razoáveis. “Nunca” torna o item errado.","ap":-1},{"id":"lgpd-12-03","b":"lgpd-12-16","g":"C","l":"lgpd","art":"12","r":"LGPD, art. 12, § 1º","t":["tais como custo e tempo necessários para reverter o processo de anonimização, de acordo com as tecnologias disponíveis, e a utilização exclusiva de meios próprios"],"a":"literal","d":2,"e":"A determinação do que seja razoável para reverter a anonimização deve considerar fatores objetivos, como custo e tempo necessários, de acordo com as tecnologias disponíveis.","c":"Art. 12, § 1º. Como a tecnologia muda, um dado anonimizado hoje pode deixar de sê-lo amanhã, o que exige reavaliação periódica.","ap":-1},{"id":"lgpd-12-04","b":"lgpd-12-16","g":"C","l":"lgpd","art":"12","r":"LGPD, art. 12, § 2º","t":["Poderão ser igualmente considerados como dados pessoais, para os fins desta Lei, aqueles utilizados para formação do perfil comportamental de determinada pessoa natural, se identificada"],"a":"literal","d":2,"e":"Podem ser considerados dados pessoais, para os fins da LGPD, aqueles utilizados para formação do perfil comportamental de determinada pessoa natural, se identificada.","c":"Art. 12, § 2º. Dialoga com o art. 20 (decisões automatizadas que definem perfil).","ap":-1},{"id":"lgpd-12-05","b":"lgpd-12-16","g":"E","l":"lgpd","art":"12","r":"LGPD, art. 12, § 3º","t":["A autoridade nacional poderá dispor sobre padrões e técnicas utilizados em processos de anonimização e realizar verificações acerca de sua segurança, ouvido o Conselho Nacional de Proteção de Dados Pessoais"],"a":"sujeito","d":3,"e":"A autoridade nacional pode dispor sobre padrões e técnicas de anonimização e verificar sua segurança, ouvido o Comitê Gestor da Internet no Brasil.","c":"O § 3º do art. 12 manda ouvir o Conselho Nacional de Proteção de Dados Pessoais. Esse dispositivo está na Fase 1 da Agenda Regulatória 2025-2026 da ANPD.","ap":-1},{"id":"lgpd-13-01","b":"lgpd-12-16","g":"C","l":"lgpd","art":"13","r":"LGPD, art. 13","t":["que serão tratados exclusivamente dentro do órgão e estritamente para a finalidade de realização de estudos e pesquisas e mantidos em ambiente controlado e seguro"],"a":"literal","d":2,"e":"Em estudos em saúde pública, os órgãos de pesquisa podem acessar bases de dados pessoais, que devem ser tratados exclusivamente dentro do órgão, estritamente para os estudos, e mantidos em ambiente controlado e seguro.","c":"Caput do art. 13. As práticas de segurança devem incluir, sempre que possível, anonimização ou pseudonimização, e respeitar padrões éticos de pesquisa.","ap":-1},{"id":"lgpd-13-02","b":"lgpd-12-16","g":"E","l":"lgpd","art":"13","r":"LGPD, art. 13, § 2º","t":["não permitida, em circunstância alguma, a transferência dos dados a terceiro"],"a":"extrapolacao","d":2,"e":"O órgão de pesquisa que acessa bases de dados para estudos em saúde pública pode transferir os dados a terceiro, desde que mediante convênio e para a mesma finalidade.","c":"O § 2º do art. 13 proíbe a transferência a terceiro “em circunstância alguma”. O órgão de pesquisa é o responsável pela segurança.","ap":-1},{"id":"lgpd-13-03","b":"lgpd-12-16","g":"C","l":"lgpd","art":"13","r":"LGPD, art. 13, § 4º","t":["a pseudonimização é o tratamento por meio do qual um dado perde a possibilidade de associação, direta ou indireta, a um indivíduo, senão pelo uso de informação adicional mantida separadamente pelo controlador em ambiente controlado e seguro"],"a":"conceito","d":2,"e":"Pseudonimização é o tratamento pelo qual um dado perde a possibilidade de associação a um indivíduo, senão pelo uso de informação adicional mantida separadamente pelo controlador em ambiente controlado e seguro.","c":"Art. 13, § 4º. É a única definição de pseudonimização na lei e fica fora do art. 5º.","ap":-1},{"id":"lgpd-13-04","b":"lgpd-12-16","g":"E","l":"lgpd","art":"13","r":"LGPD, art. 13, § 4º","t":["senão pelo uso de informação adicional mantida separadamente pelo controlador"],"a":"conceito","d":3,"e":"Conforme a definição do art. 13, § 4º, da LGPD, o dado pseudonimizado não pode ser associado a um indivíduo nem mesmo com o uso de informação adicional mantida pelo controlador, razão pela qual equivale ao dado anonimizado.","c":"O dado pseudonimizado pode ser reassociado com a informação adicional guardada à parte. Por isso continua sendo dado pessoal, ao contrário do anonimizado (art. 12).","ap":-1},{"id":"lgpd-13-05","b":"lgpd-12-16","g":"E","l":"lgpd","art":"13","r":"LGPD, art. 13, § 1º","t":["em nenhuma hipótese poderá revelar dados pessoais"],"a":"excecao","d":2,"e":"A divulgação dos resultados de estudo em saúde pública pode revelar dados pessoais quando houver relevante interesse público e autorização do comitê de ética.","c":"O § 1º do art. 13 diz que a divulgação “em nenhuma hipótese poderá revelar dados pessoais”.","ap":-1},{"id":"lgpd-15-01","b":"lgpd-12-16","g":"C","l":"lgpd","art":"15","r":"LGPD, art. 15","t":["verificação de que a finalidade foi alcançada ou de que os dados deixaram de ser necessários ou pertinentes ao alcance da finalidade específica almejada","fim do período de tratamento","determinação da autoridade nacional, quando houver violação ao disposto nesta Lei"],"a":"rol","d":2,"e":"O término do tratamento ocorre, entre outras hipóteses, quando a finalidade é alcançada, com o fim do período de tratamento e por determinação da autoridade nacional quando houver violação à LGPD.","c":"Incisos I, II e IV do art. 15. O inciso III trata da comunicação do titular, inclusive revogação do consentimento, resguardado o interesse público.","ap":-1},{"id":"lgpd-15-02","b":"lgpd-12-16","g":"E","l":"lgpd","art":"15","r":"LGPD, art. 15, IV","t":["determinação da autoridade nacional, quando houver violação ao disposto nesta Lei"],"a":"excecao","d":2,"e":"A autoridade nacional pode determinar o término do tratamento de dados a qualquer tempo, por conveniência e oportunidade, independentemente de violação à LGPD.","c":"O art. 15, IV, condiciona a determinação da ANPD à existência de violação à lei.","ap":-1},{"id":"lgpd-15-03","b":"lgpd-12-16","g":"C","l":"lgpd","art":"15","r":"LGPD, art. 15, III","t":["comunicação do titular, inclusive no exercício de seu direito de revogação do consentimento conforme disposto no § 5º do art. 8º desta Lei, resguardado o interesse público"],"a":"excecao","d":3,"e":"A comunicação do titular, inclusive para revogar o consentimento, leva ao término do tratamento, resguardado o interesse público.","c":"Art. 15, III. A ressalva do interesse público é o detalhe que costuma ser retirado.","ap":-1},{"id":"lgpd-16-01","b":"lgpd-12-16","g":"C","l":"lgpd","art":"16","r":"LGPD, art. 16","t":["autorizada a conservação para as seguintes finalidades","cumprimento de obrigação legal ou regulatória pelo controlador","uso exclusivo do controlador, vedado seu acesso por terceiro, e desde que anonimizados os dados"],"a":"rol","d":2,"e":"Após o término do tratamento, a conservação dos dados é autorizada para cumprimento de obrigação legal ou regulatória e para uso exclusivo do controlador, vedado o acesso por terceiro e desde que anonimizados os dados.","c":"Incisos I e IV do art. 16. O rol completo: obrigação legal ou regulatória; estudo por órgão de pesquisa; transferência a terceiro respeitados os requisitos da lei; uso exclusivo do controlador com dados anonimizados.","ap":-1},{"id":"lgpd-16-02","b":"lgpd-12-16","g":"E","l":"lgpd","art":"16","r":"LGPD, art. 16, IV","t":["uso exclusivo do controlador, vedado seu acesso por terceiro, e desde que anonimizados os dados"],"a":"conceito","d":3,"e":"Após o término do tratamento, o controlador pode conservar os dados para uso próprio, permitido o acesso por terceiros, desde que os dados estejam pseudonimizados.","c":"O inciso IV do art. 16 exige uso exclusivo do controlador, veda o acesso por terceiro e exige anonimização. Pseudonimização não basta.","ap":-1},{"id":"lgpd-16-03","b":"lgpd-12-16","g":"E","l":"lgpd","art":"16","r":"LGPD, art. 16","t":["Os dados pessoais serão eliminados após o término de seu tratamento, no âmbito e nos limites técnicos das atividades, autorizada a conservação"],"a":"absoluto","d":1,"e":"Encerrado o tratamento, os dados pessoais devem ser eliminados imediatamente, sem possibilidade de conservação.","c":"O art. 16 manda eliminar, mas autoriza a conservação em quatro finalidades. O artigo também fala em “no âmbito e nos limites técnicos das atividades”.","ap":-1},{"id":"lgpd2-17-01","b":"lgpd-17-22","g":"E","l":"lgpd","art":"17","r":"LGPD, art. 17","t":["garantidos os direitos fundamentais de liberdade, de intimidade e de privacidade"],"a":"rol","d":2,"e":"O art. 17 da LGPD assegura à pessoa natural a titularidade de seus dados pessoais e garante os direitos fundamentais de liberdade, de igualdade e de propriedade, nos termos da lei.","c":"O art. 17 menciona liberdade, intimidade e privacidade. Igualdade e propriedade não constam desse dispositivo; a troca de um item do trio é a pegadinha.","ap":-1},{"id":"lgpd2-18-01","b":"lgpd-17-22","g":"C","l":"lgpd","art":"18","r":"LGPD, art. 18, caput","t":["a qualquer momento e mediante requisição"],"a":"literal","d":1,"e":"Os direitos previstos no art. 18 da LGPD podem ser exercidos pelo titular perante o controlador a qualquer momento, mediante requisição.","c":"O caput do art. 18 diz “a qualquer momento e mediante requisição”. Itens que inventam periodicidade (uma vez por ano, a cada seis meses) estão errados.","ap":-1},{"id":"lgpd2-18-02","b":"lgpd-17-22","g":"E","l":"lgpd","art":"18","r":"LGPD, art. 18, V","t":["portabilidade dos dados a outro fornecedor de serviço ou produto, mediante requisição expressa, de acordo com a regulamentação da autoridade nacional, observados os segredos comercial e industrial"],"a":"excecao","d":2,"e":"A portabilidade dos dados pessoais a outro fornecedor de serviço ou produto prevalece sobre os segredos comercial e industrial do controlador, por constituir direito fundamental do titular.","c":"O inciso V ressalva expressamente os segredos comercial e industrial e condiciona a portabilidade à requisição expressa e à regulamentação da autoridade nacional.","ap":-1,"p":["Portabilidade de dados e segredo comercial"]},{"id":"lgpd2-18-03","b":"lgpd-17-22","g":"C","l":"lgpd","art":"18","r":"LGPD, art. 18, VI","t":["eliminação dos dados pessoais tratados com o consentimento do titular, exceto nas hipóteses previstas no art. 16 desta Lei"],"a":"caso","d":2,"e":"Situação hipotética: uma paciente revogou o consentimento e pediu a uma clínica a eliminação de seus dados, que a clínica mantém para cumprir obrigação legal de guarda de prontuário. Assertiva: a recusa da clínica em eliminar esses dados é compatível com a LGPD.","c":"O direito de eliminação (art. 18, VI) cede nas hipóteses do art. 16, entre elas o cumprimento de obrigação legal ou regulatória pelo controlador (art. 16, I).","ap":-1,"p":["Prazo de guarda do prontuário (Lei 13.787/2018)"]},{"id":"lgpd2-18-04","b":"lgpd-17-22","g":"E","l":"lgpd","art":"18","r":"LGPD, art. 18, § 3º","t":["mediante requerimento expresso do titular ou de representante legalmente constituído, a agente de tratamento"],"a":"sujeito","d":2,"e":"Os direitos do titular são exercidos mediante requerimento expresso dirigido exclusivamente à autoridade nacional, que o encaminha ao controlador responsável.","c":"O § 3º manda dirigir o requerimento “a agente de tratamento”. A petição à ANPD contra o controlador (§ 1º) é outro instrumento, que não substitui o requerimento ao agente.","ap":-1},{"id":"lgpd2-18-05","b":"lgpd-17-22","g":"C","l":"lgpd","art":"18","r":"LGPD, art. 18, § 4º, II","t":["indicar as razões de fato ou de direito que impedem a adoção imediata da providência"],"a":"literal","d":2,"e":"Na impossibilidade de adotar imediatamente a providência requerida pelo titular, o controlador poderá enviar resposta que indique as razões de fato ou de direito que impedem a adoção imediata da providência.","c":"Art. 18, § 4º, II. A outra resposta possível (inciso I) é comunicar que não é agente de tratamento e indicar, sempre que possível, quem é.","ap":-1},{"id":"lgpd2-18-06","b":"lgpd-17-22","g":"E","l":"lgpd","art":"18","r":"LGPD, art. 18, § 6º","t":["exceto nos casos em que esta comunicação seja comprovadamente impossível ou implique esforço desproporcional"],"a":"absoluto","d":3,"e":"O dever do controlador de informar aos agentes com quem compartilhou dados a correção ou a eliminação desses dados não admite exceção, ainda que a comunicação implique esforço desproporcional.","c":"O § 6º traz exceção expressa: comunicação comprovadamente impossível ou que implique esforço desproporcional.","ap":-1},{"id":"lgpd2-19-01","b":"lgpd-17-22","g":"C","l":"lgpd","art":"19","r":"LGPD, art. 19, § 1º","t":["Os dados pessoais serão armazenados em formato que favoreça o exercício do direito de acesso."],"a":"literal","d":1,"e":"Segundo a LGPD, os dados pessoais serão armazenados em formato que favoreça o exercício do direito de acesso.","c":"Art. 19, § 1º. Dispositivo curto e pouco lembrado, bom candidato a item literal.","ap":-1},{"id":"lgpd2-19-02","b":"lgpd-17-22","g":"E","l":"lgpd","art":"19","r":"LGPD, art. 19, II","t":["fornecida no prazo de até 15 (quinze) dias, contado da data do requerimento do titular"],"a":"numero","d":2,"e":"A declaração clara e completa sobre a origem dos dados e a finalidade do tratamento deve ser fornecida ao titular no prazo de até 15 dias úteis, contado da data do requerimento.","c":"A lei fala em até 15 (quinze) dias, sem a qualificação “úteis”. Acrescentar uma palavra ao prazo é extrapolação típica do Cebraspe.","ap":-1},{"id":"lgpd2-19-03","b":"lgpd-17-22","g":"C","l":"lgpd","art":"19","r":"LGPD, art. 19, § 3º","t":["Quando o tratamento tiver origem no consentimento do titular ou em contrato, o titular poderá solicitar cópia eletrônica integral de seus dados pessoais"],"a":"caso","d":2,"e":"Situação hipotética: Ana mantém contrato de prestação de serviços com uma operadora e quer levar para outro sistema os dados pessoais que a empresa trata com base nesse contrato. Assertiva: Ana poderá solicitar cópia eletrônica integral de seus dados pessoais, em formato que permita a utilização subsequente, observados os segredos comercial e industrial.","c":"Art. 19, § 3º: o direito à cópia eletrônica integral existe quando o tratamento tem origem no consentimento ou em contrato, nos termos de regulamentação da autoridade nacional.","ap":-1},{"id":"lgpd2-19-04","b":"lgpd-17-22","g":"E","l":"lgpd","art":"19","r":"LGPD, art. 19, II","t":["observados os segredos comercial e industrial"],"a":"excecao","d":2,"e":"A declaração completa fornecida ao titular deve revelar os critérios utilizados no tratamento mesmo quando protegidos por segredo comercial ou industrial, porque o direito de acesso prevalece sobre interesses empresariais.","c":"O art. 19, II, manda observar os segredos comercial e industrial. A mesma ressalva aparece nos arts. 9º, II; 18, V; 19, § 3º; e 20, §§ 1º e 2º.","ap":-1},{"id":"lgpd2-20-01","b":"lgpd-17-22","g":"E","l":"lgpd","art":"20","r":"LGPD, art. 20, caput","t":["decisões tomadas unicamente com base em tratamento automatizado de dados pessoais que afetem seus interesses"],"a":"extrapolacao","d":2,"e":"O titular tem direito a solicitar a revisão de qualquer decisão que tenha contado com o apoio de tratamento automatizado de dados pessoais, ainda que a decisão final tenha sido tomada por pessoa natural.","c":"O art. 20 alcança decisões tomadas “unicamente” com base em tratamento automatizado e que afetem os interesses do titular. Decisão humana apoiada por sistema não está na literalidade do dispositivo.","ap":-1,"p":["Decisão automatizada e revisão humana (LGPD × GDPR art. 22)"]},{"id":"lgpd2-20-02","b":"lgpd-17-22","g":"C","l":"lgpd","art":"20","r":"LGPD, art. 20, caput","t":["incluídas as decisões destinadas a definir o seu perfil pessoal, profissional, de consumo e de crédito"],"a":"caso","d":1,"e":"Situação hipotética: um banco negou crédito a um cliente por meio de sistema de pontuação totalmente automatizado. Assertiva: o cliente pode solicitar a revisão dessa decisão, pois o direito alcança decisões destinadas a definir o perfil de crédito do titular.","c":"Art. 20, caput: perfil pessoal, profissional, de consumo e de crédito, além dos aspectos da personalidade.","ap":-1,"p":["Credit scoring e LGPD"]},{"id":"lgpd2-21-01","b":"lgpd-17-22","g":"C","l":"lgpd","art":"21","r":"LGPD, art. 21","t":["Os dados pessoais referentes ao exercício regular de direitos pelo titular não podem ser utilizados em seu prejuízo."],"a":"literal","d":1,"e":"Os dados pessoais referentes ao exercício regular de direitos pelo titular não podem ser utilizados em seu prejuízo.","c":"Art. 21, literal. Aparece em prova como situação hipotética, por exemplo o uso de reclamação ou ação judicial do titular para negar-lhe serviço.","ap":-1},{"id":"lgpd2-22-01","b":"lgpd-17-22","g":"C","l":"lgpd","art":"22","r":"LGPD, art. 22","t":["poderá ser exercida em juízo, individual ou coletivamente"],"a":"literal","d":1,"e":"A defesa dos interesses e dos direitos dos titulares de dados poderá ser exercida em juízo, individual ou coletivamente, na forma da legislação pertinente acerca dos instrumentos de tutela individual e coletiva.","c":"Art. 22. A tutela coletiva segue a legislação pertinente, como a Lei da Ação Civil Pública e o Código de Defesa do Consumidor.","ap":-1,"p":["Ação civil pública por vazamento de dados"]},{"id":"lgpd-17-01","b":"lgpd-17-22","g":"C","l":"lgpd","art":"17","r":"LGPD, art. 17","t":["Toda pessoa natural tem assegurada a titularidade de seus dados pessoais e garantidos os direitos fundamentais de liberdade, de intimidade e de privacidade"],"a":"literal","d":1,"e":"Segundo a LGPD, toda pessoa natural tem assegurada a titularidade de seus dados pessoais, garantidos os direitos fundamentais de liberdade, de intimidade e de privacidade.","c":"Reprodução fiel do art. 17. Repare nos três direitos fundamentais citados (liberdade, intimidade e privacidade): o Cebraspe costuma trocar um deles por outro direito parecido, como honra ou imagem, que aparecem no art. 2º, IV, e não aqui.","ap":-1},{"id":"lgpd-17-02","b":"lgpd-17-22","g":"E","l":"lgpd","art":"17","r":"LGPD, art. 17","t":["Toda pessoa natural tem assegurada a titularidade de seus dados pessoais"],"a":"sujeito","d":1,"e":"A LGPD assegura a titularidade de dados pessoais tanto à pessoa natural quanto à pessoa jurídica, de modo que uma empresa pode exercer, perante o controlador, os direitos do art. 18 em relação aos seus próprios dados cadastrais.","c":"A titularidade é só da pessoa natural (art. 17), e o art. 5º, V, define titular como a pessoa natural a quem se referem os dados. Dados de pessoa jurídica (CNPJ, razão social) não são dados pessoais para a LGPD.","ap":-1},{"id":"lgpd-18-01","b":"lgpd-17-22","g":"E","l":"lgpd","art":"18","r":"LGPD, art. 18, caput","t":["a qualquer momento e mediante requisição"],"a":"extrapolacao","d":1,"e":"Os direitos do titular previstos no art. 18 da LGPD podem ser exercidos perante o controlador uma vez a cada doze meses, salvo justificativa fundamentada.","c":"O caput do art. 18 diz que o titular pode obter as providências do controlador “a qualquer momento e mediante requisição”. Não há limite de periodicidade na lei.","ap":-1},{"id":"lgpd-18-02","b":"lgpd-17-22","g":"C","l":"lgpd","art":"18","r":"LGPD, art. 18, IV","t":["anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade com o disposto nesta Lei"],"a":"rol","d":1,"e":"O titular pode obter do controlador a anonimização, o bloqueio ou a eliminação de dados desnecessários, excessivos ou tratados em desconformidade com a LGPD.","c":"Inciso IV do art. 18, literal. Não confunda com o inciso VI, que trata da eliminação de dados tratados com base no consentimento, com as exceções do art. 16.","ap":-1},{"id":"lgpd-18-03","b":"lgpd-17-22","g":"E","l":"lgpd","art":"18","r":"LGPD, art. 18, § 7º","t":["não inclui dados que já tenham sido anonimizados pelo controlador"],"a":"excecao","d":2,"e":"A portabilidade dos dados pessoais a outro fornecedor de serviço ou produto abrange inclusive os dados que já tenham sido anonimizados pelo controlador, desde que o titular a requeira expressamente.","c":"O § 7º do art. 18 exclui da portabilidade os dados já anonimizados pelo controlador. A requisição expressa é exigida pelo inciso V, mas não amplia o objeto da portabilidade.","ap":-1},{"id":"lgpd-18-04","b":"lgpd-17-22","g":"C","l":"lgpd","art":"18","r":"LGPD, art. 18, § 8º","t":["também poderá ser exercido perante os organismos de defesa do consumidor"],"a":"literal","d":2,"e":"O direito do titular de peticionar contra o controlador em relação aos seus dados, que pode ser exercido perante a autoridade nacional, também poderá ser exercido perante os organismos de defesa do consumidor.","c":"Combinação dos §§ 1º e 8º do art. 18. O § 8º estende aos Procons e demais órgãos de defesa do consumidor o direito de petição do § 1º.","ap":-1},{"id":"lgpd-18-05","b":"lgpd-17-22","g":"E","l":"lgpd","art":"18","r":"LGPD, art. 18, § 2º","t":["O titular pode opor-se a tratamento realizado com fundamento em uma das hipóteses de dispensa de consentimento, em caso de descumprimento ao disposto nesta Lei"],"a":"excecao","d":2,"e":"O titular pode opor-se a tratamento realizado com fundamento em qualquer das hipóteses de dispensa de consentimento, independentemente de descumprimento da LGPD, bastando manifestar sua discordância.","c":"O direito de oposição do § 2º do art. 18 é condicionado: cabe “em caso de descumprimento ao disposto nesta Lei”. Sem descumprimento, a base legal que dispensa o consentimento continua válida.","ap":-1},{"id":"lgpd-18-06","b":"lgpd-17-22","g":"C","l":"lgpd","art":"18","r":"LGPD, art. 18, § 4º, I","t":["comunicar que não é agente de tratamento dos dados e indicar, sempre que possível, o agente"],"a":"literal","d":2,"e":"Se não puder adotar imediatamente a providência requerida pelo titular, o controlador poderá responder comunicando que não é agente de tratamento dos dados e indicando, sempre que possível, quem é o agente.","c":"É uma das duas respostas possíveis do § 4º do art. 18. A outra (inciso II) é indicar as razões de fato ou de direito que impedem a adoção imediata da providência.","ap":-1},{"id":"lgpd-18-07","b":"lgpd-17-22","g":"E","l":"lgpd","art":"18","r":"LGPD, art. 18, § 5º","t":["será atendido sem custos para o titular, nos prazos e nos termos previstos em regulamento"],"a":"extrapolacao","d":1,"e":"O atendimento ao requerimento do titular para exercício dos direitos do art. 18 poderá ser cobrado, desde que o valor se limite ao custo administrativo da operação.","c":"O § 5º do art. 18 é taxativo: o requerimento “será atendido sem custos para o titular”. Não existe cobrança de custo administrativo na LGPD.","ap":-1},{"id":"lgpd-18-08","b":"lgpd-17-22","g":"C","l":"lgpd","art":"18","r":"LGPD, art. 18, § 6º","t":["exceto nos casos em que esta comunicação seja comprovadamente impossível ou implique esforço desproporcional"],"a":"excecao","d":2,"e":"O controlador deve informar de maneira imediata aos agentes com os quais compartilhou dados a correção, a eliminação, a anonimização ou o bloqueio desses dados, para que repitam o procedimento, salvo se essa comunicação for comprovadamente impossível ou implicar esforço desproporcional.","c":"Texto do § 6º do art. 18, com a redação da Lei nº 13.853/2019. A exceção (impossibilidade comprovada ou esforço desproporcional) é o detalhe que costuma ser cortado para transformar o item em errado.","ap":-1},{"id":"lgpd-18-09","b":"lgpd-17-22","g":"E","l":"lgpd","art":"18","r":"LGPD, art. 18, VI","t":["eliminação dos dados pessoais tratados com o consentimento do titular, exceto nas hipóteses previstas no art. 16 desta Lei"],"a":"absoluto","d":2,"e":"O direito do titular à eliminação dos dados pessoais tratados com seu consentimento é absoluto, não comportando exceções.","c":"O inciso VI do art. 18 ressalva as hipóteses do art. 16, que autorizam a conservação, por exemplo, para cumprimento de obrigação legal ou regulatória e para estudo por órgão de pesquisa.","ap":-1},{"id":"lgpd-18-10","b":"lgpd-17-22","g":"E","l":"lgpd","art":"18","r":"LGPD, art. 18, § 3º","t":["mediante requerimento expresso do titular ou de representante legalmente constituído"],"a":"extrapolacao","d":1,"e":"Os direitos previstos no art. 18 da LGPD somente podem ser exercidos pessoalmente pelo titular, vedada a representação.","c":"O § 3º admite requerimento expresso do titular “ou de representante legalmente constituído”, dirigido a agente de tratamento.","ap":-1},{"id":"lgpd-18-11","b":"lgpd-17-22","g":"C","l":"lgpd","art":"18","r":"LGPD, art. 18, VIII","t":["informação sobre a possibilidade de não fornecer consentimento e sobre as consequências da negativa"],"a":"rol","d":1,"e":"Integra o rol de direitos do titular perante o controlador a informação sobre a possibilidade de não fornecer consentimento e sobre as consequências da negativa.","c":"Inciso VIII do art. 18. Os nove incisos do caput formam o rol de direitos que o titular exerce perante o controlador.","ap":-1},{"id":"lgpd-18-12","b":"lgpd-17-22","g":"E","l":"lgpd","art":"18","r":"LGPD, art. 18, VII","t":["informação das entidades públicas e privadas com as quais o controlador realizou uso compartilhado de dados"],"a":"extrapolacao","d":2,"e":"Entre os direitos do titular previstos no art. 18 da LGPD está o de obter do controlador a identificação nominal de todos os empregados que tiveram acesso aos seus dados pessoais.","c":"O inciso VII garante informação sobre as entidades públicas e privadas com quem o controlador compartilhou dados, não sobre pessoas físicas internas que acessaram os dados. O item acrescenta um direito que a lei não prevê.","ap":-1},{"id":"lgpd-18-13","b":"lgpd-17-22","g":"C","l":"lgpd","art":"18","r":"LGPD, art. 18, § 1º","t":["O titular dos dados pessoais tem o direito de peticionar em relação aos seus dados contra o controlador perante a autoridade nacional"],"a":"literal","d":1,"e":"O titular dos dados pessoais tem o direito de peticionar em relação aos seus dados contra o controlador perante a autoridade nacional.","c":"§ 1º do art. 18, literal. Para a ANPD apreciar a petição, porém, o titular precisa comprovar que reclamou antes ao controlador sem solução no prazo regulamentar (art. 55-J, V).","ap":-1},{"id":"lgpd-18-14","b":"lgpd-17-22","g":"E","l":"lgpd","art":"55-J","r":"LGPD, art. 55-J, V","t":["apreciar petições de titular contra controlador após comprovada pelo titular a apresentação de reclamação ao controlador não solucionada no prazo estabelecido em regulamentação"],"a":"excecao","d":3,"e":"A ANPD deve apreciar de imediato a petição do titular contra o controlador, independentemente de o titular ter apresentado reclamação prévia ao controlador.","c":"O art. 55-J, V, condiciona a apreciação pela ANPD à comprovação, pelo titular, de que reclamou ao controlador e não teve solução no prazo fixado em regulamentação. O direito de petição existe (art. 18, § 1º), mas a apreciação tem essa condição.","ap":-1},{"id":"lgpd-19-01","b":"lgpd-17-22","g":"E","l":"lgpd","art":"19","r":"LGPD, art. 19, II","t":["fornecida no prazo de até 15 (quinze) dias, contado da data do requerimento do titular"],"a":"numero","d":1,"e":"A confirmação de existência de tratamento, quando requerida por meio de declaração clara e completa, deve ser fornecida no prazo de até 30 dias, contado da data do requerimento do titular.","c":"O prazo do inciso II do art. 19 é de até 15 dias, contado da data do requerimento. Prazo trocado é a pegadinha mais comum deste artigo.","ap":-1},{"id":"lgpd-19-02","b":"lgpd-17-22","g":"C","l":"lgpd","art":"19","r":"LGPD, art. 19, I","t":["em formato simplificado, imediatamente"],"a":"numero","d":1,"e":"Em formato simplificado, a confirmação de existência ou o acesso a dados pessoais devem ser providenciados imediatamente, mediante requisição do titular.","c":"Inciso I do art. 19. São dois formatos: simplificado (imediato) e declaração clara e completa (até 15 dias).","ap":-1},{"id":"lgpd-19-03","b":"lgpd-17-22","g":"C","l":"lgpd","art":"19","r":"LGPD, art. 19, II","t":["que indique a origem dos dados, a inexistência de registro, os critérios utilizados e a finalidade do tratamento, observados os segredos comercial e industrial"],"a":"rol","d":2,"e":"A declaração clara e completa fornecida ao titular deve indicar a origem dos dados, a inexistência de registro, os critérios utilizados e a finalidade do tratamento, observados os segredos comercial e industrial.","c":"Conteúdo exigido pelo inciso II do art. 19. A ressalva dos segredos comercial e industrial aparece em vários dispositivos (arts. 9º, II; 18, V; 19, II e § 3º; 20, § 1º).","ap":-1},{"id":"lgpd-19-04","b":"lgpd-17-22","g":"E","l":"lgpd","art":"19","r":"LGPD, art. 19, § 2º","t":["As informações e os dados poderão ser fornecidos, a critério do titular"],"a":"sujeito","d":1,"e":"Cabe ao controlador escolher se as informações e os dados solicitados pelo titular serão fornecidos por meio eletrônico ou sob forma impressa.","c":"O § 2º do art. 19 dá a escolha ao titular (“a critério do titular”), não ao controlador.","ap":-1},{"id":"lgpd-19-05","b":"lgpd-17-22","g":"E","l":"lgpd","art":"19","r":"LGPD, art. 19, § 3º","t":["Quando o tratamento tiver origem no consentimento do titular ou em contrato, o titular poderá solicitar cópia eletrônica integral de seus dados pessoais"],"a":"excecao","d":3,"e":"O titular poderá solicitar cópia eletrônica integral de seus dados pessoais, em formato que permita sua utilização subsequente, qualquer que seja a base legal que fundamente o tratamento.","c":"O § 3º do art. 19 restringe a cópia eletrônica integral aos tratamentos que tenham origem no consentimento ou em contrato. Tratamento por obrigação legal, por exemplo, não está coberto por esse parágrafo.","ap":-1},{"id":"lgpd-19-06","b":"lgpd-17-22","g":"C","l":"lgpd","art":"19","r":"LGPD, art. 19, § 4º","t":["A autoridade nacional poderá dispor de forma diferenciada acerca dos prazos previstos nos incisos I e II do caput deste artigo para os setores específicos"],"a":"literal","d":2,"e":"A autoridade nacional poderá dispor de forma diferenciada sobre os prazos de confirmação de existência e de acesso a dados pessoais para setores específicos.","c":"§ 4º do art. 19. É uma das brechas regulamentares da lei: a ANPD pode ajustar o “imediatamente” e os 15 dias conforme o setor.","ap":-1},{"id":"lgpd-20-01","b":"lgpd-17-22","g":"C","l":"lgpd","art":"20","r":"LGPD, art. 20, caput","t":["incluídas as decisões destinadas a definir o seu perfil pessoal, profissional, de consumo e de crédito ou os aspectos de sua personalidade"],"a":"literal","d":1,"e":"O direito de solicitar a revisão de decisões tomadas unicamente com base em tratamento automatizado alcança as decisões destinadas a definir os aspectos da personalidade do titular.","c":"O caput do art. 20 inclui expressamente as decisões que definem perfil pessoal, profissional, de consumo e de crédito “ou os aspectos de sua personalidade”.","ap":-1},{"id":"lgpd-20-02","b":"lgpd-17-22","g":"E","l":"lgpd","art":"20","r":"LGPD, art. 20, § 3º","t":["§ 3º (VETADO)","solicitar a revisão de decisões tomadas unicamente com base em tratamento automatizado"],"a":"vetado","d":2,"e":"Conforme a LGPD, a revisão de decisão tomada unicamente com base em tratamento automatizado deve ser realizada obrigatoriamente por pessoa natural.","c":"A Lei nº 13.853/2019 tentou incluir essa exigência no § 3º do art. 20, mas o dispositivo foi vetado. Hoje a lei garante a revisão sem dizer quem a faz. Afirmar revisão humana obrigatória acrescenta o que a lei não diz.","ap":-1},{"id":"lgpd-20-03","b":"lgpd-17-22","g":"E","l":"lgpd","art":"20","r":"LGPD, art. 20, § 2º","t":["a autoridade nacional poderá realizar auditoria para verificação de aspectos discriminatórios em tratamento automatizado de dados pessoais"],"a":"extrapolacao","d":2,"e":"Se o controlador se recusar, com base em segredo comercial e industrial, a informar os critérios da decisão automatizada, a autoridade nacional poderá determinar a divulgação pública do algoritmo utilizado.","c":"O § 2º do art. 20 prevê auditoria pela ANPD para verificar aspectos discriminatórios, preservando o segredo. Divulgação pública do algoritmo não está na lei.","ap":-1},{"id":"lgpd-20-04","b":"lgpd-17-22","g":"C","l":"lgpd","art":"20","r":"LGPD, art. 20, § 2º","t":["Em caso de não oferecimento de informações de que trata o § 1º deste artigo baseado na observância de segredo comercial e industrial, a autoridade nacional poderá realizar auditoria"],"a":"literal","d":2,"e":"Na hipótese de o controlador não oferecer, com base em segredo comercial e industrial, informações sobre os critérios da decisão automatizada, a autoridade nacional poderá realizar auditoria para verificar aspectos discriminatórios no tratamento automatizado.","c":"§ 2º do art. 20. Para quem presta concurso de auditoria na ANPD, este parágrafo e o art. 55-J, XVI, são a base legal da auditoria de algoritmos.","ap":-1},{"id":"lgpd-20-05","b":"lgpd-17-22","g":"E","l":"lgpd","art":"20","r":"LGPD, art. 20, § 1º","t":["O controlador deverá fornecer, sempre que solicitadas, informações claras e adequadas a respeito dos critérios e dos procedimentos utilizados para a decisão automatizada"],"a":"sujeito","d":2,"e":"O controlador somente está obrigado a informar os critérios e os procedimentos utilizados em decisão automatizada quando houver determinação da autoridade nacional.","c":"O § 1º do art. 20 obriga o controlador a fornecer essas informações “sempre que solicitadas”, o que inclui a solicitação do próprio titular, sem depender de ordem da ANPD.","ap":-1},{"id":"lgpd-21-01","b":"lgpd-17-22","g":"C","l":"lgpd","art":"21","r":"LGPD, art. 21","t":["Os dados pessoais referentes ao exercício regular de direitos pelo titular não podem ser utilizados em seu prejuízo"],"a":"caso","d":2,"e":"Situação hipotética: um consumidor ajuizou ação contra uma operadora de telefonia, que, meses depois, usou o registro dessa ação para recusar a contratação de novo plano por ele. Assertiva: a conduta da operadora contraria a LGPD, que veda o uso, em prejuízo do titular, de dados referentes ao exercício regular de seus direitos.","c":"Aplicação direta do art. 21. Ajuizar ação é exercício regular de direito, e o dado gerado por esse exercício não pode ser usado contra o titular.","ap":-1},{"id":"lgpd-22-01","b":"lgpd-17-22","g":"E","l":"lgpd","art":"22","r":"LGPD, art. 22","t":["poderá ser exercida em juízo, individual ou coletivamente"],"a":"extrapolacao","d":1,"e":"A defesa dos interesses e dos direitos dos titulares de dados pode ser exercida em juízo apenas individualmente, cabendo a tutela coletiva exclusivamente à ANPD, na via administrativa.","c":"O art. 22 admite a defesa em juízo individual ou coletivamente, conforme a legislação de tutela coletiva. O art. 42, § 3º, reforça a possibilidade de ações coletivas de reparação.","ap":-1},{"id":"lgpd2-23-01","b":"lgpd-23-32","g":"E","l":"lgpd","art":"23","r":"LGPD, art. 23, I","t":["em veículos de fácil acesso, preferencialmente em seus sítios eletrônicos"],"a":"absoluto","d":2,"e":"As informações sobre as hipóteses em que os entes públicos tratam dados pessoais devem ser divulgadas exclusivamente no Diário Oficial, como condição de validade do tratamento.","c":"Art. 23, I: a divulgação se dá em veículos de fácil acesso, preferencialmente nos sítios eletrônicos. Não há exigência de Diário Oficial.","ap":-1},{"id":"lgpd2-23-02","b":"lgpd-23-32","g":"C","l":"lgpd","art":"23","r":"LGPD, art. 23, § 1º","t":["A autoridade nacional poderá dispor sobre as formas de publicidade das operações de tratamento."],"a":"literal","d":1,"e":"A autoridade nacional poderá dispor sobre as formas de publicidade das operações de tratamento de dados pessoais realizadas pelo Poder Público.","c":"Art. 23, § 1º. Competência normativa da ANPD que se soma ao art. 30 (normas complementares sobre comunicação e uso compartilhado).","ap":-1},{"id":"lgpd2-23-03","b":"lgpd-23-32","g":"E","l":"lgpd","art":"23","r":"LGPD, art. 23, § 5º","t":["Os órgãos notariais e de registro devem fornecer acesso aos dados por meio eletrônico para a administração pública, tendo em vista as finalidades de que trata o caput deste artigo."],"a":"extrapolacao","d":2,"e":"Os órgãos notariais e de registro devem fornecer acesso aos dados por meio eletrônico para a administração pública e para qualquer interessado, independentemente da finalidade.","c":"O § 5º restringe o dever à administração pública e o vincula às finalidades do caput do art. 23 (finalidade pública, interesse público, competências legais).","ap":-1},{"id":"lgpd2-23-04","b":"lgpd-23-32","g":"C","l":"lgpd","art":"23","r":"LGPD, art. 23, caput","t":["pessoas jurídicas de direito público referidas no parágrafo único do art. 1º da Lei nº 12.527, de 18 de novembro de 2011 (Lei de Acesso à Informação)"],"a":"literal","d":3,"e":"Para identificar os entes alcançados pelas regras de tratamento de dados pelo Poder Público, o art. 23 da LGPD remete às pessoas jurídicas de direito público referidas na Lei de Acesso à Informação.","c":"O art. 23 remete ao parágrafo único do art. 1º da Lei nº 12.527/2011 (LAI). As empresas estatais têm regra própria no art. 24 da LGPD.","ap":-1,"p":["Parágrafo único do art. 1º da Lei de Acesso à Informação"]},{"id":"lgpd2-25-01","b":"lgpd-23-32","g":"C","l":"lgpd","art":"25","r":"LGPD, art. 25","t":["Os dados deverão ser mantidos em formato interoperável e estruturado para o uso compartilhado"],"a":"literal","d":1,"e":"Com vistas à execução de políticas públicas, à prestação de serviços públicos e à descentralização da atividade pública, os dados deverão ser mantidos em formato interoperável e estruturado para o uso compartilhado.","c":"Art. 25. Interoperabilidade é palavra-chave do capítulo do Poder Público.","ap":-1,"p":["Interoperabilidade de dados no governo"]},{"id":"lgpd2-26-01","b":"lgpd-23-32","g":"E","l":"lgpd","art":"26","r":"LGPD, art. 26, § 1º, I","t":["exclusivamente para esse fim específico e determinado"],"a":"extrapolacao","d":2,"e":"Na execução descentralizada de atividade pública que exija a transferência, o Poder Público pode repassar dados pessoais a entidade privada, que poderá utilizá-los também para outras finalidades compatíveis com seu objeto social.","c":"O inciso I do § 1º do art. 26 limita a transferência “exclusivamente para esse fim específico e determinado”.","ap":-1},{"id":"lgpd2-26-02","b":"lgpd-23-32","g":"C","l":"lgpd","art":"26","r":"LGPD, art. 26, § 1º, III","t":["nos casos em que os dados forem acessíveis publicamente, observadas as disposições desta Lei"],"a":"rol","d":2,"e":"Uma das exceções à vedação de transferência de dados pessoais do Poder Público a entidades privadas abrange os casos em que os dados forem acessíveis publicamente, observadas as disposições da LGPD.","c":"Art. 26, § 1º, III. Os incisos IV e V, incluídos pela Lei nº 13.853/2019, acrescentaram previsão legal ou contrato/convênio e prevenção de fraudes.","ap":-1},{"id":"lgpd2-27-01","b":"lgpd-23-32","g":"C","l":"lgpd","art":"27","r":"LGPD, art. 27, III","t":["nas exceções constantes do § 1º do art. 26 desta Lei"],"a":"rol","d":2,"e":"A comunicação de dados pessoais de pessoa jurídica de direito público a pessoa de direito privado dispensa o consentimento do titular nas exceções do § 1º do art. 26 da LGPD, como a execução descentralizada de atividade pública.","c":"Art. 27, III. As outras exceções são as hipóteses de dispensa de consentimento da LGPD (I) e o uso compartilhado com a publicidade do art. 23, I (II).","ap":-1},{"id":"lgpd2-27-02","b":"lgpd-23-32","g":"E","l":"lgpd","art":"27","r":"LGPD, art. 27, parágrafo único","t":["A informação à autoridade nacional de que trata o caput deste artigo será objeto de regulamentação."],"a":"extrapolacao","d":3,"e":"A informação à autoridade nacional exigida no art. 27 da LGPD independe de regulamentação, pois a própria lei fixa o prazo e a forma de seu envio.","c":"O parágrafo único do art. 27, incluído pela Lei nº 13.853/2019, remete a informação à regulamentação. A LGPD não fixa prazo nem forma.","ap":-1},{"id":"lgpd2-29-01","b":"lgpd-23-32","g":"E","l":"lgpd","art":"29","r":"LGPD, art. 29","t":["poderá solicitar, a qualquer momento"],"a":"extrapolacao","d":2,"e":"A autoridade nacional somente pode solicitar aos órgãos e entidades do poder público informações sobre suas operações de tratamento de dados pessoais após a instauração de processo administrativo sancionador.","c":"O art. 29 permite a solicitação “a qualquer momento”, além da emissão de parecer técnico complementar. Não há condicionamento a processo sancionador.","ap":-1},{"id":"lgpd2-31-01","b":"lgpd-23-32","g":"C","l":"lgpd","art":"31","r":"LGPD, art. 31","t":["a autoridade nacional poderá enviar informe com medidas cabíveis para fazer cessar a violação"],"a":"literal","d":1,"e":"Quando houver infração à LGPD em decorrência do tratamento de dados pessoais por órgãos públicos, a autoridade nacional poderá enviar informe com medidas cabíveis para fazer cessar a violação.","c":"Art. 31. Lembre que o art. 52, § 3º, também permite aplicar a entes públicos as sanções que não são pecuniárias, como advertência e publicização.","ap":-1},{"id":"lgpd2-32-01","b":"lgpd-23-32","g":"E","l":"lgpd","art":"32","r":"LGPD, art. 32","t":["poderá solicitar a agentes do Poder Público a publicação de relatórios de impacto à proteção de dados pessoais e sugerir a adoção de padrões e de boas práticas"],"a":"sujeito","d":2,"e":"A autoridade nacional poderá determinar aos agentes do Poder Público a publicação de relatórios de impacto à proteção de dados pessoais, sob pena de multa diária, e impor-lhes padrões de boas práticas.","c":"O art. 32 usa “solicitar” e “sugerir”. O verbo mais forte e a multa diária foram acrescentados pelo item.","ap":-1},{"id":"lgpd-23-01","b":"lgpd-23-32","g":"C","l":"lgpd","art":"23","r":"LGPD, art. 23","t":["deverá ser realizado para o atendimento de sua finalidade pública, na persecução do interesse público, com o objetivo de executar as competências legais ou cumprir as atribuições legais do serviço público"],"a":"literal","d":1,"e":"O tratamento de dados pessoais pelas pessoas jurídicas de direito público deve atender à sua finalidade pública, na persecução do interesse público, com o objetivo de executar as competências legais ou cumprir as atribuições legais do serviço público.","c":"Caput do art. 23. As pessoas jurídicas de direito público alcançadas são as do parágrafo único do art. 1º da Lei de Acesso à Informação.","ap":-1},{"id":"lgpd-23-02","b":"lgpd-23-32","g":"C","l":"lgpd","art":"23","r":"LGPD, art. 23, I","t":["em veículos de fácil acesso, preferencialmente em seus sítios eletrônicos"],"a":"literal","d":2,"e":"Os entes públicos devem informar as hipóteses em que tratam dados pessoais, com informações claras e atualizadas sobre a previsão legal, a finalidade, os procedimentos e as práticas, em veículos de fácil acesso, preferencialmente em seus sítios eletrônicos.","c":"Art. 23, I. Esse inciso é a referência de publicidade para várias outras regras: arts. 11, § 2º; 27, II; e 33, VII.","ap":-1},{"id":"lgpd-23-03","b":"lgpd-23-32","g":"E","l":"lgpd","art":"23","r":"LGPD, art. 23, III","t":["seja indicado um encarregado quando realizarem operações de tratamento de dados pessoais"],"a":"extrapolacao","d":1,"e":"A indicação de encarregado é facultativa para os órgãos e entidades públicos, que já contam com a autoridade de monitoramento prevista na Lei de Acesso à Informação.","c":"O art. 23, III, exige que seja indicado encarregado quando o ente público tratar dados pessoais. A autoridade da LAI continua obrigatória (§ 2º), mas não substitui o encarregado.","ap":-1},{"id":"lgpd-23-04","b":"lgpd-23-32","g":"C","l":"lgpd","art":"23","r":"LGPD, art. 23, § 4º","t":["Os serviços notariais e de registro exercidos em caráter privado, por delegação do Poder Público, terão o mesmo tratamento dispensado às pessoas jurídicas referidas no caput deste artigo"],"a":"sujeito","d":2,"e":"Os serviços notariais e de registro exercidos em caráter privado, por delegação do Poder Público, recebem da LGPD o mesmo tratamento dispensado às pessoas jurídicas de direito público.","c":"Art. 23, § 4º. O § 5º ainda obriga cartórios a dar acesso eletrônico aos dados para a administração pública.","ap":-1},{"id":"lgpd-23-05","b":"lgpd-23-32","g":"E","l":"lgpd","art":"23","r":"LGPD, art. 23, § 4º","t":["terão o mesmo tratamento dispensado às pessoas jurídicas referidas no caput deste artigo"],"a":"sujeito","d":2,"e":"Por serem exercidos em caráter privado, os serviços notariais e de registro submetem-se à LGPD com o mesmo tratamento dispensado às pessoas jurídicas de direito privado.","c":"Apesar do caráter privado do exercício, o § 4º do art. 23 equipara os cartórios às pessoas jurídicas de direito público.","ap":-1},{"id":"lgpd-23-06","b":"lgpd-23-32","g":"C","l":"lgpd","art":"23","r":"LGPD, art. 23, § 3º","t":["em especial as disposições constantes da Lei nº 9.507, de 12 de novembro de 1997 (Lei do Habeas Data), da Lei nº 9.784, de 29 de janeiro de 1999 (Lei Geral do Processo Administrativo), e da Lei nº 12.527, de 18 de novembro de 2011 (Lei de Acesso à Informação)"],"a":"rol","d":2,"e":"Os prazos e procedimentos para exercício dos direitos do titular perante o Poder Público observam a legislação específica, em especial a Lei do Habeas Data, a Lei Geral do Processo Administrativo e a Lei de Acesso à Informação.","c":"Art. 23, § 3º. É o elo entre a LGPD e a Lei nº 9.784/1999, outra frente fixa do seu estudo.","ap":-1},{"id":"lgpd-23-07","b":"lgpd-23-32","g":"E","l":"lgpd","art":"23","r":"LGPD, art. 23, § 2º","t":["O disposto nesta Lei não dispensa as pessoas jurídicas mencionadas no caput deste artigo de instituir as autoridades de que trata a Lei nº 12.527"],"a":"extrapolacao","d":2,"e":"A indicação de encarregado pelo ente público dispensa-o de instituir as autoridades previstas na Lei de Acesso à Informação.","c":"O § 2º do art. 23 diz o contrário: a LGPD não dispensa a instituição das autoridades da LAI.","ap":-1},{"id":"lgpd-24-01","b":"lgpd-23-32","g":"C","l":"lgpd","art":"24","r":"LGPD, art. 24","t":["As empresas públicas e as sociedades de economia mista que atuam em regime de concorrência","terão o mesmo tratamento dispensado às pessoas jurídicas de direito privado particulares","quando estiverem operacionalizando políticas públicas e no âmbito da execução delas, terão o mesmo tratamento dispensado aos órgãos e às entidades do Poder Público"],"a":"caso","d":2,"e":"Uma sociedade de economia mista que atua em regime de concorrência recebe da LGPD o tratamento de pessoa jurídica de direito privado, salvo quando estiver operacionalizando políticas públicas, hipótese em que é tratada como órgão do Poder Público.","c":"Art. 24 e parágrafo único. O critério é a atividade (concorrência × execução de política pública), não a forma jurídica da estatal.","ap":-1},{"id":"lgpd-24-02","b":"lgpd-23-32","g":"E","l":"lgpd","art":"24","r":"LGPD, art. 24","t":["que atuam em regime de concorrência, sujeitas ao disposto no art. 173 da Constituição Federal"],"a":"absoluto","d":2,"e":"As empresas públicas sempre recebem da LGPD o tratamento dispensado aos órgãos do Poder Público, por integrarem a administração indireta.","c":"Quando atuam em regime de concorrência (art. 173 da CF), recebem o tratamento de pessoa jurídica de direito privado (art. 24).","ap":-1},{"id":"lgpd-25-01","b":"lgpd-23-32","g":"E","l":"lgpd","art":"25","r":"LGPD, art. 25","t":["à disseminação e ao acesso das informações pelo público em geral"],"a":"extrapolacao","d":2,"e":"Os dados devem ser mantidos em formato interoperável e estruturado exclusivamente para a execução de políticas públicas, vedada sua disseminação ao público em geral.","c":"O art. 25 inclui entre os objetivos a disseminação e o acesso das informações pelo público em geral, além de políticas públicas, serviços públicos e descentralização.","ap":-1},{"id":"lgpd-26-01","b":"lgpd-23-32","g":"C","l":"lgpd","art":"26","r":"LGPD, art. 26, § 1º","t":["É vedado ao Poder Público transferir a entidades privadas dados pessoais constantes de bases de dados a que tenha acesso, exceto"],"a":"excecao","d":2,"e":"É vedado ao Poder Público transferir a entidades privadas dados pessoais de suas bases, exceto, entre outros casos, quando houver previsão legal ou a transferência for respaldada em contratos, convênios ou instrumentos congêneres.","c":"Art. 26, § 1º, IV. As demais exceções: execução descentralizada de atividade pública, dados acessíveis publicamente e prevenção de fraudes ou proteção do titular.","ap":-1},{"id":"lgpd-26-02","b":"lgpd-23-32","g":"E","l":"lgpd","art":"26","r":"LGPD, art. 26, § 1º","t":["É vedado ao Poder Público transferir a entidades privadas dados pessoais constantes de bases de dados a que tenha acesso, exceto"],"a":"absoluto","d":1,"e":"A vedação de transferência de dados pessoais do Poder Público a entidades privadas é absoluta e não admite exceções.","c":"O § 1º do art. 26 lista exceções (incisos I, III, IV e V; o II foi vetado).","ap":-1},{"id":"lgpd-26-03","b":"lgpd-23-32","g":"E","l":"lgpd","art":"26","r":"LGPD, art. 26, § 1º, V","t":["na hipótese de a transferência dos dados objetivar exclusivamente a prevenção de fraudes e irregularidades, ou proteger e resguardar a segurança e a integridade do titular dos dados, desde que vedado o tratamento para outras finalidades"],"a":"excecao","d":3,"e":"O Poder Público pode transferir dados a entidade privada para prevenção de fraudes, permitido o tratamento posterior desses dados para finalidades correlatas.","c":"O inciso V do § 1º do art. 26 exige finalidade exclusiva e veda o tratamento para outras finalidades.","ap":-1},{"id":"lgpd-26-04","b":"lgpd-23-32","g":"C","l":"lgpd","art":"26","r":"LGPD, art. 26, § 2º","t":["Os contratos e convênios de que trata o § 1º deste artigo deverão ser comunicados à autoridade nacional"],"a":"literal","d":2,"e":"Os contratos e convênios que fundamentam a transferência de dados do Poder Público a entidades privadas devem ser comunicados à autoridade nacional.","c":"Art. 26, § 2º. O compartilhamento pelo Poder Público (arts. 26, 27 e 30) é prioridade da Agenda Regulatória e do Mapa de Temas Prioritários da ANPD.","ap":-1},{"id":"lgpd-26-05","b":"lgpd-23-32","g":"C","l":"lgpd","art":"26","r":"LGPD, art. 26","t":["deve atender a finalidades específicas de execução de políticas públicas e atribuição legal pelos órgãos e pelas entidades públicas, respeitados os princípios de proteção de dados pessoais elencados no art. 6º desta Lei"],"a":"literal","d":1,"e":"O uso compartilhado de dados pessoais pelo Poder Público deve atender a finalidades específicas de execução de políticas públicas e atribuição legal, respeitados os princípios do art. 6º da LGPD.","c":"Caput do art. 26. O compartilhamento entre órgãos públicos também se submete a finalidade, necessidade e transparência.","ap":-1},{"id":"lgpd-27-01","b":"lgpd-23-32","g":"E","l":"lgpd","art":"27","r":"LGPD, art. 27","t":["será informado à autoridade nacional e dependerá de consentimento do titular, exceto"],"a":"extrapolacao","d":2,"e":"A comunicação de dados pessoais de pessoa jurídica de direito público a pessoa de direito privado independe de informação à autoridade nacional, bastando o consentimento do titular.","c":"O art. 27 exige que a comunicação ou o uso compartilhado seja informado à ANPD e, em regra, que haja consentimento, com as exceções dos incisos I a III.","ap":-1},{"id":"lgpd-27-02","b":"lgpd-23-32","g":"C","l":"lgpd","art":"27","r":"LGPD, art. 27","t":["nas hipóteses de dispensa de consentimento previstas nesta Lei","nas exceções constantes do § 1º do art. 26 desta Lei"],"a":"excecao","d":3,"e":"A comunicação de dados de pessoa jurídica de direito público a pessoa de direito privado não depende de consentimento do titular nas hipóteses de dispensa de consentimento previstas na LGPD e nas exceções do § 1º do art. 26.","c":"Incisos I e III do art. 27. O inciso II trata do uso compartilhado com publicidade nos termos do art. 23, I.","ap":-1},{"id":"lgpd-29-01","b":"lgpd-23-32","g":"C","l":"lgpd","art":"29","r":"LGPD, art. 29","t":["A autoridade nacional poderá solicitar, a qualquer momento, aos órgãos e às entidades do poder público a realização de operações de tratamento de dados pessoais, informações específicas"],"a":"literal","d":2,"e":"A autoridade nacional pode solicitar, a qualquer momento, aos órgãos e entidades públicos informações específicas sobre o âmbito e a natureza dos dados tratados e emitir parecer técnico complementar para garantir o cumprimento da LGPD.","c":"Art. 29, com redação da Lei nº 13.853/2019. A mesma competência aparece no art. 55-J, XI.","ap":-1},{"id":"lgpd-30-01","b":"lgpd-23-32","g":"C","l":"lgpd","art":"30","r":"LGPD, art. 30","t":["A autoridade nacional poderá estabelecer normas complementares para as atividades de comunicação e de uso compartilhado de dados pessoais"],"a":"literal","d":1,"e":"A autoridade nacional pode estabelecer normas complementares para as atividades de comunicação e de uso compartilhado de dados pessoais.","c":"Art. 30. Junto com os arts. 26 e 27, é item da Agenda Regulatória 2025-2026 da ANPD.","ap":-1},{"id":"lgpd-31-01","b":"lgpd-23-32","g":"E","l":"lgpd","art":"31","r":"LGPD, art. 31","t":["a autoridade nacional poderá enviar informe com medidas cabíveis para fazer cessar a violação"],"a":"comparacao","d":2,"e":"Constatada infração à LGPD por órgão público, a lei determina que a ANPD aplique, de imediato, multa simples ao órgão infrator.","c":"O art. 31 prevê o envio de informe com medidas para fazer cessar a violação. Multas nem estão entre as sanções aplicáveis a órgãos públicos (art. 52, § 3º).","ap":-1},{"id":"lgpd-32-01","b":"lgpd-23-32","g":"C","l":"lgpd","art":"32","r":"LGPD, art. 32","t":["A autoridade nacional poderá solicitar a agentes do Poder Público a publicação de relatórios de impacto à proteção de dados pessoais"],"a":"literal","d":2,"e":"A autoridade nacional pode solicitar a agentes do Poder Público a publicação de relatórios de impacto à proteção de dados pessoais e sugerir a adoção de padrões e boas práticas.","c":"Art. 32. Para o Poder Público, a lei fala em publicação do relatório, o que vai além da simples elaboração (art. 38).","ap":-1},{"id":"lgpd-33-01","b":"lgpd-33-36","g":"C","l":"lgpd","art":"33","r":"LGPD, art. 33","t":["A transferência internacional de dados pessoais somente é permitida nos seguintes casos"],"a":"rol","d":1,"e":"A transferência internacional de dados pessoais somente é permitida nas hipóteses previstas na LGPD, que formam rol taxativo.","c":"O caput do art. 33 usa “somente”, o que torna o rol fechado. Fora dos nove incisos, a transferência é ilícita, mesmo com acordo entre as partes.","ap":-1},{"id":"lgpd-33-02","b":"lgpd-33-36","g":"C","l":"lgpd","art":"33","r":"LGPD, art. 33, I","t":["para países ou organismos internacionais que proporcionem grau de proteção de dados pessoais adequado ao previsto nesta Lei"],"a":"literal","d":1,"e":"É permitida a transferência internacional de dados pessoais para países ou organismos internacionais que proporcionem grau de proteção de dados pessoais adequado ao previsto na LGPD.","c":"Inciso I do art. 33: a chamada decisão de adequação. A Resolução CD/ANPD nº 32/2026 reconheceu a adequação da União Europeia.","ap":-1},{"id":"lgpd-33-03","b":"lgpd-33-36","g":"E","l":"lgpd","art":"33","r":"LGPD, art. 33, II","t":["quando o controlador oferecer e comprovar garantias de cumprimento dos princípios, dos direitos do titular e do regime de proteção de dados previstos nesta Lei"],"a":"sujeito","d":2,"e":"A transferência internacional é permitida quando o operador oferecer e comprovar garantias de cumprimento dos princípios e dos direitos do titular, na forma de cláusulas-padrão contratuais, normas corporativas globais ou selos.","c":"O inciso II do art. 33 atribui ao controlador o dever de oferecer e comprovar as garantias. As medidas do operador entram na análise (art. 35, § 5º), mas quem oferece é o controlador.","ap":-1},{"id":"lgpd-33-04","b":"lgpd-33-36","g":"C","l":"lgpd","art":"33","r":"LGPD, art. 33, II","t":["a) cláusulas contratuais específicas para determinada transferência","b) cláusulas-padrão contratuais","c) normas corporativas globais","d) selos, certificados e códigos de conduta regularmente emitidos"],"a":"rol","d":2,"e":"As garantias que o controlador pode oferecer para a transferência internacional incluem cláusulas contratuais específicas, cláusulas-padrão contratuais, normas corporativas globais e selos, certificados e códigos de conduta regularmente emitidos.","c":"As quatro alíneas do inciso II do art. 33. A Resolução CD/ANPD nº 19/2024 aprovou o modelo de cláusulas-padrão da ANPD.","ap":-1},{"id":"lgpd-33-05","b":"lgpd-33-36","g":"E","l":"lgpd","art":"33","r":"LGPD, art. 33, VIII","t":["quando o titular tiver fornecido o seu consentimento específico e em destaque para a transferência, com informação prévia sobre o caráter internacional da operação, distinguindo claramente esta de outras finalidades"],"a":"excecao","d":2,"e":"O consentimento do titular autoriza a transferência internacional ainda que fornecido de forma genérica em contrato de adesão, desde que o titular seja informado do caráter internacional da operação após a transferência.","c":"O inciso VIII exige consentimento específico e em destaque, com informação prévia sobre o caráter internacional, distinguindo essa finalidade das outras. Genérico e posterior são os dois erros do item.","ap":-1},{"id":"lgpd-33-06","b":"lgpd-33-36","g":"C","l":"lgpd","art":"33","r":"LGPD, art. 33, III","t":["quando a transferência for necessária para a cooperação jurídica internacional entre órgãos públicos de inteligência, de investigação e de persecução, de acordo com os instrumentos de direito internacional"],"a":"literal","d":2,"e":"A transferência internacional é permitida quando necessária para a cooperação jurídica internacional entre órgãos públicos de inteligência, de investigação e de persecução, de acordo com os instrumentos de direito internacional.","c":"Inciso III do art. 33. Os três tipos de órgão públicos (inteligência, investigação e persecução) e a exigência de instrumentos de direito internacional costumam ser trocados no item errado.","ap":-1},{"id":"lgpd-33-07","b":"lgpd-33-36","g":"E","l":"lgpd","art":"33","r":"LGPD, art. 33, IV","t":["quando a transferência for necessária para a proteção da vida ou da incolumidade física do titular ou de terceiro"],"a":"sujeito","d":1,"e":"A proteção da vida autoriza a transferência internacional de dados pessoais apenas quando o beneficiário for o próprio titular, e não terceiro.","c":"O inciso IV do art. 33 abrange a proteção da vida ou da incolumidade física “do titular ou de terceiro”.","ap":-1},{"id":"lgpd-33-08","b":"lgpd-33-36","g":"E","l":"lgpd","art":"33","r":"LGPD, art. 33, V","t":["quando a autoridade nacional autorizar a transferência"],"a":"rol","d":2,"e":"A autorização da autoridade nacional não constitui, isoladamente, hipótese autorizadora de transferência internacional, servindo apenas para confirmar uma das demais hipóteses do art. 33.","c":"O inciso V do art. 33 prevê a autorização da autoridade nacional como hipótese autônoma.","ap":-1},{"id":"lgpd-33-09","b":"lgpd-33-36","g":"C","l":"lgpd","art":"33","r":"LGPD, art. 33, IX","t":["quando necessário para atender as hipóteses previstas nos incisos II, V e VI do art. 7º desta Lei"],"a":"rol","d":3,"e":"A transferência internacional é permitida quando necessária para o cumprimento de obrigação legal ou regulatória pelo controlador, para a execução de contrato do qual seja parte o titular ou para o exercício regular de direitos em processo judicial, administrativo ou arbitral.","c":"O inciso IX do art. 33 remete aos incisos II (obrigação legal), V (contrato) e VI (exercício regular de direitos) do art. 7º.","ap":-1},{"id":"lgpd-33-10","b":"lgpd-33-36","g":"E","l":"lgpd","art":"33","r":"LGPD, art. 33, IX","t":["quando necessário para atender as hipóteses previstas nos incisos II, V e VI do art. 7º desta Lei"],"a":"rol","d":3,"e":"O legítimo interesse do controlador autoriza, por si só, a transferência internacional de dados pessoais, pois o art. 33 remete a essa base legal do art. 7º.","c":"O art. 33, IX, remete só aos incisos II, V e VI do art. 7º. Legítimo interesse (art. 7º, IX) não está na lista. Para transferir com base nele, é preciso outro mecanismo, como cláusulas-padrão.","ap":-1},{"id":"lgpd-33-11","b":"lgpd-33-36","g":"E","l":"lgpd","art":"33","r":"LGPD, art. 33, VII","t":["quando a transferência for necessária para a execução de política pública ou atribuição legal do serviço público, sendo dada publicidade nos termos do inciso I do caput do art. 23 desta Lei"],"a":"excecao","d":2,"e":"A transferência internacional necessária para a execução de política pública dispensa qualquer publicidade, por se tratar de atividade estatal.","c":"O inciso VII do art. 33 exige que se dê publicidade, nos termos do art. 23, I (informação clara e atualizada, preferencialmente em sítio eletrônico).","ap":-1},{"id":"lgpd-33-12","b":"lgpd-33-36","g":"C","l":"lgpd","art":"33","r":"LGPD, art. 33, VI","t":["quando a transferência resultar em compromisso assumido em acordo de cooperação internacional"],"a":"literal","d":2,"e":"A transferência internacional é permitida quando resultar em compromisso assumido em acordo de cooperação internacional.","c":"Inciso VI do art. 33. Não confunda com o inciso III, que trata de cooperação jurídica entre órgãos de inteligência, investigação e persecução.","ap":-1},{"id":"lgpd-33-13","b":"lgpd-33-36","g":"C","l":"lgpd","art":"33","r":"LGPD, art. 33, parágrafo único","t":["poderão requerer à autoridade nacional a avaliação do nível de proteção a dados pessoais conferido por país ou organismo internacional"],"a":"literal","d":3,"e":"As pessoas jurídicas de direito público referidas na Lei de Acesso à Informação, no âmbito de suas competências legais, podem requerer à autoridade nacional a avaliação do nível de proteção de dados conferido por país ou organismo internacional.","c":"Parágrafo único do art. 33. Na Resolução CD/ANPD nº 19/2024, o procedimento de adequação pode começar de ofício ou por pedido dessas pessoas jurídicas de direito público.","ap":-1},{"id":"lgpd-34-01","b":"lgpd-33-36","g":"C","l":"lgpd","art":"34","r":"LGPD, art. 34","t":["a existência de garantias judiciais e institucionais para o respeito aos direitos de proteção de dados pessoais","a natureza dos dados"],"a":"rol","d":2,"e":"Na avaliação do nível de proteção de dados de país estrangeiro, a autoridade nacional considera, entre outros fatores, a natureza dos dados e a existência de garantias judiciais e institucionais para o respeito aos direitos de proteção de dados.","c":"Incisos II e V do art. 34. O rol tem seis itens e o último é aberto (“outras circunstâncias específicas relativas à transferência”).","ap":-1},{"id":"lgpd-34-02","b":"lgpd-33-36","g":"E","l":"lgpd","art":"34","r":"LGPD, art. 34, VI","t":["outras circunstâncias específicas relativas à transferência"],"a":"absoluto","d":2,"e":"A ANPD avalia o nível de proteção de dados de país estrangeiro considerando exclusivamente as normas gerais e setoriais da legislação em vigor no país de destino.","c":"A legislação do país é só o inciso I do art. 34. Entram também a natureza dos dados, os princípios, as medidas de segurança, as garantias judiciais e institucionais e outras circunstâncias.","ap":-1},{"id":"lgpd-34-03","b":"lgpd-33-36","g":"E","l":"lgpd","art":"34","r":"LGPD, art. 34","t":["será avaliado pela autoridade nacional"],"a":"sujeito","d":1,"e":"A avaliação do nível de proteção de dados de país estrangeiro compete ao Ministério das Relações Exteriores, ouvida a ANPD.","c":"O art. 34 atribui a avaliação à autoridade nacional, sem participação obrigatória do Itamaraty.","ap":-1},{"id":"lgpd-35-01","b":"lgpd-33-36","g":"C","l":"lgpd","art":"35","r":"LGPD, art. 35","t":["A definição do conteúdo de cláusulas-padrão contratuais, bem como a verificação de cláusulas contratuais específicas para uma determinada transferência, normas corporativas globais ou selos, certificados e códigos de conduta","será realizada pela autoridade nacional"],"a":"sujeito","d":1,"e":"Compete à autoridade nacional definir o conteúdo das cláusulas-padrão contratuais e verificar cláusulas contratuais específicas, normas corporativas globais e selos, certificados e códigos de conduta.","c":"Caput do art. 35. A verificação dos instrumentos do art. 33, II, é da autoridade nacional, que pode designar organismos de certificação para ajudar (§ 3º).","ap":-1},{"id":"lgpd-35-02","b":"lgpd-33-36","g":"E","l":"lgpd","art":"35","r":"LGPD, art. 35, § 3º","t":["A autoridade nacional poderá designar organismos de certificação para a realização do previsto no caput deste artigo"],"a":"extrapolacao","d":2,"e":"É vedado à ANPD designar organismos de certificação para verificar cláusulas e normas corporativas globais, atividade que lhe é privativa.","c":"O § 3º do art. 35 permite que a ANPD designe organismos de certificação, que ficam sob sua fiscalização.","ap":-1},{"id":"lgpd-35-03","b":"lgpd-33-36","g":"E","l":"lgpd","art":"35","r":"LGPD, art. 35, § 4º","t":["Os atos realizados por organismo de certificação poderão ser revistos pela autoridade nacional e, caso em desconformidade com esta Lei, submetidos a revisão ou anulados"],"a":"extrapolacao","d":2,"e":"Os atos praticados por organismo de certificação designado pela ANPD são definitivos e não podem ser revistos pela agência.","c":"O § 4º do art. 35 permite à ANPD rever esses atos e, se desconformes, submetê-los a revisão ou anulá-los.","ap":-1},{"id":"lgpd-35-04","b":"lgpd-33-36","g":"C","l":"lgpd","art":"35","r":"LGPD, art. 35, § 2º","t":["poderão ser requeridas informações suplementares ou realizadas diligências de verificação quanto às operações de tratamento, quando necessário"],"a":"literal","d":2,"e":"Na análise de cláusulas contratuais ou de normas corporativas globais submetidas à sua aprovação, a autoridade nacional pode requerer informações suplementares ou realizar diligências de verificação quanto às operações de tratamento.","c":"§ 2º do art. 35. Repare no “quando necessário”: diligência e informação suplementar são faculdades da ANPD, não etapas obrigatórias.","ap":-1},{"id":"lgpd-35-05","b":"lgpd-33-36","g":"C","l":"lgpd","art":"35","r":"LGPD, art. 35, § 5º","t":["serão também analisadas de acordo com as medidas técnicas e organizacionais adotadas pelo operador"],"a":"literal","d":3,"e":"As garantias de observância dos princípios e dos direitos do titular apresentadas para a transferência internacional são analisadas também de acordo com as medidas técnicas e organizacionais adotadas pelo operador.","c":"§ 5º do art. 35, que remete aos §§ 1º e 2º do art. 46 (padrões técnicos de segurança e privacidade desde a concepção).","ap":-1},{"id":"lgpd-36-01","b":"lgpd-33-36","g":"E","l":"lgpd","art":"36","r":"LGPD, art. 36","t":["deverão ser comunicadas à autoridade nacional"],"a":"extrapolacao","d":2,"e":"As alterações nas garantias apresentadas para a transferência internacional dispensam comunicação à autoridade nacional, desde que mantido nível de proteção equivalente.","c":"O art. 36 manda comunicar à autoridade nacional as alterações nas garantias do art. 33, II, sem exceção.","ap":-1},{"id":"lgpd-5-xv-01","b":"lgpd-33-36","g":"C","l":"lgpd","art":"5","r":"LGPD, art. 5º, XV","t":["transferência internacional de dados: transferência de dados pessoais para país estrangeiro ou organismo internacional do qual o país seja membro"],"a":"conceito","d":2,"e":"Para a LGPD, transferência internacional de dados é a transferência de dados pessoais para país estrangeiro ou para organismo internacional do qual o Brasil seja membro.","c":"Art. 5º, XV. A Resolução CD/ANPD nº 19/2024 distingue transferência internacional de coleta internacional; a segunda não é transferência.","ap":-1},{"id":"lgpd2-33-01","b":"lgpd-33-36","g":"C","l":"lgpd","art":"33","r":"LGPD, art. 33, II","t":["selos, certificados e códigos de conduta regularmente emitidos"],"a":"rol","d":1,"e":"Selos, certificados e códigos de conduta regularmente emitidos estão entre as formas pelas quais o controlador pode oferecer e comprovar garantias para a transferência internacional de dados pessoais.","c":"Art. 33, II, alínea d. As quatro formas: cláusulas contratuais específicas, cláusulas-padrão contratuais, normas corporativas globais e selos, certificados e códigos de conduta.","ap":-1,"p":["Cláusulas-padrão contratuais da ANPD (Resolução 19/2024)"]},{"id":"lgpd2-33-02","b":"lgpd-33-36","g":"C","l":"lgpd","art":"33","r":"LGPD, art. 33, VIII","t":["consentimento específico e em destaque para a transferência, com informação prévia sobre o caráter internacional da operação, distinguindo claramente esta de outras finalidades"],"a":"caso","d":2,"e":"Situação hipotética: no cadastro de um aplicativo, a usuária marcou caixa própria, separada das demais autorizações, concordando com a transferência de seus dados para servidores no exterior, após ser informada desse caráter internacional. Assertiva: esse consentimento atende à hipótese de transferência internacional baseada no consentimento do titular.","c":"Art. 33, VIII: consentimento específico e em destaque, com informação prévia sobre o caráter internacional, distinguindo essa finalidade das demais.","ap":-1},{"id":"lgpd2-33-03","b":"lgpd-33-36","g":"E","l":"lgpd","art":"33","r":"LGPD, art. 33, IX","t":["quando necessário para atender as hipóteses previstas nos incisos II, V e VI do art. 7º desta Lei"],"a":"rol","d":3,"e":"A transferência internacional de dados pessoais é permitida quando necessária para a proteção do crédito, em razão da remissão do art. 33 da LGPD às bases legais do art. 7º.","c":"O inciso IX remete só aos incisos II, V e VI do art. 7º: obrigação legal ou regulatória, execução de contrato e exercício regular de direitos em processo. Proteção do crédito (art. 7º, X) e legítimo interesse (IX) ficam de fora.","ap":-1},{"id":"lgpd2-33-04","b":"lgpd-33-36","g":"E","l":"lgpd","art":"33","r":"LGPD, art. 33, parágrafo único","t":["as pessoas jurídicas de direito público referidas no parágrafo único do art. 1º da Lei nº 12.527, de 18 de novembro de 2011 (Lei de Acesso à Informação), no âmbito de suas competências legais, e responsáveis, no âmbito de suas atividades, poderão requerer à autoridade nacional a avaliação do nível de proteção"],"a":"sujeito","d":3,"e":"O parágrafo único do art. 33 da LGPD confere a qualquer pessoa jurídica de direito privado a prerrogativa de requerer à autoridade nacional a avaliação do nível de proteção de dados conferido por país estrangeiro.","c":"O parágrafo único menciona as pessoas jurídicas de direito público referidas na Lei de Acesso à Informação e os responsáveis, no âmbito de suas atividades. A generalização para qualquer pessoa jurídica de direito privado não está no texto.","ap":-1},{"id":"lgpd2-34-01","b":"lgpd-33-36","g":"C","l":"lgpd","art":"34","r":"LGPD, art. 34, V","t":["a existência de garantias judiciais e institucionais para o respeito aos direitos de proteção de dados pessoais"],"a":"rol","d":2,"e":"Na avaliação do nível de proteção de dados de país estrangeiro, a autoridade nacional considera a existência de garantias judiciais e institucionais para o respeito aos direitos de proteção de dados pessoais.","c":"Art. 34, V. Os seis critérios: normas gerais e setoriais; natureza dos dados; princípios e direitos; medidas de segurança; garantias judiciais e institucionais; outras circunstâncias.","ap":-1,"p":["Decisão de adequação (adequacy decision) no GDPR"]},{"id":"lgpd2-35-01","b":"lgpd-33-36","g":"C","l":"lgpd","art":"35","r":"LGPD, art. 35, § 1º","t":["deverão ser considerados os requisitos, as condições e as garantias mínimas para a transferência que observem os direitos, as garantias e os princípios desta Lei"],"a":"literal","d":2,"e":"Na verificação de cláusulas contratuais, normas corporativas globais e selos para transferência internacional, deverão ser considerados os requisitos, as condições e as garantias mínimas que observem os direitos, as garantias e os princípios da LGPD.","c":"Art. 35, § 1º. O caput atribui à autoridade nacional a definição das cláusulas-padrão e a verificação dos demais instrumentos.","ap":-1},{"id":"lgpd2-38-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"38","r":"LGPD, art. 38, parágrafo único","t":["o relatório deverá conter, no mínimo, a descrição dos tipos de dados coletados, a metodologia utilizada para a coleta e para a garantia da segurança das informações e a análise do controlador com relação a medidas, salvaguardas e mecanismos de mitigação de risco adotados"],"a":"rol","d":2,"e":"O relatório de impacto à proteção de dados pessoais deverá conter, no mínimo, a descrição dos tipos de dados coletados, a metodologia utilizada para a coleta e para a garantia da segurança das informações e a análise do controlador sobre medidas, salvaguardas e mecanismos de mitigação de risco adotados.","c":"Conteúdo mínimo do RIPD, art. 38, parágrafo único. A definição do relatório está no art. 5º, XVII.","ap":-1,"p":["Relatório de impacto à proteção de dados (RIPD): modelo da ANPD"]},{"id":"lgpd2-38-02","b":"lgpd-37-45","g":"E","l":"lgpd","art":"38","r":"LGPD, art. 38","t":["A autoridade nacional poderá determinar ao controlador que elabore relatório de impacto à proteção de dados pessoais"],"a":"extrapolacao","d":2,"e":"Segundo o art. 38 da LGPD, todo controlador deve elaborar e publicar anualmente relatório de impacto à proteção de dados pessoais, independentemente de determinação da autoridade nacional.","c":"O art. 38 diz que a autoridade nacional “poderá determinar” a elaboração, nos termos de regulamento. A lei não fixa periodicidade anual nem dever geral de publicação.","ap":-1},{"id":"lgpd2-39-01","b":"lgpd-37-45","g":"E","l":"lgpd","art":"39","r":"LGPD, art. 39","t":["O operador deverá realizar o tratamento segundo as instruções fornecidas pelo controlador, que verificará a observância das próprias instruções e das normas sobre a matéria."],"a":"sujeito","d":1,"e":"O operador deve realizar o tratamento segundo as instruções do controlador, cabendo ao próprio operador verificar a observância dessas instruções e das normas sobre a matéria.","c":"Quem verifica a observância das instruções é o controlador. O item trocou o sujeito.","ap":-1},{"id":"lgpd2-40-01","b":"lgpd-37-45","g":"E","l":"lgpd","art":"40","r":"LGPD, art. 40","t":["assim como sobre o tempo de guarda dos registros"],"a":"numero","d":2,"e":"A LGPD fixa em cinco anos o tempo mínimo de guarda dos registros das operações de tratamento de dados pessoais.","c":"A lei não fixa prazo. O art. 40 permite à autoridade nacional dispor sobre o tempo de guarda dos registros, considerando especialmente a necessidade e a transparência.","ap":-1},{"id":"lgpd2-41-01","b":"lgpd-37-45","g":"C","l":"lgpd","art":"41","r":"LGPD, art. 41, § 2º, III","t":["orientar os funcionários e os contratados da entidade a respeito das práticas a serem tomadas em relação à proteção de dados pessoais"],"a":"rol","d":1,"e":"Entre as atividades do encarregado está orientar os funcionários e os contratados da entidade a respeito das práticas a serem tomadas em relação à proteção de dados pessoais.","c":"Art. 41, § 2º, III. As quatro atividades: reclamações dos titulares; comunicações da autoridade; orientação interna; demais atribuições do controlador ou de normas complementares.","ap":-1,"p":["Resolução CD/ANPD 18/2024 (atuação do encarregado)"]},{"id":"lgpd2-41-02","b":"lgpd-37-45","g":"C","l":"lgpd","art":"41","r":"LGPD, art. 41, § 3º","t":["inclusive hipóteses de dispensa da necessidade de sua indicação, conforme a natureza e o porte da entidade ou o volume de operações de tratamento de dados"],"a":"excecao","d":2,"e":"A autoridade nacional poderá estabelecer hipóteses de dispensa da indicação de encarregado, conforme a natureza e o porte da entidade ou o volume de operações de tratamento de dados.","c":"Art. 41, § 3º. Foi com base nele que o regulamento de agentes de pequeno porte (Resolução CD/ANPD nº 2/2022) tratou da dispensa do encarregado.","ap":-1,"p":["Agentes de tratamento de pequeno porte e encarregado"]},{"id":"lgpd2-42-01","b":"lgpd-37-45","g":"E","l":"lgpd","art":"42","r":"LGPD, art. 42","t":["causar a outrem dano patrimonial, moral, individual ou coletivo"],"a":"extrapolacao","d":2,"e":"A obrigação de reparar prevista no art. 42 da LGPD restringe-se aos danos individuais, cabendo a reparação de danos coletivos exclusivamente às sanções administrativas da ANPD.","c":"O caput do art. 42 abrange dano patrimonial, moral, individual ou coletivo. O § 3º prevê ações coletivas de reparação em juízo.","ap":-1},{"id":"lgpd2-42-02","b":"lgpd-37-45","g":"C","l":"lgpd","art":"42","r":"LGPD, art. 42, § 2º","t":["quando, a seu juízo, for verossímil a alegação, houver hipossuficiência para fins de produção de prova ou quando a produção de prova pelo titular resultar-lhe excessivamente onerosa"],"a":"literal","d":2,"e":"No processo civil, o juiz poderá inverter o ônus da prova a favor do titular dos dados quando, a seu juízo, for verossímil a alegação, houver hipossuficiência para fins de produção de prova ou quando a produção de prova pelo titular resultar-lhe excessivamente onerosa.","c":"Art. 42, § 2º. A inversão é faculdade do juiz (“poderá”), e as três situações são alternativas.","ap":-1},{"id":"lgpd2-42-03","b":"lgpd-37-45","g":"C","l":"lgpd","art":"42","r":"LGPD, art. 42, § 1º, I","t":["quando
