) seja atualizado constantemente com base em informações obtidas a partir de monitoramento contínuo e avaliações periódicas;\nII - demonstrar a efetividade de seu programa de governança em privacidade quando apropriado e, em especial, a pedido da autoridade nacional ou de outra entidade responsável por promover o cumprimento de boas práticas ou códigos de conduta, os quais, de forma independente, promovam o cumprimento desta Lei.\n§ 3º As regras de boas práticas e de governança deverão ser publicadas e atualizadas periodicamente e poderão ser reconhecidas e divulgadas pela autoridade nacional."},{"id":"51","rotulo":"Art. 51","estrutura":["CAPÍTULO VII — DA SEGURANÇA E DAS BOAS PRÁTICAS","Seção II — Das Boas Práticas e da Governança"],"texto":"Art. 51. A autoridade nacional estimulará a adoção de padrões técnicos que facilitem o controle pelos titulares dos seus dados pessoais."},{"id":"52","rotulo":"Art. 52","estrutura":["CAPÍTULO VIII — DA FISCALIZAÇÃO","Seção I — Das Sanções Administrativas"],"texto":"Art. 52. Os agentes de tratamento de dados, em razão das infrações cometidas às normas previstas nesta Lei, ficam sujeitos às seguintes sanções administrativas aplicáveis pela autoridade nacional:\nI - advertência, com indicação de prazo para adoção de medidas corretivas;\nII - multa simples, de até 2% (dois por cento) do faturamento da pessoa jurídica de direito privado, grupo ou conglomerado no Brasil no seu último exercício, excluídos os tributos, limitada, no total, a R$ 50.000.000,00 (cinquenta milhões de reais) por infração;\nIII - multa diária, observado o limite total a que se refere o inciso II;\nIV - publicização da infração após devidamente apurada e confirmada a sua ocorrência;\nV - bloqueio dos dados pessoais a que se refere a infração até a sua regularização;\nVI - eliminação dos dados pessoais a que se refere a infração;\nVII - (VETADO);\nVIII - (VETADO);\nIX - (VETADO).\nX - suspensão parcial do funcionamento do banco de dados a que se refere a infração pelo período máximo de 6 (seis) meses, prorrogável por igual período, até a regularização da atividade de tratamento pelo controlador; (Incluído pela Lei nº 13.853, de 2019)\nXI - suspensão do exercício da atividade de tratamento dos dados pessoais a que se refere a infração pelo período máximo de 6 (seis) meses, prorrogável por igual período; (Incluído pela Lei nº 13.853, de 2019)\nXII - proibição parcial ou total do exercício de atividades relacionadas a tratamento de dados. (Incluído pela Lei nº 13.853, de 2019)\n§ 1º As sanções serão aplicadas após procedimento administrativo que possibilite a oportunidade da ampla defesa, de forma gradativa, isolada ou cumulativa, de acordo com as peculiaridades do caso concreto e considerados os seguintes parâmetros e critérios:\nI - a gravidade e a natureza das infrações e dos direitos pessoais afetados;\nII - a boa-fé do infrator;\nIII - a vantagem auferida ou pretendida pelo infrator;\nIV - a condição econômica do infrator;\nV - a reincidência;\nVI - o grau do dano;\nVII - a cooperação do infrator;\nVIII - a adoção reiterada e demonstrada de mecanismos e procedimentos internos capazes de minimizar o dano, voltados ao tratamento seguro e adequado de dados, em consonância com o disposto no inciso II do § 2º do art. 48 desta Lei;\nIX - a adoção de política de boas práticas e governança;\nX - a pronta adoção de medidas corretivas; e\nXI - a proporcionalidade entre a gravidade da falta e a intensidade da sanção.\n§ 2º O disposto neste artigo não substitui a aplicação de sanções administrativas, civis ou penais definidas na Lei nº 8.078, de 11 de setembro de 1990, e em legislação específica. (Redação dada pela Lei nº 13.853, de 2019)\n§ 3º O disposto nos incisos I, IV, V, VI, X, XI e XII do caput deste artigo poderá ser aplicado às entidades e aos órgãos públicos, sem prejuízo do disposto na Lei nº 8.112, de 11 de dezembro de 1990, na Lei nº 8.429, de 2 de junho de 1992, e na Lei nº 12.527, de 18 de novembro de 2011. (Promulgação partes vetadas)\n§ 4º No cálculo do valor da multa de que trata o inciso II do caput deste artigo, a autoridade nacional poderá considerar o faturamento total da empresa ou grupo de empresas, quando não dispuser do valor do faturamento no ramo de atividade empresarial em que ocorreu a infração, definido pela autoridade nacional, ou quando o valor for apresentado de forma incompleta ou não for demonstrado de forma inequívoca e idônea.\n§ 5º O produto da arrecadação das multas aplicadas pela ANPD, inscritas ou não em dívida ativa, será destinado ao Fundo de Defesa de Direitos Difusos de que tratam o art. 13 da Lei nº 7.347, de 24 de julho de 1985, e a Lei nº 9.008, de 21 de março de 1995. (Incluído pela Lei nº 13.853, de 2019)\n§ 6º As sanções previstas nos incisos X, XI e XII do caput deste artigo serão aplicadas: (Incluído pela Lei nº 13.853, de 2019)\nI - somente após já ter sido imposta ao menos 1 (uma) das sanções de que tratam os incisos II, III, IV, V e VI do caput deste artigo para o mesmo caso concreto; e (Incluído pela Lei nº 13.853, de 2019)\nII - em caso de controladores submetidos a outros órgãos e entidades com competências sancionatórias, ouvidos esses órgãos. (Incluído pela Lei nº 13.853, de 2019)\n§ 7º Os vazamentos individuais ou os acessos não autorizados de que trata o caput do art. 46 desta Lei poderão ser objeto de conciliação direta entre controlador e titular e, caso não haja acordo, o controlador estará sujeito à aplicação das penalidades de que trata este artigo. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"53","rotulo":"Art. 53","estrutura":["CAPÍTULO VIII — DA FISCALIZAÇÃO","Seção I — Das Sanções Administrativas"],"texto":"Art. 53. A autoridade nacional definirá, por meio de regulamento próprio sobre sanções administrativas a infrações a esta Lei, que deverá ser objeto de consulta pública, as metodologias que orientarão o cálculo do valor-base das sanções de multa.\n§ 1º As metodologias a que se refere o caput deste artigo devem ser previamente publicadas, para ciência dos agentes de tratamento, e devem apresentar objetivamente as formas e dosimetrias para o cálculo do valor-base das sanções de multa, que deverão conter fundamentação detalhada de todos os seus elementos, demonstrando a observância dos critérios previstos nesta Lei.\n§ 2º O regulamento de sanções e metodologias correspondentes deve estabelecer as circunstâncias e as condições para a adoção de multa simples ou diária."},{"id":"54","rotulo":"Art. 54","estrutura":["CAPÍTULO VIII — DA FISCALIZAÇÃO","Seção I — Das Sanções Administrativas"],"texto":"Art. 54. O valor da sanção de multa diária aplicável às infrações a esta Lei deve observar a gravidade da falta e a extensão do dano ou prejuízo causado e ser fundamentado pela autoridade nacional.\nParágrafo único. A intimação da sanção de multa diária deverá conter, no mínimo, a descrição da obrigação imposta, o prazo razoável e estipulado pelo órgão para o seu cumprimento e o valor da multa diária a ser aplicada pelo seu descumprimento."},{"id":"55","rotulo":"Art. 55","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55. (VETADO)."},{"id":"55-A","rotulo":"Art. 55-A","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-A. Fica criada a Agência Nacional de Proteção de Dados (ANPD), autarquia de natureza especial vinculada ao Ministério da Justiça e Segurança Pública, dotada de autonomia funcional, técnica, decisória, administrativa e financeira, com patrimônio próprio e com sede e foro no Distrito Federal, nos termos da Lei nº 13.848, de 25 de junho de 2019. (Redação dada pela Lei nº 15.352, de 2026)\n§ 1º (Revogado pela Lei nº 14.460, de 2022)\n§ 2º (Revogado pela Lei nº 14.460, de 2022)\n§ 3º (Revogado pela Lei nº 14.460, de 2022)"},{"id":"55-B","rotulo":"Art. 55-B","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-B. (Revogado pela Lei nº 14.460, de 2022)"},{"id":"55-C","rotulo":"Art. 55-C","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-C. A ANPD é composta de: (Incluído pela Lei nº 13.853, de 2019)\nI - Conselho Diretor, órgão máximo de direção; (Incluído pela Lei nº 13.853, de 2019)\nII - Conselho Nacional de Proteção de Dados Pessoais e da Privacidade; (Incluído pela Lei nº 13.853, de 2019)\nIII - Corregedoria; (Incluído pela Lei nº 13.853, de 2019)\nIV - Ouvidoria; (Incluído pela Lei nº 13.853, de 2019)\nV - (revogado); (Redação dada pela Lei nº 14.460, de 2022)\nV-A - Procuradoria; (Redação dada pela Lei nº 15.352, de 2026)\nV-B - Auditoria; e (Incluído pela Lei nº 15.352, de 2026)\nVI - unidades administrativas e unidades especializadas. (Redação dada pela Lei nº 15.352, de 2026)"},{"id":"55-D","rotulo":"Art. 55-D","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-D. O Conselho Diretor da ANPD será composto de 5 (cinco) diretores, incluído o Diretor-Presidente. (Incluído pela Lei nº 13.853, de 2019)\n§ 1º Os membros do Conselho Diretor da ANPD serão escolhidos pelo Presidente da República e por ele nomeados, após aprovação pelo Senado Federal, nos termos da alínea 'f' do inciso III do art. 52 da Constituição Federal, e ocuparão cargo em comissão do Grupo-Direção e Assessoramento Superiores - DAS, no mínimo, de nível 5. (Incluído pela Lei nº 13.853, de 2019)\n§ 2º Os membros do Conselho Diretor serão escolhidos dentre brasileiros que tenham reputação ilibada, nível superior de educação e elevado conceito no campo de especialidade dos cargos para os quais serão nomeados. (Incluído pela Lei nº 13.853, de 2019)\n§ 3º O mandato dos membros do Conselho Diretor será de 4 (quatro) anos. (Incluído pela Lei nº 13.853, de 2019)\n§ 4º Os mandatos dos primeiros membros do Conselho Diretor nomeados serão de 2 (dois), de 3 (três), de 4 (quatro), de 5 (cinco) e de 6 (seis) anos, conforme estabelecido no ato de nomeação. (Incluído pela Lei nº 13.853, de 2019)\n§ 5º Na hipótese de vacância do cargo no curso do mandato de membro do Conselho Diretor, o prazo remanescente será completado pelo sucessor. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"55-E","rotulo":"Art. 55-E","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-E. Os membros do Conselho Diretor somente perderão seus cargos em virtude de renúncia, condenação judicial transitada em julgado ou pena de demissão decorrente de processo administrativo disciplinar. (Incluído pela Lei nº 13.853, de 2019)\n§ 1º Nos termos do caput deste artigo, cabe ao Ministro de Estado Chefe da Casa Civil da Presidência da República instaurar o processo administrativo disciplinar, que será conduzido por comissão especial constituída por servidores públicos federais estáveis. (Incluído pela Lei nº 13.853, de 2019)\n§ 2º Compete ao Presidente da República determinar o afastamento preventivo, somente quando assim recomendado pela comissão especial de que trata o § 1º deste artigo, e proferir o julgamento. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"55-F","rotulo":"Art. 55-F","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-F. Aplica-se aos membros do Conselho Diretor, após o exercício do cargo, o disposto no art. 6º da Lei nº 12.813, de 16 de maio de 2013. (Incluído pela Lei nº 13.853, de 2019)\nParágrafo único. A infração ao disposto no caput deste artigo caracteriza ato de improbidade administrativa. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"55-G","rotulo":"Art. 55-G","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-G. Ato do Presidente da República disporá sobre a estrutura regimental da ANPD. (Incluído pela Lei nº 13.853, de 2019)\n§ 1º Até a data de entrada em vigor de sua estrutura regimental, a ANPD receberá o apoio técnico e administrativo da Casa Civil da Presidência da República para o exercício de suas atividades. (Incluído pela Lei nº 13.853, de 2019)\n§ 2º O Conselho Diretor disporá sobre o regimento interno da ANPD. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"55-H","rotulo":"Art. 55-H","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-H. Os cargos em comissão e as funções de confiança da ANPD serão remanejados de outros órgãos e entidades do Poder Executivo federal. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"55-I","rotulo":"Art. 55-I","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-I. Os ocupantes dos cargos em comissão e das funções de confiança da ANPD serão indicados pelo Conselho Diretor e nomeados ou designados pelo Diretor-Presidente. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"55-J","rotulo":"Art. 55-J","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-J. Compete à ANPD: (Incluído pela Lei nº 13.853, de 2019)\nI - zelar pela proteção dos dados pessoais, nos termos da legislação; (Incluído pela Lei nº 13.853, de 2019)\nII - zelar pela observância dos segredos comercial e industrial, observada a proteção de dados pessoais e do sigilo das informações quando protegido por lei ou quando a quebra do sigilo violar os fundamentos do art. 2º desta Lei; (Incluído pela Lei nº 13.853, de 2019)\nIII - elaborar diretrizes para a Política Nacional de Proteção de Dados Pessoais e da Privacidade; (Incluído pela Lei nº 13.853, de 2019)\nIV - fiscalizar e aplicar sanções em caso de tratamento de dados realizado em descumprimento à legislação, mediante processo administrativo que assegure o contraditório, a ampla defesa e o direito de recurso; (Incluído pela Lei nº 13.853, de 2019)\nV - apreciar petições de titular contra controlador após comprovada pelo titular a apresentação de reclamação ao controlador não solucionada no prazo estabelecido em regulamentação; (Incluído pela Lei nº 13.853, de 2019)\nVI - promover na população o conhecimento das normas e das políticas públicas sobre proteção de dados pessoais e das medidas de segurança; (Incluído pela Lei nº 13.853, de 2019)\nVII - promover e elaborar estudos sobre as práticas nacionais e internacionais de proteção de dados pessoais e privacidade; (Incluído pela Lei nº 13.853, de 2019)\nVIII - estimular a adoção de padrões para serviços e produtos que facilitem o exercício de controle dos titulares sobre seus dados pessoais, os quais deverão levar em consideração as especificidades das atividades e o porte dos responsáveis; (Incluído pela Lei nº 13.853, de 2019)\nIX - promover ações de cooperação com autoridades de proteção de dados pessoais de outros países, de natureza internacional ou transnacional; (Incluído pela Lei nº 13.853, de 2019)\nX - dispor sobre as formas de publicidade das operações de tratamento de dados pessoais, respeitados os segredos comercial e industrial; (Incluído pela Lei nº 13.853, de 2019)\nXI - solicitar, a qualquer momento, às entidades do poder público que realizem operações de tratamento de dados pessoais informe específico sobre o âmbito, a natureza dos dados e os demais detalhes do tratamento realizado, com a possibilidade de emitir parecer técnico complementar para garantir o cumprimento desta Lei; (Incluído pela Lei nº 13.853, de 2019)\nXII - elaborar relatórios de gestão anuais acerca de suas atividades; (Incluído pela Lei nº 13.853, de 2019)\nXIII - editar regulamentos e procedimentos sobre proteção de dados pessoais e privacidade, bem como sobre relatórios de impacto à proteção de dados pessoais para os casos em que o tratamento representar alto risco à garantia dos princípios gerais de proteção de dados pessoais previstos nesta Lei; (Incluído pela Lei nº 13.853, de 2019)\nXIV - ouvir os agentes de tratamento e a sociedade em matérias de interesse relevante e prestar contas sobre suas atividades e planejamento; (Incluído pela Lei nº 13.853, de 2019)\nXV - arrecadar e aplicar suas receitas e publicar, no relatório de gestão a que se refere o inciso XII do caput deste artigo, o detalhamento de suas receitas e despesas; (Incluído pela Lei nº 13.853, de 2019)\nXVI - realizar auditorias, ou determinar sua realização, no âmbito da atividade de fiscalização de que trata o inciso IV e com a devida observância do disposto no inciso II do caput deste artigo, sobre o tratamento de dados pessoais efetuado pelos agentes de tratamento, incluído o poder público; (Incluído pela Lei nº 13.853, de 2019)\nXVII - celebrar, a qualquer momento, compromisso com agentes de tratamento para eliminar irregularidade, incerteza jurídica ou situação contenciosa no âmbito de processos administrativos, de acordo com o previsto no Decreto-Lei nº 4.657, de 4 de setembro de 1942; (Incluído pela Lei nº 13.853, de 2019)\nXVIII - editar normas, orientações e procedimentos simplificados e diferenciados, inclusive quanto aos prazos, para que microempresas e empresas de pequeno porte, bem como iniciativas empresariais de caráter incremental ou disruptivo que se autodeclarem startups ou empresas de inovação, possam adequar-se a esta Lei; (Incluído pela Lei nº 13.853, de 2019)\nXIX - garantir que o tratamento de dados de idosos seja efetuado de maneira simples, clara, acessível e adequada ao seu entendimento, nos termos desta Lei e da Lei nº 10.741, de 1º de outubro de 2003 (Estatuto do Idoso); (Incluído pela Lei nº 13.853, de 2019)\nXX - deliberar, na esfera administrativa, em caráter terminativo, sobre a interpretação desta Lei, as suas competências e os casos omissos; (Incluído pela Lei nº 13.853, de 2019)\nXXI - comunicar às autoridades competentes as infrações penais das quais tiver conhecimento; (Incluído pela Lei nº 13.853, de 2019)\nXXII - comunicar aos órgãos de controle interno o descumprimento do disposto nesta Lei por órgãos e entidades da administração pública federal; (Incluído pela Lei nº 13.853, de 2019)\nXXIII - articular-se com as autoridades reguladoras públicas para exercer suas competências em setores específicos de atividades econômicas e governamentais sujeitas à regulação; e (Incluído pela Lei nº 13.853, de 2019)\nXXIV - implementar mecanismos simplificados, inclusive por meio eletrônico, para o registro de reclamações sobre o tratamento de dados pessoais em desconformidade com esta Lei. (Incluído pela Lei nº 13.853, de 2019)\n§ 1º Ao impor condicionantes administrativas ao tratamento de dados pessoais por agente de tratamento privado, sejam eles limites, encargos ou sujeições, a ANPD deve observar a exigência de mínima intervenção, assegurados os fundamentos, os princípios e os direitos dos titulares previstos no art. 170 da Constituição Federal e nesta Lei. (Incluído pela Lei nº 13.853, de 2019)\n§ 2º Os regulamentos e as normas editados pela ANPD devem ser precedidos de consulta e audiência públicas, bem como de análises de impacto regulatório. (Incluído pela Lei nº 13.853, de 2019)\n§ 3º A ANPD e os órgãos e entidades públicos responsáveis pela regulação de setores específicos da atividade econômica e governamental devem coordenar suas atividades, nas correspondentes esferas de atuação, com vistas a assegurar o cumprimento de suas atribuições com a maior eficiência e promover o adequado funcionamento dos setores regulados, conforme legislação específica, e o tratamento de dados pessoais, na forma desta Lei. (Incluído pela Lei nº 13.853, de 2019)\n§ 4º A ANPD manterá fórum permanente de comunicação, inclusive por meio de cooperação técnica, com órgãos e entidades da administração pública responsáveis pela regulação de setores específicos da atividade econômica e governamental, a fim de facilitar as competências regulatória, fiscalizatória e punitiva da ANPD. (Incluído pela Lei nº 13.853, de 2019)\n§ 5º No exercício das competências de que trata o caput deste artigo, a autoridade competente deverá zelar pela preservação do segredo empresarial e do sigilo das informações, nos termos da lei. (Incluído pela Lei nº 13.853, de 2019)\n§ 6º As reclamações colhidas conforme o disposto no inciso V do caput deste artigo poderão ser analisadas de forma agregada, e as eventuais providências delas decorrentes poderão ser adotadas de forma padronizada. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"55-K","rotulo":"Art. 55-K","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-K. A aplicação das sanções previstas nesta Lei compete exclusivamente à ANPD, e suas competências prevalecerão, no que se refere à proteção de dados pessoais, sobre as competências correlatas de outras entidades ou órgãos da administração pública. (Incluído pela Lei nº 13.853, de 2019)\nParágrafo único. A ANPD articulará sua atuação com outros órgãos e entidades com competências sancionatórias e normativas afetas ao tema de proteção de dados pessoais e será o órgão central de interpretação desta Lei e do estabelecimento de normas e diretrizes para a sua implementação. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"55-L","rotulo":"Art. 55-L","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-L. Constituem receitas da ANPD: (Incluído pela Lei nº 13.853, de 2019)\nI - as dotações, consignadas no orçamento geral da União, os créditos especiais, os créditos adicionais, as transferências e os repasses que lhe forem conferidos; (Incluído pela Lei nº 13.853, de 2019)\nII - as doações, os legados, as subvenções e outros recursos que lhe forem destinados; (Incluído pela Lei nº 13.853, de 2019)\nIII - os valores apurados na venda ou aluguel de bens móveis e imóveis de sua propriedade; (Incluído pela Lei nº 13.853, de 2019)\nIV - os valores apurados em aplicações no mercado financeiro das receitas previstas neste artigo; (Incluído pela Lei nº 13.853, de 2019)\nV - (VETADO); (Incluído pela Lei nº 13.853, de 2019)\nVI - os recursos provenientes de acordos, convênios ou contratos celebrados com entidades, organismos ou empresas, públicos ou privados, nacionais ou internacionais; (Incluído pela Lei nº 13.853, de 2019)\nVII - o produto da venda de publicações, material técnico, dados e informações, inclusive para fins de licitação pública. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"55-M","rotulo":"Art. 55-M","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 55-M. Constituem o patrimônio da ANPD os bens e os direitos: (Incluído pela Lei nº 14.460, de 2022)\nI - que lhe forem transferidos pelos órgãos da Presidência da República; e (Incluído pela Lei nº 14.460, de 2022)\nII - que venha a adquirir ou a incorporar. (Incluído pela Lei nº 14.460, de 2022)"},{"id":"56","rotulo":"Art. 56","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 56. (VETADO)."},{"id":"57","rotulo":"Art. 57","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção I — Da Agência Nacional de Proteção de Dados"],"texto":"Art. 57. (VETADO)."},{"id":"58","rotulo":"Art. 58","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção II — Do Conselho Nacional de Proteção de Dados Pessoais e da Privacidade"],"texto":"Art. 58. (VETADO)."},{"id":"58-A","rotulo":"Art. 58-A","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção II — Do Conselho Nacional de Proteção de Dados Pessoais e da Privacidade"],"texto":"Art. 58-A. O Conselho Nacional de Proteção de Dados Pessoais e da Privacidade será composto de 23 (vinte e três) representantes, titulares e suplentes, dos seguintes órgãos: (Incluído pela Lei nº 13.853, de 2019)\nI - 5 (cinco) do Poder Executivo federal; (Incluído pela Lei nº 13.853, de 2019)\nII - 1 (um) do Senado Federal; (Incluído pela Lei nº 13.853, de 2019)\nIII - 1 (um) da Câmara dos Deputados; (Incluído pela Lei nº 13.853, de 2019)\nIV - 1 (um) do Conselho Nacional de Justiça; (Incluído pela Lei nº 13.853, de 2019)\nV - 1 (um) do Conselho Nacional do Ministério Público; (Incluído pela Lei nº 13.853, de 2019)\nVI - 1 (um) do Comitê Gestor da Internet no Brasil; (Incluído pela Lei nº 13.853, de 2019)\nVII - 3 (três) de entidades da sociedade civil com atuação relacionada a proteção de dados pessoais; (Incluído pela Lei nº 13.853, de 2019)\nVIII - 3 (três) de instituições científicas, tecnológicas e de inovação; (Incluído pela Lei nº 13.853, de 2019)\nIX - 3 (três) de confederações sindicais representativas das categorias econômicas do setor produtivo; (Incluído pela Lei nº 13.853, de 2019)\nX - 2 (dois) de entidades representativas do setor empresarial relacionado à área de tratamento de dados pessoais; e (Incluído pela Lei nº 13.853, de 2019)\nXI - 2 (dois) de entidades representativas do setor laboral. (Incluído pela Lei nº 13.853, de 2019)\n§ 1º Os representantes serão designados por ato do Presidente da República, permitida a delegação. (Incluído pela Lei nº 13.853, de 2019)\n§ 2º Os representantes de que tratam os incisos I, II, III, IV, V e VI do caput deste artigo e seus suplentes serão indicados pelos titulares dos respectivos órgãos e entidades da administração pública. (Incluído pela Lei nº 13.853, de 2019)\n§ 3º Os representantes de que tratam os incisos VII, VIII, IX, X e XI do caput deste artigo e seus suplentes: (Incluído pela Lei nº 13.853, de 2019)\nI - serão indicados na forma de regulamento; (Incluído pela Lei nº 13.853, de 2019)\nII - não poderão ser membros do Comitê Gestor da Internet no Brasil; (Incluído pela Lei nº 13.853, de 2019)\nIII - terão mandato de 2 (dois) anos, permitida 1 (uma) recondução. (Incluído pela Lei nº 13.853, de 2019)\n§ 4º A participação no Conselho Nacional de Proteção de Dados Pessoais e da Privacidade será considerada prestação de serviço público relevante, não remunerada. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"58-B","rotulo":"Art. 58-B","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção II — Do Conselho Nacional de Proteção de Dados Pessoais e da Privacidade"],"texto":"Art. 58-B. Compete ao Conselho Nacional de Proteção de Dados Pessoais e da Privacidade: (Incluído pela Lei nº 13.853, de 2019)\nI - propor diretrizes estratégicas e fornecer subsídios para a elaboração da Política Nacional de Proteção de Dados Pessoais e da Privacidade e para a atuação da ANPD; (Incluído pela Lei nº 13.853, de 2019)\nII - elaborar relatórios anuais de avaliação da execução das ações da Política Nacional de Proteção de Dados Pessoais e da Privacidade; (Incluído pela Lei nº 13.853, de 2019)\nIII - sugerir ações a serem realizadas pela ANPD; (Incluído pela Lei nº 13.853, de 2019)\nIV - elaborar estudos e realizar debates e audiências públicas sobre a proteção de dados pessoais e da privacidade; e (Incluído pela Lei nº 13.853, de 2019)\nV - disseminar o conhecimento sobre a proteção de dados pessoais e da privacidade à população. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"59","rotulo":"Art. 59","estrutura":["CAPÍTULO IX — DA AGÊNCIA NACIONAL DE PROTEÇÃO DE DADOS E DO CONSELHO NACIONAL DE PROTEÇÃO DE DADOS PESSOAIS E DA PRIVACIDADE (Redação dada pela Lei nº 15.352, de 2026)","Seção II — Do Conselho Nacional de Proteção de Dados Pessoais e da Privacidade"],"texto":"Art. 59. (VETADO)."},{"id":"60","rotulo":"Art. 60","estrutura":["CAPÍTULO X — DISPOSIÇÕES FINAIS E TRANSITÓRIAS"],"texto":"Art. 60. A Lei nº 12.965, de 23 de abril de 2014 (Marco Civil da Internet), passa a vigorar com as seguintes alterações:\n\"Art. 7º X - exclusão definitiva dos dados pessoais que tiver fornecido a determinada aplicação de internet, a seu requerimento, ao término da relação entre as partes, ressalvadas as hipóteses de guarda obrigatória de registros previstas nesta Lei e na que dispõe sobre a proteção de dados pessoais;\" (NR)\n\"Art. 16. II - de dados pessoais que sejam excessivos em relação à finalidade para a qual foi dado consentimento pelo seu titular, exceto nas hipóteses previstas na Lei que dispõe sobre a proteção de dados pessoais.\" (NR)"},{"id":"61","rotulo":"Art. 61","estrutura":["CAPÍTULO X — DISPOSIÇÕES FINAIS E TRANSITÓRIAS"],"texto":"Art. 61. A empresa estrangeira será notificada e intimada de todos os atos processuais previstos nesta Lei, independentemente de procuração ou de disposição contratual ou estatutária, na pessoa do agente ou representante ou pessoa responsável por sua filial, agência, sucursal, estabelecimento ou escritório instalado no Brasil."},{"id":"62","rotulo":"Art. 62","estrutura":["CAPÍTULO X — DISPOSIÇÕES FINAIS E TRANSITÓRIAS"],"texto":"Art. 62. A autoridade nacional e o Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira (Inep), no âmbito de suas competências, editarão regulamentos específicos para o acesso a dados tratados pela União para o cumprimento do disposto no § 2º do art. 9º da Lei nº 9.394, de 20 de dezembro de 1996 (Lei de Diretrizes e Bases da Educação Nacional), e aos referentes ao Sistema Nacional de Avaliação da Educação Superior (Sinaes), de que trata a Lei nº 10.861, de 14 de abril de 2004."},{"id":"63","rotulo":"Art. 63","estrutura":["CAPÍTULO X — DISPOSIÇÕES FINAIS E TRANSITÓRIAS"],"texto":"Art. 63. A autoridade nacional estabelecerá normas sobre a adequação progressiva de bancos de dados constituídos até a data de entrada em vigor desta Lei, consideradas a complexidade das operações de tratamento e a natureza dos dados."},{"id":"64","rotulo":"Art. 64","estrutura":["CAPÍTULO X — DISPOSIÇÕES FINAIS E TRANSITÓRIAS"],"texto":"Art. 64. Os direitos e princípios expressos nesta Lei não excluem outros previstos no ordenamento jurídico pátrio relacionados à matéria ou nos tratados internacionais em que a República Federativa do Brasil seja parte."},{"id":"65","rotulo":"Art. 65","estrutura":["CAPÍTULO X — DISPOSIÇÕES FINAIS E TRANSITÓRIAS"],"texto":"Art. 65. Esta Lei entra em vigor: (Redação dada pela Lei nº 13.853, de 2019)\nI - dia 28 de dezembro de 2018, quanto aos arts. 55-A, 55-B, 55-C, 55-D, 55-E, 55-F, 55-G, 55-H, 55-I, 55-J, 55-K, 55-L, 58-A e 58-B; e (Incluído pela Lei nº 13.853, de 2019)\nI-A - dia 1º de agosto de 2021, quanto aos arts. 52, 53 e 54; (Incluído pela Lei nº 14.010, de 2020)\nII - 24 (vinte e quatro) meses após a data de sua publicação, quanto aos demais artigos. (Incluído pela Lei nº 13.853, de 2019)"}]}},"cronograma":{"edital":"2026-12-22","doc":"https://claude.ai/code/artifact/dc438565-b7df-4271-adaa-11c991fa271e","fases":[{"id":"f1","titulo":"Fase 1","subtitulo":"LGPD prioridade 1 e as 3 resoluções máximas","periodo":"05/10 a 25/10","semanas":[{"titulo":"Semana 1","periodo":"05/10 a 11/10","dias":[{"data":"2026-10-05","atividade":"Questões + leitura literal: LGPD arts. 17 a 22 (direitos do titular e decisão automatizada)","duracao":"1h45","modo":"treino","blocos":["lgpd-17-22"],"n":20},{"data":"2026-10-06","atividade":"Questões + leitura literal: LGPD arts. 52 a 54 (sanções e dosimetria)","duracao":"1h45","modo":"treino","blocos":["lgpd-52-54"],"n":20},{"data":"2026-10-07","atividade":"Questões + leitura: Resolução CD/ANPD 1/2021 (fiscalização e processo sancionador)","duracao":"1h45","modo":"treino","blocos":["res-1-2021","lgpd-52-54","lgpd-55"],"n":20},{"data":"2026-10-08","atividade":"Tronco fixo: Lei 13.848/2019,  pessoais, estabelecido em um ou em vários locais, em suporte {{eletrônico ou físico}};"},{"id":"cz-166pkyt","b":"lgpd-5-11","art":"5","r":"LGPD, art. 5º, VI","t":"controlador: pessoa natural ou jurídica, de direito público ou privado, a quem competem as {{decisões}} referentes ao tratamento de dados pessoais;"},{"id":"cz-1p0qk2r","b":"lgpd-5-11","art":"5","r":"LGPD, art. 5º, VII","t":"operador: pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais {{em nome do controlador}};"},{"id":"cz-1jvpv2o","b":"lgpd-5-11","art":"5","r":"LGPD, art. 5º, VIII","t":"encarregado: pessoa indicada pelo {{controlador e operador}} para atuar como canal de comunicação"},{"id":"cz-1me4mu6","b":"lgpd-5-11","art":"5","r":"LGPD, art. 5º, IX","t":"agentes de tratamento: o {{controlador e o operador}};"},{"id":"cz-1twc0d1","b":"lgpd-5-11","art":"5","r":"LGPD, art. 5º, XII","t":"consentimento: manifestação {{livre, informada e inequívoca}} pela qual o titular concorda com o tratamento de seus dados pessoais para uma {{finalidade determinada}};"},{"id":"cz-gsdw2","b":"lgpd-5-11","art":"5","r":"LGPD, art. 5º, XIII","t":"bloqueio: suspensão {{temporária}} de qualquer operação de tratamento, mediante guarda do dado pessoal ou do banco de dados;"},{"id":"cz-zkfx59","b":"lgpd-5-11","art":"5","r":"LGPD, art. 5º, XIV","t":"eliminação: exclusão de dado ou de conjunto de dados armazenados em banco de dados, {{independentemente do procedimento empregado}};"},{"id":"cz-is2xzd","b":"lgpd-5-11","art":"5","r":"LGPD, art. 5º, XV","t":"transferência internacional de dados: transferência de dados pessoais para país estrangeiro ou {{organismo internacional do qual o país seja membro}};"},{"id":"cz-pu8j8q","b":"lgpd-5-11","art":"5","r":"LGPD, art. 5º, XVII","t":"relatório de impacto à proteção de dados pessoais: documentação do {{controlador}} que contém a descrição dos processos de tratamento de dados pessoais que podem gerar riscos às liberdades civis e aos direitos fundamentais"},{"id":"cz-h7jdk9","b":"lgpd-5-11","art":"5","r":"LGPD, art. 5º, XVIII","t":"ou pessoa jurídica de direito privado {{sem fins lucrativos}} legalmente constituída sob as leis brasileiras, com sede e foro no País"},{"id":"cz-w1tp3k","b":"lgpd-5-11","art":"5","r":"LGPD, art. 5º, XIX","t":"autoridade nacional: {{entidade}} da administração pública responsável por zelar, implementar e fiscalizar o cumprimento desta Lei em todo o território nacional","dc":"órgão ou entidade?"},{"id":"cz-md9lew","b":"lgpd-5-11","art":"6","r":"LGPD, art. 6º","t":"As atividades de tratamento de dados pessoais deverão observar a {{boa-fé}} e os seguintes princípios"},{"id":"cz-doot9d","b":"lgpd-5-11","art":"6","r":"LGPD, art. 6º, I","t":"finalidade: realização do tratamento para propósitos {{legítimos, específicos, explícitos e informados}} ao titular"},{"id":"cz-1frcau5","b":"lgpd-5-11","art":"6","r":"LGPD, art. 6º, II","t":"{{adequação}}: compatibilidade do tratamento com as finalidades informadas ao titular, de acordo com o contexto do tratamento;"},{"id":"cz-1qgvaa2","b":"lgpd-5-11","art":"6","r":"LGPD, art. 6º, III","t":"{{necessidade}}: limitação do tratamento ao mínimo necessário para a realização de suas finalidades"},{"id":"cz-1epl6qc","b":"lgpd-5-11","art":"6","r":"LGPD, art. 6º, IV","t":"{{livre acesso}}: garantia, aos titulares, de consulta facilitada e gratuita sobre a forma e a duração do tratamento"},{"id":"cz-mlp1u7","b":"lgpd-5-11","art":"6","r":"LGPD, art. 6º, V","t":"{{qualidade dos dados}}: garantia, aos titulares, de exatidão, clareza, relevância e atualização dos dados"},{"id":"cz-8oxbm8","b":"lgpd-5-11","art":"6","r":"LGPD, art. 6º, VI","t":"{{transparência}}: garantia, aos titulares, de informações claras, precisas e facilmente acessíveis sobre a realização do tratamento"},{"id":"cz-gbtccl","b":"lgpd-5-11","art":"6","r":"LGPD, art. 6º, VII","t":"{{segurança}}: utilização de medidas técnicas e administrativas aptas a proteger os dados pessoais de acessos não autorizados"},{"id":"cz-1mmczwe","b":"lgpd-5-11","art":"6","r":"LGPD, art. 6º, VIII","t":"{{prevenção}}: adoção de medidas para prevenir a ocorrência de danos em virtude do tratamento de dados pessoais;"},{"id":"cz-1dwu5z9","b":"lgpd-5-11","art":"6","r":"LGPD, art. 6º, IX","t":"não discriminação: impossibilidade de realização do tratamento para fins discriminatórios {{ilícitos ou abusivos}};"},{"id":"cz-mrhrpb","b":"lgpd-5-11","art":"6","r":"LGPD, art. 6º, X","t":"{{responsabilização e prestação de contas}}: demonstração, pelo agente, da adoção de medidas eficazes"},{"id":"cz-1ojdhoy","b":"lgpd-5-11","art":"7","r":"LGPD, art. 7º","t":"O tratamento de dados pessoais {{somente}} poderá ser realizado nas seguintes hipóteses"},{"id":"cz-u52pqb","b":"lgpd-5-11","art":"7","r":"LGPD, art. 7º, IV","t":"para a realização de estudos por órgão de pesquisa, garantida, {{sempre que possível}}, a anonimização dos dados pessoais;"},{"id":"cz-1r936ai","b":"lgpd-5-11","art":"7","r":"LGPD, art. 7º, V","t":"quando necessário para a execução de contrato ou de procedimentos preliminares relacionados a contrato do qual seja parte o titular, {{a pedido do titular}} dos dados;"},{"id":"cz-1a30zp0","b":"lgpd-5-11","art":"7","r":"LGPD, art. 7º, VIII","t":"para a tutela da saúde, {{exclusivamente}}, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária;"},{"id":"cz-1di2hjh","b":"lgpd-5-11","art":"7","r":"LGPD, art. 7º, IX","t":"quando necessário para atender aos {{interesses legítimos}} do controlador ou de terceiro, exceto no caso de prevalecerem direitos e liberdades fundamentais do titular"},{"id":"cz-temcc6","b":"lgpd-5-11","art":"7","r":"LGPD, art. 7º, X","t":"para a {{proteção do crédito}}, inclusive quanto ao disposto na legislação pertinente."},{"id":"cz-lzgu7b","b":"lgpd-5-11","art":"7","r":"LGPD, art. 7º, § 4º","t":"É dispensada a exigência do consentimento previsto no caput deste artigo para os dados tornados {{manifestamente públicos}} pelo titular"},{"id":"cz-pyt2ey","b":"lgpd-5-11","art":"7","r":"LGPD, art. 7º, § 5º","t":"deverá obter consentimento {{específico}} do titular para esse fim, ressalvadas as hipóteses de dispensa do consentimento previstas nesta Lei."},{"id":"cz-q7lezw","b":"lgpd-5-11","art":"8","r":"LGPD, art. 8º","t":"deverá ser fornecido por escrito ou {{por outro meio que demonstre a manifestação de vontade do titular}}."},{"id":"cz-x9xzac","b":"lgpd-5-11","art":"8","r":"LGPD, art. 8º, § 1º","t":"Caso o consentimento seja fornecido por escrito, esse deverá constar de {{cláusula destacada}} das demais cláusulas contratuais."},{"id":"cz-dcakp4","b":"lgpd-5-11","art":"8","r":"LGPD, art. 8º, § 2º","t":"Cabe ao {{controlador}} o ônus da prova de que o consentimento foi obtido em conformidade com o disposto nesta Lei."},{"id":"cz-vmxeka","b":"lgpd-5-11","art":"8","r":"LGPD, art. 8º, § 4º","t":"O consentimento deverá referir-se a finalidades determinadas, e as autorizações genéricas para o tratamento de dados pessoais serão {{nulas}}."},{"id":"cz-73m51r","b":"lgpd-5-11","art":"8","r":"LGPD, art. 8º, § 5º","t":"O consentimento pode ser revogado {{a qualquer momento}} mediante manifestação expressa do titular, por procedimento {{gratuito e facilitado}}"},{"id":"cz-10li89d","b":"lgpd-5-11","art":"9","r":"LGPD, art. 9º","t":"que deverão ser disponibilizadas de forma {{clara, adequada e ostensiva}}"},{"id":"cz-1xyt6xc","b":"lgpd-5-11","art":"9","r":"LGPD, art. 9º, § 1º","t":"esse será considerado {{nulo}} caso as informações fornecidas ao titular tenham conteúdo enganoso ou abusivo"},{"id":"cz-7qtxhn","b":"lgpd-5-11","art":"10","r":"LGPD, art. 10","t":"para finalidades legítimas, consideradas a partir de situações concretas, que incluem, {{mas não se limitam a}}:","dc":"rol exemplificativo"},{"id":"cz-pusoi5","b":"lgpd-5-11","art":"10","r":"LGPD, art. 10, § 1º","t":"Quando o tratamento for baseado no legítimo interesse do controlador, somente os dados pessoais {{estritamente necessários}} para a finalidade pretendida poderão ser tratados."},{"id":"cz-1174vty","b":"lgpd-5-11","art":"10","r":"LGPD, art. 10, § 3º","t":"A autoridade nacional poderá solicitar ao controlador {{relatório de impacto à proteção de dados pessoais}}, quando o tratamento tiver como fundamento seu interesse legítimo"},{"id":"cz-10qp1v1","b":"lgpd-5-11","art":"11","r":"LGPD, art. 11, I","t":"quando o titular ou seu responsável legal consentir, de forma {{específica e destacada}}, para finalidades específicas;"},{"id":"cz-10yiwa4","b":"lgpd-5-11","art":"11","r":"LGPD, art. 11, II","t":"sem fornecimento de consentimento do titular, nas hipóteses em que for {{indispensável}} para:"},{"id":"cz-178z641","b":"lgpd-5-11","art":"11","r":"LGPD, art. 11, II, g","t":"garantia da {{prevenção à fraude}} e à segurança do titular, nos processos de identificação e autenticação de cadastro em sistemas eletrônicos"},{"id":"cz-53zy8g","b":"lgpd-5-11","art":"11","r":"LGPD, art. 11, § 5º","t":"É vedado às operadoras de planos privados de assistência à saúde o tratamento de dados de saúde para a prática de {{seleção de riscos}} na contratação de qualquer modalidade"},{"id":"cz-18tgu77","b":"lgpd-12-16","art":"12","r":"LGPD, art. 12","t":"Os dados anonimizados não serão considerados dados pessoais para os fins desta Lei, salvo quando o processo de anonimização ao qual foram submetidos for revertido, utilizando {{exclusivamente meios próprios}}, ou quando, com {{esforços razoáveis}}, puder ser revertido."},{"id":"cz-1c9scix","b":"lgpd-12-16","art":"12","r":"LGPD, art. 12, § 1º","t":"deve levar em consideração fatores objetivos, tais como {{custo e tempo}} necessários para reverter o processo de anonimização"},{"id":"cz-1as57oh","b":"lgpd-12-16","art":"12","r":"LGPD, art. 12, § 2º","t":"aqueles utilizados para formação do {{perfil comportamental}} de determinada pessoa natural, se identificada."},{"id":"cz-1uj5zr6","b":"lgpd-12-16","art":"12","r":"LGPD, art. 12, § 3º","t":"realizar verificações acerca de sua segurança, ouvido o {{Conselho Nacional de Proteção de Dados Pessoais}}."},{"id":"cz-1omp5vv","b":"lgpd-12-16","art":"13","r":"LGPD, art. 13","t":"mantidos em ambiente {{controlado e seguro}}"},{"id":"cz-qufec4","b":"lgpd-12-16","art":"13","r":"LGPD, art. 13, § 1º","t":"A divulgação dos resultados ou de qualquer excerto do estudo ou da pesquisa de que trata o caput deste artigo {{em nenhuma hipótese}} poderá revelar dados pessoais."},{"id":"cz-1ir37n9","b":"lgpd-12-16","art":"13","r":"LGPD, art. 13, § 2º","t":"não permitida, {{em circunstância alguma}}, a transferência dos dados a terceiro."},{"id":"cz-1gzmmq2","b":"lgpd-12-16","art":"13","r":"LGPD, art. 13, § 4º","t":"a {{pseudonimização}} é o tratamento por meio do qual um dado perde a possibilidade de associação, direta ou indireta, a um indivíduo, senão pelo uso de informação adicional mantida separadamente pelo controlador"},{"id":"cz-aqtlx4","b":"lgpd-12-16","art":"15","r":"LGPD, art. 15, IV","t":"determinação da autoridade nacional, {{quando houver violação}} ao disposto nesta Lei."},{"id":"cz-1dy0lq7","b":"lgpd-12-16","art":"16","r":"LGPD, art. 16, IV","t":"uso exclusivo do controlador, vedado seu acesso por terceiro, e desde que {{anonimizados}} os dados."},{"id":"cz-9qx2yw","b":"lgpd-17-22","art":"17","r":"LGPD, art. 17","t":"Toda {{pessoa natural}} tem assegurada a titularidade de seus dados pessoais"},{"id":"cz-sxqid6","b":"lgpd-17-22","art":"18","r":"LGPD, art. 18","t":"em relação aos dados do titular por ele tratados, {{a qualquer momento}} e mediante requisição:"},{"id":"cz-nrye4m","b":"lgpd-17-22","art":"18","r":"LGPD, art. 18, III","t":"{{correção}} de dados incompletos, inexatos ou desatualizados;"},{"id":"cz-qj1bww","b":"lgpd-17-22","art":"18","r":"LGPD, art. 18, V","t":"portabilidade dos dados a outro fornecedor de serviço ou produto, mediante {{requisição expressa}}, de acordo com a regulamentação da autoridade nacional"},{"id":"cz-11q7v78","b":"lgpd-17-22","art":"18","r":"LGPD, art. 18, VI","t":"eliminação dos dados pessoais tratados com o consentimento do titular, exceto nas hipóteses previstas no {{art. 16}} desta Lei;"},{"id":"cz-1bcbj3o","b":"lgpd-17-22","art":"18","r":"LGPD, art. 18, VII","t":"informação das {{entidades públicas e privadas}} com as quais o controlador realizou uso compartilhado de dados;"},{"id":"cz-14exnvu","b":"lgpd-17-22","art":"18","r":"LGPD, art. 18, § 2º","t":"O titular pode {{opor-se}} a tratamento realizado com fundamento em uma das hipóteses de dispensa de consentimento, {{em caso de descumprimento}} ao disposto nesta Lei."},{"id":"cz-10wnfhz","b":"lgpd-17-22","art":"18","r":"LGPD, art. 18, § 3º","t":"Os direitos previstos neste artigo serão exercidos mediante requerimento expresso do titular ou de {{representante legalmente constituído}}, a agente de tratamento."},{"id":"cz-12zbzup","b":"lgpd-17-22","art":"18","r":"LGPD, art. 18, § 5º","t":"O requerimento referido no § 3º deste artigo será atendido {{sem custos}} para o titular"},{"id":"cz-trpocs","b":"lgpd-17-22","art":"18","r":"LGPD, art. 18, § 7º","t":"A portabilidade dos dados pessoais a que se refere o inciso V do caput deste artigo não inclui dados que já tenham sido {{anonimizados}} pelo controlador."},{"id":"cz-ntjtuk","b":"lgpd-17-22","art":"18","r":"LGPD, art. 18, § 8º","t":"O direito a que se refere o § 1º deste artigo também poderá ser exercido perante os {{organismos de defesa do consumidor}}."},{"id":"cz-8gg0ax","b":"lgpd-17-22","art":"19","r":"LGPD, art. 19, I","t":"em formato simplificado, {{imediatamente}}; ou"},{"id":"cz-zurqsd","b":"lgpd-17-22","art":"19","r":"LGPD, art. 19, II","t":"fornecida no prazo de até {{15 (quinze) dias}}, contado da data do requerimento do titular."},{"id":"cz-1w51zzl","b":"lgpd-17-22","art":"19","r":"LGPD, art. 19, § 2º","t":"As informações e os dados poderão ser fornecidos, {{a critério do titular}}:"},{"id":"cz-9ju09v","b":"lgpd-17-22","art":"19","r":"LGPD, art. 19, § 3º","t":"Quando o tratamento tiver origem no {{consentimento do titular ou em contrato}}, o titular poderá solicitar cópia eletrônica integral de seus dados pessoais"},{"id":"cz-1qld1ty","b":"lgpd-17-22","art":"20","r":"LGPD, art. 20","t":"O titular dos dados tem direito a solicitar a {{revisão}} de decisões tomadas {{unicamente}} com base em tratamento automatizado de dados pessoais que afetem seus interesses"},{"id":"cz-1fr15yu","b":"lgpd-17-22","art":"20","r":"LGPD, art. 20, § 1º","t":"O controlador deverá fornecer, {{sempre que solicitadas}}, informações claras e adequadas a respeito dos critérios e dos procedimentos utilizados para a decisão automatizada"},{"id":"cz-1qs4cuk","b":"lgpd-17-22","art":"20","r":"LGPD, art. 20, § 2º","t":"a autoridade nacional poderá realizar {{auditoria}} para verificação de aspectos discriminatórios em tratamento automatizado de dados pessoais."},{"id":"cz-ve00ei","b":"lgpd-17-22","art":"20","r":"LGPD, art. 20, § 3º","t":"§ 3º {{(VETADO)}}.","dc":"revisão humana"},{"id":"cz-9ni51a","b":"lgpd-17-22","art":"21","r":"LGPD, art. 21","t":"Os dados pessoais referentes ao exercício regular de direitos pelo titular não podem ser utilizados {{em seu prejuízo}}."},{"id":"cz-1vszv5b","b":"lgpd-17-22","art":"22","r":"LGPD, art. 22","t":"A defesa dos interesses e dos direitos dos titulares de dados poderá ser exercida em juízo, {{individual ou coletivamente}}"},{"id":"cz-1ursvll","b":"lgpd-23-32","art":"23","r":"LGPD, art. 23","t":"deverá ser realizado para o atendimento de sua {{finalidade pública}}, na persecução do {{interesse público}}"},{"id":"cz-sr6me5","b":"lgpd-23-32","art":"23","r":"LGPD, art. 23, I","t":"em veículos de fácil acesso, {{preferencialmente em seus sítios eletrônicos}};"},{"id":"cz-14jrep1","b":"lgpd-23-32","art":"23","r":"LGPD, art. 23, III","t":"seja indicado um {{encarregado}} quando realizarem operações de tratamento de dados pessoais"},{"id":"cz-ozsik8","b":"lgpd-23-32","art":"23","r":"LGPD, art. 23, § 3º","t":"em especial as disposições constantes da Lei nº 9.507, de 12 de novembro de 1997 ({{Lei do Habeas Data}})"},{"id":"cz-1a0rcyb","b":"lgpd-23-32","art":"23","r":"LGPD, art. 23, § 4º","t":"Os serviços {{notariais e de registro}} exercidos em caráter privado, por delegação do Poder Público, terão o mesmo tratamento dispensado às pessoas jurídicas referidas no caput deste artigo"},{"id":"cz-1ky98h4","b":"lgpd-23-32","art":"24","r":"LGPD, art. 24","t":"As empresas públicas e as sociedades de economia mista que atuam em {{regime de concorrência}}, sujeitas ao disposto no art. 173 da Constituição Federal, terão o mesmo tratamento dispensado às pessoas jurídicas de {{direito privado}} particulares"},{"id":"cz-13uxai1","b":"lgpd-23-32","art":"25","r":"LGPD, art. 25","t":"Os dados deverão ser mantidos em formato {{interoperável e estruturado}} para o uso compartilhado"},{"id":"cz-1vxyupc","b":"lgpd-23-32","art":"26","r":"LGPD, art. 26, § 1º","t":"É {{vedado}} ao Poder Público transferir a entidades privadas dados pessoais constantes de bases de dados a que tenha acesso, exceto:"},{"id":"cz-5jm854","b":"lgpd-23-32","art":"26","r":"LGPD, art. 26, § 1º, I","t":"em casos de {{execução descentralizada de atividade pública}} que exija a transferência, exclusivamente para esse fim específico e determinado"},{"id":"cz-1w4e45f","b":"lgpd-23-32","art":"26","r":"LGPD, art. 26, § 1º, V","t":"na hipótese de a transferência dos dados objetivar exclusivamente a {{prevenção de fraudes e irregularidades}}"},{"id":"cz-11rony0","b":"lgpd-23-32","art":"26","r":"LGPD, art. 26, § 2º","t":"Os contratos e convênios de que trata o § 1º deste artigo deverão ser {{comunicados à autoridade nacional}}."},{"id":"cz-175mki6","b":"lgpd-23-32","art":"27","r":"LGPD, art. 27","t":"A comunicação ou o uso compartilhado de dados pessoais de pessoa jurídica de direito público a pessoa de direito privado será {{informado à autoridade nacional}} e dependerá de {{consentimento do titular}}, exceto:"},{"id":"cz-n4s1dy","b":"lgpd-23-32","art":"29","r":"LGPD, art. 29","t":"e poderá emitir {{parecer técnico complementar}} para garantir o cumprimento desta Lei."},{"id":"cz-12v9yjy","b":"lgpd-23-32","art":"31","r":"LGPD, art. 31","t":"a autoridade nacional poderá enviar {{informe}} com medidas cabíveis para fazer cessar a violação.","dc":"órgão público infrator"},{"id":"cz-1f1re7z","b":"lgpd-23-32","art":"32","r":"LGPD, art. 32","t":"A autoridade nacional poderá solicitar a agentes do Poder Público a {{publicação}} de relatórios de impacto à proteção de dados pessoais"},{"id":"cz-hjgeku","b":"lgpd-33-36","art":"33","r":"LGPD, art. 33","t":"A transferência internacional de dados pessoais {{somente}} é permitida nos seguintes casos:"},{"id":"cz-lr6xsn","b":"lgpd-33-36","art":"33","r":"LGPD, art. 33, I","t":"para países ou organismos internacionais que proporcionem grau de proteção de dados pessoais {{adequado}} ao previsto nesta Lei;"},{"id":"cz-bhebvh","b":"lgpd-33-36","art":"33","r":"LGPD, art. 33, II","t":"quando o {{controlador}} oferecer e comprovar garantias de cumprimento dos princípios, dos direitos do titular e do regime de proteção de dados previstos nesta Lei"},{"id":"cz-1asnsy4","b":"lgpd-33-36","art":"33","r":"LGPD, art. 33, II, c","t":"c) {{normas corporativas globais}};"},{"id":"cz-156t2zr","b":"lgpd-33-36","art":"33","r":"LGPD, art. 33, II, d","t":"d) {{selos, certificados e códigos de conduta}} regularmente emitidos;"},{"id":"cz-dio4yb","b":"lgpd-33-36","art":"33","r":"LGPD, art. 33, III","t":"para a {{cooperação jurídica internacional}} entre órgãos públicos de inteligência, de investigação e de persecução"},{"id":"cz-gu966r","b":"lgpd-33-36","art":"33","r":"LGPD, art. 33, V","t":"quando a {{autoridade nacional}} autorizar a transferência;"},{"id":"cz-12n7ocd","b":"lgpd-33-36","art":"33","r":"LGPD, art. 33, VIII","t":"quando o titular tiver fornecido o seu consentimento {{específico e em destaque}} para a transferência, com informação {{prévia}} sobre o caráter internacional da operação"},{"id":"cz-10xvsr","b":"lgpd-33-36","art":"33","r":"LGPD, art. 33, IX","t":"quando necessário para atender as hipóteses previstas nos incisos {{II, V e VI}} do art. 7º desta Lei.","dc":"obrigação legal, contrato, exercício de direitos"},{"id":"cz-4nrypo","b":"lgpd-33-36","art":"34","r":"LGPD, art. 34","t":"O nível de proteção de dados do país estrangeiro ou do organismo internacional mencionado no inciso I do caput do art. 33 desta Lei será avaliado pela {{autoridade nacional}}"},{"id":"cz-rz8ie","b":"lgpd-33-36","art":"34","r":"LGPD, art. 34, V","t":"a existência de {{garantias judiciais e institucionais}} para o respeito aos direitos de proteção de dados pessoais; e"},{"id":"cz-85ha1l","b":"lgpd-33-36","art":"35","r":"LGPD, art. 35, § 3º","t":"A autoridade nacional poderá designar {{organismos de certificação}} para a realização do previsto no caput deste artigo, que permanecerão sob sua fiscalização"},{"id":"cz-1jpegmw","b":"lgpd-33-36","art":"35","r":"LGPD, art. 35, § 4º","t":"Os atos realizados por organismo de certificação poderão ser {{revistos}} pela autoridade nacional e, caso em desconformidade com esta Lei, submetidos a revisão ou {{anulados}}."},{"id":"cz-g9ojph","b":"lgpd-33-36","art":"36","r":"LGPD, art. 36","t":"deverão ser {{comunicadas à autoridade nacional}}.","dc":"alterações nas garantias"},{"id":"cz-1uivjp3","b":"lgpd-37-45","art":"37","r":"LGPD, art. 37","t":"O controlador e o operador devem manter {{registro das operações}} de tratamento de dados pessoais que realizarem, especialmente quando baseado no {{legítimo interesse}}."},{"id":"cz-1et3fb7","b":"lgpd-37-45","art":"38","r":"LGPD, art. 38","t":"A autoridade nacional poderá {{determinar}} ao controlador que elabore relatório de impacto à proteção de dados pessoais, inclusive de dados sensíveis"},{"id":"cz-9xgwdl","b":"lgpd-37-45","art":"39","r":"LGPD, art. 39","t":"O operador deverá realizar o tratamento segundo as {{instruções fornecidas pelo controlador}}"},{"id":"cz-1csfcob","b":"lgpd-37-45","art":"41","r":"LGPD, art. 41","t":"O {{controlador}} deverá indicar encarregado pelo tratamento de dados pessoais."},{"id":"cz-1t5rgtr","b":"lgpd-37-45","art":"41","r":"LGPD, art. 41, § 1º","t":"A identidade e as informações de contato do encarregado deverão ser {{divulgadas publicamente}}, de forma clara e objetiva, preferencialmente no sítio eletrônico do controlador."},{"id":"cz-15wwexb","b":"lgpd-37-45","art":"41","r":"LGPD, art. 41, § 3º","t":"inclusive hipóteses de {{dispensa}} da necessidade de sua indicação, conforme a natureza e o porte da entidade ou o volume de operações de tratamento de dados."},{"id":"cz-6jlwl2","b":"lgpd-37-45","art":"42","r":"LGPD, art. 42","t":"causar a outrem dano {{patrimonial, moral, individual ou coletivo}}, em violação à legislação de proteção de dados pessoais, é obrigado a repará-lo."},{"id":"cz-mytiem","b":"lgpd-37-45","art":"42","r":"LGPD, art. 42, § 1º, I","t":"o operador responde {{solidariamente}} pelos danos causados pelo tratamento quando descumprir as obrigações da legislação de proteção de dados ou quando não tiver seguido as {{instruções lícitas}} do controlador"},{"id":"cz-13w3ghh","b":"lgpd-37-45","art":"42","r":"LGPD, art. 42, § 2º","t":"O juiz, no processo civil, {{poderá}} inverter o ônus da prova a favor do titular dos dados quando, a seu juízo, for verossímil a alegação"},{"id":"cz-1izy1ye","b":"lgpd-37-45","art":"42","r":"LGPD, art. 42, § 4º","t":"Aquele que reparar o dano ao titular tem direito de {{regresso}} contra os demais responsáveis, na medida de sua participação no evento danoso."},{"id":"cz-eqb0ja","b":"lgpd-37-45","art":"43","r":"LGPD, art. 43","t":"Os agentes de tratamento {{só não}} serão responsabilizados quando provarem:"},{"id":"cz-1ah89nj","b":"lgpd-37-45","art":"43","r":"LGPD, art. 43, III","t":"que o dano é decorrente de culpa {{exclusiva}} do titular dos dados ou de terceiro."},{"id":"cz-18n7j1v","b":"lgpd-37-45","art":"44","r":"LGPD, art. 44, III","t":"as técnicas de tratamento de dados pessoais disponíveis {{à época em que foi realizado}}."},{"id":"cz-lq0uxi","b":"lgpd-37-45","art":"45","r":"LGPD, art. 45","t":"As hipóteses de violação do direito do titular no âmbito das {{relações de consumo}} permanecem sujeitas às regras de responsabilidade previstas na legislação pertinente."},{"id":"cz-10odkb9","b":"lgpd-46-51","art":"46","r":"LGPD, art. 46, § 2º","t":"As medidas de que trata o caput deste artigo deverão ser observadas desde a {{fase de concepção}} do produto ou do serviço até a sua execução."},{"id":"cz-62c3we","b":"lgpd-46-51","art":"47","r":"LGPD, art. 47","t":"obriga-se a garantir a segurança da informação prevista nesta Lei em relação aos dados pessoais, {{mesmo após o seu término}}."},{"id":"cz-1r15e6a","b":"lgpd-46-51","art":"48","r":"LGPD, art. 48","t":"O controlador deverá comunicar à {{autoridade nacional}} e ao {{titular}} a ocorrência de incidente de segurança que possa acarretar {{risco ou dano relevante}} aos titulares."},{"id":"cz-tcyp2b","b":"lgpd-46-51","art":"48","r":"LGPD, art. 48, § 1º","t":"A comunicação será feita em {{prazo razoável}}, conforme definido pela autoridade nacional"},{"id":"cz-vv7pbh","b":"lgpd-46-51","art":"48","r":"LGPD, art. 48, § 1º, V","t":"os {{motivos da demora}}, no caso de a comunicação não ter sido imediata; e"},{"id":"cz-18prvbf","b":"lgpd-46-51","art":"48","r":"LGPD, art. 48, § 2º, I","t":"{{ampla divulgação}} do fato em meios de comunicação; e"},{"id":"cz-p6lsha","b":"lgpd-46-51","art":"48","r":"LGPD, art. 48, § 3º","t":"será avaliada eventual comprovação de que foram adotadas medidas técnicas adequadas que tornem os dados pessoais afetados {{ininteligíveis}}"},{"id":"cz-nrrh45","b":"lgpd-46-51","art":"50","r":"LGPD, art. 50","t":"individualmente ou por meio de associações, {{poderão}} formular regras de boas práticas e de governança"},{"id":"cz-1p6ckph","b":"lgpd-46-51","art":"50","r":"LGPD, art. 50, § 2º, I, g","t":"conte com planos de {{resposta a incidentes e remediação}}; e"},{"id":"cz-rgpqbu","b":"lgpd-46-51","art":"50","r":"LGPD, art. 50, § 3º","t":"As regras de boas práticas e de governança deverão ser publicadas e atualizadas periodicamente e poderão ser {{reconhecidas e divulgadas}} pela autoridade nacional."},{"id":"cz-1invuwi","b":"lgpd-46-51","art":"51","r":"LGPD, art. 51","t":"A autoridade nacional {{estimulará}} a adoção de padrões técnicos que facilitem o controle pelos titulares dos seus dados pessoais."},{"id":"cz-7y9nkk","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, I","t":"advertência, com indicação de {{prazo}} para adoção de medidas corretivas;"},{"id":"cz-vkswc4","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, II","t":"multa simples, de até {{2% (dois por cento)}} do faturamento da pessoa jurídica de direito privado, grupo ou conglomerado {{no Brasil}} no seu último exercício, {{excluídos}} os tributos, limitada, no total, a {{R$ 50.000.000,00 (cinquenta milhões de reais) por infração}};"},{"id":"cz-5ore1z","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, III","t":"multa diária, observado o {{limite total}} a que se refere o inciso II;"},{"id":"cz-j22aut","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, IV","t":"publicização da infração após devidamente {{apurada e confirmada}} a sua ocorrência;"},{"id":"cz-15rctu0","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, X","t":"suspensão parcial do funcionamento do banco de dados a que se refere a infração pelo período máximo de {{6 (seis) meses}}, {{prorrogável por igual período}}"},{"id":"cz-jtp4ce","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, XII","t":"{{proibição parcial ou total}} do exercício de atividades relacionadas a tratamento de dados."},{"id":"cz-1e2zdot","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, § 1º","t":"As sanções serão aplicadas após procedimento administrativo que possibilite a oportunidade da ampla defesa, de forma {{gradativa, isolada ou cumulativa}}"},{"id":"cz-lz9nqr","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, § 1º, XI","t":"a {{proporcionalidade}} entre a gravidade da falta e a intensidade da sanção."},{"id":"cz-1hd2nao","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, § 3º","t":"O disposto nos incisos {{I, IV, V, VI, X, XI e XII}} do caput deste artigo poderá ser aplicado às entidades e aos órgãos públicos","dc":"multas ficam fora"},{"id":"cz-5xy9fv","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, § 5º","t":"será destinado ao {{Fundo de Defesa de Direitos Difusos}}"},{"id":"cz-1dsalw7","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, § 6º, I","t":"somente após já ter sido imposta ao menos 1 (uma) das sanções de que tratam os incisos {{II, III, IV, V e VI}} do caput deste artigo para o mesmo caso concreto; e"},{"id":"cz-8xx9vw","b":"lgpd-52-54","art":"52","r":"LGPD, art. 52, § 7º","t":"poderão ser objeto de {{conciliação direta}} entre controlador e titular"},{"id":"cz-112d1rx","b":"lgpd-52-54","art":"53","r":"LGPD, art. 53","t":"que deverá ser objeto de {{consulta pública}}, as metodologias que orientarão o cálculo do valor-base das sanções de multa."},{"id":"cz-6vxmb3","b":"lgpd-52-54","art":"54","r":"LGPD, art. 54","t":"O valor da sanção de multa diária aplicável às infrações a esta Lei deve observar a {{gravidade da falta}} e a {{extensão do dano ou prejuízo causado}}"},{"id":"cz-1x280c1","b":"lgpd-55","art":"55-A","r":"LGPD, art. 55-A","t":"Fica criada a Agência Nacional de Proteção de Dados (ANPD), autarquia de {{natureza especial}} vinculada ao {{Ministério da Justiça e Segurança Pública}}"},{"id":"cz-oiff26","b":"lgpd-55","art":"55-A","r":"LGPD, art. 55-A","t":"dotada de autonomia {{funcional, técnica, decisória, administrativa e financeira}}, com patrimônio próprio e com sede e foro no Distrito Federal"},{"id":"cz-85c52c","b":"lgpd-55","art":"55-A","r":"LGPD, art. 55-A","t":"com sede e foro no Distrito Federal, nos termos da {{Lei nº 13.848}}, de 25 de junho de 2019."},{"id":"cz-ackskn","b":"lgpd-55","art":"55-C","r":"LGPD, art. 55-C, I","t":"I - Conselho Diretor, {{órgão máximo de direção}};"},{"id":"cz-eu7z47","b":"lgpd-55","art":"55-C","r":"LGPD, art. 55-C, V-A","t":"V-A - {{Procuradoria}};","dc":"Lei 15.352/2026"},{"id":"cz-bdkhwx","b":"lgpd-55","art":"55-C","r":"LGPD, art. 55-C, V-B","t":"V-B - {{Auditoria}}; e","dc":"Lei 15.352/2026"},{"id":"cz-1k2tcio","b":"lgpd-55","art":"55-D","r":"LGPD, art. 55-D","t":"O Conselho Diretor da ANPD será composto de {{5 (cinco)}} diretores, incluído o Diretor-Presidente."},{"id":"cz-1060oze","b":"lgpd-55","art":"55-D","r":"LGPD, art. 55-D, § 1º","t":"serão escolhidos pelo {{Presidente da República}} e por ele nomeados, após aprovação pelo {{Senado Federal}}"},{"id":"cz-hs46kc","b":"lgpd-55","art":"55-D","r":"LGPD, art. 55-D, § 3º","t":"O mandato dos membros do Conselho Diretor será de {{4 (quatro) anos}}.","dc":"conferir efeitos da Lei 15.352/2026"},{"id":"cz-1wwahiz","b":"lgpd-55","art":"55-D","r":"LGPD, art. 55-D, § 5º","t":"Na hipótese de vacância do cargo no curso do mandato de membro do Conselho Diretor, o prazo {{remanescente}} será completado pelo sucessor."},{"id":"cz-1bbnpxr","b":"lgpd-55","art":"55-E","r":"LGPD, art. 55-E","t":"somente perderão seus cargos em virtude de {{renúncia}}, {{condenação judicial transitada em julgado}} ou {{pena de demissão decorrente de processo administrativo disciplinar}}."},{"id":"cz-188fgp7","b":"lgpd-55","art":"55-F","r":"LGPD, art. 55-F","t":"Aplica-se aos membros do Conselho Diretor, após o exercício do cargo, o disposto no art. 6º da Lei nº {{12.813}}, de 16 de maio de 2013.","dc":"conflito de interesses"},{"id":"cz-1z0glwr","b":"lgpd-55","art":"55-F","r":"LGPD, art. 55-F, parágrafo único","t":"A infração ao disposto no caput deste artigo caracteriza ato de {{improbidade administrativa}}."},{"id":"cz-1tce4gq","b":"lgpd-55","art":"55-G","r":"LGPD, art. 55-G","t":"{{Ato do Presidente da República}} disporá sobre a estrutura regimental da ANPD."},{"id":"cz-1e8yghr","b":"lgpd-55","art":"55-G","r":"LGPD, art. 55-G, § 2º","t":"O {{Conselho Diretor}} disporá sobre o regimento interno da ANPD."},{"id":"cz-tg237r","b":"lgpd-55","art":"55-I","r":"LGPD, art. 55-I","t":"serão indicados pelo {{Conselho Diretor}} e nomeados ou designados pelo {{Diretor-Presidente}}."},{"id":"cz-1kw3ok8","b":"lgpd-55","art":"55-J","r":"LGPD, art. 55-J, IV","t":"mediante processo administrativo que assegure o contraditório, a ampla defesa e o {{direito de recurso}};"},{"id":"cz-hoe44b","b":"lgpd-55","art":"55-J","r":"LGPD, art. 55-J, V","t":"apreciar petições de titular contra controlador após comprovada pelo titular a apresentação de {{reclamação ao controlador}} não solucionada no prazo estabelecido em regulamentação;"},{"id":"cz-hmhge4","b":"lgpd-55","art":"55-J","r":"LGPD, art. 55-J, XVI","t":"realizar {{auditorias}}, ou determinar sua realização, no âmbito da atividade de fiscalização"},{"id":"cz-wk04py","b":"lgpd-55","art":"55-J","r":"LGPD, art. 55-J, XVII","t":"celebrar, a qualquer momento, {{compromisso}} com agentes de tratamento para eliminar irregularidade, incerteza jurídica ou situação contenciosa"},{"id":"cz-1m542xk","b":"lgpd-55","art":"55-J","r":"LGPD, art. 55-J, XVIII","t":"inclusive quanto aos {{prazos}}, para que microempresas e empresas de pequeno porte"},{"id":"cz-15lsvyk","b":"lgpd-55","art":"55-J","r":"LGPD, art. 55-J, XX","t":"deliberar, na esfera administrativa, em caráter {{terminativo}}, sobre a interpretação desta Lei, as suas competências e os casos omissos;"},{"id":"cz-1708pmg","b":"lgpd-55","art":"55-J","r":"LGPD, art. 55-J, XXII","t":"comunicar aos órgãos de {{controle interno}} o descumprimento do disposto nesta Lei por órgãos e entidades da administração pública federal;"},{"id":"cz-10c40zk","b":"lgpd-55","art":"55-J","r":"LGPD, art. 55-J, § 1º","t":"a ANPD deve observar a exigência de {{mínima intervenção}}"},{"id":"cz-tf6ym5","b":"lgpd-55","art":"55-J","r":"LGPD, art. 55-J, § 2º","t":"Os regulamentos e as normas editados pela ANPD devem ser precedidos de {{consulta e audiência públicas}}, bem como de {{análises de impacto regulatório}}."},{"id":"cz-ty6wwp","b":"lgpd-55","art":"55-J","r":"LGPD, art. 55-J, § 6º","t":"poderão ser analisadas de forma {{agregada}}, e as eventuais providências delas decorrentes poderão ser adotadas de forma {{padronizada}}."},{"id":"cz-2rsn05","b":"lgpd-55","art":"55-K","r":"LGPD, art. 55-K","t":"A aplicação das sanções previstas nesta Lei compete {{exclusivamente}} à ANPD"},{"id":"cz-bnkrw4","b":"lgpd-55","art":"55-K","r":"LGPD, art. 55-K, parágrafo único","t":"será o {{órgão central de interpretação}} desta Lei e do estabelecimento de normas e diretrizes para a sua implementação."},{"id":"cz-159z835","b":"lgpd-55","art":"58-A","r":"LGPD, art. 58-A","t":"O Conselho Nacional de Proteção de Dados Pessoais e da Privacidade será composto de {{23 (vinte e três)}} representantes, titulares e suplentes"},{"id":"cz-38byy3","b":"lgpd-55","art":"58-A","r":"LGPD, art. 58-A, I","t":"I - {{5 (cinco)}} do Poder Executivo federal;"},{"id":"cz-1vqp6go","b":"lgpd-55","art":"58-A","r":"LGPD, art. 58-A, § 3º, III","t":"terão mandato de {{2 (dois) anos}}, permitida {{1 (uma) recondução}}."},{"id":"cz-1raidbo","b":"lgpd-55","art":"58-A","r":"LGPD, art. 58-A, § 4º","t":"A participação no Conselho Nacional de Proteção de Dados Pessoais e da Privacidade será considerada prestação de serviço público relevante, {{não remunerada}}."},{"id":"cz-1opjb1b","b":"lgpd-55","art":"58-B","r":"LGPD, art. 58-B, I","t":"propor {{diretrizes estratégicas}} e fornecer subsídios para a elaboração da Política Nacional de Proteção de Dados Pessoais e da Privacidade"}],"glossario":[{"t":"Autarquia de natureza especial","p":["autarquia de natureza especial","autarquia de regime especial","agência reguladora","agências reguladoras"],"d":"Pessoa jurídica de direito público da administração indireta com garantias reforçadas de autonomia: dirigentes com mandato fixo e estabilidade, ausência de subordinação hierárquica ao ministério e autonomia administrativa e financeira. É o regime das agências reguladoras (Lei 13.848/2019) e, desde a Lei 15.352/2026, da ANPD.","s":"autarquia de regime especial agência reguladora características mandato estabilidade","f":0.051},{"t":"Vinculação × subordinação","p":["vinculada","vinculação"],"d":"A autarquia é vinculada a um ministério, que exerce supervisão (tutela) nos limites da lei, mas não é subordinada a ele: não há hierarquia nem recurso hierárquico próprio contra suas decisões técnicas.","s":"vinculação subordinação autarquia tutela supervisão ministerial recurso hierárquico impróprio","f":0.011},{"t":"Rol taxativo","p":["rol taxativo","taxativo","taxativa"],"d":"Lista fechada: só valem as hipóteses enumeradas. Na LGPD, palavras como “somente” e “só” indicam rol taxativo (arts. 7º, 11, 33, 43). Em prova, qualquer hipótese a mais torna o item errado.","s":"rol taxativo exemplificativo LGPD bases legais","f":0.004},{"t":"Rol exemplificativo","p":["rol exemplificativo","exemplificativa","exemplificativo","entre outras","tais como"],"d":"Lista aberta: os itens são exemplos. Expressões como “entre outros”, “tais como” e “que incluem, mas não se limitam a” (art. 10) indicam rol exemplificativo.","s":"rol exemplificativo tais como entre outros interpretação","f":0.011},{"t":"Dado pessoal","p":["dado pessoal","dados pessoais"],"d":"Informação relacionada a pessoa natural identificada ou identificável (art. 5º, I). O conceito é expansionista: basta que a pessoa possa ser identificada com meios razoáveis, mesmo sem nome no registro.","s":"conceito expansionista dado pessoal identificável LGPD","f":0.21},{"t":"Dado pessoal sensível","p":["dado pessoal sensível","dados pessoais sensíveis","dados sensíveis","dado sensível"],"d":"Rol do art. 5º, II: origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou organização religiosa, filosófica ou política, dado de saúde ou vida sexual, dado genético ou biométrico vinculado a pessoa natural. Tem bases legais próprias e mais restritas (art. 11).","s":"dados pessoais sensíveis LGPD art. 11 bases legais","f":0.025},{"t":"Titular","p":["titular dos dados","titulares de dados","titular de dados"],"d":"Pessoa natural a quem se referem os dados pessoais tratados (art. 5º, V). Pessoa jurídica não é titular para a LGPD.","s":"titular de dados pessoais direitos LGPD","f":0.009},{"t":"Controlador","p":["controlador","controladores"],"d":"Quem toma as decisões sobre o tratamento, isto é, define finalidades e meios essenciais (art. 5º, VI). Pode ser pessoa natural ou jurídica, de direito público ou privado.","s":"controlador e operador guia ANPD agentes de tratamento","f":0.139},{"t":"Operador","p":["operador","operadores"],"d":"Quem realiza o tratamento em nome do controlador (art. 5º, VII), seguindo suas instruções (art. 39). Se descumpre a lei ou as instruções lícitas, responde solidariamente como se fosse controlador (art. 42, § 1º, I).","s":"operador de dados responsabilidade solidária LGPD guia ANPD","f":0.028},{"t":"Encarregado","p":["encarregado","encarregados","DPO"],"d":"Pessoa indicada para ser o canal de comunicação entre controlador, titulares e ANPD (art. 5º, VIII). Equivale ao DPO do GDPR. A Resolução CD/ANPD 18/2024 detalha sua atuação.","s":"encarregado de dados Resolução CD/ANPD 18/2024 atribuições conflito de interesses","f":0.027},{"t":"Agentes de tratamento","p":["agentes de tratamento","agente de tratamento"],"d":"Controlador e operador (art. 5º, IX). O encarregado não é agente de tratamento.","s":"agentes de tratamento controlador operador encarregado diferença","f":0.037},{"t":"Tratamento","p":["tratamento de dados","operação de tratamento","operações de tratamento"],"d":"Toda operação realizada com dados pessoais: coleta, armazenamento, uso, compartilhamento, eliminação e outras (art. 5º, X). A lista do inciso é exemplificativa (“como as que se referem a”).","s":"conceito de tratamento de dados LGPD art. 5º X","f":0.093},{"t":"Anonimização","p":["anonimização","anonimizados","anonimizado","anonimizadas"],"d":"Uso de meios técnicos razoáveis para que o dado perca a possibilidade de associação a uma pessoa (art. 5º, XI). Dado anonimizado não é dado pessoal, salvo se a anonimização puder ser revertida com esforços razoáveis (art. 12).","s":"anonimização técnicas guia ANPD reversibilidade esforços razoáveis","f":0.023},{"t":"Pseudonimização","p":["pseudonimização","pseudonimizados","pseudonimizado"],"d":"Tratamento em que o dado só pode ser associado à pessoa com uma informação adicional guardada à parte pelo controlador (art. 13, § 4º). Continua sendo dado pessoal.","s":"pseudonimização × anonimização diferença exemplos","f":0.008},{"t":"Consentimento","p":["consentimento"],"d":"Manifestação livre, informada e inequívoca de concordância com o tratamento para finalidade determinada (art. 5º, XII). Pode ser revogado a qualquer momento (art. 8º, § 5º). É uma das dez bases legais, não a principal.","s":"consentimento LGPD requisitos revogação vício de consentimento","f":0.065},{"t":"Legítimo interesse","p":["legítimo interesse","interesses legítimos","interesse legítimo"],"d":"Base legal (art. 7º, IX) que exige finalidade legítima, situação concreta, dados estritamente necessários e transparência (art. 10). Não vale para dados sensíveis. A ANPD publicou guia com teste de balanceamento.","s":"legítimo interesse teste de balanceamento guia ANPD","f":0.015},{"t":"Bases legais","p":["base legal","bases legais","hipóteses legais","hipóteses de tratamento"],"d":"Hipóteses que autorizam o tratamento: dez no art. 7º (dados comuns) e as do art. 11 (dados sensíveis). Sem base legal, o tratamento é ilícito.","s":"bases legais LGPD art. 7º art. 11 comparação","f":0.021},{"t":"Uso compartilhado de dados","p":["uso compartilhado","compartilhamento de dados","tratamento compartilhado"],"d":"Comunicação, difusão, transferência internacional, interconexão ou tratamento compartilhado de bancos de dados, entre órgãos públicos, entre estes e privados ou entre privados (art. 5º, XVI).","s":"uso compartilhado de dados Poder Público LGPD art. 26 art. 27","f":0.016},{"t":"Relatório de impacto à proteção de dados (RIPD)","p":["relatório de impacto","relatórios de impacto","RIPD","avaliação de impacto"],"d":"Documento do controlador que descreve tratamentos que podem gerar riscos a liberdades e direitos fundamentais e as medidas de mitigação (art. 5º, XVII). A ANPD pode exigi-lo (arts. 10, § 3º, 32 e 38). Equivale à DPIA do GDPR (art. 35).","s":"relatório de impacto à proteção de dados RIPD modelo ANPD quando exigir","f":0.017},{"t":"Princípio da necessidade","p":["princípio da necessidade","minimização","mínimo necessário"],"d":"Limitar o tratamento ao mínimo necessário, com dados pertinentes, proporcionais e não excessivos (art. 6º, III). É a minimização de dados do GDPR.","s":"princípio da necessidade minimização de dados LGPD","f":0.012},{"t":"Accountability","p":["responsabilização e prestação de contas","accountability"],"d":"Princípio do art. 6º, X: não basta cumprir a lei, o agente precisa demonstrar que adotou medidas eficazes e que elas funcionam.","s":"princípio da responsabilização e prestação de contas accountability LGPD","f":0.004},{"t":"Privacidade desde a concepção","p":["privacidade desde a concepção","privacy by design","desde a fase de concepção","desde a concepção"],"d":"Incorporar proteção de dados ao projeto do produto ou serviço desde o início, e não depois (art. 46, § 2º). Por padrão (by default), a configuração mais protetiva vem ativada.","s":"privacy by design privacy by default sete princípios Ann Cavoukian","f":0.008},{"t":"Incidente de segurança","p":["incidente de segurança","incidentes de segurança","vazamento","vazamentos"],"d":"Evento que compromete a confidencialidade, integridade ou disponibilidade de dados pessoais. Se puder causar risco ou dano relevante, o controlador comunica à ANPD e ao titular (art. 48), no prazo fixado pela Resolução CD/ANPD 15/2024.","s":"comunicação de incidente de segurança Resolução CD/ANPD 15/2024 prazo","f":0.02},{"t":"Portabilidade","p":["portabilidade"],"d":"Direito de levar os dados a outro fornecedor de serviço ou produto, mediante requisição expressa e conforme regulamentação da ANPD (art. 18, V). Não inclui dados já anonimizados (art. 18, § 7º).","s":"portabilidade de dados LGPD regulamentação ANPD concorrência","f":0.009},{"t":"Decisão automatizada","p":["decisão automatizada","decisões automatizadas","tratamento automatizado"],"d":"Decisão tomada unicamente por sistema, sem intervenção humana relevante. O titular pode pedir revisão e informações sobre critérios (art. 20). A revisão por pessoa natural foi vetada.","s":"decisão automatizada art. 20 LGPD explicabilidade revisão humana veto","f":0.015},{"t":"Transferência internacional","p":["transferência internacional"],"d":"Envio de dados pessoais para país estrangeiro ou organismo internacional (art. 5º, XV). Só é permitida nas hipóteses do art. 33. A Resolução CD/ANPD 19/2024 a regulamenta.","s":"transferência internacional de dados Resolução CD/ANPD 19/2024 mecanismos","f":0.031},{"t":"Decisão de adequação","p":["adequação","adequado","grau de proteção"],"d":"Reconhecimento de que um país ou organismo oferece proteção de dados adequada, o que libera a transferência (art. 33, I). No Brasil decide a ANPD; na UE, a Comissão Europeia.","s":"decisão de adequação ANPD União Europeia Resolução 32/2026","f":0.024},{"t":"Cláusulas-padrão contratuais","p":["cláusulas-padrão contratuais","cláusulas-padrão","cláusulas contratuais-padrão"],"d":"Modelo de cláusulas aprovado pela autoridade para transferências internacionais (art. 33, II, b). Na ANPD, estão na Resolução 19/2024 e devem ser adotadas sem alteração.","s":"cláusulas-padrão contratuais ANPD Resolução 19/2024 anexo II","f":0.019},{"t":"Normas corporativas globais","p":["normas corporativas globais"],"d":"Regras internas de proteção de dados de um grupo econômico, aprovadas pela autoridade, que autorizam transferências entre empresas do grupo (art. 33, II, c). Equivalem às binding corporate rules do GDPR (ar
