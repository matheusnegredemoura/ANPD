encarregado devem ser divulgados publicamente (art. 41, § 1º, da LGPD).","ap":-1,"v":0},{"id":"r4-01","b":"res-4-2023","g":"C","l":"res4","art":null,"r":"Res. CD/ANPD 4/2023","t":[],"a":"rol","d":1,"e":"O regulamento de dosimetria da ANPD classifica as infrações, conforme a gravidade e a natureza das infrações e dos direitos pessoais afetados, em leves, médias ou graves.","c":"Resolução CD/ANPD nº 4/2023, que cumpre o art. 53 da LGPD.","ap":-1,"p":["Quando a infração é grave na Resolução CD/ANPD 4/2023"],"v":0},{"id":"r4-02","b":"res-4-2023","g":"E","l":"res4","art":null,"r":"Res. CD/ANPD 4/2023","t":[],"a":"rol","d":1,"e":"O regulamento de dosimetria da ANPD classifica as infrações em quatro níveis: leves, médias, graves e gravíssimas.","c":"São três níveis: leve, média e grave.","ap":-1,"v":0},{"id":"r4-03","b":"res-4-2023","g":"C","l":"res4","art":null,"r":"Res. CD/ANPD 4/2023","t":[],"a":"conceito","d":3,"e":"No regulamento de dosimetria da ANPD, a reincidência é específica quando o agente repete a infração ao mesmo dispositivo e genérica quando infringe qualquer norma de proteção de dados, considerado em ambos os casos um período de cinco anos.","c":"O período é contado do trânsito em julgado administrativo da condenação anterior até a nova infração; confira a redação exata da reincidência genérica. A reincidência é critério do art. 52, § 1º, V, da LGPD.","ap":-1,"v":0},{"id":"r4-04","b":"res-4-2023","g":"C","l":"res4","art":null,"r":"Res. CD/ANPD 4/2023","t":[],"a":"conceito","d":2,"e":"No cálculo da multa, o regulamento de dosimetria parte de um valor-base, definido a partir da classificação da infração, sobre o qual incidem circunstâncias agravantes e atenuantes.","c":"O cálculo segue etapas, e o resultado respeita os limites do art. 52, II, da LGPD (2% do faturamento no Brasil, limitado a R$ 50 milhões por infração).","ap":-1,"v":0},{"id":"si2-01","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · criptografia","t":[],"a":"conceito","d":1,"e":"Na criptografia simétrica, cada participante possui um par de chaves, uma pública e outra privada, matematicamente relacionadas.","c":"Isso descreve a criptografia assimétrica. Na simétrica, a mesma chave secreta cifra e decifra (exemplo: AES). Exemplo de assimétrica: RSA.","ap":-1},{"id":"si2-02","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · criptografia","t":[],"a":"conceito","d":1,"e":"O protocolo TLS protege dados em trânsito, ao passo que a criptografia de disco ou de banco de dados protege dados em repouso.","c":"Em trânsito × em repouso é distinção básica para avaliar medidas de segurança (LGPD, art. 46) e o juízo de gravidade de incidentes (art. 48, § 3º).","ap":-1},{"id":"si2-03","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · pseudonimização","t":[],"a":"conceito","d":2,"e":"Dados pseudonimizados equiparam-se a dados anonimizados e, por isso, ficam fora do alcance da LGPD.","c":"A pseudonimização mantém informação adicional que permite a reassociação, guardada pelo controlador (LGPD, art. 13, § 4º). O dado continua pessoal. No GDPR é igual (considerando 26).","ap":-1},{"id":"si2-04","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · privacidade diferencial","t":[],"a":"conceito","d":3,"e":"A privacidade diferencial adiciona ruído calibrado aos resultados de consultas ou análises, de modo a limitar o que se pode inferir sobre a presença ou os dados de um indivíduo específico na base.","c":"Técnica usada, por exemplo, pelo Censo dos EUA de 2020. O parâmetro épsilon controla o equilíbrio entre privacidade e utilidade.","ap":-1,"p":["Privacidade diferencial e o parâmetro épsilon"]},{"id":"si2-05","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · anonimização","t":[],"a":"conceito","d":3,"e":"Uma base que atende ao k-anonimato está protegida contra o ataque de homogeneidade, ainda que todos os registros de um mesmo grupo compartilhem o mesmo valor sensível.","c":"Se todos os k registros do grupo têm o mesmo diagnóstico, o atacante descobre o dado sensível sem saber qual é o registro. A l-diversidade e a t-proximidade surgiram para tratar essa falha.","ap":-1},{"id":"si2-06","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · anonimização","t":[],"a":"conceito","d":2,"e":"A reidentificação por ligação ocorre quando uma base supostamente anonimizada é cruzada com outra base que contém quase-identificadores, como CEP, data de nascimento e sexo.","c":"Caso clássico de Latanya Sweeney, que reidentificou o prontuário de um governador combinando dados de saúde com o cadastro eleitoral. Por isso a LGPD fala em meios técnicos razoáveis (art. 12).","ap":-1,"p":["Latanya Sweeney e a reidentificação por quase-identificadores"]},{"id":"si2-07","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · ameaças","t":[],"a":"conceito","d":1,"e":"O phishing é técnica de engenharia social em que o atacante se passa por entidade confiável para induzir a vítima a fornecer credenciais ou a executar ação maliciosa.","c":"Variações: spear phishing (alvo específico), whaling (altos executivos), smishing (SMS), vishing (voz).","ap":-1},{"id":"si2-08","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · backup","t":[],"a":"conceito","d":2,"e":"O backup incremental copia todos os dados a cada execução, independentemente de terem sido alterados.","c":"Isso é o backup completo. O incremental copia o que mudou desde o último backup de qualquer tipo; o diferencial, o que mudou desde o último completo.","ap":-1},{"id":"si2-09","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · backup","t":[],"a":"conceito","d":2,"e":"Para restaurar um ambiente a partir de backups diferenciais, bastam o último backup completo e o último backup diferencial.","c":"O diferencial acumula as mudanças desde o último completo. No incremental, é preciso o completo e todos os incrementais posteriores, em ordem.","ap":-1},{"id":"si2-10","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · zero trust","t":[],"a":"conceito","d":2,"e":"O modelo de confiança zero parte da premissa de que nenhum usuário ou dispositivo deve ser considerado confiável apenas por estar dentro do perímetro da rede corporativa.","c":"Lema: nunca confie, sempre verifique. Referência: NIST SP 800-207.","ap":-1},{"id":"si2-11","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · redes","t":[],"a":"conceito","d":2,"e":"O firewall de filtragem de pacotes sem estado inspeciona o conteúdo das mensagens da camada de aplicação para bloquear comandos maliciosos.","c":"O filtro de pacotes atua nas camadas de rede e transporte (endereços, portas, protocolos). Inspeção de conteúdo de aplicação é feita por firewalls de aplicação (WAF) ou de próxima geração.","ap":-1},{"id":"si2-12","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · ameaças","t":[],"a":"conceito","d":2,"e":"A injeção de SQL explora entradas não validadas para executar comandos no banco de dados, e o uso de consultas parametrizadas é medida eficaz de prevenção.","c":"Vulnerabilidade presente há anos no OWASP Top 10 (categoria Injection).","ap":-1},{"id":"si2-13","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · hash","t":[],"a":"conceito","d":3,"e":"Para armazenar senhas, basta aplicar uma única vez a função SHA-256, sendo desnecessário o uso de sal, pois o hash já é irreversível.","c":"Sem sal, senhas iguais geram o mesmo resumo e ficam expostas a tabelas pré-computadas. Recomenda-se sal aleatório e funções lentas próprias para senhas, como bcrypt, scrypt ou Argon2.","ap":-1},{"id":"si2-14","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · normas ISO","t":[],"a":"conceito","d":2,"e":"A norma ISO/IEC 27701 estende os requisitos das normas ISO/IEC 27001 e 27002 para a gestão da privacidade da informação.","c":"Especifica o sistema de gestão da privacidade da informação (SGPI ou PIMS), útil para demonstrar conformidade com LGPD e GDPR.","ap":-1},{"id":"si2-15","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · controle de acesso","t":[],"a":"conceito","d":2,"e":"No controle de acesso baseado em papéis, as permissões são associadas a funções, e os usuários as recebem ao serem vinculados a essas funções.","c":"RBAC facilita aplicar o menor privilégio e revisar acessos, medidas típicas de segurança administrativa.","ap":-1},{"id":"si2-16","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · DLP","t":[],"a":"conceito","d":2,"e":"Ferramentas de prevenção de perda de dados (DLP) monitoram e podem bloquear a saída não autorizada de informações sensíveis por e-mail, nuvem ou dispositivos removíveis.","c":"DLP ajuda a prevenir incidentes de vazamento, ligando-se ao princípio da prevenção (LGPD, art. 6º, VIII).","ap":-1},{"id":"si2-17","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · ameaças","t":[],"a":"conceito","d":2,"e":"Ataque de negação de serviço distribuído (DDoS) tem como objetivo principal a exfiltração de dados pessoais armazenados no servidor atacado.","c":"O DDoS ataca a disponibilidade, sobrecarregando o serviço. Pode servir de distração para outros ataques, mas seu objetivo direto não é a exfiltração.","ap":-1},{"id":"si2-18","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · minimização","t":[],"a":"conceito","d":1,"e":"Coletar e reter apenas os dados necessários reduz a superfície de ataque e o impacto potencial de um incidente de segurança.","c":"Ponte entre o princípio da necessidade (LGPD, art. 6º, III) e a segurança: dado que não existe não vaza.","ap":-1},{"id":"si-01","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · CID","t":[],"a":"conceito","d":1,"e":"Confidencialidade, integridade e disponibilidade são os três pilares clássicos da segurança da informação.","c":"A tríade CID. Autenticidade e não repúdio costumam ser acrescentados. O princípio da segurança da LGPD (art. 6º, VII) protege contra acesso não autorizado (confidencialidade), alteração (integridade) e perda ou destruição (disponibilidade).","ap":-1},{"id":"si-02","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · CID","t":[],"a":"conceito","d":1,"e":"A integridade, na segurança da informação, consiste em garantir que a informação esteja acessível aos usuários autorizados sempre que necessário.","c":"Essa é a disponibilidade. Integridade é a garantia de que a informação não foi alterada de forma indevida.","ap":-1},{"id":"si-03","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · criptografia","t":[],"a":"conceito","d":2,"e":"Na criptografia assimétrica, para garantir a confidencialidade de uma mensagem, o remetente a cifra com a chave pública do destinatário, que a decifra com sua chave privada.","c":"Só o dono da chave privada consegue decifrar. É assim que dados ficam ininteligíveis para terceiros, fator considerado no juízo de gravidade de incidentes (LGPD, art. 48, § 3º).","ap":-1},{"id":"si-04","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · criptografia","t":[],"a":"conceito","d":2,"e":"A assinatura digital garante a confidencialidade do documento, pois o signatário cifra o conteúdo com a chave pública do destinatário.","c":"A assinatura digital usa a chave privada do signatário e garante autenticidade, integridade e não repúdio, mas não confidencialidade. Qualquer um com a chave pública verifica a assinatura.","ap":-1},{"id":"si-05","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · hash","t":[],"a":"conceito","d":1,"e":"Funções de resumo criptográfico (hash) produzem saída de tamanho fixo e são projetadas para ser unidirecionais, sendo úteis para verificar a integridade de dados.","c":"Exemplo: SHA-256. Qualquer alteração no dado muda o resumo.","ap":-1},{"id":"si-06","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · hash","t":[],"a":"conceito","d":1,"e":"A partir do resumo gerado por uma função hash criptográfica, é possível recuperar o dado original aplicando a função inversa.","c":"Funções hash criptográficas são projetadas para não ter inversa computável. Isso não as torna anonimização: dados com poucos valores possíveis (CPF, telefone) podem ser recuperados por força bruta.","ap":-1},{"id":"si-07","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · ISO 27001","t":[],"a":"conceito","d":2,"e":"A norma ABNT NBR ISO/IEC 27001 especifica requisitos para estabelecer, implementar, manter e melhorar continuamente um sistema de gestão da segurança da informação, e a ISO/IEC 27701 a estende para a gestão da privacidade.","c":"A 27001 é a norma certificável de requisitos. A 27002 é o guia de controles. A 27701 acrescenta o sistema de gestão da privacidade da informação.","ap":-1},{"id":"si-08","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · ISO 27002","t":[],"a":"conceito","d":2,"e":"A ABNT NBR ISO/IEC 27002 é a norma de requisitos utilizada para certificar o sistema de gestão da segurança da informação das organizações.","c":"A certificação é feita pela 27001. A 27002 é código de prática com orientações sobre controles.","ap":-1},{"id":"si-09","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · privacy by design","t":[],"a":"conceito","d":2,"e":"Entre os princípios da privacidade desde a concepção estão a atuação proativa, e não reativa, e a privacidade como configuração padrão.","c":"São dois dos sete princípios de Ann Cavoukian: proativo e preventivo; privacidade por padrão; privacidade incorporada ao projeto; funcionalidade total (soma positiva); segurança de ponta a ponta; visibilidade e transparência; respeito à privacidade do usuário.","ap":-1},{"id":"si-10","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · privacy by design","t":[],"a":"conceito","d":2,"e":"A privacidade desde a concepção parte da premissa de soma zero, segundo a qual mais privacidade implica necessariamente menos funcionalidade ou segurança.","c":"Um dos princípios é justamente a funcionalidade total, de soma positiva: privacidade e funcionalidade podem coexistir.","ap":-1},{"id":"si-11","b":"seginfo","g":"C","l":"lgpd","art":"46","r":"LGPD, art. 46, § 2º","t":["deverão ser observadas desde a fase de concepção do produto ou do serviço até a sua execução"],"a":"conceito","d":1,"e":"A LGPD incorpora a ideia de privacidade desde a concepção ao exigir que as medidas de segurança sejam observadas desde a fase de concepção do produto ou do serviço até a sua execução.","c":"Art. 46, § 2º, da LGPD. O GDPR tem regra equivalente no art. 25 (data protection by design and by default).","ap":-1},{"id":"si-12","b":"seginfo","g":"E","l":"lgpd","art":"13","r":"LGPD, art. 13, § 4º","t":["senão pelo uso de informação adicional mantida separadamente pelo controlador em ambiente controlado e seguro"],"a":"conceito","d":2,"e":"A substituição do CPF por um código aleatório, com a tabela de correspondência guardada pelo próprio controlador, torna os dados anonimizados para fins da LGPD.","c":"Isso é pseudonimização (art. 13, § 4º): a associação ao titular continua possível com a informação adicional. Dado pseudonimizado continua sendo dado pessoal.","ap":-1},{"id":"si-13","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · k-anonimato","t":[],"a":"conceito","d":3,"e":"Uma base de dados atende ao k-anonimato quando cada registro é indistinguível de pelo menos k − 1 outros registros em relação aos atributos quase identificadores.","c":"Quase identificadores são atributos que, combinados, identificam alguém (CEP, data de nascimento, sexo). O k-anonimato não protege contra todos os ataques, por isso surgiram variantes como l-diversidade.","ap":-1},{"id":"si-14","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · controle de acesso","t":[],"a":"conceito","d":1,"e":"Pelo princípio do menor privilégio, cada usuário deve receber apenas as permissões estritamente necessárias para executar suas funções.","c":"É o espelho técnico do princípio da necessidade da LGPD (art. 6º, III).","ap":-1},{"id":"si-15","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · autenticação","t":[],"a":"conceito","d":2,"e":"Exigir do usuário uma senha e um PIN numérico caracteriza autenticação de dois fatores, por envolver dois segredos distintos.","c":"Senha e PIN são do mesmo fator: algo que você sabe. Dois fatores exigem categorias diferentes: algo que você sabe, algo que você tem (token, celular) ou algo que você é (biometria).","ap":-1},{"id":"si-16","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · resposta a incidentes","t":[],"a":"rol","d":2,"e":"No ciclo clássico de resposta a incidentes descrito pelo NIST (SP 800-61, revisão 2), as fases são preparação; detecção e análise; contenção, erradicação e recuperação; e atividades pós-incidente.","c":"A revisão 3 (2025) reorganizou o guia em torno das funções do NIST Cybersecurity Framework 2.0, mas o ciclo da revisão 2 continua sendo o mais cobrado.","ap":-1},{"id":"si-17","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · backup","t":[],"a":"numero","d":1,"e":"A regra 3-2-1 de cópias de segurança recomenda manter três cópias dos dados, em dois tipos de mídia diferentes, com uma cópia fora do local principal.","c":"É a defesa básica contra ransomware e desastres. Cópias imutáveis ou desconectadas da rede reforçam a proteção.","ap":-1},{"id":"si-18","b":"seginfo","g":"E","l":"doutrina","art":null,"r":"Doutrina · engenharia social","t":[],"a":"conceito","d":1,"e":"A engenharia social explora principalmente vulnerabilidades técnicas de software, como falhas de atualização em sistemas operacionais.","c":"Engenharia social explora o fator humano (confiança, urgência, medo). Phishing é o exemplo mais comum.","ap":-1},{"id":"si-19","b":"seginfo","g":"C","l":"doutrina","art":null,"r":"Doutrina · ransomware","t":[],"a":"conceito","d":1,"e":"O ransomware é um código malicioso que torna inacessíveis os dados do equipamento, geralmente por criptografia, e exige pagamento de resgate para restabelecer o acesso.","c":"Variantes modernas também copiam os dados antes de cifrá-los e ameaçam publicá-los (dupla extorsão), o que caracteriza incidente com dados pessoais comunicável à ANPD quando houver risco relevante.","ap":-1}],"apoios":["When children go online, they rarely read the terms they accept, and their parents often do not either. For years, companies treated a box ticked by a twelve-year-old as meaningful consent. Lawmakers in several countries have now rejected that fiction. Instead of asking users to declare their age, platforms are increasingly required to verify it, and services likely to be accessed by minors must be designed with their best interests in mind.\nAge assurance, however, raises its own privacy concerns. Asking every user to upload an identity document may protect children while exposing adults to new risks of data breaches. Regulators therefore favour methods that confirm only what is necessary, such as whether a user is over a certain age, without revealing who that user is.\nDesigning such systems is not merely a technical challenge. It requires deciding who bears the cost, how mistakes will be corrected, and which authority will hold platforms to account when they fail.","Data protection authorities around the world are being asked to do more with less. As artificial intelligence systems spread into hiring, lending and public services, regulators must decide not only whether personal data was collected lawfully, but also whether automated decisions can be explained to the people they affect.\nSome authorities have responded by publishing guidance before issuing fines, on the assumption that most organisations want to comply but lack clear instructions. Others argue that guidance alone is toothless unless it is backed by credible enforcement. A middle path, often called responsive regulation, starts with dialogue and escalates to sanctions only when an organisation repeatedly ignores its obligations.\nCritics warn, however, that this approach can favour large companies, which can afford lawyers to negotiate at every stage. Whatever the strategy, transparency remains essential: an authority that does not explain its priorities invites suspicion that its decisions are arbitrary.","Durante anos, vazamentos de dados foram tratados como acidentes inevitáveis, quase como tempestades que ninguém poderia prever. Essa visão mudou. Hoje se exige que as organizações demonstrem não apenas que reagiram ao incidente, mas também que haviam adotado, antes dele, medidas proporcionais ao risco de suas atividades.\nA mudança tem consequências práticas. Um hospital que guarda prontuários em planilhas abertas não pode alegar surpresa quando elas circulam pela internet; uma pequena loja virtual, por sua vez, não precisa de um departamento inteiro de segurança, mas deve conhecer os dados que coleta e por que os coleta. A proporcionalidade, portanto, protege tanto o titular quanto o agente de menor porte.\nResta saber se as autoridades conseguirão fiscalizar milhares de organizações com equipes reduzidas. A resposta mais provável não está em multas cada vez maiores, mas em orientações claras, em prioridades públicas e em sanções exemplares aplicadas a quem insiste em descumprir a lei.","A proteção de dados pessoais deixou de ser assunto restrito a especialistas. Quando um aplicativo pede acesso à agenda do celular, o usuário raramente se pergunta para que aquela informação servirá. É justamente nesse ponto que a regulação se mostra necessária: cabe ao Estado assegurar que o consentimento seja livre e informado, e não uma formalidade aceita às pressas.\nContudo, regular não significa impedir a inovação. As agências que conseguem equilibrar esses interesses são aquelas que dialogam com o setor regulado, publicam suas prioridades e aplicam sanções de forma proporcional. Assim, a confiança dos cidadãos depende tanto da firmeza quanto da previsibilidade da atuação estatal."],"lei":{"lgpd":{"nome":"LGPD — Lei nº 13.709/2018","curto":"LGPD","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm","artigos":[{"id":"1","rotulo":"Art. 1","estrutura":["CAPÍTULO I — DISPOSIÇÕES PRELIMINARES"],"texto":"Art. 1º Esta Lei dispõe sobre o tratamento de dados pessoais, inclusive nos meios digitais, por pessoa natural ou por pessoa jurídica de direito público ou privado, com o objetivo de proteger os direitos fundamentais de liberdade e de privacidade e o livre desenvolvimento da personalidade da pessoa natural.\nParágrafo único. As normas gerais contidas nesta Lei são de interesse nacional e devem ser observadas pela União, Estados, Distrito Federal e Municípios. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"2","rotulo":"Art. 2","estrutura":["CAPÍTULO I — DISPOSIÇÕES PRELIMINARES"],"texto":"Art. 2º A disciplina da proteção de dados pessoais tem como fundamentos:\nI - o respeito à privacidade;\nII - a autodeterminação informativa;\nIII - a liberdade de expressão, de informação, de comunicação e de opinião;\nIV - a inviolabilidade da intimidade, da honra e da imagem;\nV - o desenvolvimento econômico e tecnológico e a inovação;\nVI - a livre iniciativa, a livre concorrência e a defesa do consumidor; e\nVII - os direitos humanos, o livre desenvolvimento da personalidade, a dignidade e o exercício da cidadania pelas pessoas naturais."},{"id":"3","rotulo":"Art. 3","estrutura":["CAPÍTULO I — DISPOSIÇÕES PRELIMINARES"],"texto":"Art. 3º Esta Lei aplica-se a qualquer operação de tratamento realizada por pessoa natural ou por pessoa jurídica de direito público ou privado, independentemente do meio, do país de sua sede ou do país onde estejam localizados os dados, desde que:\nI - a operação de tratamento seja realizada no território nacional;\nII - a atividade de tratamento tenha por objetivo a oferta ou o fornecimento de bens ou serviços ou o tratamento de dados de indivíduos localizados no território nacional; ou (Redação dada pela Lei nº 13.853, de 2019)\nIII - os dados pessoais objeto do tratamento tenham sido coletados no território nacional.\n§ 1º Consideram-se coletados no território nacional os dados pessoais cujo titular nele se encontre no momento da coleta.\n§ 2º Excetua-se do disposto no inciso I deste artigo o tratamento de dados previsto no inciso IV do caput do art. 4º desta Lei."},{"id":"4","rotulo":"Art. 4","estrutura":["CAPÍTULO I — DISPOSIÇÕES PRELIMINARES"],"texto":"Art. 4º Esta Lei não se aplica ao tratamento de dados pessoais:\nI - realizado por pessoa natural para fins exclusivamente particulares e não econômicos;\nII - realizado para fins exclusivamente:\na) jornalístico e artísticos; ou\nb) acadêmicos, aplicando-se a esta hipótese os arts. 7º e 11 desta Lei;\nIII - realizado para fins exclusivos de:\na) segurança pública;\nb) defesa nacional;\nc) segurança do Estado; ou\nd) atividades de investigação e repressão de infrações penais; ou\nIV - provenientes de fora do território nacional e que não sejam objeto de comunicação, uso compartilhado de dados com agentes de tratamento brasileiros ou objeto de transferência internacional de dados com outro país que não o de proveniência, desde que o país de proveniência proporcione grau de proteção de dados pessoais adequado ao previsto nesta Lei.\n§ 1º O tratamento de dados pessoais previsto no inciso III será regido por legislação específica, que deverá prever medidas proporcionais e estritamente necessárias ao atendimento do interesse público, observados o devido processo legal, os princípios gerais de proteção e os direitos do titular previstos nesta Lei.\n§ 2º É vedado o tratamento dos dados a que se refere o inciso III do caput deste artigo por pessoa de direito privado, exceto em procedimentos sob tutela de pessoa jurídica de direito público, que serão objeto de informe específico à autoridade nacional e que deverão observar a limitação imposta no § 4º deste artigo.\n§ 3º A autoridade nacional emitirá opiniões técnicas ou recomendações referentes às exceções previstas no inciso III do caput deste artigo e deverá solicitar aos responsáveis relatórios de impacto à proteção de dados pessoais.\n§ 4º Em nenhum caso a totalidade dos dados pessoais de banco de dados de que trata o inciso III do caput deste artigo poderá ser tratada por pessoa de direito privado, salvo por aquela que possua capital integralmente constituído pelo poder público. (Redação dada pela Lei nº 13.853, de 2019)"},{"id":"5","rotulo":"Art. 5","estrutura":["CAPÍTULO I — DISPOSIÇÕES PRELIMINARES"],"texto":"Art. 5º Para os fins desta Lei, considera-se:\nI - dado pessoal: informação relacionada a pessoa natural identificada ou identificável;\nII - dado pessoal sensível: dado pessoal sobre origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou a organização de caráter religioso, filosófico ou político, dado referente à saúde ou à vida sexual, dado genético ou biométrico, quando vinculado a uma pessoa natural;\nIII - dado anonimizado: dado relativo a titular que não possa ser identificado, considerando a utilização de meios técnicos razoáveis e disponíveis na ocasião de seu tratamento;\nIV - banco de dados: conjunto estruturado de dados pessoais, estabelecido em um ou em vários locais, em suporte eletrônico ou físico;\nV - titular: pessoa natural a quem se referem os dados pessoais que são objeto de tratamento;\nVI - controlador: pessoa natural ou jurídica, de direito público ou privado, a quem competem as decisões referentes ao tratamento de dados pessoais;\nVII - operador: pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do controlador;\nVIII - encarregado: pessoa indicada pelo controlador e operador para atuar como canal de comunicação entre o controlador, os titulares dos dados e a Agência Nacional de Proteção de Dados (ANPD); (Redação dada pela Lei nº 15.352, de 2026)\nIX - agentes de tratamento: o controlador e o operador;\nX - tratamento: toda operação realizada com dados pessoais, como as que se referem a coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação, avaliação ou controle da informação, modificação, comunicação, transferência, difusão ou extração;\nXI - anonimização: utilização de meios técnicos razoáveis e disponíveis no momento do tratamento, por meio dos quais um dado perde a possibilidade de associação, direta ou indireta, a um indivíduo;\nXII - consentimento: manifestação livre, informada e inequívoca pela qual o titular concorda com o tratamento de seus dados pessoais para uma finalidade determinada;\nXIII - bloqueio: suspensão temporária de qualquer operação de tratamento, mediante guarda do dado pessoal ou do banco de dados;\nXIV - eliminação: exclusão de dado ou de conjunto de dados armazenados em banco de dados, independentemente do procedimento empregado;\nXV - transferência internacional de dados: transferência de dados pessoais para país estrangeiro ou organismo internacional do qual o país seja membro;\nXVI - uso compartilhado de dados: comunicação, difusão, transferência internacional, interconexão de dados pessoais ou tratamento compartilhado de bancos de dados pessoais por órgãos e entidades públicos no cumprimento de suas competências legais, ou entre esses e entes privados, reciprocamente, com autorização específica, para uma ou mais modalidades de tratamento permitidas por esses entes públicos, ou entre entes privados;\nXVII - relatório de impacto à proteção de dados pessoais: documentação do controlador que contém a descrição dos processos de tratamento de dados pessoais que podem gerar riscos às liberdades civis e aos direitos fundamentais, bem como medidas, salvaguardas e mecanismos de mitigação de risco;\nXVIII - órgão de pesquisa: órgão ou entidade da administração pública direta ou indireta ou pessoa jurídica de direito privado sem fins lucrativos legalmente constituída sob as leis brasileiras, com sede e foro no País, que inclua em sua missão institucional ou em seu objetivo social ou estatutário a pesquisa básica ou aplicada de caráter histórico, científico, tecnológico ou estatístico; e (Redação dada pela Lei nº 13.853, de 2019)\nXIX - autoridade nacional: entidade da administração pública responsável por zelar, implementar e fiscalizar o cumprimento desta Lei em todo o território nacional. (Redação dada pela Lei nº 15.352, de 2026)"},{"id":"6","rotulo":"Art. 6","estrutura":["CAPÍTULO I — DISPOSIÇÕES PRELIMINARES"],"texto":"Art. 6º As atividades de tratamento de dados pessoais deverão observar a boa-fé e os seguintes princípios:\nI - finalidade: realização do tratamento para propósitos legítimos, específicos, explícitos e informados ao titular, sem possibilidade de tratamento posterior de forma incompatível com essas finalidades;\nII - adequação: compatibilidade do tratamento com as finalidades informadas ao titular, de acordo com o contexto do tratamento;\nIII - necessidade: limitação do tratamento ao mínimo necessário para a realização de suas finalidades, com abrangência dos dados pertinentes, proporcionais e não excessivos em relação às finalidades do tratamento de dados;\nIV - livre acesso: garantia, aos titulares, de consulta facilitada e gratuita sobre a forma e a duração do tratamento, bem como sobre a integralidade de seus dados pessoais;\nV - qualidade dos dados: garantia, aos titulares, de exatidão, clareza, relevância e atualização dos dados, de acordo com a necessidade e para o cumprimento da finalidade de seu tratamento;\nVI - transparência: garantia, aos titulares, de informações claras, precisas e facilmente acessíveis sobre a realização do tratamento e os respectivos agentes de tratamento, observados os segredos comercial e industrial;\nVII - segurança: utilização de medidas técnicas e administrativas aptas a proteger os dados pessoais de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração, comunicação ou difusão;\nVIII - prevenção: adoção de medidas para prevenir a ocorrência de danos em virtude do tratamento de dados pessoais;\nIX - não discriminação: impossibilidade de realização do tratamento para fins discriminatórios ilícitos ou abusivos;\nX - responsabilização e prestação de contas: demonstração, pelo agente, da adoção de medidas eficazes e capazes de comprovar a observância e o cumprimento das normas de proteção de dados pessoais e, inclusive, da eficácia dessas medidas."},{"id":"7","rotulo":"Art. 7","estrutura":["CAPÍTULO II — DO TRATAMENTO DE DADOS PESSOAIS","Seção I — Dos Requisitos para o Tratamento de Dados Pessoais"],"texto":"Art. 7º O tratamento de dados pessoais somente poderá ser realizado nas seguintes hipóteses:\nI - mediante o fornecimento de consentimento pelo titular;\nII - para o cumprimento de obrigação legal ou regulatória pelo controlador;\nIII - pela administração pública, para o tratamento e uso compartilhado de dados necessários à execução de políticas públicas previstas em leis e regulamentos ou respaldadas em contratos, convênios ou instrumentos congêneres, observadas as disposições do Capítulo IV desta Lei;\nIV - para a realização de estudos por órgão de pesquisa, garantida, sempre que possível, a anonimização dos dados pessoais;\nV - quando necessário para a execução de contrato ou de procedimentos preliminares relacionados a contrato do qual seja parte o titular, a pedido do titular dos dados;\nVI - para o exercício regular de direitos em processo judicial, administrativo ou arbitral, esse último nos termos da Lei nº 9.307, de 23 de setembro de 1996 (Lei de Arbitragem);\nVII - para a proteção da vida ou da incolumidade física do titular ou de terceiro;\nVIII - para a tutela da saúde, exclusivamente, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária; (Redação dada pela Lei nº 13.853, de 2019)\nIX - quando necessário para atender aos interesses legítimos do controlador ou de terceiro, exceto no caso de prevalecerem direitos e liberdades fundamentais do titular que exijam a proteção dos dados pessoais; ou\nX - para a proteção do crédito, inclusive quanto ao disposto na legislação pertinente.\n§ 1º (Revogado). (Redação dada pela Lei nº 13.853, de 2019)\n§ 2º (Revogado). (Redação dada pela Lei nº 13.853, de 2019)\n§ 3º O tratamento de dados pessoais cujo acesso é público deve considerar a finalidade, a boa-fé e o interesse público que justificaram sua disponibilização.\n§ 4º É dispensada a exigência do consentimento previsto no caput deste artigo para os dados tornados manifestamente públicos pelo titular, resguardados os direitos do titular e os princípios previstos nesta Lei.\n§ 5º O controlador que obteve o consentimento referido no inciso I do caput deste artigo que necessitar comunicar ou compartilhar dados pessoais com outros controladores deverá obter consentimento específico do titular para esse fim, ressalvadas as hipóteses de dispensa do consentimento previstas nesta Lei.\n§ 6º A eventual dispensa da exigência do consentimento não desobriga os agentes de tratamento das demais obrigações previstas nesta Lei, especialmente da observância dos princípios gerais e da garantia dos direitos do titular.\n§ 7º O tratamento posterior dos dados pessoais a que se referem os §§ 3º e 4º deste artigo poderá ser realizado para novas finalidades, desde que observados os propósitos legítimos e específicos para o novo tratamento e a preservação dos direitos do titular, assim como os fundamentos e os princípios previstos nesta Lei. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"8","rotulo":"Art. 8","estrutura":["CAPÍTULO II — DO TRATAMENTO DE DADOS PESSOAIS","Seção I — Dos Requisitos para o Tratamento de Dados Pessoais"],"texto":"Art. 8º O consentimento previsto no inciso I do art. 7º desta Lei deverá ser fornecido por escrito ou por outro meio que demonstre a manifestação de vontade do titular.\n§ 1º Caso o consentimento seja fornecido por escrito, esse deverá constar de cláusula destacada das demais cláusulas contratuais.\n§ 2º Cabe ao controlador o ônus da prova de que o consentimento foi obtido em conformidade com o disposto nesta Lei.\n§ 3º É vedado o tratamento de dados pessoais mediante vício de consentimento.\n§ 4º O consentimento deverá referir-se a finalidades determinadas, e as autorizações genéricas para o tratamento de dados pessoais serão nulas.\n§ 5º O consentimento pode ser revogado a qualquer momento mediante manifestação expressa do titular, por procedimento gratuito e facilitado, ratificados os tratamentos realizados sob amparo do consentimento anteriormente manifestado enquanto não houver requerimento de eliminação, nos termos do inciso VI do caput do art. 18 desta Lei.\n§ 6º Em caso de alteração de informação referida nos incisos I, II, III ou V do art. 9º desta Lei, o controlador deverá informar ao titular, com destaque de forma específica do teor das alterações, podendo o titular, nos casos em que o seu consentimento é exigido, revogá-lo caso discorde da alteração."},{"id":"9","rotulo":"Art. 9","estrutura":["CAPÍTULO II — DO TRATAMENTO DE DADOS PESSOAIS","Seção I — Dos Requisitos para o Tratamento de Dados Pessoais"],"texto":"Art. 9º O titular tem direito ao acesso facilitado às informações sobre o tratamento de seus dados, que deverão ser disponibilizadas de forma clara, adequada e ostensiva acerca de, entre outras características previstas em regulamentação para o atendimento do princípio do livre acesso:\nI - finalidade específica do tratamento;\nII - forma e duração do tratamento, observados os segredos comercial e industrial;\nIII - identificação do controlador;\nIV - informações de contato do controlador;\nV - informações acerca do uso compartilhado de dados pelo controlador e a finalidade;\nVI - responsabilidades dos agentes que realizarão o tratamento; e\nVII - direitos do titular, com menção explícita aos direitos contidos no art. 18 desta Lei.\n§ 1º Na hipótese em que o consentimento é requerido, esse será considerado nulo caso as informações fornecidas ao titular tenham conteúdo enganoso ou abusivo ou não tenham sido apresentadas previamente com transparência, de forma clara e inequívoca.\n§ 2º Na hipótese em que o consentimento é requerido, se houver mudanças da finalidade para o tratamento de dados pessoais não compatíveis com o consentimento original, o controlador deverá informar previamente o titular sobre as mudanças de finalidade, podendo o titular revogar o consentimento, caso discorde das alterações.\n§ 3º Quando o tratamento de dados pessoais for condição para o fornecimento de produto ou de serviço ou para o exercício de direito, o titular será informado com destaque sobre esse fato e sobre os meios pelos quais poderá exercer os direitos do titular elencados no art. 18 desta Lei."},{"id":"10","rotulo":"Art. 10","estrutura":["CAPÍTULO II — DO TRATAMENTO DE DADOS PESSOAIS","Seção I — Dos Requisitos para o Tratamento de Dados Pessoais"],"texto":"Art. 10. O legítimo interesse do controlador somente poderá fundamentar tratamento de dados pessoais para finalidades legítimas, consideradas a partir de situações concretas, que incluem, mas não se limitam a:\nI - apoio e promoção de atividades do controlador; e\nII - proteção, em relação ao titular, do exercício regular de seus direitos ou prestação de serviços que o beneficiem, respeitadas as legítimas expectativas dele e os direitos e liberdades fundamentais, nos termos desta Lei.\n§ 1º Quando o tratamento for baseado no legítimo interesse do controlador, somente os dados pessoais estritamente necessários para a finalidade pretendida poderão ser tratados.\n§ 2º O controlador deverá adotar medidas para garantir a transparência do tratamento de dados baseado em seu legítimo interesse.\n§ 3º A autoridade nacional poderá solicitar ao controlador relatório de impacto à proteção de dados pessoais, quando o tratamento tiver como fundamento seu interesse legítimo, observados os segredos comercial e industrial."},{"id":"11","rotulo":"Art. 11","estrutura":["CAPÍTULO II — DO TRATAMENTO DE DADOS PESSOAIS","Seção II — Do Tratamento de Dados Pessoais Sensíveis"],"texto":"Art. 11. O tratamento de dados pessoais sensíveis somente poderá ocorrer nas seguintes hipóteses:\nI - quando o titular ou seu responsável legal consentir, de forma específica e destacada, para finalidades específicas;\nII - sem fornecimento de consentimento do titular, nas hipóteses em que for indispensável para:\na) cumprimento de obrigação legal ou regulatória pelo controlador;\nb) tratamento compartilhado de dados necessários à execução, pela administração pública, de políticas públicas previstas em leis ou regulamentos;\nc) realização de estudos por órgão de pesquisa, garantida, sempre que possível, a anonimização dos dados pessoais sensíveis;\nd) exercício regular de direitos, inclusive em contrato e em processo judicial, administrativo e arbitral, este último nos termos da Lei nº 9.307, de 23 de setembro de 1996 (Lei de Arbitragem);\ne) proteção da vida ou da incolumidade física do titular ou de terceiro;\nf) tutela da saúde, exclusivamente, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária; ou (Redação dada pela Lei nº 13.853, de 2019)\ng) garantia da prevenção à fraude e à segurança do titular, nos processos de identificação e autenticação de cadastro em sistemas eletrônicos, resguardados os direitos mencionados no art. 9º desta Lei e exceto no caso de prevalecerem direitos e liberdades fundamentais do titular que exijam a proteção dos dados pessoais.\n§ 1º Aplica-se o disposto neste artigo a qualquer tratamento de dados pessoais que revele dados pessoais sensíveis e que possa causar dano ao titular, ressalvado o disposto em legislação específica.\n§ 2º Nos casos de aplicação do disposto nas alíneas \"a\" e \"b\" do inciso II do caput deste artigo pelos órgãos e pelas entidades públicas, será dada publicidade à referida dispensa de consentimento, nos termos do inciso I do caput do art. 23 desta Lei.\n§ 3º A comunicação ou o uso compartilhado de dados pessoais sensíveis entre controladores com objetivo de obter vantagem econômica poderá ser objeto de vedação ou de regulamentação por parte da autoridade nacional, ouvidos os órgãos setoriais do Poder Público, no âmbito de suas competências.\n§ 4º É vedada a comunicação ou o uso compartilhado entre controladores de dados pessoais sensíveis referentes à saúde com objetivo de obter vantagem econômica, exceto nas hipóteses relativas a prestação de serviços de saúde, de assistência farmacêutica e de assistência à saúde, desde que observado o § 5º deste artigo, incluídos os serviços auxiliares de diagnose e terapia, em benefício dos interesses dos titulares de dados, e para permitir: (Redação dada pela Lei nº 13.853, de 2019)\nI - a portabilidade de dados quando solicitada pelo titular; ou (Incluído pela Lei nº 13.853, de 2019)\nII - as transações financeiras e administrativas resultantes do uso e da prestação dos serviços de que trata este parágrafo. (Incluído pela Lei nº 13.853, de 2019)\n§ 5º É vedado às operadoras de planos privados de assistência à saúde o tratamento de dados de saúde para a prática de seleção de riscos na contratação de qualquer modalidade, assim como na contratação e exclusão de beneficiários. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"12","rotulo":"Art. 12","estrutura":["CAPÍTULO II — DO TRATAMENTO DE DADOS PESSOAIS","Seção II — Do Tratamento de Dados Pessoais Sensíveis"],"texto":"Art. 12. Os dados anonimizados não serão considerados dados pessoais para os fins desta Lei, salvo quando o processo de anonimização ao qual foram submetidos for revertido, utilizando exclusivamente meios próprios, ou quando, com esforços razoáveis, puder ser revertido.\n§ 1º A determinação do que seja razoável deve levar em consideração fatores objetivos, tais como custo e tempo necessários para reverter o processo de anonimização, de acordo com as tecnologias disponíveis, e a utilização exclusiva de meios próprios.\n§ 2º Poderão ser igualmente considerados como dados pessoais, para os fins desta Lei, aqueles utilizados para formação do perfil comportamental de determinada pessoa natural, se identificada.\n§ 3º A autoridade nacional poderá dispor sobre padrões e técnicas utilizados em processos de anonimização e realizar verificações acerca de sua segurança, ouvido o Conselho Nacional de Proteção de Dados Pessoais."},{"id":"13","rotulo":"Art. 13","estrutura":["CAPÍTULO II — DO TRATAMENTO DE DADOS PESSOAIS","Seção II — Do Tratamento de Dados Pessoais Sensíveis"],"texto":"Art. 13. Na realização de estudos em saúde pública, os órgãos de pesquisa poderão ter acesso a bases de dados pessoais, que serão tratados exclusivamente dentro do órgão e estritamente para a finalidade de realização de estudos e pesquisas e mantidos em ambiente controlado e seguro, conforme práticas de segurança previstas em regulamento específico e que incluam, sempre que possível, a anonimização ou pseudonimização dos dados, bem como considerem os devidos padrões éticos relacionados a estudos e pesquisas.\n§ 1º A divulgação dos resultados ou de qualquer excerto do estudo ou da pesquisa de que trata o caput deste artigo em nenhuma hipótese poderá revelar dados pessoais.\n§ 2º O órgão de pesquisa será o responsável pela segurança da informação prevista no caput deste artigo, não permitida, em circunstância alguma, a transferência dos dados a terceiro.\n§ 3º O acesso aos dados de que trata este artigo será objeto de regulamentação por parte da autoridade nacional e das autoridades da área de saúde e sanitárias, no âmbito de suas competências.\n§ 4º Para os efeitos deste artigo, a pseudonimização é o tratamento por meio do qual um dado perde a possibilidade de associação, direta ou indireta, a um indivíduo, senão pelo uso de informação adicional mantida separadamente pelo controlador em ambiente controlado e seguro."},{"id":"14","rotulo":"Art. 14","estrutura":["CAPÍTULO II — DO TRATAMENTO DE DADOS PESSOAIS","Seção III — Do Tratamento de Dados Pessoais de Crianças e de Adolescentes"],"texto":"Art. 14. O tratamento de dados pessoais de crianças e de adolescentes deverá ser realizado em seu melhor interesse, nos termos deste artigo e da legislação pertinente.\n§ 1º O tratamento de dados pessoais de crianças deverá ser realizado com o consentimento específico e em destaque dado por pelo menos um dos pais ou pelo responsável legal.\n§ 2º No tratamento de dados de que trata o § 1º deste artigo, os controladores deverão manter pública a informação sobre os tipos de dados coletados, a forma de sua utilização e os procedimentos para o exercício dos direitos a que se refere o art. 18 desta Lei.\n§ 3º Poderão ser coletados dados pessoais de crianças sem o consentimento a que se refere o § 1º deste artigo quando a coleta for necessária para contatar os pais ou o responsável legal, utilizados uma única vez e sem armazenamento, ou para sua proteção, e em nenhum caso poderão ser repassados a terceiro sem o consentimento de que trata o § 1º deste artigo.\n§ 4º Os controladores não deverão condicionar a participação dos titulares de que trata o § 1º deste artigo em jogos, aplicações de internet ou outras atividades ao fornecimento de informações pessoais além das estritamente necessárias à atividade.\n§ 5º O controlador deve realizar todos os esforços razoáveis para verificar que o consentimento a que se refere o § 1º deste artigo foi dado pelo responsável pela criança, consideradas as tecnologias disponíveis.\n§ 6º As informações sobre o tratamento de dados referidas neste artigo deverão ser fornecidas de maneira simples, clara e acessível, consideradas as características físico-motoras, perceptivas, sensoriais, intelectuais e mentais do usuário, com uso de recursos audiovisuais quando adequado, de forma a proporcionar a informação necessária aos pais ou ao responsável legal e adequada ao entendimento da criança."},{"id":"15","rotulo":"Art. 15","estrutura":["CAPÍTULO II — DO TRATAMENTO DE DADOS PESSOAIS","Seção IV — Do Término do Tratamento de Dados"],"texto":"Art. 15. O término do tratamento de dados pessoais ocorrerá nas seguintes hipóteses:\nI - verificação de que a finalidade foi alcançada ou de que os dados deixaram de ser necessários ou pertinentes ao alcance da finalidade específica almejada;\nII - fim do período de tratamento;\nIII - comunicação do titular, inclusive no exercício de seu direito de revogação do consentimento conforme disposto no § 5º do art. 8º desta Lei, resguardado o interesse público; ou\nIV - determinação da autoridade nacional, quando houver violação ao disposto nesta Lei."},{"id":"16","rotulo":"Art. 16","estrutura":["CAPÍTULO II — DO TRATAMENTO DE DADOS PESSOAIS","Seção IV — Do Término do Tratamento de Dados"],"texto":"Art. 16. Os dados pessoais serão eliminados após o término de seu tratamento, no âmbito e nos limites técnicos das atividades, autorizada a conservação para as seguintes finalidades:\nI - cumprimento de obrigação legal ou regulatória pelo controlador;\nII - estudo por órgão de pesquisa, garantida, sempre que possível, a anonimização dos dados pessoais;\nIII - transferência a terceiro, desde que respeitados os requisitos de tratamento de dados dispostos nesta Lei; ou\nIV - uso exclusivo do controlador, vedado seu acesso por terceiro, e desde que anonimizados os dados."},{"id":"17","rotulo":"Art. 17","estrutura":["CAPÍTULO III — DOS DIREITOS DO TITULAR"],"texto":"Art. 17. Toda pessoa natural tem assegurada a titularidade de seus dados pessoais e garantidos os direitos fundamentais de liberdade, de intimidade e de privacidade, nos termos desta Lei."},{"id":"18","rotulo":"Art. 18","estrutura":["CAPÍTULO III — DOS DIREITOS DO TITULAR"],"texto":"Art. 18. O titular dos dados pessoais tem direito a obter do controlador, em relação aos dados do titular por ele tratados, a qualquer momento e mediante requisição:\nI - confirmação da existência de tratamento;\nII - acesso aos dados;\nIII - correção de dados incompletos, inexatos ou desatualizados;\nIV - anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade com o disposto nesta Lei;\nV - portabilidade dos dados a outro fornecedor de serviço ou produto, mediante requisição expressa, de acordo com a regulamentação da autoridade nacional, observados os segredos comercial e industrial; (Redação dada pela Lei nº 13.853, de 2019)\nVI - eliminação dos dados pessoais tratados com o consentimento do titular, exceto nas hipóteses previstas no art. 16 desta Lei;\nVII - informação das entidades públicas e privadas com as quais o controlador realizou uso compartilhado de dados;\nVIII - informação sobre a possibilidade de não fornecer consentimento e sobre as consequências da negativa;\nIX - revogação do consentimento, nos termos do § 5º do art. 8º desta Lei.\n§ 1º O titular dos dados pessoais tem o direito de peticionar em relação aos seus dados contra o controlador perante a autoridade nacional.\n§ 2º O titular pode opor-se a tratamento realizado com fundamento em uma das hipóteses de dispensa de consentimento, em caso de descumprimento ao disposto nesta Lei.\n§ 3º Os direitos previstos neste artigo serão exercidos mediante requerimento expresso do titular ou de representante legalmente constituído, a agente de tratamento.\n§ 4º Em caso de impossibilidade de adoção imediata da providência de que trata o § 3º deste artigo, o controlador enviará ao titular resposta em que poderá:\nI - comunicar que não é agente de tratamento dos dados e indicar, sempre que possível, o agente; ou\nII - indicar as razões de fato ou de direito que impedem a adoção imediata da providência.\n§ 5º O requerimento referido no § 3º deste artigo será atendido sem custos para o titular, nos prazos e nos termos previstos em regulamento.\n§ 6º O responsável deverá informar, de maneira imediata, aos agentes de tratamento com os quais tenha realizado uso compartilhado de dados a correção, a eliminação, a anonimização ou o bloqueio dos dados, para que repitam idêntico procedimento, exceto nos casos em que esta comunicação seja comprovadamente impossível ou implique esforço desproporcional. (Redação dada pela Lei nº 13.853, de 2019)\n§ 7º A portabilidade dos dados pessoais a que se refere o inciso V do caput deste artigo não inclui dados que já tenham sido anonimizados pelo controlador.\n§ 8º O direito a que se refere o § 1º deste artigo também poderá ser exercido perante os organismos de defesa do consumidor."},{"id":"19","rotulo":"Art. 19","estrutura":["CAPÍTULO III — DOS DIREITOS DO TITULAR"],"texto":"Art. 19. A confirmação de existência ou o acesso a dados pessoais serão providenciados, mediante requisição do titular:\nI - em formato simplificado, imediatamente; ou\nII - por meio de declaração clara e completa, que indique a origem dos dados, a inexistência de registro, os critérios utilizados e a finalidade do tratamento, observados os segredos comercial e industrial, fornecida no prazo de até 15 (quinze) dias, contado da data do requerimento do titular.\n§ 1º Os dados pessoais serão armazenados em formato que favoreça o exercício do direito de acesso.\n§ 2º As informações e os dados poderão ser fornecidos, a critério do titular:\nI - por meio eletrônico, seguro e idôneo para esse fim; ou\nII - sob forma impressa.\n§ 3º Quando o tratamento tiver origem no consentimento do titular ou em contrato, o titular poderá solicitar cópia eletrônica integral de seus dados pessoais, observados os segredos comercial e industrial, nos termos de regulamentação da autoridade nacional, em formato que permita a sua utilização subsequente, inclusive em outras operações de tratamento.\n§ 4º A autoridade nacional poderá dispor de forma diferenciada acerca dos prazos previstos nos incisos I e II do caput deste artigo para os setores específicos."},{"id":"20","rotulo":"Art. 20","estrutura":["CAPÍTULO III — DOS DIREITOS DO TITULAR"],"texto":"Art. 20. O titular dos dados tem direito a solicitar a revisão de decisões tomadas unicamente com base em tratamento automatizado de dados pessoais que afetem seus interesses, incluídas as decisões destinadas a definir o seu perfil pessoal, profissional, de consumo e de crédito ou os aspectos de sua personalidade. (Redação dada pela Lei nº 13.853, de 2019)\n§ 1º O controlador deverá fornecer, sempre que solicitadas, informações claras e adequadas a respeito dos critérios e dos procedimentos utilizados para a decisão automatizada, observados os segredos comercial e industrial.\n§ 2º Em caso de não oferecimento de informações de que trata o § 1º deste artigo baseado na observância de segredo comercial e industrial, a autoridade nacional poderá realizar auditoria para verificação de aspectos discriminatórios em tratamento automatizado de dados pessoais.\n§ 3º (VETADO). (Incluído pela Lei nº 13.853, de 2019)"},{"id":"21","rotulo":"Art. 21","estrutura":["CAPÍTULO III — DOS DIREITOS DO TITULAR"],"texto":"Art. 21. Os dados pessoais referentes ao exercício regular de direitos pelo titular não podem ser utilizados em seu prejuízo."},{"id":"22","rotulo":"Art. 22","estrutura":["CAPÍTULO III — DOS DIREITOS DO TITULAR"],"texto":"Art. 22. A defesa dos interesses e dos direitos dos titulares de dados poderá ser exercida em juízo, individual ou coletivamente, na forma do disposto na legislação pertinente, acerca dos instrumentos de tutela individual e coletiva."},{"id":"23","rotulo":"Art. 23","estrutura":["CAPÍTULO IV — DO TRATAMENTO DE DADOS PESSOAIS PELO PODER PÚBLICO","Seção I — Das Regras"],"texto":"Art. 23. O tratamento de dados pessoais pelas pessoas jurídicas de direito público referidas no parágrafo único do art. 1º da Lei nº 12.527, de 18 de novembro de 2011 (Lei de Acesso à Informação), deverá ser realizado para o atendimento de sua finalidade pública, na persecução do interesse público, com o objetivo de executar as competências legais ou cumprir as atribuições legais do serviço público, desde que:\nI - sejam informadas as hipóteses em que, no exercício de suas competências, realizam o tratamento de dados pessoais, fornecendo informações claras e atualizadas sobre a previsão legal, a finalidade, os procedimentos e as práticas utilizadas para a execução dessas atividades, em veículos de fácil acesso, preferencialmente em seus sítios eletrônicos;\nII - (VETADO); e\nIII - seja indicado um encarregado quando realizarem operações de tratamento de dados pessoais, nos termos do art. 39 desta Lei; e (Redação dada pela Lei nº 13.853, de 2019)\nIV - (VETADO). (Incluído pela Lei nº 13.853, de 2019)\n§ 1º A autoridade nacional poderá dispor sobre as formas de publicidade das operações de tratamento.\n§ 2º O disposto nesta Lei não dispensa as pessoas jurídicas mencionadas no caput deste artigo de instituir as autoridades de que trata a Lei nº 12.527, de 18 de novembro de 2011 (Lei de Acesso à Informação).\n§ 3º Os prazos e procedimentos para exercício dos direitos do titular perante o Poder Público observarão o disposto em legislação específica, em especial as disposições constantes da Lei nº 9.507, de 12 de novembro de 1997 (Lei do Habeas Data), da Lei nº 9.784, de 29 de janeiro de 1999 (Lei Geral do Processo Administrativo), e da Lei nº 12.527, de 18 de novembro de 2011 (Lei de Acesso à Informação).\n§ 4º Os serviços notariais e de registro exercidos em caráter privado, por delegação do Poder Público, terão o mesmo tratamento dispensado às pessoas jurídicas referidas no caput deste artigo, nos termos desta Lei.\n§ 5º Os órgãos notariais e de registro devem fornecer acesso aos dados por meio eletrônico para a administração pública, tendo em vista as finalidades de que trata o caput deste artigo."},{"id":"24","rotulo":"Art. 24","estrutura":["CAPÍTULO IV — DO TRATAMENTO DE DADOS PESSOAIS PELO PODER PÚBLICO","Seção I — Das Regras"],"texto":"Art. 24. As empresas públicas e as sociedades de economia mista que atuam em regime de concorrência, sujeitas ao disposto no art. 173 da Constituição Federal, terão o mesmo tratamento dispensado às pessoas jurídicas de direito privado particulares, nos termos desta Lei.\nParágrafo único. As empresas públicas e as sociedades de economia mista, quando estiverem operacionalizando políticas públicas e no âmbito da execução delas, terão o mesmo tratamento dispensado aos órgãos e às entidades do Poder Público, nos termos deste Capítulo."},{"id":"25","rotulo":"Art. 25","estrutura":["CAPÍTULO IV — DO TRATAMENTO DE DADOS PESSOAIS PELO PODER PÚBLICO","Seção I — Das Regras"],"texto":"Art. 25. Os dados deverão ser mantidos em formato interoperável e estruturado para o uso compartilhado, com vistas à execução de políticas públicas, à prestação de serviços públicos, à descentralização da atividade pública e à disseminação e ao acesso das informações pelo público em geral."},{"id":"26","rotulo":"Art. 26","estrutura":["CAPÍTULO IV — DO TRATAMENTO DE DADOS PESSOAIS PELO PODER PÚBLICO","Seção I — Das Regras"],"texto":"Art. 26. O uso compartilhado de dados pessoais pelo Poder Público deve atender a finalidades específicas de execução de políticas públicas e atribuição legal pelos órgãos e pelas entidades públicas, respeitados os princípios de proteção de dados pessoais elencados no art. 6º desta Lei.\n§ 1º É vedado ao Poder Público transferir a entidades privadas dados pessoais constantes de bases de dados a que tenha acesso, exceto:\nI - em casos de execução descentralizada de atividade pública que exija a transferência, exclusivamente para esse fim específico e determinado, observado o disposto na Lei nº 12.527, de 18 de novembro de 2011 (Lei de Acesso à Informação);\nII - (VETADO);\nIII - nos casos em que os dados forem acessíveis publicamente, observadas as disposições desta Lei.\nIV - quando houver previsão legal ou a transferência for respaldada em contratos, convênios ou instrumentos congêneres; ou (Incluído pela Lei nº 13.853, de 2019)\nV - na hipótese de a transferência dos dados objetivar exclusivamente a prevenção de fraudes e irregularidades, ou proteger e resguardar a segurança e a integridade do titular dos dados, desde que vedado o tratamento para outras finalidades. (Incluído pela Lei nº 13.853, de 2019)\n§ 2º Os contratos e convênios de que trata o § 1º deste artigo deverão ser comunicados à autoridade nacional."},{"id":"27","rotulo":"Art. 27","estrutura":["CAPÍTULO IV — DO TRATAMENTO DE DADOS PESSOAIS PELO PODER PÚBLICO","Seção I — Das Regras"],"texto":"Art. 27. A comunicação ou o uso compartilhado de dados pessoais de pessoa jurídica de direito público a pessoa de direito privado será informado à autoridade nacional e dependerá de consentimento do titular, exceto:\nI - nas hipóteses de dispensa de consentimento previstas nesta Lei;\nII - nos casos de uso compartilhado de dados, em que será dada publicidade nos termos do inciso I do caput do art. 23 desta Lei; ou\nIII - nas exceções constantes do § 1º do art. 26 desta Lei.\nParágrafo único. A informação à autoridade nacional de que trata o caput deste artigo será objeto de regulamentação. (Incluído pela Lei nº 13.853, de 2019)"},{"id":"28","rotulo":"Art. 28","estrutura":["CAPÍTULO IV — DO TRATAMENTO DE DADOS PESSOAIS PELO PODER PÚBLICO","Seção I — Das Regras"],"texto":"Art. 28. (VETADO)."},{"id":"29","rotulo":"Art. 29","estrutura":["CAPÍTULO IV — DO TRATAMENTO DE DADOS PESSOAIS PELO PODER PÚBLICO","Seção I — Das Regras"],"texto":"Art. 29. A autoridade nacional poderá solicitar, a qualquer momento, aos órgãos e às entidades do poder público a realização de operações de tratamento de dados pessoais, informações específicas sobre o âmbito e a natureza dos dados e outros detalhes do tratamento realizado e poderá emitir parecer técnico complementar para garantir o cumprimento desta Lei. (Redação dada pela Lei nº 13.853, de 2019)"},{"id":"30","rotulo":"Art. 30","estrutura":["CAPÍTULO IV — DO TRATAMENTO DE DADOS PESSOAIS PELO PODER PÚBLICO","Seção I — Das Regras"],"texto":"Art. 30. A autoridade nacional poderá estabelecer normas complementares para as atividades de comunicação e de uso compartilhado de dados pessoais."},{"id":"31","rotulo":"Art. 31","estrutura":["CAPÍTULO IV — DO TRATAMENTO DE DADOS PESSOAIS PELO PODER PÚBLICO","Seção II — Da Responsabilidade"],"texto":"Art. 31. Quando houver infração a esta Lei em decorrência do tratamento de dados pessoais por órgãos públicos, a autoridade nacional poderá enviar informe com medidas cabíveis para fazer cessar a violação."},{"id":"32","rotulo":"Art. 32","estrutura":["CAPÍTULO IV — DO TRATAMENTO DE DADOS PESSOAIS PELO PODER PÚBLICO","Seção II — Da Responsabilidade"],"texto":"Art. 32. A autoridade nacional poderá solicitar a agentes do Poder Público a publicação de relatórios de impacto à proteção de dados pessoais e sugerir a adoção de padrões e de boas práticas para os tratamentos de dados pessoais pelo Poder Público."},{"id":"33","rotulo":"Art. 33","estrutura":["CAPÍTULO V — DA TRANSFERÊNCIA INTERNACIONAL DE DADOS"],"texto":"Art. 33. A transferência internacional de dados pessoais somente é permitida nos seguintes casos:\nI - para países ou organismos internacionais que proporcionem grau de proteção de dados pessoais adequado ao previsto nesta Lei;\nII - quando o controlador oferecer e comprovar garantias de cumprimento dos princípios, dos direitos do titular e do regime de proteção de dados previstos nesta Lei, na forma de:\na) cláusulas contratuais específicas para determinada transferência;\nb) cláusulas-padrão contratuais;\nc) normas corporativas globais;\nd) selos, certificados e códigos de conduta regularmente emitidos;\nIII - quando a transferência for necessária para a cooperação jurídica internacional entre órgãos públicos de inteligência, de investigação e de persecução, de acordo com os instrumentos de direito internacional;\nIV - quando a transferência for necessária para a proteção da vida ou da incolumidade física do titular ou de terceiro;\nV - quando a autoridade nacional autorizar a transferência;\nVI - quando a transferência resultar em compromisso assumido em acordo de cooperação internacional;\nVII - quando a transferência for necessária para a execução de política pública ou atribuição legal do serviço público, sendo dada publicidade nos termos do inciso I do caput do art. 23 desta Lei;\nVIII - quando o titular tiver fornecido o seu consentimento específico e em destaque para a transferência, com informação prévia sobre o caráter internacional da operação, distinguindo claramente esta de outras finalidades; ou\nIX - quando necessário para atender as hipóteses previstas nos incisos II, V e VI do art. 7º desta Lei.\nParágrafo único. Para os fins do inciso I deste artigo, as pessoas jurídicas de direito público referidas no parágrafo único do art. 1º da Lei nº 12.527, de 18 de novembro de 2011 (Lei de Acesso à Informação), no âmbito de suas competências legais, e responsáveis, no âmbito de suas atividades, poderão requerer à autoridade nacional a avaliação do nível de proteção a dados pessoais conferido por país ou organismo internacional."},{"id":"34","rotulo":"Art. 34","estrutura":["CAPÍTULO V — DA TRANSFERÊNCIA INTERNACIONAL DE DADOS"],"texto":"Art. 34. O nível de proteção de dados do país estrangeiro ou do organismo internacional mencionado no inciso I do caput do art. 33 desta Lei será avaliado pela autoridade nacional, que levará em consideração:\nI - as normas gerais e setoriais da legislação em vigor no país de destino ou no organismo internacional;\nII - a natureza dos dados;\nIII - a observância dos princípios gerais de proteção de dados pessoais e direitos dos titulares previstos nesta Lei;\nIV - a adoção de medidas de segurança previstas em regulamento;\nV - a existência de garantias judiciais e institucionais para o respeito aos direitos de proteção de dados pessoais; e\nVI - outras circunstâncias específicas relativas à transferência."},{"id":"35","rotulo":"Art. 35","estrutura":["CAPÍTULO V — DA TRANSFERÊNCIA INTERNACIONAL DE DADOS"],"texto":"Art. 35. A definição do conteúdo de cláusulas-padrão contratuais, bem como a verificação de cláusulas contratuais específicas para uma determinada transferência, normas corporativas globais ou selos, certificados e códigos de conduta, a que se refere o inciso II do caput do art. 33 desta Lei, será realizada pela autoridade nacional.\n§ 1º Para a verificação do disposto no caput deste artigo, deverão ser considerados os requisitos, as condições e as garantias mínimas para a transferência que observem os direitos, as garantias e os princípios desta Lei.\n§ 2º Na análise de cláusulas contratuais, de documentos ou de normas corporativas globais submetidas à aprovação da autoridade nacional, poderão ser requeridas informações suplementares ou realizadas diligências de verificação quanto às operações de tratamento, quando necessário.\n§ 3º A autoridade nacional poderá designar organismos de certificação para a realização do previsto no caput deste artigo, que permanecerão sob sua fiscalização nos termos definidos em regulamento.\n§ 4º Os atos realizados por organismo de certificação poderão ser revistos pela autoridade nacional e, caso em desconformidade com esta Lei, submetidos a revisão ou anulados.\n§ 5º As garantias suficientes de observância dos princípios gerais de proteção e dos direitos do titular referidas no caput deste artigo serão também analisadas de acordo com as medidas técnicas e organizacionais adotadas pelo operador, de acordo com o previsto nos §§ 1º e 2º do art. 46 desta Lei."},{"id":"36","rotulo":"Art. 36","estrutura":["CAPÍTULO V — DA TRANSFERÊNCIA INTERNACIONAL DE DADOS"],"texto":"Art. 36. As alterações nas garantias apresentadas como suficientes de observância dos princípios gerais de proteção e dos direitos do titular referidas no inciso II do art. 33 desta Lei deverão ser comunicadas à autoridade nacional."},{"id":"37","rotulo":"Art. 37","estrutura":["CAPÍTULO VI — DOS AGENTES DE TRATAMENTO DE DADOS PESSOAIS","Seção I — Do Controlador e do Operador"],"texto":"Art. 37. O controlador e o operador devem manter registro das operações de tratamento de dados pessoais que realizarem, especialmente quando baseado no legítimo interesse."},{"id":"38","rotulo":"Art. 38","estrutura":["CAPÍTULO VI — DOS AGENTES DE TRATAMENTO DE DADOS PESSOAIS","Seção I — Do Controlador e do Operador"],"texto":"Art. 38. A autoridade nacional poderá determinar ao controlador que elabore relatório de impacto à proteção de dados pessoais, inclusive de dados sensíveis, referente a suas operações de tratamento de dados, nos termos de regulamento, observados os segredos comercial e industrial.\nParágrafo único. Observado o disposto no caput deste artigo, o relatório deverá conter, no mínimo, a descrição dos tipos de dados coletados, a metodologia utilizada para a coleta e para a garantia da segurança das informações e a análise do controlador com relação a medidas, salvaguardas e mecanismos de mitigação de risco adotados."},{"id":"39","rotulo":"Art. 39","estrutura":["CAPÍTULO VI — DOS AGENTES DE TRATAMENTO DE DADOS PESSOAIS","Seção I — Do Controlador e do Operador"],"texto":"Art. 39. O operador deverá realizar o tratamento segundo as instruções fornecidas pelo controlador, que verificará a observância das próprias instruções e das normas sobre a matéria."},{"id":"40","rotulo":"Art. 40","estrutura":["CAPÍTULO VI — DOS AGENTES DE TRATAMENTO DE DADOS PESSOAIS","Seção I — Do Controlador e do Operador"],"texto":"Art. 40. A autoridade nacional poderá dispor sobre padrões de interoperabilidade para fins de portabilidade, livre acesso aos dados e segurança, assim como sobre o tempo de guarda dos registros, tendo em vista especialmente a necessidade e a transparência."},{"id":"41","rotulo":"Art. 41","estrutura":["CAPÍTULO VI — DOS AGENTES DE TRATAMENTO DE DADOS PESSOAIS","Seção II — Do Encarregado pelo Tratamento de Dados Pessoais"],"texto":"Art. 41. O controlador deverá indicar encarregado pelo tratamento de dados pessoais.\n§ 1º A identidade e as informações de contato do encarregado deverão ser divulgadas publicamente, de forma clara e objetiva, preferencialmente no sítio eletrônico do controlador.\n§ 2º As atividades do encarregado consistem em:\nI - aceitar reclamações e comunicações dos titulares, prestar esclarecimentos e adotar providências;\nII - receber comunicações da autoridade nacional e adotar providências;\nIII - orientar os funcionários e os contratados da entidade a respeito das práticas a serem tomadas em relação à proteção de dados pessoais; e\nIV - executar as demais atribuições determinadas pelo controlador ou estabelecidas em normas complementares.\n§ 3º A autoridade nacional poderá estabelecer normas complementares sobre a definição e as atribuições do encarregado, inclusive hipóteses de dispensa da necessidade de sua indicação, conforme a natureza e o porte da entidade ou o volume de operações de tratamento de dados.\n§ 4º (VETADO). (Incluído pela Lei nº 13.853, de 2019)"},{"id":"42","rotulo":"Art. 42","estrutura":["CAPÍTULO VI — DOS AGENTES DE TRATAMENTO DE DADOS PESSOAIS","Seção III — Da Responsabilidade e do Ressarcimento de Danos"],"texto":"Art. 42. O controlador ou o operador que, em razão do exercício de atividade de tratamento de dados pessoais, causar a outrem dano patrimonial, moral, individual ou coletivo, em violação à legislação de proteção de dados pessoais, é obrigado a repará-lo.\n§ 1º A fim de assegurar a efetiva indenização ao titular dos dados:\nI - o operador responde solidariamente pelos danos causados pelo tratamento quando descumprir as obrigações da legislação de proteção de dados ou quando não tiver seguido as instruções lícitas do controlador, hipótese em que o operador equipara-se ao controlador, salvo nos casos de exclusão previstos no art. 43 desta Lei;\nII - os controladores que estiverem diretamente envolvidos no tratamento do qual decorreram danos ao titular dos dados respondem solidariamente, salvo nos casos de exclusão previstos no art. 43 desta Lei.\n§ 2º O juiz, no processo civil, poderá inverter o ônus da prova a favor do titular dos dados quando, a seu juízo, for verossímil a alegação, houver hipossuficiência para fins de produção de prova ou quando a produção de prova pelo titular resultar-lhe excessivamente onerosa.\n§ 3º As ações de reparação por danos coletivos que tenham por objeto a responsabilização nos termos do caput deste artigo podem ser exercidas coletivamente em juízo, observado o disposto na legislação pertinente.\n§ 4º Aquele que reparar o dano ao titular tem direito de regresso contra os demais responsáveis, na medida de sua participação no evento danoso."},{"id":"43","rotulo":"Art. 43","estrutura":["CAPÍTULO VI — DOS AGENTES DE TRATAMENTO DE DADOS PESSOAIS","Seção III — Da Responsabilidade e do Ressarcimento de Danos"],"texto":"Art. 43. Os agentes de tratamento só não serão responsabilizados quando provarem:\nI - que não realizaram o tratamento de dados pessoais que lhes é atribuído;\nII - que, embora tenham realizado o tratamento de dados pessoais que lhes é atribuído, não houve violação à legislação de proteção de dados; ou\nIII - que o dano é decorrente de culpa exclusiva do titular dos dados ou de terceiro."},{"id":"44","rotulo":"Art. 44","estrutura":["CAPÍTULO VI — DOS AGENTES DE TRATAMENTO DE DADOS PESSOAIS","Seção III — Da Responsabilidade e do Ressarcimento de Danos"],"texto":"Art. 44. O tratamento de dados pessoais será irregular quando deixar de observar a legislação ou quando não fornecer a segurança que o titular dele pode esperar, consideradas as circunstâncias relevantes, entre as quais:\nI - o modo pelo qual é realizado;\nII - o resultado e os riscos que razoavelmente dele se esperam;\nIII - as técnicas de tratamento de dados pessoais disponíveis à época em que foi realizado.\nParágrafo único. Responde pelos danos decorrentes da violação da segurança dos dados o controlador ou o operador que, ao deixar de adotar as medidas de segurança previstas no art. 46 desta Lei, der causa ao dano."},{"id":"45","rotulo":"Art. 45","estrutura":["CAPÍTULO VI — DOS AGENTES DE TRATAMENTO DE DADOS PESSOAIS","Seção III — Da Responsabilidade e do Ressarcimento de Danos"],"texto":"Art. 45. As hipóteses de violação do direito do titular no âmbito das relações de consumo permanecem sujeitas às regras de responsabilidade previstas na legislação pertinente."},{"id":"46","rotulo":"Art. 46","estrutura":["CAPÍTULO VII — DA SEGURANÇA E DAS BOAS PRÁTICAS","Seção I — Da Segurança e do Sigilo de Dados"],"texto":"Art. 46. Os agentes de tratamento devem adotar medidas de segurança, técnicas e administrativas aptas a proteger os dados pessoais de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração, comunicação ou qualquer forma de tratamento inadequado ou ilícito.\n§ 1º A autoridade nacional poderá dispor sobre padrões técnicos mínimos para tornar aplicável o disposto no caput deste artigo, considerados a natureza das informações tratadas, as características específicas do tratamento e o estado atual da tecnologia, especialmente no caso de dados pessoais sensíveis, assim como os princípios previstos no caput do art. 6º desta Lei.\n§ 2º As medidas de que trata o caput deste artigo deverão ser observadas desde a fase de concepção do produto ou do serviço até a sua execução."},{"id":"47","rotulo":"Art. 47","estrutura":["CAPÍTULO VII — DA SEGURANÇA E DAS BOAS PRÁTICAS","Seção I — Da Segurança e do Sigilo de Dados"],"texto":"Art. 47. Os agentes de tratamento ou qualquer outra pessoa que intervenha em uma das fases do tratamento obriga-se a garantir a segurança da informação prevista nesta Lei em relação aos dados pessoais, mesmo após o seu término."},{"id":"48","rotulo":"Art. 48","estrutura":["CAPÍTULO VII — DA SEGURANÇA E DAS BOAS PRÁTICAS","Seção I — Da Segurança e do Sigilo de Dados"],"texto":"Art. 48. O controlador deverá comunicar à autoridade nacional e ao titular a ocorrência de incidente de segurança que possa acarretar risco ou dano relevante aos titulares.\n§ 1º A comunicação será feita em prazo razoável, conforme definido pela autoridade nacional, e deverá mencionar, no mínimo:\nI - a descrição da natureza dos dados pessoais afetados;\nII - as informações sobre os titulares envolvidos;\nIII - a indicação das medidas técnicas e de segurança utilizadas para a proteção dos dados, observados os segredos comercial e industrial;\nIV - os riscos relacionados ao incidente;\nV - os motivos da demora, no caso de a comunicação não ter sido imediata; e\nVI - as medidas que foram ou que serão adotadas para reverter ou mitigar os efeitos do prejuízo.\n§ 2º A autoridade nacional verificará a gravidade do incidente e poderá, caso necessário para a salvaguarda dos direitos dos titulares, determinar ao controlador a adoção de providências, tais como:\nI - ampla divulgação do fato em meios de comunicação; e\nII - medidas para reverter ou mitigar os efeitos do incidente.\n§ 3º No juízo de gravidade do incidente, será avaliada eventual comprovação de que foram adotadas medidas técnicas adequadas que tornem os dados pessoais afetados ininteligíveis, no âmbito e nos limites técnicos de seus serviços, para terceiros não autorizados a acessá-los."},{"id":"49","rotulo":"Art. 49","estrutura":["CAPÍTULO VII — DA SEGURANÇA E DAS BOAS PRÁTICAS","Seção I — Da Segurança e do Sigilo de Dados"],"texto":"Art. 49. Os sistemas utilizados para o tratamento de dados pessoais devem ser estruturados de forma a atender aos requisitos de segurança, aos padrões de boas práticas e de governança e aos princípios gerais previstos nesta Lei e às demais normas regulamentares."},{"id":"50","rotulo":"Art. 50","estrutura":["CAPÍTULO VII — DA SEGURANÇA E DAS BOAS PRÁTICAS","Seção II — Das Boas Práticas e da Governança"],"texto":"Art. 50. Os controladores e operadores, no âmbito de suas competências, pelo tratamento de dados pessoais, individualmente ou por meio de associações, poderão formular regras de boas práticas e de governança que estabeleçam as condições de organização, o regime de funcionamento, os procedimentos, incluindo reclamações e petições de titulares, as normas de segurança, os padrões técnicos, as obrigações específicas para os diversos envolvidos no tratamento, as ações educativas, os mecanismos internos de supervisão e de mitigação de riscos e outros aspectos relacionados ao tratamento de dados pessoais.\n§ 1º Ao estabelecer regras de boas práticas, o controlador e o operador levarão em consideração, em relação ao tratamento e aos dados, a natureza, o escopo, a finalidade e a probabilidade e a gravidade dos riscos e dos benefícios decorrentes de tratamento de dados do titular.\n§ 2º Na aplicação dos princípios indicados nos incisos VII e VIII do caput do art. 6º desta Lei, o controlador, observados a estrutura, a escala e o volume de suas operações, bem como a sensibilidade dos dados tratados e a probabilidade e a gravidade dos danos para os titulares dos dados, poderá:\nI - implementar programa de governança em privacidade que, no mínimo:\na) demonstre o comprometimento do controlador em adotar processos e políticas internas que assegurem o cumprimento, de forma abrangente, de normas e boas práticas relativas à proteção de dados pessoais;\nb) seja aplicável a todo o conjunto de dados pessoais que estejam sob seu controle, independentemente do modo como se realizou sua coleta;\nc) seja adaptado à estrutura, à escala e ao volume de suas operações, bem como à sensibilidade dos dados tratados;\nd) estabeleça políticas e salvaguardas adequadas com base em processo de avaliação sistemática de impactos e riscos à privacidade;\ne) tenha o objetivo de estabelecer relação de confiança com o titular, por meio de atuação transparente e que assegure mecanismos de participação do titular;\nf) esteja integrado a sua estrutura geral de governança e estabeleça e aplique mecanismos de supervisão internos e externos;\ng) conte com planos de resposta a incidentes e remediação; e\nh
